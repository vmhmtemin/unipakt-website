@font-face { font-family: 'Archivo'; font-style: normal; font-weight: 500 900; font-display: swap; src: url(/fonts/archivo-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

@font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 600; font-display: swap; src: url(/fonts/inter-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  color-scheme: dark;
  --ink: #F2F1EE; --paper: #0C0C0D; --surface: #161618; --soft: #1E1E21;
  --border: #F2F1EE17; --border-strong: #F2F1EE30;
  /*brand:start*/ --brand-grad: linear-gradient(135deg, #8F244D, #A94B86); --brand-on-dark: #A94B86; --brand-on-light: #8F244D; --brand-on-accent: #FFFFFF; /*brand:end*/
    --accent: var(--brand-on-dark); --accent-grad: var(--brand-grad); --on-accent: var(--brand-on-accent); --ok: #4ADE80; --warn: #FACC15; --no: #F87171;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 400 15px/1.55 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100dvh; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { width: min(100% - 32px, 520px); margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 0 calc(28px + env(safe-area-inset-bottom, 0px)); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand img { height: 28px; width: auto; display: block; }
.brand span { font: 700 13px/1 'Inter', sans-serif; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; }
h1 { margin: 26px 0 8px; font: 900 clamp(30px, 8vw, 40px)/1.04 'Archivo', sans-serif; letter-spacing: -0.04em; }
.lead { margin: 0 0 24px; opacity: .72; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--accent-grad); color: var(--on-accent); font-weight: 700; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--border-strong); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: progress; }
.msg { min-height: 22px; margin: 12px 0 0; font-size: 14px; opacity: .8; }
.msg.err { color: var(--no); opacity: 1; }
.boxes { display: grid; grid-template-columns: repeat(6, minmax(0, 58px)); gap: clamp(6px, 2vw, 10px); margin-bottom: 18px; }
.box { width: 100%; min-width: 0; height: clamp(54px, 15vw, 66px); padding: 0; text-align: center; text-transform: uppercase;
  font: 800 clamp(24px, 7vw, 30px)/1 'Archivo', sans-serif; border: 1px solid var(--border-strong); border-radius: 14px;
  background: color-mix(in srgb, var(--ink) 4%, transparent); caret-color: var(--accent); }
.box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.event { padding: 18px 20px; border-radius: 20px; background: var(--surface); }
.event b { display: block; font: 800 20px/1.2 'Archivo', sans-serif; }
.event small { display: block; margin-top: 4px; opacity: .6; }
.stats { display: flex; gap: 10px; margin: 12px 0 18px; }
.stat { flex: 1; padding: 14px 16px; border-radius: 16px; background: var(--surface); }
.stat b { display: block; font: 900 30px/1 'Archivo', sans-serif; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; opacity: .6; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 999px; background: var(--surface); margin-bottom: 14px; }
.tabs button { padding: 11px; border: 0; border-radius: 999px; background: transparent; font-weight: 600; opacity: .7; }
.tabs button[aria-pressed="true"] { background: var(--soft); opacity: 1; box-shadow: inset 0 0 0 1px var(--border-strong); }
.cam { position: relative; overflow: hidden; aspect-ratio: 1; border-radius: 22px; background: #000; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .frame { position: absolute; inset: 16%; border-radius: 22px; box-shadow: 0 0 0 9999px rgba(12,12,13,.45); pointer-events: none; }
.cam .frame::before, .cam .frame::after { content: ''; position: absolute; inset: -2px; border-radius: 24px; border: 3px solid transparent; }
.cam .frame::before { border-top-color: var(--accent); border-left-color: var(--accent); clip-path: polygon(0 0, 30% 0, 30% 3px, 3px 3px, 3px 30%, 0 30%); }
.cam .frame::after { border-bottom-color: var(--accent); border-right-color: var(--accent); clip-path: polygon(100% 100%, 70% 100%, 70% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 70%, 100% 70%); }
.cam .camtext { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; padding: 24px; text-align: center; font-size: 14px; background: var(--surface); }
.hint { margin: 10px 0 0; font-size: 13px; opacity: .55; text-align: center; }
/* Result card shown over everything after each check. */
.result { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: rgba(12,12,13,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.result-card { width: min(100%, 440px); padding: 28px 24px 22px; border-radius: 26px; background: var(--surface); border: 2px solid var(--tone); text-align: center; animation: pop .22s ease-out; }
.result-card .mark { display: grid; place-items: center; width: 74px; height: 74px; margin: 0 auto 14px; border-radius: 50%; background: color-mix(in srgb, var(--tone) 18%, transparent); color: var(--tone); }
.result-card .mark svg { width: 40px; height: 40px; }
.result-card h2 { margin: 0; font: 900 26px/1.1 'Archivo', sans-serif; color: var(--tone); letter-spacing: -0.02em; }
.result-card .who { margin: 12px 0 0; font: 800 22px/1.2 'Archivo', sans-serif; }
.result-card .sub { margin: 6px 0 0; font-size: 14px; opacity: .65; }
.result-card .btn { margin-top: 22px; }
.result.ok { --tone: var(--ok); } .result.already { --tone: var(--warn); } .result.bad { --tone: var(--no); }
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .result-card { animation: none; } }
.foot { margin-top: 26px; display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; opacity: .5; }
.linkbtn { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

<body>
<main class="wrap" id="app" aria-live="polite"><p class="lead" style="margin-top:40px">Yükleniyor…</p></main>

<script>
(() => {
  'use strict';
  const FN = 'https://hcgotmcbwmleeklbvawb.supabase.co/functions/v1/event-checkin';
  const KEY = 'sb_publishable_RcHJDYGkpd-01DPYG9o3HQ_8prlhUQn';
  const app = document.getElementById('app');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const BRAND = '<div class="brand"><img data-tint="unipakt-logo-bg-white" src="/unipakt-logo-bg-white.png?v=5" alt="UniPakt"><span>Giriş kontrolü</span></div>';
  const ICON = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    already: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    bad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  };

  // The link token comes in the URL fragment (#t=…); it is moved to this tab's
  // storage and removed from the address bar, so it does not end up in history.
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('t');
  if (fromHash) { try { sessionStorage.setItem('upCheckToken', fromHash); sessionStorage.removeItem('upCheckCode'); } catch (_) {} history.replaceState(null, '', location.pathname); }
  const token = fromHash || (() => { try { return sessionStorage.getItem('upCheckToken') || ''; } catch (_) { return ''; } })();
  let accessCode = (() => { try { return sessionStorage.getItem('upCheckCode') || ''; } catch (_) { return ''; } })();
  let info = null, mode = 'qr', stopScan = null, busy = false, resultTimer = null;

  const call = async (body) => {
    let r, data = {};
    try {
      r = await fetch(FN, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      data = await r.json().catch(() => ({}));
    } catch (_) { const e = new Error('Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.'); e.network = true; throw e; }
    if (!r.ok) { const e = new Error(data.message || 'İşlem yapılamadı.'); e.status = r.status; e.data = data; throw e; }
    return data;
  };

  const boxesHtml = (kind) => `<div class="boxes" role="group" aria-label="${kind === 'access' ? 'Erişim kodu' : 'Kayıt kodu'}">${Array.from({ length: 6 }, (_, i) =>
    `<input class="box" data-box="${i}" maxlength="${i === 0 ? 6 : 1}" autocomplete="off" autocapitalize="characters" spellcheck="false" ${kind === 'access' ? 'inputmode="numeric" pattern="[0-9]*"' : 'inputmode="text"'} aria-label="${i + 1}. karakter">`).join('')}</div>`;
  const wireBoxes = (form, kind, onFull) => {
    const boxes = [...form.querySelectorAll('[data-box]')];
    const clean = (v) => (kind === 'access' ? v.replace(/\D/g, '') : v.toUpperCase().replace(/[^A-Z0-9]/g, ''));
    const fill = (start, text) => {
      clean(text).slice(0, 6 - start).split('').forEach((ch, k) => { boxes[start + k].value = ch; });
      const filled = boxes.findIndex((b) => !b.value);
      (boxes[filled === -1 ? 5 : filled]).focus();
      if (boxes.every((b) => b.value)) onFull(boxes.map((b) => b.value).join(''));
    };
    boxes.forEach((b, i) => {
      b.addEventListener('input', () => { const v = b.value; b.value = ''; if (v) fill(i, v); });
      b.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !b.value && i > 0) { e.preventDefault(); boxes[i - 1].value = ''; boxes[i - 1].focus(); }
        if (e.key === 'Enter') { e.preventDefault(); if (boxes.every((x) => x.value)) onFull(boxes.map((x) => x.value).join('')); }
      });
      b.addEventListener('paste', (e) => { e.preventDefault(); fill(i, e.clipboardData?.getData('text') || ''); });
      b.addEventListener('focus', () => b.select());
    });
    return { clear: () => { boxes.forEach((b) => { b.value = ''; }); boxes[0].focus(); }, value: () => boxes.map((b) => b.value).join('') };
  };

  // ---------- 1) No link / broken link ----------
  const renderNoLink = (message) => {
    app.innerHTML = `${BRAND}<h1>Bağlantı gerekli</h1><p class="lead">${esc(message || 'Bu sayfa, etkinliği düzenleyen kulübün e-postayla gönderdiği bağlantıyla açılır. E-postandaki “Kontrol sayfasını aç” düğmesine dokun.')}</p>`;
  };

  // ---------- 2) Access code ----------
  const renderAccess = (message = '', isErr = false) => {
    stopCamera();
    app.innerHTML = `${BRAND}
      <h1>Erişim kodunu gir</h1>
      <p class="lead">E-postadaki 6 haneli erişim kodunu yaz.</p>
      <form id="accessForm" novalidate>${boxesHtml('access')}
        <button class="btn block" type="submit">Devam et</button>
        <p class="msg ${isErr ? 'err' : ''}" id="accessMsg">${esc(message)}</p>
      </form>`;
    const form = document.getElementById('accessForm');
    const msg = document.getElementById('accessMsg');
    const go = async (code) => {
      if (busy || code.length !== 6) { if (code.length !== 6) { msg.textContent = 'Kodun 6 hanesini de gir.'; msg.className = 'msg err'; } return; }
      busy = true; form.querySelector('button').disabled = true; msg.textContent = 'Kontrol ediliyor…'; msg.className = 'msg';
      try {
        info = await call({ action: 'open', token, access_code: code });
        accessCode = code; try { sessionStorage.setItem('upCheckCode', code); } catch (_) {}
        renderMain();
      } catch (error) {
        const kind = error.data?.error;
        if (kind === 'link' || kind === 'expired' || kind === 'locked') { renderNoLink(error.message); return; }
        msg.textContent = error.message; msg.className = 'msg err'; boxes.clear();
      } finally { busy = false; const b = form.querySelector('button'); if (b) b.disabled = false; }
    };
    const boxes = wireBoxes(form, 'access', go);
    form.addEventListener('submit', (e) => { e.preventDefault(); go(boxes.value()); });
    form.querySelector('[data-box="0"]').focus();
  };

  // ---------- 3) Checking ----------
  const statsHtml = (s) => `<div class="stat"><b>${s.checked}</b><span>giriş yaptı</span></div><div class="stat"><b>${s.total}</b><span>kayıtlı</span></div>`;
  const whenText = (d, t) => {
    if (!d) return '';
    const [y, m, dd] = d.split('-').map(Number);
    const months = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
    return `${dd} ${months[m - 1]} ${y}${t ? ` · ${String(t).slice(0, 5)}` : ''}`;
  };
  const renderMain = () => {
    const e = info.event || {};
    app.innerHTML = `${BRAND}
      <h1>${esc(e.title || 'Etkinlik')}</h1>
      <div class="event"><b>${esc(e.owner || '')}</b><small>${esc([whenText(e.date, e.time), e.place].filter(Boolean).join(' · '))}</small>
        <small>Görevli: ${esc(info.staff?.name || '')}</small></div>
      <div class="stats" id="stats">${statsHtml(info.stats || { total: 0, checked: 0 })}</div>
      <div class="tabs" role="group" aria-label="Kontrol yöntemi">
        <button type="button" data-mode="qr" aria-pressed="${mode === 'qr'}">QR okut</button>
        <button type="button" data-mode="code" aria-pressed="${mode === 'code'}">Kodla kontrol</button>
      </div>
      <section id="panel"></section>
      <div class="foot"><span>Yetki: ${esc(new Date(info.expires_at).toLocaleString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }))}’e kadar</span>
        <button class="linkbtn" type="button" id="forget">Bu cihazda çıkış yap</button></div>`;
    app.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.mode; renderMain(); }));
    document.getElementById('forget').addEventListener('click', () => {
      stopCamera(); try { sessionStorage.removeItem('upCheckCode'); } catch (_) {}
      accessCode = ''; renderAccess('Çıkış yapıldı. Devam etmek için erişim kodunu yeniden gir.');
    });
    if (mode === 'qr') renderQr(); else renderCode();
  };

  const stopCamera = () => { if (stopScan) { try { stopScan(); } catch (_) {} stopScan = null; } };
  let scanModule = null;
  const renderQr = () => {
    const panel = document.getElementById('panel');
    panel.innerHTML = `<div class="cam"><video id="video" muted playsinline></video><div class="frame"></div>
        <div class="camtext" id="camtext"><span>Kamera açılıyor…</span></div></div>
      <p class="hint">QR kodu çerçevenin içine getir. Kamerada sorun olursa “Kodla kontrol”e geç.</p>`;
    startCamera();
  };
  const startCamera = async () => {
    stopCamera();
    const camtext = document.getElementById('camtext');
    const video = document.getElementById('video');
    if (!video) return;
    if (!navigator.mediaDevices?.getUserMedia) { camFailed('Bu tarayıcı kameraya erişemiyor.'); return; }
    try {
      scanModule ||= await import('/assets/qr/qr-scan.js');
      stopScan = await scanModule.startScanner(video, (text) => check(text));
      if (camtext) camtext.hidden = true;
    } catch (error) {
      camFailed(error && error.name === 'NotAllowedError' ? 'Kamera izni verilmedi. Tarayıcı ayarlarından izin verebilir ya da kodla kontrol edebilirsin.' : 'Kamera açılamadı.');
    }
  };
  const camFailed = (text) => {
    const camtext = document.getElementById('camtext');
    if (!camtext) return;
    camtext.hidden = false;
    camtext.innerHTML = `<span>${esc(text)}</span><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn ghost" type="button" id="camRetry">Tekrar dene</button><button class="btn" type="button" id="toCode">Kodla kontrol et</button></div>`;
    document.getElementById('camRetry').addEventListener('click', () => { camtext.innerHTML = '<span>Kamera açılıyor…</span>'; startCamera(); });
    document.getElementById('toCode').addEventListener('click', () => { mode = 'code'; renderMain(); });
  };
  let codeBoxes = null;
  const renderCode = () => {
    stopCamera();
    const panel = document.getElementById('panel');
    panel.innerHTML = `<form id="codeForm" novalidate>${boxesHtml('code')}<button class="btn block" type="submit">Kontrol et</button></form>
      <p class="hint">Katılımcının ekranındaki 6 karakterli kodu yaz (harfler büyük).</p>`;
    const form = document.getElementById('codeForm');
    codeBoxes = wireBoxes(form, 'code', (v) => check(v));
    form.addEventListener('submit', (e) => { e.preventDefault(); check(codeBoxes.value()); });
    form.querySelector('[data-box="0"]').focus();
  };

  const check = async (code) => {
    if (busy || document.querySelector('.result')) return;
    busy = true;
    try {
      const r = await call({ action: 'check', token, access_code: accessCode, code });
      if (r.stats) { info.stats = r.stats; const s = document.getElementById('stats'); if (s) s.innerHTML = statsHtml(r.stats); }
      showResult(r);
    } catch (error) {
      const kind = error.data?.error;
      if (kind === 'wrong' || kind === 'locked' || kind === 'link' || kind === 'expired') {
        try { sessionStorage.removeItem('upCheckCode'); } catch (_) {}
        if (kind === 'wrong') renderAccess(error.message, true); else renderNoLink(error.message);
        return;
      }
      showResult({ result: 'error', message: error.message });
    } finally { busy = false; }
  };
  const showResult = (r) => {
    const tone = r.result === 'ok' ? 'ok' : r.result === 'already' ? 'already' : 'bad';
    const title = { ok: 'Giriş onaylandı', already: 'Daha önce giriş yaptı', other_event: 'Başka etkinlik', waitlist: 'Bekleme listesinde', not_found: 'Kayıt bulunamadı', error: 'Kontrol edilemedi' }[r.result] || 'Kayıt bulunamadı';
    const at = r.checked_in_at ? new Date(r.checked_in_at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';
    const who = r.person ? `<p class="who">${esc(r.person.name)}</p><p class="sub">${esc(r.person.code)} · ${esc(r.person.email)}</p>` : `<p class="sub">${esc(r.message || '')}</p>`;
    const extra = r.result === 'already' && at ? `<p class="sub">İlk giriş: ${esc(at)}</p>`
      : r.result === 'waitlist' ? '<p class="sub">Kaydı kesinleşmemiş, girişe alınmaz.</p>' : '';
    const box = document.createElement('div');
    box.className = `result ${tone}`;
    box.setAttribute('role', 'alertdialog');
    box.innerHTML = `<div class="result-card"><div class="mark">${ICON[tone]}</div><h2>${esc(title)}</h2>${who}${extra}<button class="btn block" type="button">Sıradaki</button></div>`;
    document.body.append(box);
    try { navigator.vibrate?.(tone === 'ok' ? 60 : [80, 60, 80]); } catch (_) {}
    const close = () => { clearTimeout(resultTimer); box.remove(); if (mode === 'code' && codeBoxes) codeBoxes.clear(); };
    box.querySelector('button').addEventListener('click', close);
    box.addEventListener('click', (e) => { if (e.target === box) close(); });
    box.querySelector('button').focus();
    // QR mode moves on by itself so the queue keeps flowing; problems stay until tapped.
    if (mode === 'qr' && tone === 'ok') resultTimer = setTimeout(close, 2200);
  };

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopCamera();
    else if (info && mode === 'qr' && document.getElementById('video') && !stopScan) startCamera();
  });

  // ---------- start ----------
  if (!token) { renderNoLink(); return; }
  if (!accessCode) { renderAccess(); return; }
  call({ action: 'open', token, access_code: accessCode })
    .then((r) => { info = r; renderMain(); })
    .catch((error) => {
      const kind = error.data?.error;
      if (kind === 'link' || kind === 'expired' || kind === 'locked') renderNoLink(error.message);
      else renderAccess(error.network ? error.message : '', !!error.network);
    });
})();
</script>
</body>
</html>
