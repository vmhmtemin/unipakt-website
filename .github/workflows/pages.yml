# Publishes unipakt.com. Needs: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  # Event share pages (/etkinlik/<id>/) and the brand colour (panel › Marka rengi) are rebuilt every hour.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install chat SDK dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build chat SDK bundle
        run: pnpm run build:matrix
      - name: Build QR helpers (event page QR, kontrol.html scanner)
        run: pnpm run build:qr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Image tools for the brand colour (logos are repainted with the live theme)
        run: python -m pip install --quiet pillow numpy
      - name: Build _site (one copy of index.html per page path)
        run: python tools/build_pages.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
