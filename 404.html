  :root { color-scheme: dark; --ink: #fff; --paper: #000; --border: #FFFFFF20; --border-strong: #FFFFFF35; --accent: #FF5A1F; --on-accent: #000; }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;

    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--on-accent); }
  header, main, footer { width: 100%; max-width: 1240px; margin: 0 auto; padding-left: clamp(16px, 5vw, 64px); padding-right: clamp(16px, 5vw, 64px); }

  .wordmark span { color: var(--accent); }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: clamp(48px, 9vw, 110px); padding-bottom: clamp(48px, 9vw, 110px); }
  .kicker { margin: 0 0 10px; font: 700 clamp(24px, 3vw, 32px)/1 'Caveat', cursive; color: var(--accent); }
  h1 { margin: 0; font: 900 clamp(96px, 22vw, 260px)/.85 'Archivo', sans-serif; letter-spacing: -0.06em; }
  h1 span { color: var(--accent); }
  .lead { margin: clamp(22px, 3vw, 34px) 0 0; max-width: 46ch; font-size: clamp(17px, 1.6vw, 20px); opacity: .8; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; margin-top: clamp(28px, 4vw, 44px); }
  .btn {
    display: inline-flex; align-items: center; padding: 15px 28px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); border: 1.5px solid var(--accent);
    font-weight: 600; text-decoration: none; transition: background .2s ease, color .2s ease;
  }
  .btn:hover, .btn:focus-visible { background: transparent; color: var(--accent); }
  .links { display: flex; flex-wrap: wrap; gap: 8px 22px; }
  .links a { color: var(--ink); opacity: .7; text-decoration: none; border-bottom: 1px solid var(--border-strong); padding-bottom: 2px; transition: opacity .2s ease, border-color .2s ease; }
  .links a:hover, .links a:focus-visible { opacity: 1; border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  footer { padding-top: 24px; padding-bottom: 28px; border-top: 1px solid var(--border); font-size: 13px; opacity: .5; max-width: none; }
  /* A lone dot that drifts off the network line: the page that is not connected. */
  .line { position: relative; height: 2px; margin-top: clamp(40px, 6vw, 70px); max-width: 520px; background: linear-gradient(90deg, var(--border-strong), transparent); }
  .line::before, .line::after { content: ''; position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); }
  .line::before { left: 0; background: var(--ink); }
  .line::after { left: 62%; background: var(--accent); animation: drift 3.2s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -170%); } }

<script>
(function () {
  // The site's pages live at /story/, /takvim/ ... (copies built by tools/build_pages.py).
  // If this page is shown for one of them anyway (e.g. a deploy without those copies),
  // open it through the home page. Keep in sync with ROUTES in tools/build_pages.py.
  var routes = ['story', 'takvim', 'kulupler', 'hakkimizda', 'kampus', 'iletisim', 'katil', 'kvkk'];
  var first = location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0];

})();
