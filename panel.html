    'pts-new'(id) {
      if (!isAdmin()) return;
      const events = [...publishedEvents()].reverse();
      const hostCategories = [
        ['org', 'Organizasyon Planlama', 10],
        ['ops', 'Operasyon Yönetimi', 10],
        ['participant', 'Katılımcı Memnuniyeti', 10],
        ['resource', 'Kaynak & Tesis Yönetimi', 5],
        ['fairness', 'Adalet & Sorumluluk', 9],
        ['innovation', 'Yenilik & Fikir Geliştirme', 6],
      ];
      const supportCategories = [
        ['supportDuty', 'Görev ve Sorumluluk Yönetimi', 12],
        ['supportOps', 'Operasyonel Katkı', 10],
        ['supportStaff', 'Personel Desteği', 4],
        ['supportTeam', 'Ekip Koordinasyonu', 4],
      ];
      const makeScoreFields = (categories) => categories.map(([name, label, max]) =>
        field(label, `<div class="field-row"><input type="number" name="${name}" min="0" max="100" step="1" value="0" placeholder="0–100"><span class="muted" data-score="${name}">0 / ${max}</span></div>`)
      ).join('');
      const clubOptions = db.clubs.map((c) => `<option value="${esc(c.id)}" ${c.id === id ? 'selected' : ''}>${esc(c.name)} — ${esc(c.uni || c.university || 'Üniversite belirtilmemiş')} (${pts(c.id)})</option>`).join('');
      const eventOptions = events.map((e) => `<option value="${esc(e.id)}">${esc(e.title)} · ${fmtDay(e.date)}</option>`).join('');

      openForm({
        title: 'Puan gönder',
        lead: 'Kulüp ve etkinliği seç. Sistem etkinlikteki rolünü otomatik belirleyip doğru puanlama aracını açar.',
        fields: field('Kulüp', `<select name="club" required><option value="">Kulüp seç</option>${clubOptions}</select>`)
          + field('Etkinlik', `<select name="event"><option value="">${OTHER}</option>${eventOptions}</select>`)
          + `<div data-role-status class="quote"><small>Rol</small>Etkinlik seçildiğinde kulübün Host veya Support rolü burada gösterilir.</div>`
          + `<div data-host-panel hidden><p class="form-section">Host değerlendirmesi · Standart toplam 50 puandır</p>${makeScoreFields(hostCategories)}<label class="checkline"><input type="checkbox" name="crisisBonus" value="5"><span><strong>Kriz Çözüm Bonusu</strong><small>Gerçek operasyonel kriz başarıyla çözüldüyse +5 puan</small></span><b data-crisis-value>+0</b></label><div class="card" style="margin-top:14px;padding:16px"><div class="mini-row"><div><strong>Standart toplam</strong><small>50 puan üzerinden</small></div><b data-standard-total>0 / 50</b></div><div class="mini-row"><div><strong>Kriz Çözüm Bonusu</strong><small>Bonus ayrı değerlendirilir</small></div><b data-bonus-total>+0</b></div><div class="mini-row"><div><strong>Genel toplam</strong><small>55 puan üzerinden</small></div><b data-grand-total>0 / 55</b></div></div></div>`
          + `<div data-support-panel hidden><p class="form-section">Support değerlendirmesi · Standart toplam 30 puandır</p>${makeScoreFields(supportCategories)}<label class="checkline"><input type="checkbox" name="supportBonus" value="5"><span><strong>Ek Sorumluluk Bonusu</strong><small>Ek sorumluluk başarıyla üstlenildiyse +5 puan</small></span><b data-support-bonus-value>+0</b></label><div class="card" style="margin-top:14px;padding:16px"><div class="mini-row"><div><strong>Standart toplam</strong><small>30 puan üzerinden</small></div><b data-support-standard-total>0 / 30</b></div><div class="mini-row"><div><strong>Ek Sorumluluk Bonusu</strong><small>Bonus ayrı değerlendirilir</small></div><b data-support-bonus-total>+0</b></div><div class="mini-row"><div><strong>Genel toplam</strong><small>35 puan üzerinden</small></div><b data-support-grand-total>0 / 35</b></div></div></div>`
          + `<div data-other-panel hidden>${field('Etkinlik dışı puan','<input type="number" name="otherDelta" step="1" placeholder="Örn. 20 veya -10">')}<p class="muted">Etkinlik seçilmezse puan doğrudan bu değer olarak kaydedilir.</p></div>`
          + field('Açıklama (isteğe bağlı)', '<input name="note" maxlength="120" placeholder="Değerlendirme notu">'),
        submit: 'Gönder',
        onSubmit: async (fd) => {
          const c = club(val(fd, 'club')); if (!c) return 'Bir kulüp seç.';
          const eventId = val(fd, 'event');
          const ev = db.events.find((e) => e.id === eventId);
          const userNote = val(fd, 'note');

          if (!ev) {
            const delta = Math.round(Number(fd.get('otherDelta')));
            if (!Number.isFinite(delta) || delta === 0) return 'Etkinlik dışı puan sıfırdan farklı olmalı.';
            await api.addPoints({ clubId: c.id, eventId: '', label: OTHER, delta, note: userNote });
            toast(`${c.name}: ${signed(delta)} puan`);
            return;
          }

          const isHost = ev.ownerId === c.id;
          const isSupport = ev.applications.some((p) => p.clubId === c.id && p.status === 'approved');
          if (!isHost && !isSupport) return 'Bu kulüp seçilen etkinlikte Host veya onaylı Support değil.';

          if (isHost) {
            const values = Object.fromEntries(hostCategories.map(([name]) => [name, Math.max(0, Math.min(100, Number(fd.get(name)) || 0))]));
            const standard = hostCategories.reduce((sum, [name, , max]) => sum + (values[name] * max / 100), 0);
            const crisis = fd.get('crisisBonus') ? 5 : 0;
            const rawTotal = standard + crisis;
            if (rawTotal <= 0) return 'En az bir değerlendirme puanı gir.';
            const total = Math.round(rawTotal);
            const breakdown = hostCategories.map(([name, label, max]) => `${label}: ${(values[name] * max / 100).toFixed(1)}/${max}`).join(' · ');
            const generatedNote = `${breakdown} · Kriz: +${crisis} · Hesaplanan: ${rawTotal.toFixed(1)}/55 · Yuvarlanan: ${total}/55`;
            const note = `${generatedNote}${userNote ? ` · Açıklama: ${userNote}` : ''}`;
            await api.addPoints({ clubId: c.id, eventId: ev.id, label: ev.title, delta: total, note });
            toast(`${c.name}: +${total} Host puanı`);
          } else {
            const values = Object.fromEntries(supportCategories.map(([name]) => [name, Math.max(0, Math.min(100, Number(fd.get(name)) || 0))]));
            const standard = supportCategories.reduce((sum, [name, , max]) => sum + (values[name] * max / 100), 0);
            const bonus = fd.get('supportBonus') ? 5 : 0;
            const rawTotal = standard + bonus;
            if (rawTotal <= 0) return 'En az bir değerlendirme puanı gir.';
            const total = Math.round(rawTotal);
            const breakdown = supportCategories.map(([name, label, max]) => `${label}: ${(values[name] * max / 100).toFixed(1)}/${max}`).join(' · ');
            const generatedNote = `${breakdown} · Ek Sorumluluk: +${bonus} · Hesaplanan: ${rawTotal.toFixed(1)}/35 · Yuvarlanan: ${total}/35`;
            const note = `${generatedNote}${userNote ? ` · Açıklama: ${userNote}` : ''}`;
            await api.addPoints({ clubId: c.id, eventId: ev.id, label: ev.title, delta: total, note });
            toast(`${c.name}: +${total} Support puanı`);
          }
        },
      });

      const hostPanel = dlgForm.querySelector('[data-host-panel]');
      const supportPanel = dlgForm.querySelector('[data-support-panel]');
      const otherPanel = dlgForm.querySelector('[data-other-panel]');
      const roleStatus = dlgForm.querySelector('[data-role-status]');
      const eventSelect = dlgForm.querySelector('[name="event"]');
      const clubSelect = dlgForm.querySelector('[name="club"]');

      const updateRolePreview = () => {
        const c = club(clubSelect?.value || '');
        const ev = db.events.find((e) => e.id === (eventSelect?.value || ''));
        if (!ev) {
          hostPanel.hidden = true; supportPanel.hidden = true; otherPanel.hidden = false;
          if (roleStatus) roleStatus.innerHTML = '<small>Rol</small>Etkinlik dışı puanlama';
          return;
        }
        otherPanel.hidden = true;

        let hostStandard = 0;
        hostCategories.forEach(([name, , max]) => {
          const input = dlgForm.querySelector(`[name="${name}"]`);
          const raw = Math.max(0, Math.min(100, Number(input?.value) || 0));

        const hostBonusOut = dlgForm.querySelector('[data-bonus-total]');
        const hostGrandOut = dlgForm.querySelector('[data-grand-total]');
        const crisisOut = dlgForm.querySelector('[data-crisis-value]');
        if (hostStdOut) hostStdOut.textContent = `${hostStandard.toFixed(1)} / 50`;
        if (hostBonusOut) hostBonusOut.textContent = `+${crisis}`;
        if (hostGrandOut) hostGrandOut.textContent = `${hostTotal} / 55`;
        if (crisisOut) crisisOut.textContent = `+${crisis}`;

        let supportStandard = 0;
        supportCategories.forEach(([name, , max]) => {
          const input = dlgForm.querySelector(`[name="${name}"]`);
          const raw = Math.max(0, Math.min(100, Number(input?.value) || 0));
          const score = raw * max / 100;
          supportStandard += score;
          const out = dlgForm.querySelector(`[data-score="${name}"]`);
          if (out) out.textContent = `${score.toFixed(1)} / ${max}`;
        });
        const supportBonus = dlgForm.querySelector('[name="supportBonus"]')?.checked ? 5 : 0;
        const supportTotal = Math.round(supportStandard + supportBonus);
        const supportStdOut = dlgForm.querySelector('[data-support-standard-total]');
        const supportBonusOut = dlgForm.querySelector('[data-support-bonus-total]');
        const supportGrandOut = dlgForm.querySelector('[data-support-grand-total]');
        const supportBonusValue = dlgForm.querySelector('[data-support-bonus-value]');
        if (supportStdOut) supportStdOut.textContent = `${supportStandard.toFixed(1)} / 30`;
        if (supportBonusOut) supportBonusOut.textContent = `+${supportBonus}`;
        if (supportGrandOut) supportGrandOut.textContent = `${supportTotal} / 35`;
        if (supportBonusValue) supportBonusValue.textContent = `+${supportBonus}`;
      };

      eventSelect?.addEventListener('change', updateRolePreview);
      clubSelect?.addEventListener('change', updateRolePreview);
      dlgForm.querySelectorAll('input[type="number"], input[name="crisisBonus"], input[name="supportBonus"]').forEach((input) => input.addEventListener('input', updateScorePreview));
      dlgForm.querySelectorAll('input[name="crisisBonus"], input[name="supportBonus"]').forEach((input) => input.addEventListener('change', updateScorePreview));
      updateRolePreview();

  /* ------------------------------------------------------------------
     TWO-STEP VERIFICATION (2FA) — e-mail code
     The database refuses everything to a 2FA account's session until that
     session is verified; this is the screen that verifies it. A browser that
     verified once keeps a 30-day token (localStorage) and is let through
     without a code next time.
     ------------------------------------------------------------------ */
  const MFA_LEN = 6;
  const mfaDeviceKey = () => `unipaktMfaDevice.${session?.user_id || state.user || ''}`;
  const mfaLead = () => `<b>${esc(state.mfa.email || 'E-posta adresine')}</b> ${state.mfa.email ? 'adresine' : ''} 6 haneli bir kod gönderdik. Kod 10 dakika geçerli.`;
  const mfaCodeHtml = (purpose) => `<form class="mfa" id="mfaForm" data-purpose="${esc(purpose)}" novalidate autocomplete="off">
      <div class="mfa-digits" role="group" aria-label="6 haneli doğrulama kodu">
        ${Array.from({ length: MFA_LEN }, (_, i) => `<input class="mfa-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="${i === 0 ? MFA_LEN : 1}" aria-label="${i + 1}. hane" data-mfa-digit="${i}" ${i === 0 ? 'autocomplete="one-time-code"' : 'autocomplete="off"'}>`).join('')}
      </div>
      <p class="mfa-msg" data-mfa-msg aria-live="polite"></p>
      <div class="mfa-actions">
        <button class="btn" type="submit">Doğrula</button>
        <button class="link-btn" type="button" data-mfa-resend>Kodu tekrar gönder</button>
      </div>
    </form>`;
  const setMfaMsg = (text, isError = false) => {
    const el = document.querySelector('[data-mfa-msg]');
    if (!el) return;
    el.textContent = text || ''; el.classList.toggle('is-error', !!isError);
  };
  // "Kodu tekrar gönder" is disabled while the 45-second wait runs.
  let mfaTimer = null;
  const tickMfaResend = () => {
    clearInterval(mfaTimer);
    const update = () => {
      const btn = document.querySelector('[data-mfa-resend]');
      if (!btn) { clearInterval(mfaTimer); return; }
      const left = Math.ceil((state.mfa.resendAt - Date.now()) / 1000);
      btn.disabled = left > 0;
      btn.textContent = left > 0 ? `Kodu tekrar gönder (${left})` : 'Kodu tekrar gönder';
      if (left <= 0) clearInterval(mfaTimer);
    };
    update(); mfaTimer = setInterval(update, 1000);
  };
  const requestMfaCode = async (purpose) => {
    try {
      const r = await api.mfa('send', { purpose });
      if (r?.email) state.mfa.email = r.email;
      state.mfa.resendAt = Date.now() + 45000;
      const lead = document.querySelector('[data-mfa-lead]');
      if (lead) lead.innerHTML = mfaLead();
      setMfaMsg('');
    } catch (error) {
      if (error.data?.retry_after) state.mfa.resendAt = Date.now() + error.data.retry_after * 1000;
      setMfaMsg(error.message || 'Kod gönderilemedi.', true);
    }
    tickMfaResend();
  };
  const mountMfa = () => {
    document.querySelector('[data-mfa-digit="0"]')?.focus();
    tickMfaResend();
  };
  const mfaDigits = (form) => [...form.querySelectorAll('[data-mfa-digit]')];
  // Put a run of digits into the boxes from `start` (typing, paste, autofill).
  const fillMfaDigits = (form, start, text) => {
    const boxes = mfaDigits(form);
    const digits = String(text).replace(/\D/g, '').slice(0, MFA_LEN - start).split('');
    digits.forEach((d, k) => { boxes[start + k].value = d; });
    const next = Math.min(start + digits.length, MFA_LEN - 1);
    boxes[next].focus();
    if (boxes.every((b) => b.value)) form.requestSubmit();
  };
  // Wrong code: every digit hops up a little and falls out of its box.
  const spillMfaDigits = (form) => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    mfaDigits(form).forEach((box, i) => {
      const value = box.value;
      box.value = '';
      if (!value) return;
      const r = box.getBoundingClientRect();
      const cs = getComputedStyle(box);
      const drop = document.createElement('span');
      drop.className = 'mfa-drop';
      drop.textContent = value;
      Object.assign(drop.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`, font: cs.font, color: cs.color });
      document.body.append(drop);
      const fall = window.innerHeight - r.top + 120;
      const drift = (Math.random() - 0.5) * 70;
      const spin = (Math.random() - 0.5) * 90;
      const anim = drop.animate(reduce
        ? [{ opacity: 1 }, { opacity: 0 }]
        : [
          { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
          { transform: `translate(${drift * 0.15}px, -16px) rotate(${spin * 0.1}deg)`, opacity: 1, offset: 0.16, easing: 'cubic-bezier(.5, 0, .9, .5)' },
          { transform: `translate(${drift}px, ${fall}px) rotate(${spin}deg)`, opacity: 0.85 },
        ], { duration: reduce ? 250 : 950 + Math.random() * 300, delay: reduce ? 0 : i * 60, fill: 'forwards' });
      anim.onfinish = () => drop.remove();
    });
    form.classList.remove('is-wrong'); void form.offsetWidth; form.classList.add('is-wrong');
    setTimeout(() => form.querySelector('[data-mfa-digit="0"]')?.focus(), 150);
  };
  const verifyMfa = async (form) => {
    const purpose = form.dataset.purpose;
    const code = mfaDigits(form).map((b) => b.value).join('');
    if (code.length !== MFA_LEN) { setMfaMsg('Kodun 6 hanesini de gir.', true); return; }
    if (state.mfa.busy) return;
    state.mfa.busy = true;
    const button = form.querySelector('button[type="submit"]');
    button.disabled = true; setMfaMsg('Doğrulanıyor…');
    try {
      const r = await api.mfa('verify', { purpose, code });
      if (r?.device_token && !DEMO) { try { localStorage.setItem(mfaDeviceKey(), r.device_token); } catch (_) {} }
      form.classList.add('is-ok'); setMfaMsg('Doğrulandı.');
      await new Promise((ok) => setTimeout(ok, 450));
      state.mfa.flow = null;
      if (purpose === 'login') { await enterPanel(); return; }
      if (purpose === 'enable') { state.mfa.enabled = true; toast('İki adımlı doğrulama açıldı.'); }
      if (purpose === 'disable') {
        state.mfa.enabled = false;
        try { localStorage.removeItem(mfaDeviceKey()); } catch (_) {}
        toast('İki adımlı doğrulama kapatıldı.');
      }
      go('hesap');
    } catch (error) {
      if (!state.user && !session && !DEMO) { renderLogin(error.message); return; }
      spillMfaDigits(form);
      const kind = error.data?.error;
      setMfaMsg(error.message || 'Kod doğrulanamadı.', true);
      if (kind === 'expired' || kind === 'locked') { state.mfa.resendAt = 0; tickMfaResend(); }
    } finally {
      state.mfa.busy = false;
      if (document.body.contains(button)) button.disabled = false;
    }
  };
  // Full-screen code page shown after sign-in, before any panel data loads.
  const renderMfaGate = () => {
    root.innerHTML = `
      <main class="login"><div class="login-box mfa-box">
        <a class="wordmark" href="https://unipakt.com/" aria-label="UniPakt"><img class="wordmark-img" src="unipakt-logo-bg-white.png?v=3" alt="UniPakt"></a>
        <p class="kicker">Panel</p>
        <h1 class="mfa-title">Bu tarayıcıyı doğrula</h1>
        <p class="mfa-lead" data-mfa-lead>İki adımlı doğrulama açık. ${mfaLead()}</p>
        ${mfaCodeHtml('login')}
        <p class="mfa-note">Doğruladığın tarayıcı 30 gün boyunca tekrar kod istemez.</p>
        <button class="link-btn mfa-signout" type="button" data-mfa-signout>Farklı bir hesapla giriş yap</button>
      </div></main>`;
    mountMfa();
  };
  const showMfaGate = async () => {
    state.mfa.flow = { purpose: 'login' };
    renderMfaGate();
    await requestMfaCode('login');
  };
  // True when this session may load the panel; otherwise the code page is shown.
  const passMfaGate = async () => {
    let status;
    // If the check itself is unreachable, carry on: the database still enforces 2FA.
    try { status = await remote.mfa('status'); } catch (error) { if (!session) throw error; return true; }
    state.mfa.enabled = !!status.enabled; state.mfa.email = status.email || '';
    if (status.verified) return true;
    let token = '';
    try { token = localStorage.getItem(mfaDeviceKey()) || ''; } catch (_) {}
    if (token) {
      const trusted = await remote.mfa('trust', { device_token: token }).catch(() => null);
      if (trusted?.verified) return true;
      try { localStorage.removeItem(mfaDeviceKey()); } catch (_) {}
    }
    await showMfaGate();
    return false;
  };
  // Sign-in → 2FA (if on) → data → panel.
  const enterPanel = async () => {
    root.innerHTML = '<main class="login"><p class="loading">Yükleniyor…</p></main>';
    try {
      if (!DEMO && !(await passMfaGate())) return;
      await loadRemote(); lastSync = Date.now();
      if (!knownView(state.view)) state.view = 'genel';
      render(); window.scrollTo(0, 0);
      loadSiteInboxCount(); startMatrix();
    } catch (error) {
      if (error.mfa) { await showMfaGate(); return; }
      state.user = null; renderLogin(error.message);
    }
  };

  /* ------------------------------------------------------------------
     RENDER
     ------------------------------------------------------------------ */
  const go = (view) => {
    if (!knownView(view)) view = 'genel';
    if (view !== state.view && !leaveEventPage()) return;
    state.view = view; state.profileMenuOpen = false; state.navOpen = false;
    if (location.hash !== `#${view}`) history.pushState(null, '', `#${view}`);
    render(); window.scrollTo(0, 0);
  };

  const renderPasswordReset = (message = '') => {
    root.innerHTML = `
      <main class="login"><div class="login-box">
        <a class="wordmark" href="https://unipakt.com/" aria-label="UniPakt"><img class="wordmark-img" src="unipakt-logo-bg-white.png?v=3" alt="UniPakt"></a>
        <p class="kicker">Panel</p><h2>Yeni şifre belirle</h2>
        <form class="login-form" id="passwordResetForm" novalidate>
          ${field('Yeni şifre', '<input type="password" name="password" required minlength="8" autocomplete="new-password">')}
          ${field('Yeni şifreyi tekrar yaz', '<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password">')}
          <p class="form-error" id="passwordResetError" ${message ? '' : 'hidden'}>${esc(message)}</p>
          <button type="submit" class="btn">Şifreyi kaydet</button>
        </form>
      </div></main>`;
  };

  /* ------------------------------------------------------------------
     UNIPAKT INSTANT MESSAGES — page
     Two panes like WhatsApp Web: chats on the left, the conversation on the
     right (one pane at a time on phones). Only #imList, #imHeadWho and
     #imMsgs are patched when messages arrive; the composer is never rebuilt
     while someone is typing in it.
     ------------------------------------------------------------------ */
  const IM_ICON = {
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.1 2-12.1 2z"/></svg>',
    sent: '<svg class="im-tick" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Gönderildi"><path d="M3.5 5.8 6.4 8.6 12.5 2.4"/></svg>',
    read: '<svg class="im-tick read" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Görüldü"><path d="M1 5.8 3.9 8.6 10 2.4M6.8 8.2l.6.4L13.5 2.4"/></svg>',
    reply: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 4 9l5 5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    sending: '<svg class="im-tick" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.4" aria-label="Gönderiliyor"><circle cx="8" cy="5.5" r="4"/><path d="M8 3.3v2.4l1.5 1"/></svg>',
  };
  const imPeerInfo = (peer) => {
    if (peer === ADMIN) return { id: ADMIN, name: 'UniPakt', sub: 'Resmî destek hesabı', avatar: '/favicon-192.png', verified: true };
    const c = club(peer);
    const p = db.panelProfiles?.find((x) => x.clubId === peer);
    return { id: peer, name: c?.name || 'Kulüp', sub: c ? [shortUni(c.uni), c.category].filter(Boolean).join(' · ') : '', avatar: p?.avatarUrl || '', club: true };
  };
  const imNameMarkup = (info) => `<span class="im-name">${esc(info.name)}</span>${info.verified ? '<span class="im-verified" aria-label="Onaylı hesap">✓</span>' : ''}${info.club ? '<span class="im-tag">Kulüp</span>' : ''}`;
  // Rooms whose other side is a known panel account, with that account attached.
  const imRooms = () => state.chat.rooms
    .map((r) => ({ ...r, peer: panelUserForMatrixId(r.peerUserId) }))
    .filter((r) => r.peer && r.peer !== state.user);
  const imRoomFor = (peer) => imRooms().find((r) => r.peer === peer) || null;
  const imUnreadTotal = () => imRooms().reduce((sum, r) => sum + r.unread, 0);
  const imMatches = (info) => !state.chat.search.trim() || searchKey(`${info.name} ${info.sub}`).includes(searchKey(state.chat.search));

  const imClock = (ts) => new Date(ts).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  const imDayDiff = (ts) => {
    const a = new Date(ts); a.setHours(0, 0, 0, 0);
    const b = new Date(); b.setHours(0, 0, 0, 0);
    return Math.round((b - a) / 86400000);
  };
  const imListTime = (ts) => {
    if (!ts) return '';
    const d = imDayDiff(ts);
    if (d === 0) return imClock(ts);
    if (d === 1) return 'Dün';
    if (d < 7) return new Date(ts).toLocaleDateString('tr-TR', { weekday: 'long' });
    return new Date(ts).toLocaleDateString('tr-TR');
  };
  const imDayLabel = (ts) => {
    const d = imDayDiff(ts);
    if (d === 0) return 'Bugün';
    if (d === 1) return 'Dün';
    return new Date(ts).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
  };

  const imRowHtml = (info, room) => {
    const last = room?.messages[room.messages.length - 1];
    const active = state.chat.peer === info.id;
    const preview = room?.peerTyping
      ? '<small class="is-typing">yazıyor…</small>'
      : last
        ? `<small>${last.mine ? IM_ICON[last.state] || '' : ''}<span class="im-preview">${esc(last.body)}</span></small>`
        : `<small><span class="im-preview">${esc(info.sub)}</span></small>`;
    const meta = room
      ? `<span class="im-row-meta ${room.unread ? 'has-unread' : ''}"><span>${esc(imListTime(last?.timestamp))}</span>${room.unread ? `<span class="im-unread">${room.unread}</span>` : ''}</span>`
      : '<span></span>';
    return `<button class="im-row ${active ? 'active' : ''}" type="button" data-act="ims-open" data-id="${esc(info.id)}">
      ${avatarMarkup(info.avatar, info.name)}
      <span class="im-row-main"><strong>${imNameMarkup(info)}</strong>${preview}</span>${meta}</button>`;
  };
  const imListHtml = () => {
    if (state.chat.newChat) {
      const peers = [...(isAdmin() ? [] : [ADMIN]), ...db.clubs.filter((c) => c.id !== state.user).sort(byLabel).map((c) => c.id)]
        .map(imPeerInfo).filter(imMatches);
      return `<p class="im-list-title">Yeni sohbet</p>${peers.map((info) => imRowHtml(info, null)).join('') || '<p class="im-empty-list">Eşleşen kulüp yok.</p>'}`;
    }
    if (state.chat.error) return `<p class="im-empty-list">${esc(state.chat.error)}</p>`;
    if (!matrixModule && state.chat.loading) return '<p class="im-empty-list">Sohbetler yükleniyor…</p>';
    const rows = imRooms().map((r) => ({ info: imPeerInfo(r.peer), room: r })).filter(({ info }) => imMatches(info));
    if (!rows.length) {
      return state.chat.search.trim()
        ? '<p class="im-empty-list">Eşleşen sohbet yok.</p>'
        : '<p class="im-empty-list">Henüz sohbet yok. <b>+</b> ile bir kulübe yazmaya başla.</p>';
    }
    return rows.map(({ info, room }) => imRowHtml(info, room)).join('');
  };
  const imHeadWhoHtml = () => {
    const info = imPeerInfo(state.chat.peer);
    const room = imRoomFor(state.chat.peer);
    return `${avatarMarkup(info.avatar, info.name)}<div class="im-head-text"><strong>${imNameMarkup(info)}</strong>${room?.peerTyping ? '<small class="is-typing">yazıyor…</small>' : `<small>${esc(info.sub)}</small>`}</div>`;
  };
  const imMsgsHtml = () => {
    const room = imRoomFor(state.chat.peer);
    if (!room || !room.messages.length) {
      return `<p class="im-status">${room?.peerTyping ? '' : 'Henüz mesaj yok. İlk mesajı sen gönder.'}</p>${room?.peerTyping ? '<span class="im-typing-bubble" aria-label="yazıyor"><i></i><i></i><i></i></span>' : ''}`;
    }
    let html = room.canLoadOlder ? '<button class="btn ghost small im-older" type="button" data-act="ims-older">Daha eski mesajlar</button>' : '';
    let prev = null;
    for (const m of room.messages) {
      if (!prev || imDayDiff(prev.timestamp) !== imDayDiff(m.timestamp)) { html += `<p class="im-day">${esc(imDayLabel(m.timestamp))}</p>`; prev = null; }
      const cont = prev && prev.sender === m.sender && m.timestamp - prev.timestamp < 5 * 60000;
      const canReply = /^\$/.test(m.eventId);
      html += `<div class="im-msg ${m.mine ? 'mine' : ''} ${cont ? 'cont' : ''} ${m.state === 'failed' ? 'failed' : ''}" ${canReply ? `data-eid="${esc(m.eventId)}"` : ''}>
        ${m.replyTo ? imQuoteHtml(m.replyTo) : ''}<span class="im-msg-body">${esc(m.body)}</span><span class="im-msg-meta">${m.state === 'failed' ? 'Gönderilemedi' : esc(imClock(m.timestamp))}${m.mine && m.state !== 'failed' ? IM_ICON[m.state] || '' : ''}</span>
        ${canReply ? `<button type="button" class="im-reply-btn" data-im-reply="${esc(m.eventId)}" aria-label="Bu mesajı yanıtla" title="Yanıtla">${IM_ICON.reply}</button>` : ''}</div>`;
      prev = m;
    }
    if (room.peerTyping) html += '<span class="im-typing-bubble" aria-label="yazıyor"><i></i><i></i><i></i></span>';
    return html;
  };
  // ---- Yanıtlama: mesajın üstüne gelince çıkan ok, telefonda mesajı sağa çekmek ----
  const imWhoName = (r) => (r.mine ? 'Sen' : imPeerInfo(state.chat.peer).name);
  const imSnippet = (s) => { const one = String(s || '').replace(/\s+/g, ' ').trim(); return one.length > 140 ? `${one.slice(0, 140)}…` : one; };
  const imQuoteHtml = (r) => r.missing
    ? '<span class="im-quote is-missing">Önceki bir mesaj</span>'
    : `<button type="button" class="im-quote ${r.mine ? 'is-mine' : ''}" data-im-jump="${esc(r.eventId)}"><b>${esc(imWhoName(r))}</b><span>${esc(imSnippet(r.body))}</span></button>`;
  const imReplyBarHtml = () => {
    const r = state.chat.replies[state.chat.peer];
    if (!r) return '';
    return `<div class="im-replying"><div class="im-quote ${r.mine ? 'is-mine' : ''}"><b>${esc(imWhoName(r))} yanıtlanıyor</b><span>${esc(imSnippet(r.body))}</span></div>
      <button type="button" class="im-icon-btn ghost" data-im-reply-cancel aria-label="Yanıtlamayı iptal et">${IM_ICON.close}</button></div>`;
  };
  const updateImReplyBar = () => { const box = document.getElementById('imReplyBar'); if (box) box.innerHTML = imReplyBarHtml(); };
  const startImReply = (eventId) => {
    const room = imRoomFor(state.chat.peer);
    const m = room?.messages.find((x) => x.eventId === eventId);
    if (!m) return;
    state.chat.replies[state.chat.peer] = { eventId, mine: m.mine, body: m.body };
    updateImReplyBar();
    const ta = document.querySelector('[data-im-input]');
    ta?.focus({ preventScroll: true });
    const msgs = document.getElementById('imMsgs');
    if (msgs && msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 160) msgs.scrollTop = msgs.scrollHeight;
  };
  const cancelImReply = () => { delete state.chat.replies[state.chat.peer]; updateImReplyBar(); };
  document.addEventListener('click', (e) => {
    const r = e.target.closest?.('[data-im-reply]');
    if (r) { e.preventDefault(); startImReply(r.dataset.imReply); return; }
    if (e.target.closest?.('[data-im-reply-cancel]')) { e.preventDefault(); cancelImReply(); document.querySelector('[data-im-input]')?.focus({ preventScroll: true }); return; }
    const j = e.target.closest?.('[data-im-jump]');
    if (j) {
      e.preventDefault();
      const target = document.querySelector(`.im-msg[data-eid="${CSS.escape(j.dataset.imJump)}"]`);
      if (!target) { toast('Bu mesaj daha eski mesajlarda; “Daha eski mesajlar” ile yükleyebilirsin.'); return; }
      target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.view === 'ims' && state.chat.replies[state.chat.peer]) cancelImReply();
  });
  // Telefonda: mesajı parmakla sağa çek → yanıtla (yeterince çekilince titrer ve ok belirir).
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    const msg = e.target.closest?.('.im-msg[data-eid]');
    if (!msg || e.target.closest('.im-reply-btn, a')) return;
    const x0 = e.clientX, y0 = e.clientY;
    let dx = 0, decided = false, swiping = false, armed = false;
    const move = (ev) => {
      if (ev.pointerId !== e.pointerId) return;
      const mx = ev.clientX - x0, my = ev.clientY - y0;
      if (!decided) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        decided = true; swiping = mx > 0 && Math.abs(mx) > Math.abs(my) * 1.4;
        if (!swiping) return end();
        msg.classList.add('swiping');
      }
      dx = Math.max(0, Math.min(mx, 90));
      msg.style.setProperty('--swipe', `${dx}px`);
      const nowArmed = dx > 58;
      if (nowArmed !== armed) { armed = nowArmed; msg.classList.toggle('armed', armed); if (armed) navigator.vibrate?.(12); }
    };
    const end = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', end);
      document.removeEventListener('pointercancel', end);
      if (!swiping) return;
      msg.classList.remove('swiping', 'armed');
      msg.style.removeProperty('--swipe');
      // Kaydırmanın sonunda gelen tıklama (ör. alıntıya atlama) yutulur.
      const swallow = (ce) => { ce.stopPropagation(); ce.preventDefault(); };
      document.addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => document.removeEventListener('click', swallow, { capture: true }), 400);
      if (armed) startImReply(msg.dataset.eid);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);
  });

  // Telefonda klavye açılınca sohbet görünür alana sığar (altta boşluk / sayfa kayması olmaz).
  const fitImViewport = () => {
    const html = document.documentElement;
    const on = state.view === 'ims' && matchMedia('(max-width: 900px)').matches;
    html.classList.toggle('im-page', state.view === 'ims');
    html.classList.toggle('im-fit', on);
    if (!on) { html.classList.remove('im-kb'); return; }
    const vv = window.visualViewport;
    const vh = vv ? vv.height : window.innerHeight;
    const keyboard = vv ? window.innerHeight - vv.height > 120 : false;
    const bar = keyboard ? 0 : (document.querySelector('.side')?.offsetHeight || 0);
    html.classList.toggle('im-kb', keyboard);
    html.style.setProperty('--im-top', `${(vv ? vv.offsetTop : 0) + bar}px`);
    html.style.setProperty('--im-fit-h', `${vh - bar}px`);
  };
  window.visualViewport?.addEventListener('resize', fitImViewport);
  window.visualViewport?.addEventListener('scroll', fitImViewport);
  window.addEventListener('resize', fitImViewport);

  // Which body the right pane shows; when it changes the page is re-rendered.
  const imMode = () => {
    if (!hasAcceptedChatNotice()) return 'notice';
    if (!state.chat.peer) return 'empty';
    if (state.chat.error) return 'error';
    if (!matrixModule) return 'loading';
    return `room:${state.chat.peer}`;
  };
  const imMainHtml = () => {
    const mode = imMode();
    if (mode === 'notice') return imNoticeHtml();
    if (mode === 'empty') return `<div class="im-placeholder"><p class="kicker">UniPakt</p><h3>Instant Messages</h3><p>Soldan bir sohbet seç ya da <b>+</b> ile bir kulübe yazmaya başla.</p></div>`;
    if (mode === 'error') return `<div class="im-placeholder"><p>${esc(state.chat.error)}</p><button class="btn ghost small" type="button" data-act="ims-retry">Tekrar dene</button></div>`;
    if (mode === 'loading') return '<div class="im-placeholder"><p>Sohbet yükleniyor…</p></div>';
    const info = imPeerInfo(state.chat.peer);
    return `<header class="im-head">
        <button class="im-icon-btn ghost im-back" type="button" data-act="ims-back" aria-label="Sohbet listesine dön">${IM_ICON.back}</button>
        <div class="im-head-who" id="imHeadWho">${imHeadWhoHtml()}</div>
      </header>
      <div class="im-msgs" id="imMsgs" aria-live="polite">${imMsgsHtml()}</div>
      <form class="im-composer" id="imComposer">
        <div class="im-reply-slot" id="imReplyBar">${imReplyBarHtml()}</div>
        <textarea name="message" rows="1" maxlength="4000" placeholder="Mesaj yaz" aria-label="Mesaj yaz" data-im-input enterkeyhint="send"></textarea>
        <button class="im-icon-btn" type="submit" aria-label="Gönder">${IM_ICON.send}</button>
      </form>`;
  };
  const imView = () => `<section class="im ${state.chat.peer ? 'has-room' : ''} ${imMode() === 'notice' ? 'is-notice' : ''}" id="im" data-mode="${esc(imMode())}">
      <aside class="im-side">
        <div class="im-side-head">
          <h2>${esc(IM_TITLE)}</h2>
          <button class="im-icon-btn ${state.chat.newChat ? 'ghost' : ''}" type="button" data-act="ims-new" aria-label="${state.chat.newChat ? 'Sohbetlere dön' : 'Yeni sohbet'}">${state.chat.newChat ? IM_ICON.back : IM_ICON.plus}</button>
        </div>
        <label class="im-search">${IM_ICON.search}<input type="search" placeholder="${state.chat.newChat ? 'Kulüp ara' : 'Ara'}" aria-label="Sohbet ara" value="${esc(state.chat.search)}" data-im-search></label>
        <div class="im-list" id="imList">${hasAcceptedChatNotice() ? imListHtml() : ''}</div>
      </aside>
      <div class="im-main" id="imMain">${imMainHtml()}</div>
    </section>`;

  const autosizeIm = (ta) => { if (!ta) return; ta.style.height = 'auto'; ta.style.height = `${Math.min(ta.scrollHeight + 2, 160)}px`; };
  const markOpenRoomRead = () => {
    if (state.view !== 'ims' || !state.chat.roomId || document.visibilityState !== 'visible') return;
    matrixModule?.markRead(state.chat.roomId);
  };
  // Menu badge: unread messages across all chats.
  const updateImBadge = () => {
    const btn = document.querySelector('.nav-item[data-go="ims"]');
    if (!btn) return;
    const n = imUnreadTotal();
    let badge = btn.querySelector('.badge');
    if (!n) { badge?.remove(); return; }
    if (!badge) { badge = document.createElement('span'); badge.className = 'badge'; btn.append(badge); }
    badge.textContent = String(n);
  };
  // After a full render of the chat page: scroll, restore the draft, focus.
  const mountIm = (focus = false) => {
    const msgs = document.getElementById('imMsgs');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
    const ta = document.querySelector('[data-im-input]');
    if (ta) {
      ta.value = state.chat.drafts[state.chat.peer] || '';
      autosizeIm(ta);
      if (focus && matchMedia('(min-width: 901px)').matches) ta.focus();
    }
    markOpenRoomRead();
  };
  // Matrix changed: patch the chat page in place (batched to one frame).
  let imRefreshQueued = false;
  const refreshIm = () => {
    if (!matrixModule || !state.user || !db) return;
    state.chat.rooms = matrixModule.listRooms();
    if (state.chat.peer && !state.chat.roomId) state.chat.roomId = matrixModule.findDirect(matrixIdFor(state.chat.peer));
    updateImBadge();
    const im = document.getElementById('im');
    if (state.view !== 'ims' || !im) return;
    if (im.dataset.mode !== imMode()) { if (!busy()) render(); return; }
    const list = document.getElementById('imList');
    if (list) list.innerHTML = imListHtml();
    const head = document.getElementById('imHeadWho');
    if (head) head.innerHTML = imHeadWhoHtml();
    const msgs = document.getElementById('imMsgs');
    if (msgs) {
      const atBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 120;
      msgs.innerHTML = imMsgsHtml();
      if (atBottom) msgs.scrollTop = msgs.scrollHeight;
    }
    markOpenRoomRead();
  };
  const onMatrixChange = () => {
    if (imRefreshQueued) return;
    imRefreshQueued = true;
    requestAnimationFrame(() => { imRefreshQueued = false; refreshIm(); });
  };
  // Club logos and names can change while the panel is open (another club
  // saves its profile); reload just the profiles for the chat page.
  let profilesFetchedAt = 0;
  const refreshChatProfiles = async (force = false) => {
    if (DEMO || !db || !state.user || (!force && Date.now() - profilesFetchedAt < 20000)) return;
    profilesFetchedAt = Date.now();
    try {
      const rows = await rest('profiles?select=id,role,club_id,full_name,bio,collaboration_interests,avatar_url');
      if (db && Array.isArray(rows)) { db.panelProfiles = rows.map(mapPanelProfile); refreshIm(); }
    } catch (_) {}
  };
  setInterval(() => { if (state.view === 'ims' && !document.hidden) refreshChatProfiles(true); }, 60000);
  const openImPeer = (peer) => {
    refreshChatProfiles();
    state.chat.peer = peer; state.chat.newChat = false; state.chat.search = '';
    state.chat.roomId = matrixModule?.findDirect(matrixIdFor(peer)) || '';
    render(); mountIm(true);
  };
  // Send what is in the composer. The room is created on the first message.
  let imCreating = null;
  const sendImMessage = async (form) => {
    const ta = form.elements.message;
    const body = ta.value.trim();
    if (!body) return;
    if (!matrixModule) { toast(state.chat.error || 'Sohbet bağlantısı hazır değil.'); return; }
    const peer = state.chat.peer;
    const reply = state.chat.replies[peer] || null;
    ta.value = ''; state.chat.drafts[peer] = ''; autosizeIm(ta); ta.focus();
    if (reply) { delete state.chat.replies[peer]; updateImReplyBar(); }
    try {
      let roomId = state.chat.peer === peer ? state.chat.roomId : '';
      if (!roomId) {
        imCreating ||= matrixModule.openDirect(matrixIdFor(peer), imPeerInfo(peer).name).finally(() => { imCreating = null; });
        roomId = await imCreating;
        if (state.chat.peer === peer) state.chat.roomId = roomId;
      }
      await matrixModule.sendText(roomId, body, reply?.eventId || '');
      refreshIm();
    } catch (error) {
      if (state.chat.peer === peer && !ta.value) { ta.value = body; state.chat.drafts[peer] = body; autosizeIm(ta); }
      if (reply && state.chat.peer === peer && !state.chat.replies[peer]) { state.chat.replies[peer] = reply; updateImReplyBar(); }
      toast(error.message || 'Mesaj gönderilemedi.');
    }
  };

  const renderLogin = (message = '') => {
    document.documentElement.classList.remove('nav-lock');
    state.navOpen = false;
    if (!DEMO) {
      root.innerHTML = `
        <main class="login"><div class="login-box">
          <a class="wordmark" href="https://unipakt.com/" aria-label="UniPakt"><img class="wordmark-img" src="unipakt-logo-bg-white.png?v=3" alt="UniPakt"></a>
          <p class="kicker">Panel</p>
          <form class="login-form" id="loginForm" novalidate>
            ${field('E-posta', '<input type="email" name="email" required autocomplete="username">')}
            ${field('Şifre', '<input type="password" name="password" required autocomplete="current-password">')}
            <p class="form-error" id="loginError" ${message ? '' : 'hidden'}>${esc(message)}</p>
            <button type="submit" class="btn">Giriş yap</button>
          </form>
          <p class="demo-note"><button class="link-btn" type="button" data-act="forgot-password">Şifremi unuttum</button></p>
        </div></main>`;
      return;
    }
    root.innerHTML = `
      <main class="login"><div class="login-box">
        <a class="wordmark" href="https://unipakt.com/" aria-label="UniPakt"><img class="wordmark-img" src="unipakt-logo-bg-white.png?v=3" alt="UniPakt"></a>
        <p class="kicker">Panel</p>
        <h2>Demo girişi: bir hesap seç</h2>
        <div class="account-list">
          <button class="account is-admin" data-act="login" data-id="${ADMIN}"><span><strong>UniPakt</strong><small>Tüm panelleri yönetir</small></span><span class="role">UniPakt yetkilisi</span></button>
          ${db.clubs.map((c) => `<button class="account" data-act="login" data-id="${esc(c.id)}"><span><strong>${esc(c.name)}</strong><small>${esc(c.uni)}</small></span><span class="role">Kulüp başkanı</span></button>`).join('')}
        </div>
        <p class="demo-note">Bu bir demo. Şifre yok ve veriler yalnızca bu tarayıcıda saklanıyor.</p>
      </div></main>`;
  };

  const render = () => {
    if (!db || !state.user || (state.user !== ADMIN && !club(state.user))) { state.user = null; renderLogin(); return; }
    const nav = NAV();
    if (!knownView(state.view)) state.view = 'genel';
    const me = isAdmin() ? { name: 'UniPakt', role: 'UniPakt yetkilisi' } : { name: club(state.user).name, role: 'Kulüp başkanı' };
    root.innerHTML = `
      <div class="app">
        <aside class="side ${state.navOpen ? 'nav-open' : ''}">
          <div class="side-brand">
            <a class="wordmark" href="https://unipakt.com/" title="unipakt.com’a git" aria-label="UniPakt"><img class="wordmark-img" src="unipakt-logo-bg-white.png?v=3" alt="UniPakt"></a>
            <p class="kicker">Panel</p>
          </div>
          <button class="mobile-nav-toggle" type="button" data-act="mobile-nav-toggle" aria-label="Menüyü aç" aria-expanded="${state.navOpen ? 'true' : 'false'}" aria-controls="panel-navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <nav class="side-nav ${state.navOpen ? 'is-open' : ''}" id="panel-navigation" aria-label="Panel">
            ${NAV_GROUPS.map(([g, title]) => `<p class="nav-group">${esc(title)}</p>${nav.filter((n) => n[3] === g).map(([id, label, count]) => `<button class="nav-item ${state.view === id ? 'active' : ''}" data-go="${id}" ${state.view === id ? 'aria-current="page"' : ''}>${esc(label)}${count ? `<span class="badge">${count}</span>` : ''}</button>`).join('')}`).join('')}
          </nav>
          <div class="side-foot">
            <div class="side-user"><strong>${esc(me.name)}</strong><small>${me.role}</small></div>
            <div class="row"><button class="btn ghost small" data-act="logout">Çıkış</button></div>
            ${DEMO ? '<button class="link-btn" data-act="reset">Demo verisini sıfırla</button>' : ''}
          </div>
        </aside>
        <main class="main ${state.view === 'ims' ? 'is-im' : ''}"><div class="main-inner">
          ${profileMenu()}
          ${DEMO ? '<div class="demo-bar"><span><b>Demo</b> — veriler yalnızca bu tarayıcıda saklanıyor.</span></div>' : ''}
          ${views[state.view]()}
        </div></main>
      </div>`;
    document.documentElement.classList.toggle('nav-lock', !!state.navOpen && matchMedia('(max-width: 900px)').matches);
    root.querySelector('.nav-item.active')?.scrollIntoView({ block: 'nearest', inline: 'center' });
    if (state.view === 'etkinlik-olustur') mountEventPage();
    if (state.view === 'dogrulama') mountMfa();
    if (state.view === 'gorevliler' && !state.staffView.staff && !state.staffView.loading && !state.staffView.error) loadStaffView();
    fitImViewport();
    if (state.view === 'ims') { mountIm(); if (!document.getElementById('imMsgs')) refreshChatProfiles(); }
  };

  // A failed action says why; if it signed the user out, the login screen follows.
  const fail = (error) => { toast(error.message || 'İşlem yapılamadı.'); if (!state.user) render(); };

  document.addEventListener('click', (e) => {
    if (state.profileMenuOpen && !e.target.closest('.profile-menu')) {
      state.profileMenuOpen = false;
      const dropdown = document.querySelector('.profile-dropdown');
      if (dropdown) dropdown.hidden = true;
      document.querySelector('.profile-trigger')?.setAttribute('aria-expanded', 'false');
    }
    const goBtn = e.target.closest('[data-go]');
    if (goBtn) { go(goBtn.dataset.go); return; }
    const btn = e.target.closest('[data-act]');
    if (!btn || dlg.contains(btn) || btn.disabled) return;
    const run = actions[btn.dataset.act];
    if (!run) return;
    let result;
    try { result = run(btn.dataset.id, btn.dataset.sub); } catch (error) { fail(error); return; }
    if (result && typeof result.then === 'function') {
      btn.disabled = true;
      result.catch(fail).finally(() => { btn.disabled = false; });
    }
  });
  // 2FA code boxes: one digit per box, typing moves on, Backspace moves back,
  // a pasted or auto-filled code is spread over the boxes; 6 digits submit.
  document.addEventListener('input', (e) => {
    if (!e.target.matches?.('[data-mfa-digit]')) return;
    const form = e.target.form, i = Number(e.target.dataset.mfaDigit);
    const value = e.target.value.replace(/\D/g, '');
    e.target.value = '';
    if (value) fillMfaDigits(form, i, value);
    if (document.querySelector('[data-mfa-msg]')?.classList.contains('is-error')) setMfaMsg('');
  });
  document.addEventListener('keydown', (e) => {
    if (!e.target.matches?.('[data-mfa-digit]')) return;
    const boxes = mfaDigits(e.target.form), i = Number(e.target.dataset.mfaDigit);
    if (e.key === 'Backspace' && !e.target.value && i > 0) { e.preventDefault(); boxes[i - 1].value = ''; boxes[i - 1].focus(); }
    else if (e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); boxes[i - 1].focus(); }
    else if (e.key === 'ArrowRight' && i < MFA_LEN - 1) { e.preventDefault(); boxes[i + 1].focus(); }
  });
  document.addEventListener('paste', (e) => {
    if (!e.target.matches?.('[data-mfa-digit]')) return;
    e.preventDefault();
    fillMfaDigits(e.target.form, Number(e.target.dataset.mfaDigit), e.clipboardData?.getData('text') || '');
  });
  document.addEventListener('focusin', (e) => { if (e.target.matches?.('[data-mfa-digit]')) e.target.select(); });
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-mfa-resend]')) {
      const form = document.getElementById('mfaForm');
      if (form) requestMfaCode(form.dataset.purpose);
      return;
    }
    if (e.target.closest('[data-mfa-signout]')) {
      clearInterval(mfaTimer); state.mfa = freshMfaState();
      remote.logout(); state.user = null; renderLogin();
    }
  });

  // UniPakt Instant Messages: Enter sends, Shift+Enter starts a new line.
  document.addEventListener('keydown', (e) => {
    if (!e.target.matches?.('[data-im-input]')) return;
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      e.target.form?.requestSubmit();
    }
  });
  document.addEventListener('focusout', (e) => {
    if (e.target.matches?.('[data-im-input]')) matrixModule?.setTyping(state.chat.roomId, false);
  });
  // Coming back to the tab marks the open chat as read.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) markOpenRoomRead(); });
  document.addEventListener('input', (e) => {
    if (e.target.matches('[data-im-search]')) {
      state.chat.search = e.target.value;
      const list = document.getElementById('imList');
      if (list) list.innerHTML = imListHtml();
      return;
    }
    if (e.target.matches('[data-im-input]')) {
      state.chat.drafts[state.chat.peer] = e.target.value;
      autosizeIm(e.target);
      matrixModule?.setTyping(state.chat.roomId, !!e.target.value.trim());
      return;
    }
    if (e.target.matches('[data-support-search]')) {
      if (e.isComposing) return;   // wait until an IME word is finished
      const { selectionStart: a, selectionEnd: b } = e.target;
      state.support.q = e.target.value; render();
      const el = document.querySelector('[data-support-search]');
      el?.focus(); el?.setSelectionRange(a, b);   // keep the caret where it was
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.matches('[data-profile-logo]')) {
      const input = e.target;
      const picked = input.files && input.files[0];
      if (!picked) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(picked.type)) { toast('Logo JPG, PNG veya WebP olmalı.'); input.value = ''; return; }
      // Align the logo in the round crop first; the cropped square replaces the picked file.
      openLogoCropper(picked).then((file) => {
        if (!file) { input.value = ''; return; }
        try { const dt = new DataTransfer(); dt.items.add(file); input.files = dt.files; }
        catch (_) { toast('Bu tarayıcı kırpılan logoyu ekleyemedi.'); input.value = ''; return; }
        showPickedLogo(input, file);
      });
      return;
    }
    if (e.target.id === 'taskClub') { state.taskClub = e.target.value; render(); return; }
    if (e.target.matches('[data-support-category-filter]')) { state.support.category = e.target.value; render(); return; }
    if (e.target.matches('[data-support-status-filter]')) { state.support.status = e.target.value; render(); return; }
  });
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-support-status-chip]');
    if (chip) { state.support.status = chip.dataset.supportStatusChip; render(); return; }
  });
  document.addEventListener('submit', async (e) => {
    if (e.target.id === 'mfaForm') { e.preventDefault(); verifyMfa(e.target); return; }
    if (e.target.id === 'imComposer') { e.preventDefault(); sendImMessage(e.target); return; }
    if (e.target.id === 'imNoticeForm') {
      e.preventDefault();
      state.chat.noticeAccepted = true;
      try { localStorage.setItem(chatNoticeStorageKey(), '1'); } catch (_) {}
      startMatrix(); render();
      return;
    }
    if (e.target.id === 'profileForm') {
      e.preventDefault();
      const form = e.target, error = form.querySelector('[data-profile-error]'), button = form.querySelector('button[type="submit"]');
      error.hidden = true; button.disabled = true;
      try {
        let avatarUrl = form.elements.removeAvatar.checked ? '' : state.profile.avatarUrl;
        const selectedLogo = form.elements.avatar.files && form.elements.avatar.files[0];
        if (selectedLogo) {
          const { file: optimizedLogo } = await shrinkImage(selectedLogo);
          avatarUrl = await api.uploadProfileLogo(optimizedLogo);
        }
        await api.updateMyProfile({ fullName: form.elements.fullName.value, bio: form.elements.bio.value, collaborationInterests: form.elements.collaborationInterests.value, avatarUrl });
        toast('Profil kaydedildi.');
        if (profileLogoPreviewUrl) { URL.revokeObjectURL(profileLogoPreviewUrl); profileLogoPreviewUrl = ''; }
        render();
      }
      catch (problem) { error.textContent = problem.message || 'Profil kaydedilemedi.'; error.hidden = false; }
      finally { button.disabled = false; }
      return;
    }
    if (e.target.id === 'passwordForm') {
      e.preventDefault();
      const form = e.target, error = form.querySelector('[data-password-error]'), button = form.querySelector('button[type="submit"]');
      error.hidden = true;
      if (form.elements.newPassword.value !== form.elements.confirmPassword.value) { error.textContent = 'Yeni şifreler eşleşmiyor.'; error.hidden = false; return; }
      button.disabled = true;
      try { await api.changePassword(form.elements.currentPassword.value, form.elements.newPassword.value); toast('Şifren değiştirildi.'); render(); }
      catch (problem) { error.textContent = problem.message || 'Şifre değiştirilemedi.'; error.hidden = false; }
      finally { button.disabled = false; }
      return;
    }
    if (e.target.id === 'passwordResetForm') {
      e.preventDefault();
      const form = e.target, error = form.querySelector('#passwordResetError'), button = form.querySelector('button[type="submit"]');
      error.hidden = true;
      if (form.elements.password.value.length < 8) { error.textContent = 'Şifre en az 8 karakter olmalı.'; error.hidden = false; return; }
      if (form.elements.password.value !== form.elements.confirmPassword.value) { error.textContent = 'Yeni şifreler eşleşmiyor.'; error.hidden = false; return; }
      button.disabled = true;
      try {
        await remote.resetPassword(recoveryToken, form.elements.password.value);
        recoveryToken = '';
        const cleanUrl = new URL(location.href); cleanUrl.searchParams.delete('password-reset'); cleanUrl.hash = '';
        history.replaceState(null, '', cleanUrl.toString());
        renderLogin('Şifren güncellendi. Yeni şifrenle giriş yap.');
      } catch (problem) { error.textContent = problem.message || 'Şifre değiştirilemedi.'; error.hidden = false; button.disabled = false; }
      return;
    }
    if (e.target.id !== 'loginForm') return;
    e.preventDefault();
    const form = e.target;
    const err = form.querySelector('#loginError');
    const button = form.querySelector('button[type="submit"]');
    const email = form.elements.email.value.trim();
    const password = form.elements.password.value;
    if (!email || !password) { err.textContent = 'E-posta ve şifreni yaz.'; err.hidden = false; return; }
    button.disabled = true; button.textContent = 'Giriş yapılıyor…'; err.hidden = true;
    try {
      await remote.login(email, password);
      state.view = 'genel';
      await enterPanel();
    } catch (error) {
      if (!document.body.contains(form)) { renderLogin(error.message); return; }
      err.textContent = error.message || 'Giriş yapılamadı.'; err.hidden = false;
      button.disabled = false; button.textContent = 'Giriş yap';
    }
  });
  window.addEventListener('hashchange', () => {
    const next = location.hash.slice(1) || 'genel';
    if (next === state.view) return;
    // Geri tuşuyla kaydedilmemiş formdan çıkılıyorsa önce sor; vazgeçerse adresi geri al.
    if (!leaveEventPage()) { history.pushState(null, '', '#etkinlik-olustur'); return; }
    state.view = next; state.profileMenuOpen = false; if (state.user) render();
  });
  window.addEventListener('beforeunload', (e) => { if (state.view === 'etkinlik-olustur' && evForm.dirty) { e.preventDefault(); e.returnValue = ''; } });

  // Keep the screen current: another tab in the demo, or coming back to the tab with Supabase.
  let lastSync = Date.now();
  const sync = async () => {
    if (!state.user || busy()) return;
    try {
      await api.refresh();   // the remote refresh reloads support too
      lastSync = Date.now();
      render();
    } catch (error) { if (error.mfa) { showMfaGate(); return; } fail(error); }
  };
  if (DEMO) window.addEventListener('storage', (e) => { if (e.key === KEY) sync(); });
  else document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastSync > 30000) sync(); });

  // Several panel tabs share one stored session: follow what the other tabs did to it.
  const dropToLogin = (message) => {
    session = null; state.user = null; db = null; state.accounts = null;
    state.inbox = { tab: 'contact', data: null, error: null, loading: false, count: null };
    pendingNotice = null;
    if (dlg.open) dlg.close();
    history.replaceState(null, '', location.pathname + location.search);
    renderLogin(message);
  };
  if (!DEMO) window.addEventListener('storage', (e) => {
    if (e.key !== TOKENS && e.key !== null) return;   // null: the whole storage was cleared
    const next = storedSession();
    if (!next) { if (session || state.user) dropToLogin('Başka bir sekmede çıkış yapıldı.'); return; }
    if (!session || next.user_id !== session.user_id) {   // signed in (as someone else) elsewhere
      pendingNotice = null; if (dlg.open) dlg.close();
      state.accounts = null; state.inbox = { tab: 'contact', data: null, error: null, loading: false, count: null };
      start(); return;
    }
    session = next;   // the other tab refreshed the tokens
  });

  const start = async () => {
    if (recoveryToken) { state.user = null; renderPasswordReset(); return; }
    state.view = location.hash.slice(1) || 'genel';
    if (DEMO) { loadLocal(); render(); startMatrix(); return; }
    state.user = null;
    readSession();
    if (!session) { renderLogin(); return; }
    await enterPanel();
  };
  start();
})();
</script>

  <div class="flower-credit" aria-label="Flower Studios">
    <svg class="flower-mark" viewBox="0 0 415 650" aria-hidden="true"><polygon fill="currentColor" points="10,260 142,175 142,643"/><polygon fill="#fe5c1d" points="154,167 405,8 377,138 154,265"/><polygon fill="#fe5c1d" points="154,328 352,235 323,330 154,408"/></svg>
