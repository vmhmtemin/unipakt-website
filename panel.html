  /* ------------------------------------------------------------------
     ETKİNLİK OLUŞTUR / DÜZENLE — ayrı sayfa (#etkinlik-olustur)
     Yeni etkinlikte önce Ücretli / Ücretsiz seçilir, sonra form açılır.
     Sağda canlı önizleme; yarım form bu tarayıcıda taslak olarak saklanır.
     ------------------------------------------------------------------ */
  const EV_CATEGORIES = CLUB_CATEGORIES;
  const evForm = { mode: 'new', kind: 'event', id: '', fee: '', back: 'etkinlikler', values: null, images: { poster: null, banner: null }, dirty: false, restored: false };
  const busy = () => dlg.open || state.view === 'etkinlik-olustur';

  // Kaydedilmemiş değişiklik varken sayfadan çıkmadan önce sorar. true: çıkılabilir.
  const leaveEventPage = () => {
    if (state.view !== 'etkinlik-olustur' || !evForm.dirty) return true;
    if (!confirm('Kaydedilmemiş değişiklikler var. Taslak bu tarayıcıda saklanıyor; yine de sayfadan çıkmak istiyor musun?')) return false;
    evForm.dirty = false;
    return true;
  };

  const draftKey = () => `unipakt.panel.eventDraft.${state.user}.${evForm.mode === 'edit' ? evForm.id : `new-${evForm.kind}`}`;
  const readDraft = () => { try { const raw = localStorage.getItem(draftKey()); return raw ? JSON.parse(raw) : null; } catch (_) { return null; } };
  const clearDraft = () => { try { localStorage.removeItem(draftKey()); } catch (_) {} };
  const writeDraft = () => {
    const img = (x) => (x && x.dataUrl && x.dataUrl.length < 700000 ? { dataUrl: x.dataUrl, name: x.name } : null);
    const data = { fee: evForm.fee, values: evForm.values, images: { poster: img(evForm.images.poster), banner: img(evForm.images.banner) }, at: stamp() };
    try { localStorage.setItem(draftKey(), JSON.stringify(data)); }
    catch (_) { try { data.images = { poster: null, banner: null }; localStorage.setItem(draftKey(), JSON.stringify(data)); } catch (__) {} }
  };
  const dataUrlToFile = async (dataUrl, name) => { const blob = await (await fetch(dataUrl)).blob(); return new File([blob], name || 'gorsel.jpg', { type: blob.type || 'image/jpeg' }); };

  // Görseli tarayıcıda 1 MB'ın altına indirir (canvas, JPEG). Zaten küçükse olduğu gibi döner.
  const MAX_IMAGE = 1000 * 1000 - 1;
  const loadImage = (file) => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Görsel açılamadı.')); };
    img.src = url;
  });
  /* ------------------------------------------------------------------
     LOGO CROPPER — a round mask with a 3×3 grid and centre mark over the
     chosen image. Drag (mouse, finger, arrow keys) to position; zoom with
     the slider, wheel, pinch or +/−. The image can be zoomed out until it
     fits completely; the uncovered area is then filled with the colour of
     the image's outermost pixels (white edge → white, black edge → black,
     transparent edge → stays transparent). "Uygula" returns a 512×512
     image of the circle's square; null when cancelled.
     ------------------------------------------------------------------ */
  const LOGO_OUT = 512;
  // Colour of the image's outermost pixel ring: the most common (quantised)
  // colour along all four edges, averaged over the pixels in that bucket.
  // Returns null for a transparent edge.
  const edgeColour = (img) => {
    const w = Math.min(img.naturalWidth, 400), h = Math.min(img.naturalHeight, 400);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);
    const px = ctx.getImageData(0, 0, w, h).data;
    const buckets = new Map();
    const add = (x, y) => {
      const i = (y * w + x) * 4, a = px[i + 3];
      const key = a < 32 ? 'clear' : `${px[i] >> 4},${px[i + 1] >> 4},${px[i + 2] >> 4}`;
      const b = buckets.get(key) || { n: 0, r: 0, g: 0, bl: 0 };
      b.n += 1; b.r += px[i]; b.g += px[i + 1]; b.bl += px[i + 2];
      buckets.set(key, b);
    };
    for (let x = 0; x < w; x += 1) { add(x, 0); add(x, h - 1); }
    for (let y = 1; y < h - 1; y += 1) { add(0, y); add(w - 1, y); }
    let bestKey = 'clear', best = { n: 0 };
    buckets.forEach((b, key) => { if (b.n > best.n) { best = b; bestKey = key; } });
    if (bestKey === 'clear') return null;
    const hex = (v) => Math.round(v / best.n).toString(16).padStart(2, '0');
    return `#${hex(best.r)}${hex(best.g)}${hex(best.bl)}`;
  };
  const openLogoCropper = (file) => new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); toast('Görsel açılamadı. Başka bir dosya dene.'); resolve(null); };
    img.onload = () => {
      const box = document.createElement('dialog');
      box.className = 'crop-dlg';
      box.innerHTML = `<div class="crop">
        <h2>Logoyu hizala</h2>
        <p class="lead">Sürükleyerek konumlandır, yakınlaştırarak boyutla. Yuvarlağın içi profilinde görünür.</p>
        <div class="crop-stage" tabindex="0" aria-label="Logoyu hizalama alanı. Ok tuşlarıyla kaydır, artı ve eksi ile yakınlaştır.">
          <img src="${esc(url)}" alt="" draggable="false"><div class="crop-ring"></div>
        </div>
        <label class="crop-zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/></svg>
          <input type="range" min="1" max="4" step="0.01" value="1" aria-label="Yakınlaştır">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-3.5-3.5"/></svg></label>
        <div class="crop-actions">
          <button class="btn ghost small" type="button" data-crop="reset">Ortala</button><span class="spacer"></span>
          <button class="btn ghost" type="button" data-crop="cancel">Vazgeç</button>
          <button class="btn" type="button" data-crop="apply">Uygula</button>
        </div></div>`;
      document.body.append(box);
      const stage = box.querySelector('.crop-stage');
      const pic = box.querySelector('.crop-stage img');
      const slider = box.querySelector('input[type="range"]');
      const W = img.naturalWidth, H = img.naturalHeight;
      const fill = edgeColour(img);
      // The stage shows the fill too, so what you see is what gets saved.
      if (fill) stage.style.background = fill;
      // zoom 1 = the image covers the circle's square; MIN_ZOOM = the whole image fits inside it.
      const MIN_ZOOM = Math.min(W, H) / Math.max(W, H);
      slider.min = String(MIN_ZOOM);
      let zoom = 1, x = 0, y = 0;   // x, y: image centre offset from the stage centre, in stage px
      const circle = () => stage.clientWidth * 0.86;          // matches .crop-ring inset: 7%
      const scale = () => Math.max(circle() / W, circle() / H) * zoom;
      // Larger than the square: it must keep covering it. Smaller: it must stay inside it.
      const clamp = () => {
        const s = scale(), d = circle();
        const mx = Math.abs(W * s - d) / 2, my = Math.abs(H * s - d) / 2;
        x = Math.min(mx, Math.max(-mx, x)); y = Math.min(my, Math.max(-my, y));
      };
      const draw = () => {
        clamp();
        const s = scale();
        pic.style.width = `${W * s}px`; pic.style.height = `${H * s}px`;
        pic.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        slider.value = String(zoom);
      };
      // Zoom towards a point (stage px from centre) so it stays under the finger/cursor.
      const setZoom = (next, px = 0, py = 0) => {
        const before = scale();
        zoom = Math.min(4, Math.max(MIN_ZOOM, next));
        const k = scale() / before;
        x = px - (px - x) * k; y = py - (py - y) * k;
        draw();
      };
      const pointers = new Map();
      let pinch = null;
      const local = (ev) => { const r = stage.getBoundingClientRect(); return [ev.clientX - r.left - r.width / 2, ev.clientY - r.top - r.height / 2]; };
      stage.addEventListener('pointerdown', (ev) => {
        stage.setPointerCapture(ev.pointerId);
        pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
        if (pointers.size === 2) {
          const [a, b] = [...pointers.values()];
          pinch = { dist: Math.hypot(a[0] - b[0], a[1] - b[1]), zoom };
        }
      });
      stage.addEventListener('pointermove', (ev) => {
        const prev = pointers.get(ev.pointerId);
        if (!prev) return;
        pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
        if (pointers.size === 1) { x += ev.clientX - prev[0]; y += ev.clientY - prev[1]; draw(); return; }
        if (pinch && pointers.size === 2) {
          const [a, b] = [...pointers.values()];
          const r = stage.getBoundingClientRect();
          setZoom(pinch.zoom * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.dist,
            (a[0] + b[0]) / 2 - r.left - r.width / 2, (a[1] + b[1]) / 2 - r.top - r.height / 2);
        }
      });
      const lift = (ev) => { pointers.delete(ev.pointerId); if (pointers.size < 2) pinch = null; };
      stage.addEventListener('pointerup', lift);
      stage.addEventListener('pointercancel', lift);
      stage.addEventListener('wheel', (ev) => { ev.preventDefault(); const [px, py] = local(ev); setZoom(zoom * Math.exp(-ev.deltaY * 0.0015), px, py); }, { passive: false });
      stage.addEventListener('keydown', (ev) => {
        const step = ev.shiftKey ? 20 : 4;
        const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
        if (moves[ev.key]) { ev.preventDefault(); x += moves[ev.key][0]; y += moves[ev.key][1]; draw(); }
        else if (ev.key === '+' || ev.key === '=') { ev.preventDefault(); setZoom(zoom * 1.08); }
        else if (ev.key === '-') { ev.preventDefault(); setZoom(zoom / 1.08); }
      });
      slider.addEventListener('input', () => setZoom(Number(slider.value)));
      const onResize = () => draw();
      window.addEventListener('resize', onResize);
      let result = null;
      const finish = () => { box.close(); };
      box.addEventListener('close', () => {
        window.removeEventListener('resize', onResize);
        URL.revokeObjectURL(url); box.remove(); resolve(result);
      });
      box.addEventListener('click', async (ev) => {
        const act = ev.target.closest('[data-crop]')?.dataset.crop;
        if (act === 'reset') { zoom = 1; x = 0; y = 0; draw(); }
        if (act === 'cancel') finish();
        if (act === 'apply') {
          const canvas = document.createElement('canvas');
          canvas.width = LOGO_OUT; canvas.height = LOGO_OUT;
          const ctx = canvas.getContext('2d');
          const s = scale(), k = LOGO_OUT / circle();
          // Only needed when the image no longer covers the whole square.
          if (fill && (W * s < circle() - 0.5 || H * s < circle() - 0.5)) { ctx.fillStyle = fill; ctx.fillRect(0, 0, LOGO_OUT, LOGO_OUT); }
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, LOGO_OUT / 2 + (x - (W * s) / 2) * k, LOGO_OUT / 2 + (y - (H * s) / 2) * k, W * s * k, H * s * k);
          const blob = await new Promise((r) => canvas.toBlob(r, 'image/webp', 0.92))
            || await new Promise((r) => canvas.toBlob(r, 'image/png'));
          if (!blob) { toast('Logo hazırlanamadı. Tekrar dene.'); return; }
          const ext = blob.type === 'image/webp' ? 'webp' : 'png';
          result = new File([blob], `logo.${ext}`, { type: blob.type });
          finish();
        }
      });
      box.showModal();
      draw();
      stage.focus();
    };
    img.src = url;
  });

  // Show the cropped logo in the profile form; it is uploaded when the form is saved.
  const showPickedLogo = (input, file) => {
    if (profileLogoPreviewUrl) URL.revokeObjectURL(profileLogoPreviewUrl);
    profileLogoPreviewUrl = URL.createObjectURL(file);
    const form = input.closest('form');
    const preview = form?.querySelector('[data-profile-avatar]');
    if (preview) preview.innerHTML = avatarMarkup(profileLogoPreviewUrl, 'Logo önizlemesi', 'large');
    const remove = form?.querySelector('[data-act="profile-avatar-remove"]');
    if (remove) remove.hidden = false;
    if (form) form.elements.removeAvatar.checked = false;
  };

  const shrinkImage = async (file) => {
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) throw new Error('Görsel yalnızca JPG, PNG veya WebP olabilir.');
    const img = await loadImage(file);
    const ratio = img.naturalWidth / Math.max(1, img.naturalHeight);
    if (file.size <= MAX_IMAGE) return { file, ratio };
    let scale = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
    let quality = 0.86;
    for (let i = 0; i < 10; i += 1) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
      if (blob && blob.size <= MAX_IMAGE) return { file: new File([blob], String(file.name || 'gorsel').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }), ratio };
      if (quality > 0.6) quality -= 0.1; else scale *= 0.8;
    }
    throw new Error('Görsel 1 MB altına küçültülemedi. Daha küçük bir görsel dene.');
  };
  const readAsDataUrl = (file) => new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(String(r.result)); r.onerror = () => resolve(''); r.readAsDataURL(file); });

  // Detay metni: **kalın**, *italik*, [metin](https://adres), "- " ile başlayan satır = madde.
  // Önce her şey kaçırılır, sonra yalnızca bu biçimler HTML'e çevrilir; başka etiket oluşamaz.
  const mdInline = (t) => esc(t)
    .replace(/\[([^\]\n]{1,200})\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`)
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const mdLite = (src) => {
    const out = []; let list = null; let para = [];
    const flush = () => { if (para.length) { out.push(`<p>${para.join('<br>')}</p>`); para = []; } };
    const endList = () => { if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } };
    String(src || '').split(/\r?\n/).forEach((line) => {
      const m = line.match(/^\s*[-•]\s+(.*)$/);
      if (m) { flush(); (list ||= []).push(`<li>${mdInline(m[1])}</li>`); return; }
      endList();
      if (!line.trim()) { flush(); return; }
      para.push(mdInline(line));
    });
    flush(); endList();
    return out.join('');
  };

  const ICON = {
    start: '<path d="M3 5h18v16H3zM3 10h18M8 3v4M16 3v4"/>',
    end: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
    org: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
    cat: '<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    place: '<path d="M12 22s7-7.2 7-12a7 7 0 0 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    cap: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.6 3.5 5.2"/>',
    instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".8" fill="currentColor"/>',
    facebook: '<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/>',
    x: '<path d="M4 4l16 16M20 4L4 20"/>',
    youtube: '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.3v5.4l4.6-2.7z" fill="currentColor"/>',

  const icon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

  const EMPTY_VALUES = { title: '', category: '', date: '', time: '', endDate: '', endTime: '', extraDates: '', place: '', city: '', university: '', address: '',
    desc: '', rules: '', registration: '', capacity: '', tags: '', seeking: '', feeAmount: '', biletimgo: '', instagram: '', facebook: '', x: '', youtube: '', hidden: false, speakers: [], dAccent: '', dBg: 'default', dBgColor: '', dTitle: 'default' };
  const valuesFromEvent = (e) => {
    const occ = e.occurrences && e.occurrences.length ? e.occurrences : [{ date: e.date, time: e.time || '' }];
    return { ...EMPTY_VALUES, title: e.title || '', category: e.category || '', date: occ[0].date || '', time: occ[0].time || '', endDate: e.endDate || '', endTime: e.endTime || '',
      extraDates: occ.slice(1).map((o) => `${o.date}${o.time ? ` ${o.time}` : ''}`).join('\n'), place: e.place || '', city: e.city || '', university: e.university || '',
      address: e.address || '', desc: e.desc || '', rules: e.rules || '', registration: e.registration || '', capacity: e.capacity === '' || e.capacity == null ? '' : String(e.capacity),
      tags: (e.tags || []).join(', '), seeking: e.seeking || '', feeAmount: e.feeAmount == null ? '' : String(e.feeAmount), biletimgo: e.biletimgo || '',
      instagram: e.instagram || '', facebook: e.facebook || '', x: e.x || '', youtube: e.youtube || '', hidden: e.visible === false,

  };

  // Sayfayı açar. Yeni etkinlikte tür seçimiyle başlar; taslak varsa tür seçilince geri yüklenir.
  const openEventPage = (mode, { kind = 'event', id = '' } = {}) => {
    const back = HIDDEN_VIEWS.includes(state.view) ? evForm.back : state.view;
    Object.assign(evForm, { mode, kind, id, fee: '', back: back || 'etkinlikler', values: null, images: { poster: null, banner: null }, dirty: false, restored: false, reg: freshRegDraft() });
    if (mode === 'edit') {
      const e = db.events.find((x) => x.id === id);
      evForm.kind = e.kind || 'event';
      evForm.fee = e.feeType === 'paid' ? 'paid' : 'free';
      evForm.values = valuesFromEvent(e);
      evForm.images = { poster: e.poster ? { url: e.poster } : null, banner: e.banner ? { url: e.banner } : null };

  const applyDraft = async () => {
    const d = readDraft(); if (!d || !d.values) return;

    if (evForm.mode === 'new' && d.fee) evForm.fee = evForm.fee || d.fee;

    for (const k of ['poster', 'banner']) {
      const im = d.images && d.images[k];

    }

    if (evForm.mode === 'edit') { const e = db.events.find((x) => x.id === evForm.id); return e ? who(e.ownerId) : ''; }
    return isAdmin() ? 'UniPakt' : (club(state.user)?.name || '');

  const readValues = (form) => {
    const fd = new FormData(form); const out = { ...EMPTY_VALUES };
    Object.keys(EMPTY_VALUES).forEach((k) => { if (k !== 'hidden' && k !== 'speakers') out[k] = String(fd.get(k) ?? (evForm.values?.[k] ?? '')); });
    const spLinks = fd.getAll('spLink');
    out.speakers = form.querySelector('[data-sp-host]')
      ? fd.getAll('spName').map((n, i) => ({ name: String(n), linkedin: String(spLinks[i] ?? '') }))
      : (evForm.values?.speakers || []);
    out.hidden = !!form.querySelector('[name="hidden"]')?.checked;
    if (!form.querySelector('[name="feeAmount"]')) out.feeAmount = evForm.values?.feeAmount || '';
    if (!form.querySelector('[name="seeking"]')) out.seeking = evForm.values?.seeking || '';
    return out;
  };

  const parseOccurrences = (v) => {
    const occ = [];
    if (v.date) occ.push({ date: v.date, time: v.time || '' });
    String(v.extraDates).split(/\n+/).map((x) => x.trim()).filter(Boolean).forEach((line) => {
      const m = line.match(/^(\d{4}-\d{2}-\d{2})(?:\s+(\d{1,2}:\d{2}))?$/);
      if (m && !occ.some((o) => o.date === m[1] && o.time === (m[2] || ''))) occ.push({ date: m[1], time: m[2] ? m[2].padStart(5, '0') : '' });
    });
    return occ.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  };

  const HTTPS = /^https:\/\/[^\s"'<>]+$/i;
  const BILETIMGO = /^https:\/\/(www\.)?biletimgo\.com\/[^\s"'<>]*$/i;
  // ---- Sayfa tasarımı: vurgu rengi, üst alan arka planı, başlık stili (boş = varsayılan) ----
  const HEX6 = /^#[0-9a-f]{6}$/i;
  const ACCENT_SWATCHES = [[brandColor(), 'UniPakt rengi'], ['#EA4335', 'Kırmızı'], ['#FBBC05', 'Sarı'], ['#34A853', 'Yeşil'], ['#4285F4', 'Mavi'], ['#06B6D4', 'Turkuaz'], ['#8B5CF6', 'Mor'], ['#EC4899', 'Pembe'], ['#F2F1EE', 'Kırık beyaz']];
  const BG_SWATCHES = [['#0C0C0D', 'Siyah'], ['#1F2937', 'Antrasit'], ['#1E3A8A', 'Lacivert'], ['#14532D', 'Koyu yeşil'], ['#7C2D12', 'Kiremit'], ['#4C1D95', 'Koyu mor'], ['#F5F5F4', 'Açık gri'], ['#FDE68A', 'Krem sarı'], ['#FFFFFF', 'Beyaz']];
  const DESIGN_BGS = [['default', 'Varsayılan', 'Görsel, koyu katman ve noktalar'], ['clear', 'Görsel net', 'Banner daha belirgin'], ['blur', 'Afişten bulanık', 'Afişin renkleri yumuşak bir zemin olur'], ['color', 'Düz renk', 'Seçtiğin renk'], ['gradient', 'Renk geçişi', 'Arka plan renginden vurgu rengine']];
  const DESIGN_TITLES = [['default', 'Varsayılan'], ['left', 'Sola yaslı, büyük'], ['compact', 'Kompakt'], ['outline', 'Çizgili (içi boş)'], ['caps', 'BÜYÜK HARF'], ['hand', 'El yazısı']];
  const designFrom = (v) => {
    const d = {};
    if (HEX6.test(v.dAccent || '')) d.accent = v.dAccent.toUpperCase();
    if (v.dBg && v.dBg !== 'default' && DESIGN_BGS.some(([k]) => k === v.dBg)) d.bg = v.dBg;
    if ((d.bg === 'color' || d.bg === 'gradient') && HEX6.test(v.dBgColor || '')) d.bgColor = v.dBgColor.toUpperCase();
    if (v.dTitle && v.dTitle !== 'default' && DESIGN_TITLES.some(([k]) => k === v.dTitle)) d.title = v.dTitle;
    return d;
  };
  const designSummary = (d) => {
    const parts = [];
    if (d.accent) parts.push(`Vurgu ${d.accent}`);
    if (d.bg) parts.push(`Arka plan: ${(DESIGN_BGS.find(([k]) => k === d.bg) || [, d.bg])[1]}${d.bgColor ? ` ${d.bgColor}` : ''}`);
    if (d.title) parts.push(`Başlık: ${(DESIGN_TITLES.find(([k]) => k === d.title) || [, d.title])[1]}`);
    return parts.length ? parts.join(' · ') : 'Varsayılan';
  };
  const bLum = (hex) => { const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((x) => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4)); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  const colorRow = (name, value, swatches, { allowDefault }) => `
    <div class="evd-colors" data-evd-colors="${name}">
      ${allowDefault ? `<button type="button" class="evd-sw evd-sw-none" data-evd-sw="${name}" data-v="" aria-pressed="${!value}" title="Varsayılan"><span>Ø</span></button>` : ''}
      ${swatches.map(([hex, label]) => `<button type="button" class="evd-sw" data-evd-sw="${name}" data-v="${hex}" aria-pressed="${String(value).toUpperCase() === hex}" title="${esc(label)}" aria-label="${esc(label)}" style="--sw:${hex}"></button>`).join('')}
      <label class="evd-custom" title="Özel renk"><input type="color" data-evd-pick="${name}" value="${HEX6.test(value) ? esc(value) : brandColor()}" aria-label="Özel renk seç"><span>+</span></label>
      <input class="evd-hex" name="${name}" value="${esc(value)}" maxlength="7" placeholder="${allowDefault ? 'Varsayılan' : '#RRGGBB'}" spellcheck="false" autocomplete="off" aria-label="Renk kodu">
    </div>`;
  const designHtml = (v, { accentHint = 'Çizgiler, simgeler, geri sayım çerçevesi ve “Kayıt ol” düğmesi bu renge döner.', bgs = DESIGN_BGS } = {}) => `
    <div class="evd-group"><span class="field-label">Vurgu rengi</span><small class="hint">${esc(accentHint)}</small>
      ${colorRow('dAccent', v.dAccent || '', ACCENT_SWATCHES, { allowDefault: true })}</div>
    <div class="evd-group"><span class="field-label">Üst alan arka planı</span>
      <div class="evd-cards">${bgs.map(([k, label, hint]) => `<label class="evd-card"><input type="radio" name="dBg" value="${k}" ${v.dBg === k ? 'checked' : ''}><span class="evd-thumb bg-${k}" aria-hidden="true"><i></i></span><b>${esc(label)}</b><small>${esc(hint)}</small></label>`).join('')}</div>
      <div class="evd-bgcolor" data-evd-bgcolor ${v.dBg === 'color' || v.dBg === 'gradient' ? '' : 'hidden'}><span class="field-label">Arka plan rengi</span>${colorRow('dBgColor', v.dBgColor || '', BG_SWATCHES, { allowDefault: false })}</div></div>
    <div class="evd-group"><span class="field-label">Başlık stili</span>
      <div class="evd-cards titles">${DESIGN_TITLES.map(([k, label]) => `<label class="evd-card"><input type="radio" name="dTitle" value="${k}" ${v.dTitle === k ? 'checked' : ''}><span class="evd-aa t-${k}" aria-hidden="true">Aa</span><b>${esc(label)}</b></label>`).join('')}</div></div>`;
  const syncDesignUi = (form) => {
    const fd = new FormData(form);
    form.querySelectorAll('[data-evd-sw]').forEach((b) => b.setAttribute('aria-pressed', String(String(fd.get(b.dataset.evdSw) || '').toUpperCase() === b.dataset.v.toUpperCase())));
    const bg = fd.get('dBg');
    const box = form.querySelector('[data-evd-bgcolor]'); if (box) box.hidden = !(bg === 'color' || bg === 'gradient');
  };
  const setDesignValue = (name, value, form = document.getElementById('evpForm')) => {
    if (!form) return;
    const input = form.querySelector(`[name="${name}"]`); if (!input) return;
    input.value = value;
    const pick = form.querySelector(`[data-evd-pick="${name}"]`); if (pick && HEX6.test(value)) pick.value = value.toLowerCase();

    form.dispatchEvent(new Event('input', { bubbles: true }));
  };
  document.addEventListener('click', (e) => {
    const b = e.target.closest?.('[data-evd-sw]'); if (!b) return;
    e.preventDefault();
    setDesignValue(b.dataset.evdSw, b.dataset.v, b.closest('form'));
    if (b.dataset.evdSw === 'dBgColor') {
      const form = b.closest('form');
      const bg = form?.querySelector('[name="dBg"]:checked');
      if (bg && bg.value !== 'color' && bg.value !== 'gradient') { form.querySelector('[name="dBg"][value="color"]').checked = true; syncDesignUi(form); form.dispatchEvent(new Event('input', { bubbles: true })); }
    }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.matches?.('[data-evd-pick]')) { setDesignValue(el.dataset.evdPick, el.value.toUpperCase(), el.form); return; }
    if (el.matches?.('.evd-hex')) {
      let s = el.value.trim(); if (s && !s.startsWith('#')) { s = `#${s}`; el.value = s; }
      const form = el.form; if (form) syncDesignUi(form);
    }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (!el.matches?.('[name="dBg"], [name="dTitle"]') || !el.form) return;
    // Düz renk / geçiş seçilince henüz renk yoksa siyahla başlar; önizleme ve kayıt hep geçerli bir renkle çalışır.
    if (el.name === 'dBg' && (el.value === 'color' || el.value === 'gradient')) {
      const c = el.form.querySelector('[name="dBgColor"]');
      if (c && !HEX6.test(c.value)) { c.value = '#0C0C0D'; el.form.dispatchEvent(new Event('input', { bubbles: true })); }
    }
    syncDesignUi(el.form);
  });
  const designActions = {
    'evd-reset'() {
      const form = document.getElementById('evpForm'); if (!form) return;
      form.querySelector('[name="dAccent"]').value = '';
      form.querySelector('[name="dBgColor"]').value = '';
      form.querySelector('[name="dBg"][value="default"]').checked = true;
      form.querySelector('[name="dTitle"][value="default"]').checked = true;
      syncDesignUi(form);
      form.dispatchEvent(new Event('input', { bubbles: true }));
      toast('Sayfa tasarımı varsayılana döndü.');
    },
  };

  // ---- Konuşmacılar: ad + isteğe bağlı LinkedIn (sitede ada tıklayınca açılır) ----
  const LINKEDIN = /^https:\/\/([a-z]{2,3}\.)?(www\.)?linkedin\.com\/[^\s"'<>]+$/i;
  const normLinkedin = (u) => {
    const s = String(u || '').trim();
    if (!s) return '';
    return /^https?:\/\//i.test(s) ? s.replace(/^http:\/\//i, 'https://') : `https://${s.replace(/^\/+/, '')}`;
  };
  const cleanSpeakers = (list) => (list || [])
    .map((s) => ({ name: String(s.name || '').trim(), linkedin: normLinkedin(s.linkedin) }))
    .filter((s) => s.name || s.linkedin)
    .map((s) => (s.linkedin ? s : { name: s.name }));
  const speakersProblem = (list) => {
    const rows = cleanSpeakers(list);
    if (rows.length > 30) return 'En fazla 30 konuşmacı eklenebilir.';
    for (const [i, s] of rows.entries()) {
      if (!s.name) return `${i + 1}. konuşmacının adını yaz.`;
      if (s.name.length > 120) return `${i + 1}. konuşmacının adı çok uzun.`;
      if (s.linkedin && (s.linkedin.length > 300 || !LINKEDIN.test(s.linkedin))) return `“${s.name}” için LinkedIn bağlantısı linkedin.com/in/... biçiminde olmalı.`;
    }
    return '';
  };
  const speakersHtml = (list) => {
    const rows = list && list.length ? list : [];
    return `${rows.map((s, i) => `
      <div class="sp-row">
        <span class="sp-n" aria-hidden="true">${i + 1}</span>
        <input name="spName" maxlength="120" value="${esc(s.name)}" placeholder="Ad soyad" aria-label="${i + 1}. konuşmacının adı">
        <input name="spLink" maxlength="300" inputmode="url" value="${esc(s.linkedin)}" placeholder="linkedin.com/in/... (isteğe bağlı)" aria-label="${i + 1}. konuşmacının LinkedIn bağlantısı">
        <span class="sp-tools">
          <button type="button" class="icon-btn" data-act="sp-move" data-id="${i}" data-sub="-1" ${i === 0 ? 'disabled' : ''} aria-label="Yukarı taşı">↑</button>
          <button type="button" class="icon-btn" data-act="sp-move" data-id="${i}" data-sub="1" ${i === rows.length - 1 ? 'disabled' : ''} aria-label="Aşağı taşı">↓</button>
          <button type="button" class="icon-btn" data-act="sp-del" data-id="${i}" aria-label="Konuşmacıyı sil">×</button>
        </span>
      </div>`).join('')}
      ${rows.length < 30 ? '<div><button type="button" class="btn ghost small" data-act="sp-add">+ Konuşmacı ekle</button></div>' : ''}`;
  };
  // Liste değişince: formu oku, değiştir, listeyi yeniden çiz, önizleme + taslak için input olayı yolla.
  const editSpeakers = (change, focusIndex) => {
    const form = document.getElementById('evpForm'); if (!form) return;
    const v = readValues(form); const list = v.speakers.slice();
    change(list);
    evForm.values = { ...v, speakers: list };
    const host = form.querySelector('[data-sp-host]');
    host.innerHTML = speakersHtml(list);
    form.dispatchEvent(new Event('input', { bubbles: true }));
    if (focusIndex != null) host.querySelectorAll('[name="spName"]')[focusIndex]?.focus();
  };
  const speakerActions = {
    'sp-add'() { let n = 0; editSpeakers((l) => { l.push({ name: '', linkedin: '' }); n = l.length - 1; }, null); document.querySelectorAll('#evpForm [name="spName"]')[n]?.focus(); },
    'sp-del'(i) { editSpeakers((l) => l.splice(Number(i), 1)); },
    'sp-move'(i, dir) { editSpeakers((l) => { const a = Number(i), b = a + Number(dir); if (b >= 0 && b < l.length) [l[a], l[b]] = [l[b], l[a]]; }); },
  };

  const validateEvent = (v) => {
    if (!v.title.trim()) return 'Etkinlik adını yaz.';
    if (!v.category) return 'Kategori seç.';
    if (!v.date) return 'Başlangıç tarihini seç.';
    const bad = String(v.extraDates).split(/\n+/).map((x) => x.trim()).filter(Boolean).find((l) => !/^\d{4}-\d{2}-\d{2}(\s+\d{1,2}:\d{2})?$/.test(l));
    if (bad) return `Ek tarih satırı anlaşılamadı: “${bad}”. Biçim: YYYY-AA-GG HH:MM`;
    if (v.endDate && v.endDate < v.date) return 'Bitiş tarihi başlangıçtan önce olamaz.';
    if (v.endTime && v.time && (!v.endDate || v.endDate === v.date) && v.endTime < v.time) return 'Bitiş saati başlangıç saatinden önce olamaz.';
    if (evForm.fee === 'paid' && !(Number(v.feeAmount) > 0)) return 'Ücretli etkinlikte ücret tutarı 0’dan büyük olmalı.';
    if (!evForm.images.poster) return 'Etkinlik görseli zorunlu.';
    if (!v.address.trim()) return 'Açık adresi yaz.';
    if (!v.desc.trim()) return 'Detay metnini yaz.';
    if (evForm.kind === 'partner' && !v.seeking.trim()) return 'Nasıl bir ortak aradığını yaz.';
    if (v.capacity && !(Number.isInteger(Number(v.capacity)) && Number(v.capacity) > 0)) return 'Kontenjan pozitif bir tam sayı olmalı.';
    if (v.biletimgo && !BILETIMGO.test(v.biletimgo)) return 'biletimGO alanına yalnızca https://biletimgo.com/… adresi yazılabilir.';
    if (badLink(v.registration)) return 'Kayıt linki http:// ya da https:// ile başlamalı.';
    for (const [k, label] of [['instagram', 'Instagram'], ['facebook', 'Facebook'], ['x', 'X / Twitter'], ['youtube', 'YouTube']]) {
      if (v[k] && !HTTPS.test(v[k])) return `${label} linki https:// ile başlamalı.`;
    }
    if (v.dAccent && !HEX6.test(v.dAccent)) return 'Vurgu rengi #RRGGBB biçiminde olmalı (örn. #A94B86).';
    if ((v.dBg === 'color' || v.dBg === 'gradient') && !HEX6.test(v.dBgColor)) return 'Arka plan rengi seç ya da #RRGGBB biçiminde yaz.';
    const speakerProblem = speakersProblem(v.speakers);
    if (speakerProblem) return speakerProblem;
    return '';
  };

  const fmtWhen = (date, time) => (date ? `${fmtDay(date)}${time ? ` · ${time}` : ''}` : '');
  const renderPreview = (box, v) => {
    const occ = parseOccurrences(v);
    const first = occ[0] || { date: v.date, time: v.time };
    const img = evForm.images.poster?.url || '';
    const hero = evForm.images.banner?.url || '/event-banner-placeholder.jpg';   // sitedekiyle aynı yer tutucu
    const socials = ['instagram', 'facebook', 'x', 'youtube'].filter((k) => v[k]);
    const row = (ic, label, val) => (val ? `<div class="pv-row">${icon(ic)}<div><small>${esc(label)}</small><span>${val}</span></div></div>` : '');
    const placeText = [v.place, v.address, v.city].map((x) => String(x).trim()).filter(Boolean).map(esc).join('<br>');
    const d = designFrom(v);
    const pvVars = [];
    let heroInk = '#FFFFFF';
    if (d.bg === 'color' || d.bg === 'gradient') {
      d.bgColor = d.bgColor || '#0C0C0D';
      const second = d.bg === 'gradient' ? (d.accent || brandColor()) : d.bgColor;
      heroInk = (bLum(d.bgColor) + bLum(second)) / 2 > 0.42 ? '#0C0C0D' : '#FFFFFF';
      pvVars.push(`--pv-bgc:${d.bgColor}`, `--pv-grad2:${second}`);
    }
    pvVars.push(`--pv-ink:${heroInk}`);
    if (img) pvVars.push(`--pv-poster:url('${esc(img).replace(/'/g, '%27')}')`);
    if (hero) pvVars.push(`background-image:url('${esc(hero).replace(/'/g, '%27')}')`);
    if (d.accent) { box.style.setProperty('--accent', d.accent); box.style.setProperty('--pv-on-acc', bLum(d.accent) > 0.42 ? '#0C0C0D' : '#FFFFFF'); }
    else { box.style.removeProperty('--accent'); box.style.removeProperty('--pv-on-acc'); }
    const orgLogo = isAdmin() || (evForm.mode === 'edit' && db.events.find((x) => x.id === evForm.id)?.ownerId === ADMIN) ? '/apple-touch-icon.png' : (state.profile.avatarUrl || '');
    box.innerHTML = `
      <div class="pv-hero bg-${d.bg || 'default'} t-${d.title || 'default'}${heroInk === '#0C0C0D' ? ' light' : ''}" style="${pvVars.join(';')}">
        <h3>${esc(v.title) || '<span class="pv-empty">Etkinlik adı</span>'}</h3><i></i>
        <p>${[v.place, fmtWhen(first.date, first.time)].filter(Boolean).map(esc).join(' · ') || '<span class="pv-empty">Yer · tarih</span>'}</p>
      </div>
      <div class="pv-body">
        <div class="pv-fee"><b>${evForm.fee === 'paid' ? (v.feeAmount ? `${esc(v.feeAmount)} TL` : 'Ücretli') : 'Ücretsiz'}</b>
          <span>${v.registration ? 'Kayıt ol' : ''}${v.registration && v.biletimgo ? ' · ' : ''}${v.biletimgo ? 'biletimGO' : ''}</span></div>
        <div class="pv-poster">${img ? `<img src="${esc(img)}" alt="">` : 'Etkinlik görseli'}</div>
        <div class="pv-detail">${mdLite(v.desc) || '<p class="pv-empty">Detay metni burada görünür.</p>'}</div>
        <div class="pv-card"><h4>Etkinlik Bilgileri</h4>
          ${row('start', 'Başlangıç', esc(fmtWhen(first.date, first.time)))}
          ${row('end', 'Bitiş', esc(fmtWhen(v.endDate || (v.endTime ? first.date : ''), v.endTime)))}
          ${row('org', 'Organizatör', `${orgLogo ? `<img class="pv-org-logo" src="${esc(orgLogo)}" alt="">` : ''}${esc(organizerName())}`)}
          ${row('cat', 'Kategori', esc(v.category))}
          ${row('place', 'Yer', placeText)}
          ${socials.length ? row('link', 'Etkinlik sayfaları', `<span class="pv-social">${socials.map((k) => icon(k)).join('')}</span>`) : ''}
          ${row('cap', 'Kontenjan', esc(v.capacity))}
        </div>
        ${cleanSpeakers(v.speakers).length ? `<div class="pv-card"><h4>Konuşmacılar</h4><ul class="pv-speakers">${cleanSpeakers(v.speakers).map((s) => `<li>${s.linkedin && LINKEDIN.test(s.linkedin) ? `<a href="${esc(s.linkedin)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a>` : esc(s.name)}</li>`).join('')}</ul></div>` : ''}
      </div>`;
  };

  const mountEventPage = () => {
    const form = document.getElementById('evpForm');
    if (!form) return;
    const box = root.querySelector('[data-ev-preview]');
    const status = form.querySelector('[data-ev-status]');
    const err = form.querySelector('#evpError');
    const refresh = (markDirty) => {
      evForm.values = readValues(form);
      renderPreview(box, evForm.values);
      if (!markDirty) return;
      evForm.dirty = true;
      clearTimeout(evForm.saveTimer);
      evForm.saveTimer = setTimeout(() => {
        if (state.view !== 'etkinlik-olustur' || !evForm.dirty) return;
        writeDraft(); status.textContent = 'Taslak bu tarayıcıya kaydedildi.';
      }, 500);
    };
    form.addEventListener('input', () => refresh(true));
    form.addEventListener('change', (e) => {
      if (e.target.matches('[data-ev-fee]')) { evForm.values = readValues(form); evForm.fee = e.target.value; evForm.dirty = true; writeDraft(); render(); return; }
      if (!e.target.matches('[data-ev-image]')) refresh(true);
    });
    form.querySelectorAll('[data-ev-image]').forEach((input) => input.addEventListener('change', async () => {
      const k = input.dataset.evImage; const file = input.files && input.files[0]; if (!file) return;
      const hint = form.querySelector(`[data-ev-hint="${k}"]`);
      hint.textContent = 'Hazırlanıyor…';
      try {
        const { file: small, ratio } = await shrinkImage(file);
        const dataUrl = await readAsDataUrl(small);
        evForm.images[k] = { file: small, url: dataUrl, dataUrl, name: small.name };
        const target = k === 'banner' ? 5 : 1;
        const off = Math.abs(ratio / target - 1) > 0.15;
        form.querySelector(`[data-ev-thumb="${k}"]`).innerHTML = `<img src="${esc(dataUrl)}" alt="">`;
        hint.textContent = `${Math.round(small.size / 1024)} KB${off ? ` · önerilen oran ${k === 'banner' ? '5:1' : '1:1'}, sitede kenarlardan kırpılabilir` : ''}`;
        evForm.values = readValues(form); evForm.dirty = true; writeDraft(); renderPreview(box, evForm.values);
        if (k === 'banner' && !form.querySelector('[data-ev-clear="banner"]')) render();
      } catch (error) { input.value = ''; hint.textContent = error.message || 'Görsel eklenemedi.'; }
    }));
    form.addEventListener('click', (e) => {
      const clear = e.target.closest('[data-ev-clear]');
      if (clear) { evForm.values = readValues(form); evForm.images[clear.dataset.evClear] = null; evForm.dirty = true; writeDraft(); render(); return; }
      if (e.target.closest('[data-ev-reset]')) {
        if (!confirm('Taslak silinsin mi? Form başa döner.')) return;
        clearDraft(); evForm.dirty = false; evForm.restored = false;
        if (evForm.mode === 'edit') { const ev = db.events.find((x) => x.id === evForm.id); evForm.values = valuesFromEvent(ev); evForm.images = { poster: ev.poster ? { url: ev.poster } : null, banner: ev.banner ? { url: ev.banner } : null }; }
        else { evForm.values = null; evForm.images = { poster: null, banner: null }; }
        render(); return;
      }
      const md = e.target.closest('[data-md]'); if (!md) return;
      const ta = form.querySelector('[name="desc"]');
      const a = ta.selectionStart; const b = ta.selectionEnd; const sel = ta.value.slice(a, b);
      let ins = sel;
      if (md.dataset.md === 'bold') ins = `**${sel || 'kalın metin'}**`;
      else if (md.dataset.md === 'italic') ins = `*${sel || 'italik metin'}*`;
      else if (md.dataset.md === 'link') {
        const url = prompt('Link adresi (https://...)', 'https://'); if (!url) return;
        if (!/^https?:\/\/[^\s"'<>()]+$/i.test(url.trim())) { alert('Link http:// ya da https:// ile başlamalı.'); return; }
        ins = `[${sel || 'bağlantı'}](${url.trim()})`;
      } else if (md.dataset.md === 'list') ins = (sel || 'madde').split('\n').map((l) => (l.startsWith('- ') ? l : `- ${l}`)).join('\n');
      ta.setRangeText(ins, a, b, 'end'); ta.focus(); refresh(true);
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = form.querySelector('button[type="submit"]'); if (button.disabled) return;
      const v = readValues(form); evForm.values = v;
      const problem = validateEvent(v);
      if (problem) { err.textContent = problem; err.hidden = false; return; }
      err.hidden = true; button.disabled = true; status.textContent = 'Kaydediliyor…';
      clearTimeout(evForm.saveTimer);
      try {
        await saveEvent(v);
        clearDraft(); evForm.dirty = false;
        const target = evForm.back && evForm.back !== 'etkinlik-olustur' ? evForm.back : (isAdmin() ? 'etkinlikler' : 'etkinliklerim');
        go(target);
      } catch (error) {
        if (!state.user) { render(); return; }
        err.textContent = error.message || 'Kaydedilemedi.'; err.hidden = false; status.textContent = '';
        button.disabled = false;
      }
    });
    renderPreview(box, readValues(form));
  };

  const saveEvent = async (v) => {
    const occ = parseOccurrences(v);
    const upload = async (k) => { const im = evForm.images[k]; if (!im) return ''; return im.file ? api.uploadEventPoster(im.file) : im.url; };
    const posterUrl = await upload('poster');
    const bannerUrl = await upload('banner');
    const f = {
      title: v.title.trim(), desc: v.desc, date: occ[0].date, time: occ[0].time, occurrences: occ,
      endDate: v.endDate, endTime: v.endTime, place: v.place.trim(), city: v.city.trim(), university: v.university.trim(), address: v.address.trim(),
      rules: v.rules, posterUrl, bannerUrl, category: v.category,
      tags: String(v.tags).split(',').map((x) => x.trim()).filter(Boolean).slice(0, 12),
      registration: v.registration.trim(), feeType: evForm.fee === 'paid' ? 'paid' : 'free', feeAmount: evForm.fee === 'paid' ? v.feeAmount : '',
      biletimgo: v.biletimgo.trim(), instagram: v.instagram.trim(), facebook: v.facebook.trim(), x: v.x.trim(), youtube: v.youtube.trim(), capacity: v.capacity,
      speakers: cleanSpeakers(v.speakers),
      design: designFrom(v),
    };
    if (evForm.kind === 'partner') f.seeking = v.seeking.trim();
    const visible = !v.hidden;
    if (evForm.mode === 'new') {
      const reg = can('registrations') ? evForm.reg : null;
      const regProblem = reg ? validateRegDraft(reg) : '';
      if (regProblem) throw new Error(regProblem);
      const newId = await api.addEvent({ ...f, kind: evForm.kind, visible });
      if (reg?.enabled && newId) {
        try { await api.setRegistration(newId, { enabled: true, open: true, deadline: fromLocalInput(reg.deadline), questions: cleanRegQuestions(reg), columns: [], reminders: reg.reminders || [] }); }
        catch (error) { toast(`Etkinlik kaydedildi ama kayıt formu kaydedilemedi: ${error.message}. Etkinliklerim → Kayıtlar’dan tekrar dene.`); }
      }
      toast(isAdmin() ? (evForm.kind === 'partner' ? 'Ortak Arama’da yayınlandı.' : 'Etkinlik takvime eklendi.') : 'Etkinlik onaya gönderildi.');
      return;
    }
    const e = db.events.find((x) => x.id === evForm.id);
    const visChanged = e && (e.visible !== false) !== visible;
    if (isAdmin()) {
      await api.updateEvent(evForm.id, f);
      if (visChanged) await api.setEventVisibility(evForm.id, visible);
      toast('Etkinlik güncellendi.');
    } else {
      await api.requestEventEdit(evForm.id, f);
      if (visChanged) await api.requestEventVisibility(evForm.id, visible, '');
      toast(visChanged ? 'Düzenleme ve görünürlük talebin Onaylamalar’a gönderildi.' : 'Düzenleme talebi Onaylamalar’a gönderildi.');
    }
  };

  const VANGUARD_OPEN = false;   // UniPakt.Vanguard yenilenirken kapalı
  const views = {
    marka: () => brandView(),
    'kulup-sayfasi': () => clubPageView(),
    birimler: () => unitsView(),
    ekip: () => teamView(),
    'islem-kaydi': () => activityView(),
    ims: () => imView(),
    kayitlar: () => regBoardView(),
    gorevliler: () => staffView(),
    'etkinlik-olustur': () => eventPageView(),
    ayarlar() {
      const clubInfo = club(state.user);
      return `${head('Profil', state.unitAcc ? 'Adın ve profil fotoğrafın Birimler sayfasında ve mesajlarda görünür.' : 'Kulüp profilinde diğer kulüplerin göreceği bilgileri düzenle.')}
        <section class="card">
          ${isAdmin() || state.unitAcc ? `${state.unitAcc ? `<p class="body">UniPakt ${esc(state.unitAcc.unitName)} <span class="tag ok">${esc(state.unitAcc.roleName)}</span></p>` : `<p class="body">UniPakt <span class="tag ok">✓ Onaylı</span></p>
            <p class="body">Adın ve profil fotoğrafın panelde görünür. Hesabın @unipakt.com adresliyse fotoğrafın sitedeki The Story bölümündeki ekip kartında da görünür; değiştirince sitede de değişir.</p>`}
            <form id="profileForm" class="stack" style="margin-top:20px">
              <div class="profile-editor">
                <div data-profile-avatar>${avatarMarkup(state.profile.avatarUrl, state.profile.fullName || 'UniPakt', 'large')}</div>
                <div class="profile-logo-actions">
                  <label class="field"><span>Profil fotoğrafı</span><input type="file" name="avatar" accept="image/jpeg,image/png,image/webp" data-profile-logo></label>
                  <small class="hint">JPG, PNG veya WebP · seçince yuvarlağa göre hizalarsın</small>
                  <input type="checkbox" name="removeAvatar" hidden>
                  <button class="btn ghost small profile-remove-logo" type="button" data-act="profile-avatar-remove" ${state.profile.avatarUrl ? '' : 'hidden'}>Fotoğrafı kaldır</button>
                </div>
              </div>
              ${field('Adın', `<input name="fullName" maxlength="120" required value="${esc(state.profile.fullName)}" autocomplete="name">`)}
              ${state.staff ? `<p class="body">Kullanıcı adın: <strong>${esc(state.profile.username || '—')}</strong> <button type="button" class="btn ghost small" data-act="username-change">Değiştir</button></p>` : ''}
              <button class="btn small" type="submit">Profili kaydet</button>
              <p class="form-error" data-profile-error hidden></p>
            </form>` : `<p class="body">Logo ve kısa tanıtım, sitedeki kulüp sayfanda ve etkinliklerinin organizatör satırında da herkese açık görünür. Başkanın adı ve iş birliği alanları yalnızca panelde ve kulüpler arası sohbetlerde görünür.</p>
            <form id="profileForm" class="stack" style="margin-top:20px">
              <div class="profile-editor">
                <div data-profile-avatar>${avatarMarkup(state.profile.avatarUrl, state.profile.fullName || clubInfo?.name || 'Kulüp', 'large')}</div>
                <div class="profile-logo-actions">
                  <label class="field"><span>Kulüp logosu</span><input type="file" name="avatar" accept="image/jpeg,image/png,image/webp" data-profile-logo></label>
                  <small class="hint">JPG, PNG veya WebP · seçince yuvarlağa göre hizalarsın</small>
                  <input type="checkbox" name="removeAvatar" hidden>
                  <button class="btn ghost small profile-remove-logo" type="button" data-act="profile-avatar-remove" ${state.profile.avatarUrl ? '' : 'hidden'}>Logoyu kaldır</button>
                </div>
              </div>
              <p><strong>${esc(clubInfo?.name || '')}</strong> <span class="tag">Kulüp</span><br><small>${esc(clubInfo?.uni || '')} · ${esc(clubInfo?.category || '')}</small></p>
              ${field('Kulüp başkanının adı', `<input name="fullName" maxlength="120" required value="${esc(state.profile.fullName)}" autocomplete="name">`)}
              ${field('Kısa tanıtım (isteğe bağlı)', `<textarea name="bio" maxlength="500" placeholder="Kulübünüzü kısaca tanıtın">${esc(state.profile.bio || '')}</textarea>`)}
              ${field('İş birliği aradığınız alanlar (isteğe bağlı)', `<textarea name="collaborationInterests" maxlength="500" placeholder="Örn. tasarım, konuşmacı, mekân desteği">${esc((state.profile.collaborationInterests || []).join(', '))}</textarea>`)}
              <button class="btn small" type="submit">Profili kaydet</button>
              <p class="form-error" data-profile-error hidden></p>
            </form>`}
        </section>`;
    },
    hesap() {
      if (DEMO) state.mfa.enabled = sessionStorage.getItem('unipaktDemoMfa') === '1';
      return `${head('Hesap', 'Giriş bilgilerini ve şifreni yönet.')}
        <section class="card">

            <button class="btn small" type="submit">E-postayı değiştir</button>
            <p class="form-error" data-email-error hidden></p>
          </form>` : ''}
          <h2>Şifre değiştir</h2>
          <form id="passwordForm" class="stack" style="margin-top:18px;max-width:520px">
            ${field('Mevcut şifre', '<input type="password" name="currentPassword" required autocomplete="current-password">')}
            ${field('Yeni şifre', '<input type="password" name="newPassword" required minlength="8" autocomplete="new-password">')}
            ${field('Yeni şifreyi tekrar yaz', '<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password">')}
            <button class="btn small" type="submit">Şifreyi değiştir</button>
            <p class="form-error" data-password-error hidden></p>
          </form>
        </section>
        <section class="card mfa-card" style="margin-top:16px">
          <div class="mfa-card-head"><h2>İki adımlı doğrulama</h2><span class="tag ${state.mfa.enabled ? 'ok' : ''}">${state.mfa.enabled ? 'Açık' : 'Kapalı'}</span></div>
          <p class="body">Açıkken panele yeni bir tarayıcıdan girişte e-posta adresine 6 haneli bir kod gönderilir. Doğruladığın tarayıcı 30 gün boyunca tekrar kod istemez.</p>
          <button class="btn small ${state.mfa.enabled ? 'ghost' : ''}" type="button" data-act="mfa-start" data-id="${state.mfa.enabled ? 'disable' : 'enable'}">${state.mfa.enabled ? 'Kapat' : 'Etkinleştir'}</button>
        </section>`;
    },
    dogrulama() {
      const purpose = state.mfa.flow?.purpose;
      if (purpose !== 'enable' && purpose !== 'disable') { setTimeout(() => go('hesap')); return ''; }
      const enabling = purpose === 'enable';
      return `${head(enabling ? 'Doğrulamayı aç' : 'Doğrulamayı kapat', 'İki adımlı doğrulama')}
        <section class="card" style="max-width:560px">
          <p class="mfa-lead" data-mfa-lead>${mfaLead()}</p>
          ${mfaCodeHtml(purpose)}
          <p class="mfa-note">${enabling ? 'Açtıktan sonra bu tarayıcı 30 gün boyunca kod istemez; yeni bir tarayıcıdan girişte kod e-postana gelir.' : 'Kapatınca kayıtlı tüm tarayıcılar da unutulur.'}</p>
          <button class="link-btn" type="button" data-go="hesap" style="margin-top:12px">Vazgeç</button>
        </section>`;
    },
    genel() {
      const events = upcomingEvents().slice(0, 3);
      const eventsBlock = `
        <div>
          <div class="section-head"><h2>Yaklaşan etkinlikler</h2><button class="link-btn" data-go="takvim">Takvim</button></div>
          ${events.length ? `<div class="card">${events.map((e) => `
            <div class="mini-row"><div><strong>${esc(e.title)}</strong><small>${fmtDay(e.date)}${e.time ? ` · ${esc(e.time)}` : ''} · ${esc(who(e.ownerId))}</small></div></div>`).join('')}</div>`
            : empty('Yaklaşan etkinlik yok.')}
        </div>`;

      if (isAdmin()) {
        const pend = [
          ...pendingAnnouncements().map((a) => ({ kind: 'Duyuru', title: a.title, by: who(a.authorId) })),
          ...pendingEvents().map((e) => ({ kind: kindLabel(e), title: e.title, by: who(e.ownerId) })),
          ...pendingCalendar().map((e) => ({ kind: 'Takvim talebi', title: e.title, by: who(e.ownerId) })),
          ...pendingComments().map((c) => ({ kind: 'Yorum', title: db.events.find((e) => e.id === c.eventId)?.title || 'Etkinlik', by: c.name })),
        ];
        const done = db.tasks.filter((t) => t.status === 'done').sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt))).slice(0, 3);
        return `
          ${head('Genel Bakış', 'Ağda bugün olan biten, tek ekranda.')}
          <div class="stats">
            <button class="stat ${pend.length ? 'hot' : ''}" data-go="onaylar"><b>${pend.length}</b><span>Bekleyen onay</span></button>
            <button class="stat" data-go="duyurular"><b>${publishedAnnouncements().length}</b><span>Yayındaki duyuru</span></button>
            <button class="stat" data-go="etkinlikler"><b>${upcomingEvents().length}</b><span>Yaklaşan etkinlik</span></button>
            <button class="stat" data-go="gorevler"><b>${db.tasks.filter((t) => t.status === 'open').length}</b><span>Açık görev</span></button>
          </div>
          <div class="grid-2" style="margin-top:34px">
            <div>
              <div class="section-head"><h2>Onay bekleyenler</h2><button class="link-btn" data-go="onaylar">Tümü</button></div>
              ${pend.length ? `<div class="card">${pend.slice(0, 5).map((p) => `
                <div class="mini-row"><div><strong>${esc(p.title)}</strong><small>${esc(p.kind)} · ${esc(p.by)}</small></div><span class="tag wait">Bekliyor</span></div>`).join('')}</div>`
                : empty('Bekleyen işlem yok.')}
            </div>
            ${eventsBlock}
            <div>
              <div class="section-head"><h2>Son biten görevler</h2><button class="link-btn" data-go="gorevler">Görevler</button></div>
              ${done.length ? `<div class="card">${done.map((t) => `
                <div class="mini-row"><div><strong>${esc(t.title)}</strong><small>${esc(who(t.clubId))} · ${fmtStamp(t.doneAt)}</small></div><span class="tag ok">Bitti</span></div>`).join('')}</div>`
                : empty('Henüz biten görev yok.')}
            </div>
            <div>
              <div class="section-head"><h2>Vanguard ilk üç</h2><button class="link-btn" data-go="vanguard">Sıralama</button></div>
              <div class="card">${ranking().slice(0, 3).map((c, i) => `
                <div class="mini-row"><div><strong>${i + 1}. ${esc(c.name)}</strong><small>${esc(c.uni)}</small></div><strong>${c.points}</strong></div>`).join('')}</div>
            </div>
          </div>
          ${uwAdminSummary()}`;
      }

      const me = club(state.user);
      const rank = ranking().findIndex((c) => c.id === state.user) + 1;
      const myOpen = visibleTasks().filter((t) => t.status === 'open');
      const myPending = db.announcements.filter((a) => a.authorId === state.user && a.status === 'pending').length
        + db.events.filter((e) => e.ownerId === state.user && e.status === 'pending').length
        + db.events.flatMap((e) => e.applications).filter((p) => p.clubId === state.user && p.status === 'pending').length;
      const latest = publishedAnnouncements().slice(0, 3);
      return `
        ${head('Genel Bakış', `${me.name} · ${me.uni}`)}
        <div class="stats">
          <button class="stat hot" data-go="vanguard"><b>${pts(state.user)}</b><span>Vanguard puanı · ${rank}. sıra</span></button>
          <button class="stat" data-go="gorevler"><b>${myOpen.length}</b><span>Açık görev</span></button>
          <button class="stat" data-go="basvuru"><b>${myPending}</b><span>Onay bekleyen başvurun</span></button>
          <button class="stat" data-go="etkinlikler"><b>${upcomingEvents().length}</b><span>Yaklaşan etkinlik</span></button>
        </div>
        <div class="grid-2" style="margin-top:34px">
          <div>
            <div class="section-head"><h2>Görevlerin</h2><button class="link-btn" data-go="gorevler">Tümü</button></div>
            ${myOpen.length ? `<div class="card">${myOpen.slice(0, 4).map((t) => `
              <div class="mini-row"><div><strong>${esc(t.title)}</strong><small>${t.due ? `Son tarih: ${fmtDay(t.due)}` : 'Son tarih yok'}</small></div>${t.due && t.due < today() ? '<span class="tag no">Gecikti</span>' : '<span class="tag wait">Açık</span>'}</div>`).join('')}</div>`
              : empty('Açık görevin yok.')}
          </div>
          ${eventsBlock}
          <div style="grid-column:1/-1">
            <div class="section-head"><h2>Son duyurular</h2><button class="link-btn" data-go="duyurular">Tümü</button></div>
            ${latest.length ? `<div class="card">${latest.map((a) => `
              <div class="mini-row"><div><strong>${esc(a.title)}</strong><small>${esc(who(a.authorId))} · ${fmtStamp(a.decidedAt || a.createdAt)}</small></div></div>`).join('')}</div>`
              : empty('Henüz duyuru yok.')}
          </div>
        </div>`;
    },

    'site-mesajlari'() {
      if (!isAdmin()) return empty('Bu bölüm yalnızca UniPakt yetkilisine açık.');
      const s = state.inbox;
      if (!s.data && !s.loading && !s.error) loadSiteInbox();
      const top = head('Site Mesajları',
        'Sitedeki İletişim ve Bize Katıl formlarından gelenler. Yalnızca UniPakt yetkilisi görür. İşi biten kaydı sil; kişisel veri gereğinden uzun tutulmamalı.',
        '<button class="btn ghost" data-act="inbox-refresh">Yenile</button>')
        + '<p class="muted" style="margin:-8px 0 18px">12 aydan eski mesajlar otomatik silinir.</p>';
      if (s.error) return `${top}<div class="support-info"><strong>Mesajlar yüklenemedi</strong><p>${esc(s.error.message || 'Sunucuya ulaşılamadı.')}</p></div>`;
      if (!s.data) return `${top}${empty('Yükleniyor…')}`;
      const isJoin = s.tab === 'join';
      const list = isJoin ? s.data.join : s.data.contact;
      const when = (iso) => new Date(iso).toLocaleString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const ago = (iso) => {
        const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
        if (!Number.isFinite(days)) return '';
        if (days <= 0) return 'bugün';
        if (days === 1) return 'dün';
        if (days < 30) return `${days} gün önce`;
        if (days < 365) return `${Math.floor(days / 30)} ay önce`;
        return `${Math.floor(days / 365)} yıl önce`;
      };
      const line = (label, v) => (v ? `<span><b>${esc(label)}:</b> ${esc(v)}</span>` : '');
      // The address goes into the link as one encoded value, so a crafted "email" cannot add cc/bcc/body.
      const mail = (v) => (EMAIL_RE.test(String(v || '')) ? `<a href="${esc(`mailto:${encodeURIComponent(v)}`)}">${esc(v)}</a>` : esc(v));
      const kvkk = (r) => (r.kvkk_version || r.kvkk_ack_at
        ? `<div class="meta"><span>KVKK metni: ${esc(r.kvkk_version ? `v${String(r.kvkk_version).replace(/^v/i, '')}` : '—')}${r.kvkk_ack_at ? ` · ${esc(when(r.kvkk_ack_at))}` : ''}</span></div>` : '');
      const card = (r) => `<article class="card item">
          <div class="meta top"><span class="tag wait">${isJoin ? 'Başvuru' : 'Mesaj'}</span><span>${esc(when(r.created_at))}</span><span>${esc(ago(r.created_at))}</span></div>
          <h3>${esc(r.name)}</h3>
          <div class="meta"><span>${mail(r.email)}</span>${isJoin ? line('Üniversite', r.university) + line('Şehir', r.city) + line('İstanbul dışı üniversite', r.outside_university) + line('Kulüp', r.club) : ''}</div>
          ${r.message ? `<p class="body" style="white-space:pre-wrap">${esc(r.message)}</p>` : ''}
          ${kvkk(r)}
          <div class="actions"><button class="btn danger small" data-act="inbox-delete" data-id="${esc(r.id)}" data-sub="${isJoin ? 'join' : 'contact'}">Sil</button></div>
        </article>`;
      return `${top}
        <div class="toolbar">
          <button class="chip ${!isJoin ? 'active' : ''}" data-act="inbox-tab" data-id="contact">İletişim (${s.data.contact.length})</button>
          <button class="chip ${isJoin ? 'active' : ''}" data-act="inbox-tab" data-id="join">Bize Katıl (${s.data.join.length})</button>
          ${list.length ? `<button class="btn danger small" data-act="inbox-delete-all" data-id="${isJoin ? 'join' : 'contact'}">Tümünü sil</button>` : ''}
        </div>
        <div class="stack">${list.length ? list.map(card).join('') : empty(isJoin ? 'Bize Katıl başvurusu yok.' : 'İletişim mesajı yok.')}</div>`;
    },

    'destek-taleplerim'() { return renderSupportTickets(); },

    bildirimler() {
      const list = [...(db.notifications || [])].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
      const row = (n) => { const app = notificationApplication(n); const pending = n.type === 'partnership_application' ? !!(app?.p.status === 'pending') : (n.actionable && !n.resolved); return `<article class="card item notification ${!n.readAt ? 'unread' : ''}"><div class="meta top"><span class="tag ${pending?'wait':'ok'}">${pending?'İşlem bekliyor':'Bilgi'}</span><span>${fmtStamp(n.createdAt)}</span></div><h3>${esc(n.title)}</h3><p class="body notif-body">${esc(n.body)}</p><div class="actions">${n.type === 'partnership_application' ? notificationAction(n) : (pending ? notificationAction(n) : '')}${!n.readAt ? `<button class="btn ghost small" data-act="notif-read" data-id="${esc(n.id)}">Okundu</button>` : ''}${!pending ? `<button class="btn ghost small" data-act="notif-delete" data-id="${esc(n.id)}">Sil</button>` : ''}</div></article>`; };
      return `${head('Bildirimler','Talepler, sonuçlar ve seninle ilgili önemli gelişmeler. Sonuçlandırılmamış talepler silinemez.')}${list.length ? `<div class="stack">${list.map(row).join('')}</div>` : empty('Henüz bildirimin yok.')}`;
    },

    etkinliklerim() {
      const mine = isAdmin() ? db.events.filter(e=>e.status==='published' && (e.ownerId===ADMIN || e.applications.some(p=>p.status==='approved'))) : db.events.filter(e=>e.status==='published' && (e.ownerId===state.user || e.applications.some(p=>p.status==='approved'&&p.clubId===state.user)));
      // Host olduğun etkinliği buradan da düzenleyebilirsin (kulüpte düzenleme UniPakt onayına gider).
      const editBtn = (e) => (!isAdmin() && pendingEventEdits().some((r) => r.eventId === e.id && r.clubId === state.user))
        ? '<span class="tag wait">Düzenleme talebi bekliyor</span>'
        : `<button class="btn ghost small" data-act="event-edit" data-id="${esc(e.id)}">Düzenle</button>`;
      const card = (e) => { const partners=e.applications.filter(p=>p.status==='approved'); const host=e.ownerId; const related=!isAdmin()&&host!==state.user; const contact=(id)=>{const c=club(id); if(!c)return ''; return Object.entries(c.contact||{}).filter(([,v])=>v).map(([k,v])=>`<span class="contact-chip"><b>${esc(k)}:</b> ${esc(v)}</span>`).join(' · ')}; return `<article class="card item"><div class="meta top"><span class="tag ${related?'ok':'wait'}">${related?'Ortaksın':'Host'}</span><span>${fmtDay(e.date)}</span></div><h3>${esc(e.title)}</h3><p class="body">Organizatör: ${esc(organizerNames(e).join(', '))}</p><div class="meta"><span><strong>Host iletişim:</strong> ${host===ADMIN?esc('UniPakt'):(contact(host)||esc('İletişim bilgisi yok'))}</span></div><div class="section-head"><h3>Ortaklar</h3></div>${partners.length?`<div class="stack">${partners.map(p=>`<div class="mini-row"><div><strong>${esc(who(p.clubId))}</strong><small>${contact(p.clubId)||esc('İletişim bilgisi yok')}</small></div>${isAdmin()?`<button class="btn danger small" data-act="partner-remove" data-id="${esc(e.id)}" data-sub="${esc(p.clubId)}">Ayır</button>`:''}</div>`).join('')}</div>`:empty('Henüz onaylı ortak yok.')}<div class="actions">${ownsEventUi(e)&&!related?editBtn(e):''}${ownsEventUi(e)&&!related?`<button class="btn small" data-act="reg-open" data-id="${esc(e.id)}">Kayıtlar</button>`:''}${isAdmin()&&host===ADMIN?`<button class="btn small" data-act="event-task" data-id="${esc(e.id)}">Bu etkinlik için görev ata</button>`:''}</div></article>`; };
      return `${head('Etkinliklerim','Host olduğun veya ortak olduğun etkinlikler ve ortakların iletişim bilgileri.')}${mine.length?`<div class="stack">${mine.map(card).join('')}</div>`:empty('Henüz etkinliğin yok.')}`;
    },

    duyurular() {
      const list = publishedAnnouncements();
      return `
        ${head('Duyurular',
          isAdmin() ? 'Senin yayınladıkların ve onay verdiğin kulüp duyuruları. Tüm kulüp başkanları görür.'
                    : 'UniPakt’ın yayınladığı ve onayladığı duyurular.',
          isAdmin() ? '<button class="btn" data-act="ann-new">Yeni duyuru</button>' : '<button class="btn ghost" data-go="basvuru">Duyuru başvurusu</button>')}
        <div class="stack">${list.length ? list.map((a) => announcementCard(a)).join('') : empty('Henüz yayında duyuru yok.')}</div>`;
    },

    etkinlikler() {
      const list = calendarEvents();
      const upcoming = list.filter((e) => e.date >= today());
      const past = list.filter((e) => e.date < today()).reverse();
      return `
        ${head('Etkinlikler',
          isAdmin() ? 'Takvimdeki etkinlikler. “Yeni etkinlik” doğrudan takvime düşer; “Yeni ortak etkinlik” Ortak Arama sayfasına düşer.'
                    : 'Takvimdeki etkinlikler. Kendi etkinliğini ekle; UniPakt onaylayınca takvime düşer.',
          isAdmin() ? '<div class="head-actions"><button class="btn" data-act="event-new" data-id="event">Yeni etkinlik</button><button class="btn ghost" data-act="event-new" data-id="partner">Yeni ortak etkinlik</button></div>'
                    : '<button class="btn" data-act="event-new" data-id="event">Yeni etkinlik</button>')}
        <div class="stack">${upcoming.length ? upcoming.map((e) => eventCard(e)).join('') : empty('Yaklaşan etkinlik yok.')}</div>
        ${past.length ? `<div class="section-head"><h2>Geçmiş etkinlikler</h2></div><div class="stack">${past.map((e) => eventCard(e)).join('')}</div>` : ''}`;
    },

    ortak() {
      const list = partnerEvents();
      const upcoming = list.filter((e) => e.date >= today());
      const past = list.filter((e) => e.date < today()).reverse();
      return `
        ${head('Ortak Arama',
          isAdmin() ? 'Ortak arayan etkinlikler. Ortaklık başvurularını onayla; bir etkinliği “Yayına al” ile takvime gönder.'
                    : 'Ortak arayan etkinlikler. Birine ortak olmak için başvur. Kendi etkinliğini takvime almak için yayına alma talebi gönder.',
          `<button class="btn" data-act="event-new" data-id="partner">${isAdmin() ? 'Yeni ortak etkinlik' : 'Ortak arıyorum'}</button>`)}
        <div class="stack">${upcoming.length ? upcoming.map((e) => eventCard(e, 'ortak')).join('') : empty('Şu an ortak arayan etkinlik yok.')}</div>
        ${past.length ? `<div class="section-head"><h2>Geçmiş</h2></div><div class="stack">${past.map((e) => eventCard(e, 'ortak')).join('')}</div>` : ''}`;
    },

    takvim() {
      const { y, m, sel } = state.cal;
      const first = new Date(y, m, 1);
      const offset = (first.getDay() + 6) % 7;            // Monday first
      const days = new Date(y, m + 1, 0).getDate();
      const cells = Math.ceil((offset + days) / 7) * 7;
      const items = {};
      const add = (date, entry) => { (items[date] = items[date] || []).push(entry); };
      calendarEvents().forEach((e) => add(e.date, { type: 'event', title: e.title, sub: `${e.time ? `${e.time} · ` : ''}${e.place || ''}`, by: who(e.ownerId) }));
      visibleTasks().filter((t) => t.status === 'open' && t.due).forEach((t) => add(t.due, { type: 'task', title: t.title, sub: 'Görev son tarihi', by: who(t.clubId) }));
      const t = today();
      let grid = DOW.map((d) => `<div class="cal-dow">${d}</div>`).join('');
      for (let i = 0; i < cells; i++) {
        const d = new Date(y, m, i - offset + 1);
        const key = ymd(d);
        const list = items[key] || [];
        const cls = ['cal-day', d.getMonth() !== m ? 'out' : '', key === t ? 'today' : '', key === sel ? 'selected' : '', i >= cells - 7 ? 'last-row' : ''].filter(Boolean).join(' ');
        grid += `<button class="${cls}" data-act="cal-pick" data-id="${key}" aria-label="${fmtDay(key)}${list.length ? `, ${list.length} kayıt` : ''}">
          <span class="num">${d.getDate()}</span>
          <span class="chips">${list.slice(0, 3).map((x) => `<span class="cal-chip ${x.type === 'task' ? 'task' : ''}">${esc(x.title)}</span>`).join('')}</span>
        </button>`;
      }
      const selected = items[sel] || [];
      return `
        ${head('Takvim', 'Takvime alınan etkinlikler ve görev son tarihleri. Buradaki etkinlikler unipakt.com’daki takvimde de görünür.')}
        <div class="cal-head">
          <h2>${MONTHS[m]} ${y}</h2>
          <div class="row">
            <button class="btn ghost small" data-act="cal-move" data-id="-1" aria-label="Önceki ay">‹ Önceki</button>
            <button class="btn ghost small" data-act="cal-today">Bugün</button>
            <button class="btn ghost small" data-act="cal-move" data-id="1" aria-label="Sonraki ay">Sonraki ›</button>
          </div>
        </div>
        <div class="cal-grid">${grid}</div>
        <div class="cal-legend"><span><i></i>Etkinlik</span><span><i class="task"></i>Görev son tarihi</span></div>
        <div class="section-head"><h2>${fmtDay(sel)}</h2></div>
        ${selected.length ? `<div class="card">${selected.map((x) => `
          <div class="mini-row"><div><strong>${esc(x.title)}</strong><small>${esc([x.sub, x.by].filter(Boolean).join(' · '))}</small></div><span class="tag ${x.type === 'task' ? '' : 'wait'}">${x.type === 'task' ? 'Görev' : 'Etkinlik'}</span></div>`).join('')}</div>`
          : empty('Bu günde kayıt yok.')}`;
    },

    gorevler() {
      let list = visibleTasks();
      if (isAdmin() && state.taskClub !== 'all') list = list.filter((t) => t.clubId === state.taskClub);
      const open = list.filter((t) => t.status === 'open').sort((a, b) => String(a.due || '9').localeCompare(String(b.due || '9')));
      const done = list.filter((t) => t.status === 'done').sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt)));
      const shown = state.taskTab === 'done' ? done : open;
      return `
        ${head('Görevler',
          isAdmin() ? 'Kulüplere görev ata, bitirdiklerinde bıraktıkları kanıtları gör.'
                    : 'UniPakt’ın kulübüne atadığı görevler. Bitirdiğinde kanıtını mesaj ya da dosya olarak bırak.',
          isAdmin() ? '<button class="btn" data-act="task-new">Görev ata</button>' : '')}
        <div class="toolbar">
          <button class="chip ${state.taskTab === 'open' ? 'active' : ''}" data-act="task-tab" data-id="open">Açık (${open.length})</button>
          <button class="chip ${state.taskTab === 'done' ? 'active' : ''}" data-act="task-tab" data-id="done">Biten (${done.length})</button>
          ${isAdmin() ? `<select id="taskClub" aria-label="Kulübe göre süz">
            <option value="all">Tüm kulüpler</option>

              <h3>${esc(e.title)}</h3>
