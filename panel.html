    },
    hesap() {
      if (DEMO) state.mfa.enabled = sessionStorage.getItem('unipaktDemoMfa') === '1';
      return `${head('Hesap', 'Giriş bilgilerini ve şifreni yönet.')}
        <section class="card">
          <h2>Hesap bilgileri</h2>
          <div class="account-summary"><strong>${esc(session?.email || 'E-posta bilgisi yüklenemedi')}</strong><br><small>${esc(isAdmin() ? 'UniPakt yöneticisi' : 'Kulüp hesabı')}</small></div>
          <h2>Şifre değiştir</h2>
          <form id="passwordForm" class="stack" style="margin-top:18px;max-width:520px">
            ${field('Mevcut şifre', '<input type="password" name="currentPassword" required autocomplete="current-password">')}
            ${field('Yeni şifre', '<input type="password" name="newPassword" required minlength="8" autocomplete="new-password">')}
            ${field('Yeni şifreyi tekrar yaz', '<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password">')}
            <button class="btn small" type="submit">Şifreyi değiştir</button>
            <p class="form-error" data-password-error hidden></p>
          </form>
        </section>
        <section class="card mfa-card" style="margin-top:16px">
          <div class="mfa-card-head"><h2>İki adımlı doğrulama</h2><span class="tag ${state.mfa.enabled ? 'ok' : ''}">${state.mfa.enabled ? 'Açık' : 'Kapalı'}</span></div>
          <p class="body">Açıkken panele yeni bir tarayıcıdan girişte e-posta adresine 6 haneli bir kod gönderilir. Doğruladığın tarayıcı 30 gün boyunca tekrar kod istemez.</p>
          <button class="btn small ${state.mfa.enabled ? 'ghost' : ''}" type="button" data-act="mfa-start" data-id="${state.mfa.enabled ? 'disable' : 'enable'}">${state.mfa.enabled ? 'Kapat' : 'Etkinleştir'}</button>
        </section>`;
    },
    dogrulama() {
      const purpose = state.mfa.flow?.purpose;
      if (purpose !== 'enable' && purpose !== 'disable') { setTimeout(() => go('hesap')); return ''; }
      const enabling = purpose === 'enable';
      return `${head(enabling ? 'Doğrulamayı aç' : 'Doğrulamayı kapat', 'İki adımlı doğrulama')}
        <section class="card" style="max-width:560px">
          <p class="mfa-lead" data-mfa-lead>${mfaLead()}</p>
          ${mfaCodeHtml(purpose)}
          <p class="mfa-note">${enabling ? 'Açtıktan sonra bu tarayıcı 30 gün boyunca kod istemez; yeni bir tarayıcıdan girişte kod e-postana gelir.' : 'Kapatınca kayıtlı tüm tarayıcılar da unutulur.'}</p>
          <button class="link-btn" type="button" data-go="hesap" style="margin-top:12px">Vazgeç</button>
        </section>`;
    },
    genel() {
      const events = upcomingEvents().slice(0, 3);
      const eventsBlock = `
        <div>
          <div class="section-head"><h2>Yaklaşan etkinlikler</h2><button class="link-btn" data-go="takvim">Takvim</button></div>
          ${events.length ? `<div class="card">${events.map((e) => `
            <div class="mini-row"><div><strong>${esc(e.title)}</strong><small>${fmtDay(e.date)}${e.time ? ` · ${esc(e.time)}` : ''} · ${esc(who(e.ownerId))}</small></div></div>`).join('')}</div>`
            : empty('Yaklaşan etkinlik yok.')}
        </div>`;

      if (isAdmin()) {
        const pend = [
          ...pendingAnnouncements().map((a) => ({ kind: 'Duyuru', title: a.title, by: who(a.authorId) })),
          ...pendingEvents().map((e) => ({ kind: kindLabel(e), title: e.title, by: who(e.ownerId) })),
          ...pendingCalendar().map((e) => ({ kind: 'Takvim talebi', title: e.title, by: who(e.ownerId) })),
          ...pendingComments().map((c) => ({ kind: 'Yorum', title: db.events.find((e) => e.id === c.eventId)?.title || 'Etkinlik', by: c.name })),
        ];
        const done = db.tasks.filter((t) => t.status === 'done').sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt))).slice(0, 3);
        return `
          ${head('Genel Bakış', 'Ağda bugün olan biten, tek ekranda.')}
          <div class="stats">
            <button class="stat ${pend.length ? 'hot' : ''}" data-go="onaylar"><b>${pend.length}</b><span>Bekleyen onay</span></button>
            <button class="stat" data-go="duyurular"><b>${publishedAnnouncements().length}</b><span>Yayındaki duyuru</span></button>
            <button class="stat" data-go="etkinlikler"><b>${upcomingEvents().length}</b><span>Yaklaşan etkinlik</span></button>
            <button class="stat" data-go="gorevler"><b>${db.tasks.filter((t) => t.status === 'open').length}</b><span>Açık görev</span></button>
          </div>
          <div class="grid-2" style="margin-top:34px">
            <div>
              <div class="section-head"><h2>Onay bekleyenler</h2><button class="link-btn" data-go="onaylar">Tümü</button></div>
              ${pend.length ? `<div class="card">${pend.slice(0, 5).map((p) => `
                <div class="mini-row"><div><strong>${esc(p.title)}</strong><small>${esc(p.kind)} · ${esc(p.by)}</small></div><span class="tag wait">Bekliyor</span></div>`).join('')}</div>`
                : empty('Bekleyen işlem yok.')}
            </div>
            ${eventsBlock}
            <div>
              <div class="section-head"><h2>Son biten görevler</h2><button class="link-btn" data-go="gorevler">Görevler</button></div>
              ${done.length ? `<div class="card">${done.map((t) => `
                <div class="mini-row"><div><strong>${esc(t.title)}</strong><small>${esc(who(t.clubId))} · ${fmtStamp(t.doneAt)}</small></div><span class="tag ok">Bitti</span></div>`).join('')}</div>`
                : empty('Henüz biten görev yok.')}
            </div>
            <div>
              <div class="section-head"><h2>Vanguard ilk üç</h2><button class="link-btn" data-go="vanguard">Sıralama</button></div>
              <div class="card">${ranking().slice(0, 3).map((c, i) => `
                <div class="mini-row"><div><strong>${i + 1}. ${esc(c.name)}</strong><small>${esc(c.uni)}</small></div><strong>${c.points}</strong></div>`).join('')}</div>
            </div>
          </div>`;
      }

      const me = club(state.user);
      const rank = ranking().findIndex((c) => c.id === state.user) + 1;
      const myOpen = visibleTasks().filter((t) => t.status === 'open');
      const myPending = db.announcements.filter((a) => a.authorId === state.user && a.status === 'pending').length
        + db.events.filter((e) => e.ownerId === state.user && e.status === 'pending').length
        + db.events.flatMap((e) => e.applications).filter((p) => p.clubId === state.user && p.status === 'pending').length;
      const latest = publishedAnnouncements().slice(0, 3);
      return `
        ${head('Genel Bakış', `${me.name} · ${me.uni}`)}
        <div class="stats">
          <button class="stat hot" data-go="vanguard"><b>${pts(state.user)}</b><span>Vanguard puanı · ${rank}. sıra</span></button>
          <button class="stat" data-go="gorevler"><b>${myOpen.length}</b><span>Açık görev</span></button>
          <button class="stat" data-go="basvuru"><b>${myPending}</b><span>Onay bekleyen başvurun</span></button>
          <button class="stat" data-go="etkinlikler"><b>${upcomingEvents().length}</b><span>Yaklaşan etkinlik</span></button>
        </div>
        <div class="grid-2" style="margin-top:34px">
          <div>
            <div class="section-head"><h2>Görevlerin</h2><button class="link-btn" data-go="gorevler">Tümü</button></div>
            ${myOpen.length ? `<div class="card">${myOpen.slice(0, 4).map((t) => `
              <div class="mini-row"><div><strong>${esc(t.title)}</strong><small>${t.due ? `Son tarih: ${fmtDay(t.due)}` : 'Son tarih yok'}</small></div>${t.due && t.due < today() ? '<span class="tag no">Gecikti</span>' : '<span class="tag wait">Açık</span>'}</div>`).join('')}</div>`
              : empty('Açık görevin yok.')}
          </div>
          ${eventsBlock}
          <div style="grid-column:1/-1">
            <div class="section-head"><h2>Son duyurular</h2><button class="link-btn" data-go="duyurular">Tümü</button></div>
            ${latest.length ? `<div class="card">${latest.map((a) => `
              <div class="mini-row"><div><strong>${esc(a.title)}</strong><small>${esc(who(a.authorId))} · ${fmtStamp(a.decidedAt || a.createdAt)}</small></div></div>`).join('')}</div>`
              : empty('Henüz duyuru yok.')}
          </div>
        </div>`;
    },

    'site-mesajlari'() {
      if (!isAdmin()) return empty('Bu bölüm yalnızca UniPakt yetkilisine açık.');
      const s = state.inbox;
      if (!s.data && !s.loading && !s.error) loadSiteInbox();
      const top = head('Site Mesajları',
        'Sitedeki İletişim ve Bize Katıl formlarından gelenler. Yalnızca UniPakt yetkilisi görür. İşi biten kaydı sil; kişisel veri gereğinden uzun tutulmamalı.',
        '<button class="btn ghost" data-act="inbox-refresh">Yenile</button>')
        + '<p class="muted" style="margin:-8px 0 18px">12 aydan eski mesajlar otomatik silinir.</p>';
      if (s.error) return `${top}<div class="support-info"><strong>Mesajlar yüklenemedi</strong><p>${esc(s.error.message || 'Sunucuya ulaşılamadı.')}</p></div>`;
      if (!s.data) return `${top}${empty('Yükleniyor…')}`;
      const isJoin = s.tab === 'join';
      const list = isJoin ? s.data.join : s.data.contact;
      const when = (iso) => new Date(iso).toLocaleString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const ago = (iso) => {
        const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
        if (!Number.isFinite(days)) return '';
        if (days <= 0) return 'bugün';
        if (days === 1) return 'dün';
        if (days < 30) return `${days} gün önce`;
        if (days < 365) return `${Math.floor(days / 30)} ay önce`;
        return `${Math.floor(days / 365)} yıl önce`;
      };
      const line = (label, v) => (v ? `<span><b>${esc(label)}:</b> ${esc(v)}</span>` : '');
      // The address goes into the link as one encoded value, so a crafted "email" cannot add cc/bcc/body.
      const mail = (v) => (EMAIL_RE.test(String(v || '')) ? `<a href="${esc(`mailto:${encodeURIComponent(v)}`)}">${esc(v)}</a>` : esc(v));
      const kvkk = (r) => (r.kvkk_version || r.kvkk_ack_at
        ? `<div class="meta"><span>KVKK metni: ${esc(r.kvkk_version ? `v${String(r.kvkk_version).replace(/^v/i, '')}` : '—')}${r.kvkk_ack_at ? ` · ${esc(when(r.kvkk_ack_at))}` : ''}</span></div>` : '');
      const card = (r) => `<article class="card item">
          <div class="meta top"><span class="tag wait">${isJoin ? 'Başvuru' : 'Mesaj'}</span><span>${esc(when(r.created_at))}</span><span>${esc(ago(r.created_at))}</span></div>
          <h3>${esc(r.name)}</h3>
          <div class="meta"><span>${mail(r.email)}</span>${isJoin ? line('Üniversite', r.university) + line('Şehir', r.city) + line('İstanbul dışı üniversite', r.outside_university) + line('Kulüp', r.club) : ''}</div>
          ${r.message ? `<p class="body" style="white-space:pre-wrap">${esc(r.message)}</p>` : ''}
          ${kvkk(r)}
          <div class="actions"><button class="btn danger small" data-act="inbox-delete" data-id="${esc(r.id)}" data-sub="${isJoin ? 'join' : 'contact'}">Sil</button></div>
        </article>`;
      return `${top}
        <div class="toolbar">
          <button class="chip ${!isJoin ? 'active' : ''}" data-act="inbox-tab" data-id="contact">İletişim (${s.data.contact.length})</button>
          <button class="chip ${isJoin ? 'active' : ''}" data-act="inbox-tab" data-id="join">Bize Katıl (${s.data.join.length})</button>
          ${list.length ? `<button class="btn danger small" data-act="inbox-delete-all" data-id="${isJoin ? 'join' : 'contact'}">Tümünü sil</button>` : ''}
        </div>
        <div class="stack">${list.length ? list.map(card).join('') : empty(isJoin ? 'Bize Katıl başvurusu yok.' : 'İletişim mesajı yok.')}</div>`;
    },

    'destek-taleplerim'() { return renderSupportTickets(); },

    bildirimler() {
      const list = [...(db.notifications || [])].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
      const row = (n) => { const app = notificationApplication(n); const pending = n.type === 'partnership_application' ? !!(app?.p.status === 'pending') : (n.actionable && !n.resolved); return `<article class="card item notification ${!n.readAt ? 'unread' : ''}"><div class="meta top"><span class="tag ${pending?'wait':'ok'}">${pending?'İşlem bekliyor':'Bilgi'}</span><span>${fmtStamp(n.createdAt)}</span></div><h3>${esc(n.title)}</h3><p class="body">${esc(n.body)}</p><div class="actions">${n.type === 'partnership_application' ? notificationAction(n) : (pending ? notificationAction(n) : '')}${!n.readAt ? `<button class="btn ghost small" data-act="notif-read" data-id="${esc(n.id)}">Okundu</button>` : ''}${!pending ? `<button class="btn ghost small" data-act="notif-delete" data-id="${esc(n.id)}">Sil</button>` : ''}</div></article>`; };
      return `${head('Bildirimler','Talepler, sonuçlar ve seninle ilgili önemli gelişmeler. Sonuçlandırılmamış talepler silinemez.')}${list.length ? `<div class="stack">${list.map(row).join('')}</div>` : empty('Henüz bildirimin yok.')}`;
    },

    etkinliklerim() {
      const mine = isAdmin() ? db.events.filter(e=>e.status==='published' && (e.ownerId===ADMIN || e.applications.some(p=>p.status==='approved'))) : db.events.filter(e=>e.status==='published' && (e.ownerId===state.user || e.applications.some(p=>p.status==='approved'&&p.clubId===state.user)));
      const card = (e) => { const partners=e.applications.filter(p=>p.status==='approved'); const host=e.ownerId; const related=!isAdmin()&&host!==state.user; const contact=(id)=>{const c=club(id); if(!c)return ''; return Object.entries(c.contact||{}).filter(([,v])=>v).map(([k,v])=>`<span class="contact-chip"><b>${esc(k)}:</b> ${esc(v)}</span>`).join(' · ')}; return `<article class="card item"><div class="meta top"><span class="tag ${related?'ok':'wait'}">${related?'Ortaksın':'Host'}</span><span>${fmtDay(e.date)}</span></div><h3>${esc(e.title)}</h3><p class="body">Organizatör: ${esc(organizerNames(e).join(', '))}</p><div class="meta"><span><strong>Host iletişim:</strong> ${host===ADMIN?esc('UniPakt'):(contact(host)||esc('İletişim bilgisi yok'))}</span></div><div class="section-head"><h3>Ortaklar</h3></div>${partners.length?`<div class="stack">${partners.map(p=>`<div class="mini-row"><div><strong>${esc(who(p.clubId))}</strong><small>${contact(p.clubId)||esc('İletişim bilgisi yok')}</small></div>${isAdmin()?`<button class="btn danger small" data-act="partner-remove" data-id="${esc(e.id)}" data-sub="${esc(p.clubId)}">Ayır</button>`:''}</div>`).join('')}</div>`:empty('Henüz onaylı ortak yok.')}<div class="actions">${ownsEventUi(e)&&!related?`<button class="btn small" data-act="reg-open" data-id="${esc(e.id)}">Kayıtlar</button>`:''}${isAdmin()&&host===ADMIN?`<button class="btn small" data-act="event-task" data-id="${esc(e.id)}">Bu etkinlik için görev ata</button>`:''}</div></article>`; };
      return `${head('Etkinliklerim','Host olduğun veya ortak olduğun etkinlikler ve ortakların iletişim bilgileri.')}${mine.length?`<div class="stack">${mine.map(card).join('')}</div>`:empty('Henüz etkinliğin yok.')}`;
    },

    duyurular() {
      const list = publishedAnnouncements();
      return `
        ${head('Duyurular',
          isAdmin() ? 'Senin yayınladıkların ve onay verdiğin kulüp duyuruları. Tüm kulüp başkanları görür.'
                    : 'UniPakt’ın yayınladığı ve onayladığı duyurular.',
          isAdmin() ? '<button class="btn" data-act="ann-new">Yeni duyuru</button>' : '<button class="btn ghost" data-go="basvuru">Duyuru başvurusu</button>')}
        <div class="stack">${list.length ? list.map((a) => announcementCard(a)).join('') : empty('Henüz yayında duyuru yok.')}</div>`;
    },

    etkinlikler() {
      const list = calendarEvents();
      const upcoming = list.filter((e) => e.date >= today());
      const past = list.filter((e) => e.date < today()).reverse();
      return `
        ${head('Etkinlikler',
          isAdmin() ? 'Takvimdeki etkinlikler. “Yeni etkinlik” doğrudan takvime düşer; “Yeni ortak etkinlik” Ortak Arama sayfasına düşer.'
                    : 'Takvimdeki etkinlikler. Kendi etkinliğini ekle; UniPakt onaylayınca takvime düşer.',
          isAdmin() ? '<div class="head-actions"><button class="btn" data-act="event-new" data-id="event">Yeni etkinlik</button><button class="btn ghost" data-act="event-new" data-id="partner">Yeni ortak etkinlik</button></div>'
                    : '<button class="btn" data-act="event-new" data-id="event">Yeni etkinlik</button>')}
        <div class="stack">${upcoming.length ? upcoming.map((e) => eventCard(e)).join('') : empty('Yaklaşan etkinlik yok.')}</div>
        ${past.length ? `<div class="section-head"><h2>Geçmiş etkinlikler</h2></div><div class="stack">${past.map((e) => eventCard(e)).join('')}</div>` : ''}`;
    },

    ortak() {
      const list = partnerEvents();
      const upcoming = list.filter((e) => e.date >= today());
      const past = list.filter((e) => e.date < today()).reverse();
      return `
        ${head('Ortak Arama',
          isAdmin() ? 'Ortak arayan etkinlikler. Ortaklık başvurularını onayla; bir etkinliği “Yayına al” ile takvime gönder.'
                    : 'Ortak arayan etkinlikler. Birine ortak olmak için başvur. Kendi etkinliğini takvime almak için yayına alma talebi gönder.',
          `<button class="btn" data-act="event-new" data-id="partner">${isAdmin() ? 'Yeni ortak etkinlik' : 'Ortak arıyorum'}</button>`)}
        <div class="stack">${upcoming.length ? upcoming.map((e) => eventCard(e, 'ortak')).join('') : empty('Şu an ortak arayan etkinlik yok.')}</div>
        ${past.length ? `<div class="section-head"><h2>Geçmiş</h2></div><div class="stack">${past.map((e) => eventCard(e, 'ortak')).join('')}</div>` : ''}`;
    },

    takvim() {
      const { y, m, sel } = state.cal;
      const first = new Date(y, m, 1);
      const offset = (first.getDay() + 6) % 7;            // Monday first
      const days = new Date(y, m + 1, 0).getDate();
      const cells = Math.ceil((offset + days) / 7) * 7;
      const items = {};
      const add = (date, entry) => { (items[date] = items[date] || []).push(entry); };
      calendarEvents().forEach((e) => add(e.date, { type: 'event', title: e.title, sub: `${e.time ? `${e.time} · ` : ''}${e.place || ''}`, by: who(e.ownerId) }));
      visibleTasks().filter((t) => t.status === 'open' && t.due).forEach((t) => add(t.due, { type: 'task', title: t.title, sub: 'Görev son tarihi', by: who(t.clubId) }));
      const t = today();
      let grid = DOW.map((d) => `<div class="cal-dow">${d}</div>`).join('');
      for (let i = 0; i < cells; i++) {
        const d = new Date(y, m, i - offset + 1);
        const key = ymd(d);
        const list = items[key] || [];
        const cls = ['cal-day', d.getMonth() !== m ? 'out' : '', key === t ? 'today' : '', key === sel ? 'selected' : '', i >= cells - 7 ? 'last-row' : ''].filter(Boolean).join(' ');
        grid += `<button class="${cls}" data-act="cal-pick" data-id="${key}" aria-label="${fmtDay(key)}${list.length ? `, ${list.length} kayıt` : ''}">
          <span class="num">${d.getDate()}</span>
          <span class="chips">${list.slice(0, 3).map((x) => `<span class="cal-chip ${x.type === 'task' ? 'task' : ''}">${esc(x.title)}</span>`).join('')}</span>
        </button>`;
      }
      const selected = items[sel] || [];
      return `
        ${head('Takvim', 'Takvime alınan etkinlikler ve görev son tarihleri. Buradaki etkinlikler unipakt.com’daki takvimde de görünür.')}
        <div class="cal-head">
          <h2>${MONTHS[m]} ${y}</h2>
          <div class="row">
            <button class="btn ghost small" data-act="cal-move" data-id="-1" aria-label="Önceki ay">‹ Önceki</button>
            <button class="btn ghost small" data-act="cal-today">Bugün</button>
            <button class="btn ghost small" data-act="cal-move" data-id="1" aria-label="Sonraki ay">Sonraki ›</button>
          </div>
        </div>
        <div class="cal-grid">${grid}</div>
        <div class="cal-legend"><span><i></i>Etkinlik</span><span><i class="task"></i>Görev son tarihi</span></div>
        <div class="section-head"><h2>${fmtDay(sel)}</h2></div>
        ${selected.length ? `<div class="card">${selected.map((x) => `
          <div class="mini-row"><div><strong>${esc(x.title)}</strong><small>${esc([x.sub, x.by].filter(Boolean).join(' · '))}</small></div><span class="tag ${x.type === 'task' ? '' : 'wait'}">${x.type === 'task' ? 'Görev' : 'Etkinlik'}</span></div>`).join('')}</div>`
          : empty('Bu günde kayıt yok.')}`;
    },

    gorevler() {
      let list = visibleTasks();
      if (isAdmin() && state.taskClub !== 'all') list = list.filter((t) => t.clubId === state.taskClub);
      const open = list.filter((t) => t.status === 'open').sort((a, b) => String(a.due || '9').localeCompare(String(b.due || '9')));
      const done = list.filter((t) => t.status === 'done').sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt)));
      const shown = state.taskTab === 'done' ? done : open;
      return `
        ${head('Görevler',
          isAdmin() ? 'Kulüplere görev ata, bitirdiklerinde bıraktıkları kanıtları gör.'
                    : 'UniPakt’ın kulübüne atadığı görevler. Bitirdiğinde kanıtını mesaj ya da dosya olarak bırak.',
          isAdmin() ? '<button class="btn" data-act="task-new">Görev ata</button>' : '')}
        <div class="toolbar">
          <button class="chip ${state.taskTab === 'open' ? 'active' : ''}" data-act="task-tab" data-id="open">Açık (${open.length})</button>
          <button class="chip ${state.taskTab === 'done' ? 'active' : ''}" data-act="task-tab" data-id="done">Biten (${done.length})</button>
          ${isAdmin() ? `<select id="taskClub" aria-label="Kulübe göre süz">
            <option value="all">Tüm kulüpler</option>
            ${[...db.clubs].sort(byLabel).map((c) => `<option value="${esc(c.id)}" ${state.taskClub === c.id ? 'selected' : ''}>${esc(clubLabel(c))}</option>`).join('')}
          </select>` : ''}
        </div>
        <div class="stack">${shown.length ? shown.map(taskCard).join('') : empty(state.taskTab === 'done' ? 'Biten görev yok.' : 'Açık görev yok.')}</div>`;
    },

    onaylar() {
      const anns = pendingAnnouncements();
      const evs = pendingEvents();
      const apps = pendingApplications();
      const cals = pendingCalendar();
      const buttons = (kind, id, sub = '') => `
        <div class="actions">
          <button class="btn small" data-act="${kind}-approve" data-id="${esc(id)}" ${sub ? `data-sub="${esc(sub)}"` : ''}>Onayla</button>
          <button class="btn ghost small" data-act="${kind}-reject" data-id="${esc(id)}" ${sub ? `data-sub="${esc(sub)}"` : ''}>Reddet</button>
        </div>`;
      return `
        ${head('Onaylamalar', 'Kulüplerin panelde yayınlanmak üzere gönderdiği, onayını bekleyen işlemler.')}
        <div class="section-head"><h2>Duyuru istekleri (${anns.length})</h2></div>
        <div class="stack">${anns.length ? anns.map((a) => `
          <article class="card item">
            <div class="meta top"><span class="tag wait">Duyuru</span><span>${esc(who(a.authorId))} · ${fmtStamp(a.createdAt)}</span></div>
            <h3>${esc(a.title)}</h3><p class="body">${esc(a.body)}</p>
            ${buttons('ann', a.id)}
          </article>`).join('') : empty('Bekleyen duyuru isteği yok.')}</div>

        <div class="section-head"><h2>Etkinlik istekleri (${evs.length})</h2></div>
        <div class="stack">${evs.length ? evs.map((e) => `
          <article class="card item event">
            ${dateBlock(e.date)}
            <div>
              <div class="meta top"><span class="tag wait">${kindLabel(e)}</span><span>${esc(who(e.ownerId))} · ${fmtStamp(e.createdAt)}</span></div>
              <h3>${esc(e.title)}</h3>
              ${e.poster ? `<div class="approval-poster"><img src="${esc(e.poster)}" alt="Etkinlik afişi" loading="lazy" referrerpolicy="no-referrer"></div>` : ''}
              <p class="body">${esc(e.desc)}</p>
              ${e.address ? `<div class="quote"><small>Açık adres</small>${esc(e.address)}</div>` : ''}
              ${e.rules ? `<div class="quote"><small>Bilgiler / kurallar</small>${esc(e.rules)}</div>` : ''}
              ${e.registration ? `<div class="quote"><small>Kayıt bağlantısı</small>${esc(e.registration)}${badLink(e.registration) ? ' — <strong>geçersiz, sitede gösterilmez</strong>' : ''}</div>` : ''}
              ${e.tags?.length ? `<div class="meta">${e.tags.map(t => `<span class="tag">#${esc(String(t).replace(/^#/,''))}</span>`).join('')}</div>` : ''}
              ${e.kind === 'partner' && e.seeking ? `<div class="quote"><small>Aranan ortak</small>${esc(e.seeking)}</div>` : ''}
              <div class="meta"><span>${fmtDay(e.date)}${e.time ? ` · ${esc(e.time)}` : ''}</span>${e.place ? `<span>${esc(e.place)}</span>` : ''}
                <span>${e.kind === 'event' ? 'Onaylarsan takvime düşer' : 'Onaylarsan Ortak Arama’ya düşer'}</span></div>
              ${buttons('event', e.id)}
            </div>
          </article>`).join('') : empty('Bekleyen etkinlik isteği yok.')}</div>

        <div class="section-head"><h2>Etkinlik düzenleme talepleri (${pendingEventEdits().length})</h2></div>
        <div class="stack">${pendingEventEdits().length ? pendingEventEdits().map((q) => { const e=db.events.find(x=>x.id===q.eventId); const c=q.changes||{}; return `<article class="card item"><div class="meta top"><span class="tag wait">Düzenleme</span><span>${esc(who(q.clubId))} · ${fmtStamp(q.createdAt)}</span></div><h3>${esc(e?.title || c.title || 'Etkinlik')}</h3>${eventEditDiff(e, c)}<div class="actions"><button class="btn small" data-act="event-edit-approve" data-id="${esc(q.id)}">Onayla</button><button class="btn ghost small" data-act="event-edit-reject" data-id="${esc(q.id)}">Reddet</button></div></article>`; }).join('') : empty('Bekleyen etkinlik düzenleme isteği yok.')}</div>

        <div class="section-head"><h2>Yorumlar (${pendingComments().length})</h2></div>
        <div class="stack">${pendingComments().length ? pendingComments().map((c) => { const e = db.events.find((x) => x.id === c.eventId); return `
          <article class="card item">
            <div class="meta top"><span class="tag wait">Yorum</span><span>${esc(e?.title || 'Etkinlik')} · ${fmtStamp(c.createdAt)}</span></div>
            <h3>${esc(c.name)}</h3>
            ${c.email ? `<div class="meta"><span>${esc(c.email)}</span></div>` : ''}
            <div class="quote comment-body">${esc(c.body)}</div>
            <div class="meta"><span>Onaylarsan etkinlik sayfasında ad ve yorum görünür; e-posta asla gösterilmez. Reddedersen yorum silinir.</span></div>
            <div class="actions"><button class="btn small" data-act="comment-approve" data-id="${esc(c.id)}">Onayla</button><button class="btn ghost small" data-act="comment-reject" data-id="${esc(c.id)}">Reddet</button></div>
          </article>`; }).join('') : empty('Bekleyen yorum yok.')}</div>

        <div class="section-head"><h2>Takvime alma talepleri (${cals.length})</h2></div>
        <div class="stack">${cals.length ? cals.map((e) => `
          <article class="card item event">
            ${dateBlock(e.date)}
            <div>
              <div class="meta top"><span class="tag wait">Takvim talebi</span><span>${esc(who(e.ownerId))}</span></div>
              <h3>${esc(e.title)}</h3>
              ${e.poster ? `<div class="approval-poster"><img src="${esc(e.poster)}" alt="Etkinlik afişi" loading="lazy" referrerpolicy="no-referrer"></div>` : ''}
              <p class="body">${esc(e.desc)}</p>
              <div class="meta"><span>${fmtDay(e.date)}${e.time ? ` · ${esc(e.time)}` : ''}</span>${e.place ? `<span>${esc(e.place)}</span>` : ''}<span>Onaylarsan takvime düşer</span></div>
              ${buttons('pub', e.id)}
            </div>
          </article>`).join('') : empty('Bekleyen takvim talebi yok.')}</div>

        <div class="section-head"><h2>Etkinlik görünürlük talepleri (${pendingVisibility().length})</h2></div>
        <div class="stack">${pendingVisibility().length ? pendingVisibility().map((r) => { const e = db.events.find((x) => x.id === r.eventId); return e ? `
          <article class="card item event">
            ${dateBlock(e.date)}
            <div>
              <div class="meta top"><span class="tag wait">Görünürlük talebi</span><span>${esc(who(r.clubId))} · ${fmtStamp(r.createdAt)}</span></div>
              <h3>${esc(e.title)}</h3>
              <p class="body">Kulüp etkinliğin sitede <strong>${r.desiredVisible ? 'görünür' : 'gizli'}</strong> olmasını istiyor.</p>
              ${e.poster ? `<img src="${esc(e.poster)}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:12px;border:1px solid var(--border)">` : ''}
              ${r.note ? `<div class="quote"><small>Kulüp notu</small>${esc(r.note)}</div>` : ''}
              <div class="actions"><button class="btn small" data-act="event-vis-approve" data-id="${esc(r.id)}">Onayla</button><button class="btn ghost small" data-act="event-vis-reject" data-id="${esc(r.id)}">Reddet</button></div>
            </div>
          </article>` : '' }).join('') : empty('Bekleyen görünürlük talebi yok.')}</div>

      `;
    },

    vanguard() {
      const list = ranking();
      const max = Math.max(1, ...list.map((c) => c.points));
      const newest = (a, b) => String(b.at).localeCompare(String(a.at));
      const logRows = (log, withClub) => log.map((l) => {
        const rawNote = l.note || '';
        const marker = ' · Açıklama: ';
        let generatedDetail = rawNote;
        let userNote = '';
        const markerIndex = rawNote.indexOf(marker);
        if (markerIndex >= 0) {
          generatedDetail = rawNote.slice(0, markerIndex);
          userNote = rawNote.slice(markerIndex + marker.length);
        } else {
          // Eski kayıtlar için: hesaplama metninin sonundaki serbest açıklamayı ayır.
          const legacyMatch = rawNote.match(/^(.* · Yuvarlanan: [^ ·]+)(?: · (.+))$/);
          if (legacyMatch) {
            generatedDetail = legacyMatch[1];
            userNote = legacyMatch[2];
          }
        }
        const eventId = l.eventId || '';
        const pointId = l.id || '';
        const meta = [withClub ? (l.label || OTHER) : '', fmtStamp(l.at)].filter(Boolean).join(' · ');
        const hasDetails = !!(generatedDetail || userNote || eventId || (withClub && pointId));
        return `
        <div class="mini-row" data-point-row data-point-id="${esc(pointId)}">
          <div style="min-width:0">
            <strong>${esc(withClub ? who(l.clubId) : l.label || OTHER)}</strong>
            <small>${esc(meta)}</small>
            <div data-point-detail hidden style="margin-top:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2,#111);line-height:1.55">
              ${withClub && pointId ? `<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)"><small style="display:block;opacity:.65">Puan ID</small><span style="word-break:break-all">${esc(pointId)}</span></div>` : ''}
              ${eventId ? `<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)"><small style="display:block;opacity:.65">Etkinlik ID</small><span style="word-break:break-all">${esc(eventId)}</span></div>` : ''}
              ${generatedDetail ? `<div style="${userNote ? 'margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);' : ''}"><small style="display:block;opacity:.65;margin-bottom:4px">Puan değerlendirmesi</small><span style="white-space:normal">${esc(generatedDetail)}</span></div>` : ''}
              ${userNote ? `<div><small style="display:block;opacity:.65;margin-bottom:4px">Açıklama</small><span style="white-space:normal">${esc(userNote)}</span></div>` : ''}
            </div>
          </div>
          <div class="actions" style="align-items:center;gap:8px">
            ${hasDetails ? `<button class="btn ghost small" type="button" data-act="point-details" data-id="${esc(pointId)}">Detaylar</button>` : ''}
            <span class="delta ${l.delta >= 0 ? 'up' : 'down'}">${signed(l.delta)}</span>
          </div>
        </div>`;
      }).join('');
      const board = `
        <div class="card" style="padding:0;overflow:hidden">
          ${list.map((c, i) => `
            <div class="rank-row ${c.id === state.user ? 'mine' : ''}">
              <span class="pos">${i + 1}</span>
              <div><strong>${esc(c.name)}</strong><small>${esc(c.uni)}</small><div class="bar"><i style="width:${Math.max(0, Math.round(c.points / max * 100))}%"></i></div></div>
              <div class="pts"><b>${c.points}</b>
                ${isAdmin() ? `<button class="btn ghost small" data-act="pts-new" data-id="${esc(c.id)}">Puan ver</button>` : ''}</div>
            </div>`).join('')}
        </div>`;

      if (isAdmin()) {
        const log = [...db.pointLog].sort(newest).slice(0, 12);
        return `
          ${head('UniPakt.Vanguard', 'Kulüp seç, etkinliği seç, artı ya da eksi puanı gönder. Kulüp, puanın hangi etkinlikten geldiğini kendi panelinde görür.',
            '<button class="btn" data-act="pts-new">Puan gönder</button>')}
          ${board}
          <div class="section-head"><h2>Son puan hareketleri</h2></div>
          ${log.length ? `<div class="card">${logRows(log, true)}</div>` : empty('Henüz puan hareketi yok.')}`;
      }

      const mine = db.pointLog.filter((l) => l.clubId === state.user);
      const sources = [];
      [...mine].sort((a, b) => String(a.at).localeCompare(String(b.at))).forEach((l) => {
        const label = l.label || OTHER;
        let row = sources.find((x) => x.label === label);
        if (!row) sources.push(row = { label, total: 0 });
        row.total += l.delta;
      });
      const top = Math.max(1, ...sources.map((x) => Math.abs(x.total)));
      const rank = list.findIndex((c) => c.id === state.user) + 1;
      return `
        ${head('UniPakt.Vanguard', 'Kazandığın puanlar ve hangi etkinliklerden geldikleri.')}
        <div class="stats two">
          <div class="stat hot"><b>${pts(state.user)}</b><span>Toplam puan</span></div>
          <div class="stat"><b>${rank}.</b><span>${list.length} kulüp arasında sıran</span></div>
        </div>
        <div class="section-head"><h2>Puanların nereden geldi</h2></div>
        ${sources.length ? `<div class="card chart" role="img" aria-label="Etkinliklere göre puan dağılımı">${sources.map((x) => `
          <div class="chart-row">
            <span class="chart-label">${esc(x.label)}</span>
            <span class="chart-track"><i class="${x.total < 0 ? 'down' : ''}" style="width:${Math.max(2, Math.round(Math.abs(x.total) / top * 100))}%"></i></span>
            <span class="delta ${x.total >= 0 ? 'up' : 'down'}">${signed(x.total)}</span>
          </div>`).join('')}</div>` : empty('Henüz puan kazanmadın.')}
        <div class="section-head"><h2>Puan hareketlerin</h2></div>
        ${mine.length ? `<div class="card">${logRows([...mine].sort(newest), false)}</div>` : empty('Henüz puan hareketi yok.')}
        <div class="section-head"><h2>Ağ sıralaması</h2></div>
        ${board}`;
    },

    kulupler() {
      if (state.accounts === null) {
        state.accounts = 'loading';
        api.accounts().then((map) => { state.accounts = map; }, () => { state.accounts = 'unavailable'; })
          .then(() => { if (state.view === 'kulupler' && state.user && !busy()) render(); });
      }
      const accountLine = (c) => {
        if (state.accounts === 'loading') return 'Giriş hesabı: yükleniyor…';
        if (state.accounts === 'unavailable') return 'Giriş hesabı: bilgi alınamadı';
        const email = state.accounts[c.id];
        return email ? `Giriş hesabı: ${esc(email)}` : '<span class="tag no">Giriş hesabı yok</span>';
      };
      const when = (iso) => new Date(iso).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
      const kvkkLine = (c) => c.kvkkConsentAt
        ? `<span class="tag ok">KVKK: Onay alındı (${esc(when(c.kvkkConsentAt))})</span>`
        : c.kvkkNoticeSentAt
          ? `<span class="tag wait">KVKK: Onay maili gitti (${esc(when(c.kvkkNoticeSentAt))})</span>`
          : '<span class="tag no">KVKK: Onay maili gitmedi</span>';
      const list = [...db.clubs].sort((a, b) => a.name.localeCompare(b.name, 'tr'));
      return `
        ${head('Kulüpler', 'Buradaki kulüpler unipakt.com’daki Ortak Kulüpler sayfasında görünür. İletişim bilgilerini değiştirdiğinde sitede de değişir.',
          '<button class="btn" data-act="club-new">Kulüp ekle</button>')}
        <div class="support-info" style="margin-bottom:18px"><strong>KVKK onayı</strong><p>Kulübün iletişim bilgileri sitede ancak KVKK onayı kaydedildikten sonra görünür. Kulüp sitede görünür ve e-postası kayıtlıysa onay maili kendiliğinden bir kez gider; kulüp onay verdiğinde “Onay alındı” ile kaydet. E-posta değişirse onay sıfırlanır ve yeni adrese yeniden mail gider.</p></div>
        <div class="stack">${list.length ? list.map((c) => {
          const filled = CONTACT_KEYS.filter(([k]) => c.contact && c.contact[k]);
          return `
          <article class="card item">
            <div class="meta top">${c.category ? `<span class="tag">${esc(c.category)}</span>` : '<span class="tag wait">Kategori yok</span>'}<span>${esc(c.uni)}</span></div>
            <h3>${esc(c.name)}</h3>
            <div class="meta">${filled.length ? filled.map(([k, label]) => {
              const link = contactLink(k, c.contact[k]);
              return link ? `<span>${label}: <a href="${esc(link.href)}" ${k === 'email' ? '' : 'target="_blank" rel="noopener noreferrer"'}>${esc(link.text)}</a></span>`
                : `<span class="bad">${label}: ${esc(c.contact[k])} (geçersiz, sitede görünmez)</span>`;
            }).join('') : '<span>İletişim bilgisi eklenmemiş</span>'}</div>
            <div class="meta"><span>${accountLine(c)}</span></div>
            <div class="meta">${kvkkLine(c)}</div>
            <div class="actions">
              <button class="club-visibility ${c.visible === false ? 'is-hidden' : ''}" data-act="club-visibility" data-id="${esc(c.id)}" aria-label="${c.visible === false ? 'Kulübü sitede görünür yap' : 'Kulübü sitede gizle'}" title="${c.visible === false ? 'Sitede görünür yap' : 'Sitede gizle'}">
                ${c.visible === false
                  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 4.3A11.8 11.8 0 0 1 12 4c5.5 0 9.5 5.7 9.5 8s-1.4 3.4-3.3 4.9"/><path d="M6.1 6.1C3.9 7.7 2.5 10.3 2.5 12c0 2.3 4 8 9.5 8 1 0 2-.2 2.9-.6"/></svg>'
                  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"/><circle cx="12" cy="12" r="2.5"/></svg>'}
              </button>
              <button class="btn ghost small" data-act="club-edit" data-id="${esc(c.id)}">Düzenle</button>
              ${c.kvkkConsentAt
                ? `<button class="btn ghost small" data-act="club-consent-withdraw" data-id="${esc(c.id)}">KVKK onayını geri çek</button>`
                : `<button class="btn small" data-act="club-consent" data-id="${esc(c.id)}">KVKK onayı alındı</button>`}
              <button class="btn danger small" data-act="club-remove" data-id="${esc(c.id)}">Sil</button>
            </div>
          </article>`; }).join('') : empty('Henüz kulüp yok.')}</div>`;
    },

    basvuru() {
      const anns = db.announcements.filter((a) => a.authorId === state.user).sort(byNewest);
      const evs = db.events.filter((e) => e.ownerId === state.user).sort(byNewest);
      const apps = db.events.flatMap((e) => e.applications.filter((p) => p.clubId === state.user).map((p) => ({ event: e, app: p })))
        .sort((a, b) => byNewest(a.app, b.app));
      return `
        ${head('Duyuru ve Etkinlik Başvurusu', 'Gönderdiklerin UniPakt’ın Onaylamalar sekmesine düşer. Onaylanınca tüm kulüp başkanları görür.')}
        <div class="grid-3">
          <div class="card item"><h3>Duyuru gönder</h3><p class="body">Diğer kulüplerin görmesini istediğin duyuruyu yaz.</p>
            <div class="actions"><button class="btn" data-act="ann-new">Duyuru başvurusu</button></div></div>
          <div class="card item"><h3>Etkinlik ekle</h3><p class="body">Ortak aramadan, etkinliğini doğrudan takvime göndermek için.</p>
            <div class="actions"><button class="btn" data-act="event-new" data-id="event">Etkinlik başvurusu</button></div></div>
          <div class="card item"><h3>Etkinliğine ortak ara</h3><p class="body">Etkinliğin detaylarını ve nasıl bir ortak aradığını yaz.</p>
            <div class="actions"><button class="btn" data-act="event-new" data-id="partner">Ortak arama başvurusu</button></div></div>
        </div>
        <div class="section-head"><h2>Duyuru başvuruların</h2></div>
        <div class="stack">${anns.length ? anns.map((a) => announcementCard(a, { mine: true })).join('') : empty('Henüz duyuru başvurun yok.')}</div>
        <div class="section-head"><h2>Etkinlik başvuruların</h2></div>
        <div class="stack">${evs.length ? evs.map((e) => eventCard(e, 'mine')).join('') : empty('Henüz etkinlik başvurun yok.')}</div>
        <div class="section-head"><h2>Ortaklık başvuruların</h2></div>
        ${apps.length ? `<div class="card">${apps.map(({ event, app }) => `
          <div class="mini-row"><div><strong>${esc(event.title)}</strong><small>${fmtDay(event.date)} · ${esc(who(event.ownerId))}</small></div><div class="actions">${tag(app.status)}${app.status === 'rejected' ? `<button class="btn danger small" data-act="rejected-app-delete" data-id="${esc(app.id)}" data-sub="${esc(event.id)}">Sil</button>` : ''}</div></div>`).join('')}</div>`
          : empty('Henüz bir etkinliğe ortaklık başvurun yok.')}`;
    },
  };

  /* ------------------------------------------------------------------
     ACTIONS
     ------------------------------------------------------------------ */
  const rejectWithNote = (title, apply) => openForm({
    title, lead: 'İstersen kulübe kısa bir not bırak.',
    fields: field('Not (isteğe bağlı)', '<textarea name="note" maxlength="400"></textarea>'),

    onSubmit: async (fd) => { await apply(val(fd, 'note')); toast('Reddedildi.'); },

  const confirmRemove = (title, lead, apply, submit = 'Kaldır') => openForm({
    title, lead, submit, danger: true,
    onSubmit: async () => { await apply(); toast(/sil$/i.test(submit) ? 'Silindi.' : 'Kaldırıldı.'); },
  });
  const chatNoticeStorageKey = () => `unipaktChatNoticeAccepted.v1.${session?.user_id || state.user || 'unknown'}`;
  const hasAcceptedChatNotice = () => {
    if (state.chat.noticeAccepted) return true;
    try { state.chat.noticeAccepted = localStorage.getItem(chatNoticeStorageKey()) === '1'; }
    catch (_) { state.chat.noticeAccepted = false; }
    return state.chat.noticeAccepted;
  };
  const imNoticeHtml = () => `<div class="im-placeholder im-notice"><form class="im-notice-card" id="imNoticeForm">
      <p class="kicker">Beta</p>
      <h3 class="title-xl">${esc(IM_TITLE)} hakkında</h3>
      <p>UniPakt Instant Messages beta sürümüdür. Kişisel ve özel bilgilerinizi paylaşmayın.</p>
      <p>Mesajların Oracle sunucularında uçtan uca şifrelenerek aktarılması planlanmaktadır. Sunucu ve şifreleme altyapısı devreye alınıp doğrulanana kadar bu güvenlik özelliği kullanıma açık değildir.</p>
      <p>UniPakt Instant Messages ürününün tüm bölümleri değişime tabi olabilir. Sistem tamamen kaldırılabilir, gizlenebilir veya kullanımı kısıtlanabilir. Mesajlarınızın bir bölümü veya tamamı silinebilir, kaybolabilir veya anonim hale gelebilir.</p>
      <p>Destek bildirimleriniz için UniPakt Destek sekmesini kullanın. UniPakt olarak kişisel sohbetlerinizde WhatsApp, Telegram ya da SMS sağlayıcısı gibi farklı yazılımlar kullanmanızı tavsiye ediyoruz.</p>
      <label class="chat-beta-consent"><input type="checkbox" name="chatNoticeAccepted" required><span>Bilgilendirmeyi okudum ve sohbeti açmayı kabul ediyorum.</span></label>
      <div><button class="btn" type="submit">Kabul et ve sohbeti aç</button></div>
    </form></div>`;

  /* ------------------------------------------------------------------
     KAYIT TOPLAMA — form builder (new event), registrations board
     (Etkinliklerim → Kayıtlar) and door staff (Görevliler).
     Visitors register on the public event page; staff check entries on
     /kontrol.html with a link + access code e-mailed from here.
     ------------------------------------------------------------------ */
  const REG_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const REG_TYPES = [['text', 'Kısa yanıt'], ['choice', 'Çoktan seçmeli']];
  const newQid = () => `q${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const freshRegDraft = () => ({ enabled: false, deadline: '', questions: [] });
  // <input type="datetime-local"> works in local wall time; the panel is Istanbul (UTC+03:00).
  const toLocalInput = (iso) => (iso ? new Date(new Date(iso).getTime() + 3 * 3600000).toISOString().slice(0, 16) : '');
  const fromLocalInput = (v) => (v ? new Date(`${v}:00+03:00`).toISOString() : null);
  const fmtRegTime = (iso) => (iso ? new Date(iso).toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '');
  const answerText = (v) => (Array.isArray(v) ? v.join(', ') : (v ?? ''));
  const regDraft = () => (state.view === 'kayitlar' ? state.regBoard.edit : (evForm.reg ||= freshRegDraft()));
  const ownsEventUi = (e) => !!e && (isAdmin() || e.ownerId === state.user);

  const regBuilderHtml = (d) => {
    if (!d) return '';
    const qs = d.questions.map((q, i) => `
      <div class="regb-q" data-qi="${i}">
        <button type="button" class="regb-handle" data-regb-drag aria-label="${i + 1}. soruyu sürükleyerek taşı" title="Sürükleyerek taşı"><svg viewBox="0 0 10 16" aria-hidden="true"><circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg></button>
        <div class="regb-row">
          <select data-regb="type" data-i="${i}" aria-label="Soru türü">${REG_TYPES.map(([v, l]) => `<option value="${v}" ${q.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <input data-regb="label" data-i="${i}" maxlength="200" placeholder="Soru (örn. Bölümün)" value="${esc(q.label)}" aria-label="Soru metni">
        </div>
        ${q.type === 'choice' ? `<div class="regb-mode" role="radiogroup" aria-label="Cevap sayısı">
          <label><input type="radio" name="regb-mode-${i}" data-regb="multi" data-i="${i}" value="0" ${q.multiple ? '' : 'checked'}><span>Tek cevap</span></label>
          <label><input type="radio" name="regb-mode-${i}" data-regb="multi" data-i="${i}" value="1" ${q.multiple ? 'checked' : ''}><span>Çok cevap</span></label>
        </div>` : ''}
        ${q.type === 'choice' ? `<div class="regb-opts">${q.options.map((o, j) => `
          <div class="regb-opt"><span class="regb-dot ${q.multiple ? 'sq' : ''}" aria-hidden="true"></span><input data-regb="opt" data-i="${i}" data-j="${j}" maxlength="100" placeholder="Seçenek ${j + 1}" value="${esc(o)}" aria-label="Seçenek ${j + 1}">
            <button type="button" class="icon-btn" data-act="regb-opt-del" data-id="${i}" data-sub="${j}" aria-label="Seçeneği sil" ${q.options.length <= 2 ? 'disabled' : ''}>×</button></div>`).join('')}
          ${q.options.length < 20 ? `<button type="button" class="link-btn" data-act="regb-opt-add" data-id="${i}">+ Seçenek ekle</button>` : ''}</div>` : ''}
        <div class="regb-tools">
          <label class="regb-req"><input type="checkbox" data-regb="req" data-i="${i}" ${q.required ? 'checked' : ''}> Zorunlu</label>
          <span class="spacer"></span>
          <button type="button" class="icon-btn" data-act="regb-move" data-id="${i}" data-sub="-1" ${i === 0 ? 'disabled' : ''} aria-label="Yukarı taşı">↑</button>
          <button type="button" class="icon-btn" data-act="regb-move" data-id="${i}" data-sub="1" ${i === d.questions.length - 1 ? 'disabled' : ''} aria-label="Aşağı taşı">↓</button>
          <button type="button" class="btn danger small" data-act="regb-del" data-id="${i}">Sil</button>
        </div>
      </div>`).join('');
    return `
      <label class="evp-check"><input type="checkbox" data-regb="enabled" ${d.enabled ? 'checked' : ''}><span>UniPakt üzerinden kayıt topla<small>Etkinlik sayfasında “Kayıt ol” düğmesi çıkar. Kayıt olan kişiye QR ve 6 karakterli giriş kodu gösterilir.</small></span></label>
      ${d.enabled ? `
        ${evField('Son kayıt zamanı', `<input type="datetime-local" data-regb="deadline" value="${esc(d.deadline)}">`, { opt: true, hint: 'Boş bırakırsan kayıtlar etkinlik bitene kadar açık kalır. Kontenjan girdiysen kontenjan dolunca da kapanır.' })}
        <div class="regb-fixed" aria-label="Her formda bulunan sabit sorular">
          <div class="regb-fixed-head"><strong>Sabit sorular</strong><small>Her kayıt formunda bulunur, kaldırılamaz.</small></div>
          <div class="regb-fixed-row"><span class="regb-lock" aria-hidden="true">${REG_LOCK}</span><span>Ad soyad</span><em>Kısa yanıt · zorunlu</em></div>
          <div class="regb-fixed-row"><span class="regb-lock" aria-hidden="true">${REG_LOCK}</span><span>E-posta</span><em>E-posta · zorunlu</em></div>
          <div class="regb-fixed-row"><span class="regb-lock" aria-hidden="true">${REG_LOCK}</span><span>KVKK Aydınlatma Metni’ni okudum</span><em>Onay kutusu · zorunlu</em></div>
          <p class="regb-fixed-note">KVKK kutusu sitedeki diğer formlardaki gibi çalışır: işaretlemek isteyen kişiye aydınlatma metni açılır, metin sonuna kadar kaydırılınca “Okudum” ile onaylanır.</p>
        </div>
        <div class="regb-list">${qs || '<p class="hint">Henüz ek soru yok. “+ Soru ekle” ile kulübünün soracağı soruları ekle.</p>'}</div>
        ${d.questions.length < 30 ? '<div><button type="button" class="btn ghost small" data-act="regb-add">+ Soru ekle</button></div>' : ''}` : ''}`;
  };
  const rerenderRegb = (focus) => {
    const host = document.querySelector('[data-regb-host]');
    if (host) host.innerHTML = regBuilderHtml(regDraft());
    if (focus) host?.querySelector(focus)?.focus();
  };
  // Soruları sol kenardaki tutamaçtan sürükleyerek sıralama (fare + dokunmatik).
  // Sürüklerken kartlar DOM'da yer değiştirir (diğerleri kayarak açılır); bırakınca sıra taslağa yazılır.
  document.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest?.('[data-regb-drag]');
    if (!handle || e.button > 0) return;
    const card = handle.closest('.regb-q'), list = card?.parentElement;
    const d = regDraft();
    if (!card || !list || !d || d.questions.length < 2) return;
    e.preventDefault();
    handle.setPointerCapture?.(e.pointerId);
    const startY = e.clientY;
    let lastY = e.clientY, scrollTimer = null;
    const baseTop = card.getBoundingClientRect().top;
    card.classList.add('dragging'); list.classList.add('regb-sorting');
    const cards = () => [...list.querySelectorAll(':scope > .regb-q')];
    const flip = (move) => {
      const others = cards().filter((c) => c !== card);
      const before = new Map(others.map((c) => [c, c.getBoundingClientRect().top]));
      move();
      others.forEach((c) => {
        const dy = before.get(c) - c.getBoundingClientRect().top;
        if (!dy) return;
        c.style.transition = 'none'; c.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(() => { c.style.transition = 'transform .18s ease'; c.style.transform = ''; });
      });
    };
    const follow = () => {
      // Kart parmağı/imleci takip eder; komşusunun ortasını geçince yer değiştirir.
      const naturalTop = card.getBoundingClientRect().top - (parseFloat(card.style.getPropertyValue('--dy')) || 0);
      card.style.setProperty('--dy', `${lastY - startY - (naturalTop - baseTop)}px`);
      const mid = card.getBoundingClientRect().top + card.offsetHeight / 2;
      const prev = card.previousElementSibling?.matches('.regb-q') ? card.previousElementSibling : null;
      const next = card.nextElementSibling?.matches('.regb-q') ? card.nextElementSibling : null;
      if (prev && mid < prev.getBoundingClientRect().top + prev.offsetHeight / 2) { flip(() => list.insertBefore(card, prev)); follow(); }
      else if (next && mid > next.getBoundingClientRect().top + next.offsetHeight / 2) { flip(() => list.insertBefore(next, card)); follow(); }
    };
    const autoScroll = () => {
      const edge = 70, h = window.innerHeight;
      const v = lastY < edge ? -(edge - lastY) / 4 : lastY > h - edge ? (lastY - (h - edge)) / 4 : 0;
      if (v) { window.scrollBy(0, v); follow(); }
      scrollTimer = requestAnimationFrame(autoScroll);
    };
    scrollTimer = requestAnimationFrame(autoScroll);
    const onMove = (ev) => { lastY = ev.clientY; follow(); };
    const onEnd = () => {
      cancelAnimationFrame(scrollTimer);
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onEnd);
      handle.removeEventListener('pointercancel', onEnd);
      const order = cards().map((c) => Number(c.dataset.qi));
      const moved = order.some((n, i) => n !== i);
      if (moved) {
        d.questions = order.map((n) => d.questions[n]);
        if (state.view === 'etkinlik-olustur') evForm.dirty = true;
      }
      card.classList.remove('dragging'); list.classList.remove('regb-sorting'); card.style.removeProperty('--dy');
      rerenderRegb();
      if (moved) document.querySelector(`.regb-q[data-qi="${order.indexOf(Number(card.dataset.qi))}"] [data-regb-drag]`)?.focus({ preventScroll: true });
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onEnd);
    handle.addEventListener('pointercancel', onEnd);
  });

  const validateRegDraft = (d) => {
    if (!d || !d.enabled) return '';
    if (d.deadline && new Date(fromLocalInput(d.deadline)).getTime() < Date.now()) return 'Son kayıt zamanı geçmişte olamaz.';
    for (const [i, q] of d.questions.entries()) {
      if (!q.label.trim()) return `${i + 1}. sorunun metnini yaz.`;
      if (q.type === 'choice') {
        const opts = q.options.map((o) => o.trim());
        if (opts.some((o) => !o)) return `“${q.label.trim()}” sorusunda boş seçenek var.`;
        if (new Set(opts.map((o) => o.toLocaleLowerCase('tr-TR'))).size !== opts.length) return `“${q.label.trim()}” sorusunda aynı seçenek iki kez yazılmış.`;
      }
    }
    return '';
  };
  const cleanRegQuestions = (d) => d.questions.map((q) => ({
    id: q.id, type: q.type, label: q.label.trim(), required: !!q.required,
    ...(q.type === 'choice' ? { options: q.options.map((o) => o.trim()), multiple: !!q.multiple } : {}),
  }));
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.matches?.('[data-regb]')) return;
    const d = regDraft(); if (!d) return;
    const k = el.dataset.regb, i = Number(el.dataset.i), j = Number(el.dataset.j);
    if (k === 'deadline') d.deadline = el.value;
    else if (k === 'label') d.questions[i].label = el.value;
    else if (k === 'opt') d.questions[i].options[j] = el.value;
    if (state.view === 'etkinlik-olustur') evForm.dirty = true;
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (!el.matches?.('[data-regb]')) return;
    const d = regDraft(); if (!d) return;
    const k = el.dataset.regb, i = Number(el.dataset.i);
    if (k === 'enabled') { d.enabled = el.checked; rerenderRegb(); }
    else if (k === 'req') d.questions[i].required = el.checked;
    else if (k === 'multi') { d.questions[i].multiple = el.value === '1'; rerenderRegb(); }
    else if (k === 'type') {
      const q = d.questions[i]; q.type = el.value;
      if (q.type === 'choice' && (!q.options || q.options.length < 2)) q.options = ['', ''];
      rerenderRegb(`[data-regb="label"][data-i="${i}"]`);
    }
    if (state.view === 'etkinlik-olustur') evForm.dirty = true;
  });

  // ---- Board: Etkinliklerim → Kayıtlar ----
  const freshRegBoard = (eventId = '') => ({ eventId, settings: null, rows: null, loading: false, error: '', search: '', edit: null });
  const loadRegBoard = async () => {
    const b = state.regBoard;
    b.loading = true; b.error = '';
    try {
      const [settings, rows] = await Promise.all([api.regSettings(b.eventId), api.registrations(b.eventId)]);
      if (state.regBoard !== b) return;
      b.settings = settings; b.rows = rows;
    } catch (error) { b.error = error.message || 'Kayıtlar yüklenemedi.'; }
    b.loading = false;
    if (state.view === 'kayitlar' && !busy()) render();
  };
  const openRegBoard = (eventId) => { state.regBoard = freshRegBoard(eventId); go('kayitlar'); loadRegBoard(); };
  const boardColumns = (s) => {
    const qs = s?.questions || [];
    const all = [['status', 'Durum'], ['code', 'Kod'], ['email', 'E-posta'], ['created', 'Kayıt zamanı'], ['checkin', 'Giriş'], ...qs.map((q) => [q.id, q.label])];
    const chosen = Array.isArray(s?.board_columns) && s.board_columns.length ? s.board_columns : ['status', 'code', 'email', 'checkin', ...qs.map((q) => q.id)];
    return { all, chosen: chosen.filter((k) => all.some(([id]) => id === k)) };
  };
  const eventEnd = (e) => (e.endDate && e.endDate > e.date ? e.endDate : e.date);
  const regReason = (e, s, n) => {
    if (eventEnd(e) < today()) return 'Etkinlik bitti';
    if (!s?.is_open) return 'Kapalı';
    if (s.deadline && new Date(s.deadline).getTime() <= Date.now()) return 'Süresi doldu';
    if (e.capacity && n >= Number(e.capacity)) return 'Dolu · bekleme listesi';
    return 'Açık';
  };
  const regStatus = (r) => r.status || 'confirmed';
  const waitPos = (r) => (state.regBoard.rows || []).filter((x) => regStatus(x) === 'waitlist' && x.created_at <= r.created_at).length;
  const regTableHtml = () => {
    const b = state.regBoard, s = b.settings, rows = b.rows || [];
    const { all, chosen } = boardColumns(s);
    const label = Object.fromEntries(all);
    const q = searchKey(b.search);
    const list = q ? rows.filter((r) => searchKey(`${r.full_name} ${r.email} ${r.code}`).includes(q)) : rows;
    if (!rows.length) return empty('Henüz kayıt yok. Etkinlik sayfasındaki “Kayıt ol” düğmesiyle gelen kayıtlar burada görünür.');
    if (!list.length) return empty('Aramaya uyan kayıt yok.');
    const cell = (r, k) => {
      if (k === 'code') return `<code class="rb-code">${esc(r.code)}</code>`;
      if (k === 'email') return esc(r.email);
      if (k === 'created') return esc(fmtRegTime(r.created_at));
      if (k === 'checkin') return regStatus(r) !== 'confirmed' ? '—' : r.checked_in_at ? `<span class="tag ok">✓ ${esc(fmtRegTime(r.checked_in_at))}</span>` : '<span class="tag">Gelmedi</span>';
      if (k === 'status') return regStatus(r) === 'waitlist' ? `<span class="tag wait">Bekleme listesi · ${waitPos(r)}.</span>`
        : regStatus(r) === 'offered' ? `<span class="tag wait">Yer teklif edildi · ${esc(fmtRegTime(r.offer_expires_at))}’e kadar</span>` : '<span class="tag ok">Kesin</span>';
      return esc(answerText(r.answers?.[k]));
    };
    return `<div class="rb-wrap"><table class="rb-table"><thead><tr><th>#</th><th>Ad soyad</th>${chosen.map((k) => `<th>${esc(label[k])}</th>`).join('')}<th><span class="sr-only">İşlem</span></th></tr></thead>
      <tbody>${list.map((r) => `<tr><td class="rb-n">${rows.indexOf(r) + 1}</td><td><strong>${esc(r.full_name)}</strong></td>${chosen.map((k) => `<td>${cell(r, k)}</td>`).join('')}
        <td class="rb-act">${regStatus(r) === 'confirmed' ? `<button class="btn small ${r.checked_in_at ? 'ghost' : ''}" data-act="reg-checkin" data-id="${esc(r.id)}" data-sub="${r.checked_in_at ? '0' : '1'}">${r.checked_in_at ? 'Girişi geri al' : 'Giriş yaptı'}</button>` : ''}
          <button class="btn danger small" data-act="reg-del" data-id="${esc(r.id)}" aria-label="Kaydı sil">Sil</button></td></tr>`).join('')}</tbody></table></div>`;
  };
  const regBoardView = () => {
    const b = state.regBoard;
    const e = db.events.find((x) => x.id === b.eventId);
    if (!e || !ownsEventUi(e)) { setTimeout(() => go('etkinliklerim')); return ''; }
    const top = head('Kayıtlar', `${e.title} · ${fmtDay(e.date)}`, `<div class="head-actions"><button class="btn ghost" data-go="gorevliler">Görevliler</button>${b.rows?.length ? '<button class="btn" data-act="reg-csv">CSV indir</button>' : ''}</div>`);
    if (b.error) return `${top}<section class="card"><p class="body">${esc(b.error)}</p><button class="btn small" data-act="reg-reload">Tekrar dene</button></section>`;
    if (!b.rows) return `${top}<section class="card"><p class="body">Kayıtlar yükleniyor…</p></section>`;
    const s = b.settings, rows = b.rows;
    if (b.edit) {
      return `${top}<section class="card evp-sec"><h2>${s?.enabled ? 'Kayıt formunu düzenle' : 'Kayıt toplamayı aç'}</h2>
        <div data-regb-host>${regBuilderHtml(b.edit)}</div>
        <p class="form-error" data-reg-edit-error hidden></p>
        <div class="row"><button class="btn" data-act="reg-edit-save">Kaydet</button><button class="btn ghost" data-act="reg-edit-cancel">Vazgeç</button></div></section>`;
    }
    if (!s || !s.enabled) {
      return `${top}<section class="card"><p class="body">Bu etkinlik UniPakt üzerinden kayıt toplamıyor.</p><button class="btn small" data-act="reg-edit">Kayıt toplamayı aç</button></section>`;
    }
    const seated = rows.filter((r) => regStatus(r) === 'confirmed');
    const waiting = rows.filter((r) => regStatus(r) !== 'confirmed').length;
    const checked = seated.filter((r) => r.checked_in_at).length;
    const status = regReason(e, s, rows.filter((r) => regStatus(r) !== 'waitlist').length);
    const { all, chosen } = boardColumns(s);
    return `${top}
      <div class="stats">
        <div class="stat"><b>${seated.length}</b><span>Kesin kayıt${e.capacity ? ` · kontenjan ${esc(e.capacity)}` : ''}</span></div>
        <div class="stat"><b>${checked}</b><span>Giriş yaptı · ${seated.length - checked} gelmedi</span></div>
        <div class="stat"><b>${waiting}</b><span>Bekleme listesi</span></div>
        <div class="stat rb-status ${status === 'Açık' ? 'hot' : ''}"><b>${esc(status)}</b><span>Kayıt durumu</span></div>
      </div>
      <section class="card rb-settings">
        <div class="rb-set-row">
          <div><strong>Kayıtlar ${s.is_open ? 'açık' : 'kapalı'}</strong><small>${s.is_open ? 'Etkinlik sayfasında “Kayıt ol” düğmesi görünüyor.' : 'Etkinlik sayfasında “Kayıtlar kapalı” yazıyor.'}</small></div>
          <button class="btn small ${s.is_open ? 'ghost' : ''}" data-act="reg-toggle">${s.is_open ? 'Kayıtları kapat' : 'Kayıtları aç'}</button>
        </div>
        <div class="rb-set-row">
          <label class="field" style="flex:1;max-width:320px"><span>Son kayıt zamanı</span><input type="datetime-local" data-reg-deadline value="${esc(toLocalInput(s.deadline))}"></label>
          <button class="btn small ghost" data-act="reg-deadline-save">Kaydet</button>
        </div>
        <div class="rb-set-row rb-links">
          <a class="link-btn" href="https://unipakt.com/etkinlik/?id=${esc(e.id)}" target="_blank" rel="noopener">Etkinlik sayfasını aç ↗</a>

      <label class="im-search rb-search">${IM_ICON.search}<input type="search" placeholder="Ad, e-posta ya da kod ara" value="${esc(b.search)}" data-reg-search aria-label="Kayıt ara"></label>

  const saveRegSettings = async (patch) => {
    const b = state.regBoard, s = b.settings || {};
    await api.setRegistration(b.eventId, { enabled: s.enabled ?? true, open: s.is_open ?? true, deadline: s.deadline || null, ...patch });
    b.settings = await api.regSettings(b.eventId);
  };
  document.addEventListener('input', (e) => {
    if (!e.target.matches?.('[data-reg-search]')) return;
    state.regBoard.search = e.target.value;
    const box = document.getElementById('rbTable');
    if (box) box.innerHTML = regTableHtml();
  });
  const downloadRegCsv = () => {
    const b = state.regBoard, e = db.events.find((x) => x.id === b.eventId);
    const qs = b.settings?.questions || [];
    const head = ['Ad soyad', 'E-posta', 'Durum', 'Kod', 'Kayıt zamanı', 'Giriş zamanı', ...qs.map((q) => q.label)];
    const stLabel = (r) => ({ waitlist: 'Bekleme listesi', offered: 'Yer teklif edildi' }[regStatus(r)] || 'Kesin');
    const cellOf = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) || /^[=+\-@]/.test(s) ? `"${(/^[=+\-@]/.test(s) ? `'${s}` : s).replace(/"/g, '""')}"` : s; };
    const lines = [head, ...(b.rows || []).map((r) => [r.full_name, r.email, stLabel(r), r.code, fmtRegTime(r.created_at), fmtRegTime(r.checked_in_at), ...qs.map((q) => answerText(r.answers?.[q.id]))])]
      .map((row) => row.map(cellOf).join(';'));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${String(e?.title || 'kayitlar').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '')}-kayitlar.csv`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  // ---- Görevliler ----

    const v = state.staffView;

    v.loading = true; v.error = '';
    try {
      const [staff, grants, settings] = await Promise.all([api.staffList(), api.grants(), api.regSettingsAll()]);
      Object.assign(v, { staff, grants, settings });
    } catch (error) { v.error = error.message || 'Görevliler yüklenemedi.'; }
    v.loading = false;
    if (state.view === 'gorevliler' && !busy()) render();
  };
  const grantableEvents = () => {
    const on = new Set((state.staffView.settings || []).filter((s) => s.enabled).map((s) => s.event_id));
    return db.events.filter((e) => on.has(e.id) && e.status === 'published' && ownsEventUi(e) && eventEnd(e) >= today())
      .sort((a, b) => a.date.localeCompare(b.date));
  };
  const staffView = () => {
    const v = state.staffView;
    const top = head('Görevliler', 'Etkinlik girişinde QR ve kod kontrolü yapacak kişiler. Panel hesabı gerekmez: etkinlik yetkisi verdiğinde e-postalarına kontrol sayfasının bağlantısı ve 6 haneli erişim kodu gider. Yetki, etkinliğin son günü bitince kendiliğinden kapanır.',
      '<button class="btn" data-act="staff-add">Görevli ekle</button>');
    if (v.error) return `${top}<section class="card"><p class="body">${esc(v.error)}</p><button class="btn small" data-act="staff-reload">Tekrar dene</button></section>`;
    if (!v.staff) return `${top}<section class="card"><p class="body">Yükleniyor…</p></section>`;
    if (!v.staff.length) return `${top}${empty('Henüz görevli eklemedin. “Görevli ekle” ile bir kez ekle; sonra her etkinlik için tek tıkla yetki verirsin.')}`;
    const now = Date.now();
    return `${top}<div class="stack">${v.staff.map((s) => {
      const gs = (v.grants || []).filter((g) => g.staff_id === s.id && new Date(g.expires_at).getTime() > now);
      return `<article class="card staff-card">
        <div class="staff-head"><div><h3>${esc(s.full_name)}</h3><small>${esc(s.email)}</small></div>
          <div class="row"><button class="btn small" data-act="staff-grant" data-id="${esc(s.id)}">Etkinlik yetkisi ver</button><button class="btn danger small" data-act="staff-del" data-id="${esc(s.id)}">Sil</button></div></div>
        ${gs.length ? `<div class="staff-grants">${gs.map((g) => {
          const ev = db.events.find((x) => x.id === g.event_id);
          const locked = Number(g.failed_attempts) >= 10;
          return `<div class="mini-row"><div><strong>${esc(ev?.title || 'Etkinlik')}${locked ? ' <span class="tag no">Kilitli</span>' : ''}</strong><small>${locked ? 'Erişim kodu 10 kez yanlış girildi · ' : ''}${esc(fmtRegTime(g.expires_at))}’e kadar${g.last_used_at ? ` · son kullanım ${esc(fmtRegTime(g.last_used_at))}` : ' · henüz açılmadı'}</small></div>
            <div class="row"><button class="btn small ${locked ? '' : 'ghost'}" data-act="grant-resend" data-id="${esc(g.id)}">Kodu yeniden gönder</button><button class="btn ghost small" data-act="grant-revoke" data-id="${esc(g.id)}">Yetkiyi geri al</button></div></div>`;
        }).join('')}</div>` : '<p class="hint" style="margin:10px 0 0">Aktif etkinlik yetkisi yok.</p>'}
      </article>`;
    }).join('')}</div>`;
  };

  const regActions = {
    'reg-open'(id) { openRegBoard(id); },
    'reg-reload'() { loadRegBoard(); render(); },
    'reg-edit'() {
      const s = state.regBoard.settings;
      state.regBoard.edit = { enabled: true, deadline: toLocalInput(s?.deadline), questions: JSON.parse(JSON.stringify(s?.questions || [])).map((q) => ({ options: [], ...q })) };
      render();

    'reg-edit-cancel'() { state.regBoard.edit = null; render(); },
    async 'reg-edit-save'() {
      const d = state.regBoard.edit;

      if (problem) { if (err) { err.textContent = problem; err.hidden = false; } return; }

      state.regBoard.edit = null; toast(d.enabled ? 'Kayıt formu kaydedildi.' : 'Kayıt toplama kapatıldı.'); render();
    },
    async 'reg-toggle'() {

      await saveRegSettings({ open: !s.is_open });

    },
    async 'reg-deadline-save'() {
      const v = document.querySelector('[data-reg-deadline]')?.value || '';

      const next = chosen.includes(key) ? chosen.filter((k) => k !== key) : [...chosen, key];

    'reg-csv'() { downloadRegCsv(); },
    'staff-reload'() { state.staffView = freshStaffView(); loadStaffView(); render(); },
    'staff-add'() {
      openForm({
        title: 'Görevli ekle', lead: 'Bir kez eklersin; sonra her etkinlik için tek tıkla yetki verirsin. Panel hesabı açılmaz.',
        fields: field('Ad soyad', '<input name="name" required maxlength="120" autocomplete="off">') + field('E-posta', '<input type="email" name="email" required maxlength="254" autocomplete="off">'),

      const qs = regDraft().questions, a = Number(i), b = a + Number(dir);

    'support-ticket-new'() {
      if (isAdmin()) return;

      const categoryCards = Object.entries(SUPPORT_CATEGORIES).map(([key, cfg]) => `
        <button type="button" class="support-category-card" data-support-category="${key}">
          <strong>${esc(cfg.label)}</strong>
          <span>${esc(cfg.description)}</span>
        </button>`).join('');

      const renderCategory = (kind) => {
        const cfg = SUPPORT_CATEGORIES[kind];
        const options = cfg.options.map((option) => `<option value="${esc(option)}">${esc(option)}</option>`).join('');
        const events = kind === 'event' ? supportEventOptions() : [];
        const eventField = kind === 'event'
          ? field('Etkinlik', `<select name="eventId" required><option value="">Etkinlik seçiniz</option><option value="__none__">Etkinlik dışı — belirli bir etkinlikle ilgili değil</option>${events.map((e) => `<option value="${esc(e.id)}">${esc(e.title)} · ${esc(e.date ? fmtDay(e.date) : '')}</option>`).join('')}</select>`)
          : '';

        let info = '';
        if (kind === 'technical') {
          info = `<div class="support-info"><strong>Bilgilendirme</strong><p><strong>UniPakt.</strong> tarafından geliştirilen UniPakt.Panel, kullanıcı deneyimlerinden elde edilen geri bildirimler doğrultusunda sürekli olarak geliştirilmektedir. Bununla birlikte, tüm dijital sistemlerde olduğu gibi teknik sorunlar veya beklenmeyen durumlarla karşılaşılması mümkündür.</p><p>Sorunun hangi işlem sırasında meydana geldiğini, beklediğiniz sonucu ve karşılaştığınız durumu mümkün olduğunca ayrıntılı şekilde belirtmeniz, destek sürecinin daha hızlı ilerlemesine yardımcı olacaktır.</p></div>`;
        }
        if (kind === 'community') {
          info = `<div class="support-info"><strong>Önemli Bilgilendirme</strong><p><strong>UniPakt.</strong>, toplum ve kulüp gönüllülerinin bir arada bulunduğu; adalet, aidiyet ve güven ilkelerini temel alan bir oluşumdur. Topluluk içerisindeki bu temel değerlere ve belirlenen ilkelere aykırı durumların uygun şekilde bildirilmesi ve değerlendirilmesi için bu kanal kullanılabilir.</p><p>Gönderilen bildirimler, bildirimin niteliği ve sunulan bilgiler doğrultusunda değerlendirilir. Bildirimin mümkün olduğunca açık, doğru ve somut bilgiler içermesi değerlendirme sürecine katkı sağlar.</p><p><strong>Uyarı:</strong> Bu kategoriden oluşturulan destek talepleri <strong>en geç 1 gün içerisinde değerlendirmeye alınır.</strong> Konunun niteliğine bağlı olarak inceleme süreci daha uzun sürebilir. Lütfen göndermeden önce bildiriminizin bu kategori kapsamında olduğundan emin olunuz.</p><div class="support-privacy"><strong>Gizlilik Bildirimi</strong><p>Bu kategori üzerinden iletilen bildirimler, yalnızca destek ve değerlendirme sürecinde yetkilendirilmiş kişiler tarafından erişilebilir.</p></div></div>`;
        }
        if (kind === 'event') {
          info = `<div class="support-info"><strong>Bilgilendirme</strong><p><strong>UniPakt.</strong>, kulüplerin etkinliklerini daha düzenli, verimli ve erişilebilir şekilde gerçekleştirebilmelerini desteklemek amacıyla UniPakt.Panel sistemini sürekli olarak geliştirmektedir.</p><p>Etkinliğinizle ilgili destek talebinizde etkinliğin adını, karşılaştığınız problemi ve mümkünse sorunun meydana geldiği işlemi belirtmeniz, değerlendirme ve çözüm sürecinin daha hızlı ilerlemesine yardımcı olacaktır.</p></div>`;
        }
        return `<div class="support-form-intro"><h3>${esc(cfg.label)}</h3><p>${esc(cfg.description)}</p></div>`
          + field('Konu', `<select name="topic" required data-support-topic><option value="">Seçiniz</option>${options}</select>`)

          + eventField
          + field('Ayrıntılar', `<label class="field-label">Mesajınız</label><textarea name="body" required maxlength="4000" placeholder="${esc(cfg.messagePlaceholder)}"></textarea>`)
          + field('İsteğe bağlı ekran görüntüsü / belge', `<input type="file" name="attachment" accept="image/png,image/jpeg,image/webp,application/pdf"><small class="muted">PNG, JPG, WebP veya PDF · en fazla 5 MB</small>`)

      openForm({
        title: 'Yeni destek talebi',

    'task-new'() {
      openForm({
        title: 'Görev ata',
        fields: `<div class="field"><span>Kulüpler <em class="pick-count" id="pickCount">0 seçili</em></span>
            <input type="search" id="clubFilter" placeholder="Kulüp ya da üniversite ara" autocomplete="off" aria-label="Kulüp ara">
            <div class="checks">
              <label><input type="checkbox" id="allClubs"> <strong id="allClubsLabel">Tüm kulüpler</strong></label>
              ${[...db.clubs].sort(byLabel).map((c) => `<label data-search="${esc(searchKey(clubLabel(c)))}"><input type="checkbox" name="club" value="${esc(c.id)}"> ${esc(clubLabel(c))}</label>`).join('')}
              <p class="checks-empty" id="clubFilterEmpty" hidden>Aramana uyan kulüp yok.</p>
            </div></div>`
          + field('Görev', '<input name="title" required maxlength="120">')
          + field('Açıklama (isteğe bağlı)', '<textarea name="desc" maxlength="1000"></textarea>')
          + field('Son tarih (isteğe bağlı)', '<input type="date" name="due">'),
        submit: 'Ata',
        onSubmit: async (fd) => {
          const ids = fd.getAll('club');
          if (!ids.length) return 'En az bir kulüp seç.';
          await api.addTasks(ids, { title: val(fd, 'title'), desc: val(fd, 'desc'), due: val(fd, 'due') });
          state.taskTab = 'open';
          toast(ids.length > 1 ? `Görev ${ids.length} kulübe atandı.` : 'Görev atandı.');
        },
      });
      const all = dlgForm.querySelector('#allClubs');
      const boxes = [...dlgForm.querySelectorAll('input[name="club"]')];
      const filter = dlgForm.querySelector('#clubFilter');
      // "Tüm kulüpler" works on what the search shows; ticks on hidden clubs are kept.
      const visible = () => boxes.filter((b) => !b.closest('label').hidden);
      const sync = () => {
        const shown = visible();
        all.checked = shown.length > 0 && shown.every((x) => x.checked);
        dlgForm.querySelector('#allClubsLabel').textContent = filter.value.trim() ? `Aramadaki kulüpler (${shown.length})` : 'Tüm kulüpler';
        dlgForm.querySelector('#pickCount').textContent = `${boxes.filter((b) => b.checked).length} seçili`;
        dlgForm.querySelector('#clubFilterEmpty').hidden = shown.length > 0;
      };
      filter.addEventListener('input', () => {
        const q = searchKey(filter.value);
        boxes.forEach((b) => { const label = b.closest('label'); label.hidden = !!q && !label.dataset.search.includes(q); });
        sync();
      });
      // Enter in the search box must not submit the form.
      filter.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });
      all.addEventListener('change', () => { visible().forEach((b) => { b.checked = all.checked; }); sync(); });
      boxes.forEach((b) => b.addEventListener('change', sync));
      sync();
      setTimeout(() => filter.focus(), 0);
    },
