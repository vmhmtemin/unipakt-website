<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co; form-action 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'">
<meta name="robots" content="noindex, nofollow">
<title>UniPakt Panel</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Caveat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ink: #FFFFFF;
    --paper: #000000;
    --paper-soft: #0A0A0A;
    --surface: #070707;
    --border: #FFFFFF20;
    --border-strong: #FFFFFF35;
    --accent: #FF5A1F;
    --on-accent: #000;
    --ok: #4ADE80;
    --no: #F87171;
    --side-w: 264px;
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15px/1.55 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--on-accent); }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---- Wordmark ---- */
  .wordmark {
    display: inline-block; color: var(--ink); text-decoration: none;
    font: 900 30px/1 'Archivo', sans-serif; letter-spacing: -0.04em;
  }
  .wordmark span { color: var(--accent); }
  .wordmark:hover { opacity: .8; }
  .kicker { font: 700 22px/1 'Caveat', cursive; color: var(--accent); }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 20px; border-radius: 999px; white-space: nowrap;
    font-weight: 600; font-size: 14px; line-height: 1;
    background: var(--accent); color: var(--on-accent); border: 1.5px solid var(--accent);
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn:hover { background: transparent; color: var(--accent); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--border-strong); }
  .btn.ghost:hover { border-color: var(--ink); color: var(--ink); }
  .btn.danger { background: transparent; color: var(--no); border-color: color-mix(in srgb, var(--no) 45%, transparent); }
  .btn.danger:hover { border-color: var(--no); color: var(--no); }
  .btn.small { padding: 8px 14px; font-size: 13px; }
  .club-visibility {
    width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-strong); border-radius: 10px; background: transparent; color: var(--ink);
    opacity: .72; transition: opacity .2s ease, border-color .2s ease, color .2s ease;
  }
  .club-visibility:hover { opacity: 1; border-color: var(--ink); }
  .club-visibility.is-hidden { color: var(--no); border-color: color-mix(in srgb, var(--no) 45%, transparent); opacity: 1; }
  .club-visibility svg { width: 18px; height: 18px; display: block; }

  /* ---- Login ---- */
  .login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; }
  .login-box { width: min(100%, 520px); }
  .login-box .wordmark { font-size: clamp(54px, 12vw, 84px); }
  .login-box .kicker { font-size: 30px; margin: 6px 0 34px; }
  .login-box h2 { font: 700 15px/1.3 'Inter', sans-serif; opacity: .7; margin-bottom: 14px; }
  .account-list { display: grid; gap: 10px; }
  .account {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left;
    padding: 16px 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border);
    transition: border-color .2s ease, background .2s ease;
  }
  .account:hover { border-color: var(--accent); background: var(--paper-soft); }
  .account strong { display: block; font-weight: 600; font-size: 16px; }
  .account small { display: block; opacity: .6; font-size: 13px; margin-top: 2px; }
  .account .role { font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; }
  .account.is-admin .role { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .login-form { display: grid; gap: 16px; }
  .login-form .btn { justify-self: start; padding: 14px 28px; font-size: 15px; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .loading { opacity: .6; }
  button.proof { background: transparent; cursor: pointer; text-align: left; }
  .demo-note { margin-top: 22px; font-size: 13px; line-height: 1.6; opacity: .6; }

  /* ---- App shell ---- */
  .app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - 64px); }
  .side {
    position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 26px;
    padding: 30px 18px 22px; border-right: 1px solid var(--border);
  }
  .side-brand { padding: 0 12px; }
  .side-brand .kicker { margin-top: 4px; }
  .side-nav { display: grid; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 11px 12px; border-radius: 12px; border: 1px solid transparent; background: transparent;
    font-weight: 500; opacity: .68; transition: opacity .2s ease, background .2s ease;
  }
  .nav-item::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); flex: none; transition: background .2s ease; }
  .nav-item:hover { opacity: 1; background: var(--paper-soft); }
  .nav-item.active { opacity: 1; background: var(--paper-soft); border-color: var(--border); font-weight: 600; }
  .nav-item.active::before { background: var(--accent); }
  .nav-item .badge { margin-left: auto; }
  .badge {
    min-width: 22px; padding: 3px 7px; border-radius: 999px; text-align: center;
    background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; line-height: 1.3;
  }
  .side-foot { margin-top: auto; padding: 16px 12px 0; border-top: 1px solid var(--border); display: grid; gap: 12px; }
  .side-user strong { display: block; font-weight: 600; line-height: 1.3; }
  .side-user small { opacity: .6; font-size: 13px; }
  .side-foot .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .link-btn { background: none; border: 0; padding: 0; font-size: 13px; opacity: .55; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
  .link-btn:hover { opacity: 1; }

  .main { padding: clamp(24px, 4vw, 56px); min-width: 0; }
  .main-inner { max-width: 1080px; }
  .demo-bar {
    display: flex; align-items: center; gap: 10px; margin-bottom: clamp(22px, 3vw, 36px);
    padding: 10px 16px; border: 1px dashed var(--border-strong); border-radius: 12px;
    font-size: 13px; opacity: .75;
  }
  .demo-bar b { color: var(--accent); font-weight: 600; }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: clamp(24px, 3vw, 38px); }
  .page-head h1 { font: 900 clamp(36px, 4.6vw, 58px)/1 'Archivo', sans-serif; letter-spacing: -0.04em; }
  .page-head h1 span { color: var(--accent); }
  .page-head p { margin-top: 12px; max-width: 60ch; opacity: .68; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 34px 0 14px; }
  .section-head:first-child { margin-top: 0; }
  .section-head h2 { font: 700 19px/1.2 'Archivo', sans-serif; letter-spacing: -0.01em; }
  .section-head .link-btn { opacity: .7; }

  /* ---- Cards & lists ---- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px; }
  .stack { display: grid; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
  .head-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; align-items: start; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; transition: border-color .2s ease; }
  button.stat:hover { border-color: var(--border-strong); }
  .stat b { display: block; font: 900 44px/1 'Archivo', sans-serif; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 10px; font-size: 13.5px; opacity: .68; }
  .stat.hot b { color: var(--accent); }

  .item h3 { font: 700 18px/1.3 'Archivo', sans-serif; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .item .body { margin-top: 8px; opacity: .82; white-space: pre-line; overflow-wrap: anywhere; }
  .item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 14px; font-size: 13px; opacity: .62; }
  .item .meta.top { margin: 0 0 10px; opacity: 1; }
  .item .meta.top > span:not(.tag) { opacity: .62; }
  .item .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; }
  .tag.wait { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .tag.no { color: var(--no); border-color: color-mix(in srgb, var(--no) 45%, transparent); }
  .quote { margin-top: 14px; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--paper-soft); border-radius: 0 12px 12px 0; white-space: pre-line; overflow-wrap: anywhere; }
  .quote small { display: block; font-size: 12px; font-weight: 600; opacity: .6; margin-bottom: 4px; }
  .empty { padding: 28px 22px; border: 1px dashed var(--border-strong); border-radius: 18px; text-align: center; opacity: .6; }

  .event { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 20px; }
  .date-block { align-self: start; text-align: center; padding: 12px 6px; border: 1px solid var(--border-strong); border-radius: 14px; }
  .date-block b { display: block; font: 900 30px/1 'Archivo', sans-serif; letter-spacing: -0.03em; }
  .date-block span { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
  .apps { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); display: grid; gap: 10px; }
  .apps > small { font-size: 12px; font-weight: 600; opacity: .6; }
  .app-row { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
  .app-row p { opacity: .82; min-width: 0; overflow-wrap: anywhere; }
  .app-row .actions { margin: 0; }

  .mini-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .mini-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .mini-row:first-child { padding-top: 0; }
  .mini-row strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .mini-row small { display: block; opacity: .6; font-size: 13px; }
  .mini-row > :last-child { flex: none; }

  /* ---- Filters ---- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
  .chip { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border-strong); background: transparent; font-size: 14px; font-weight: 500; transition: border-color .2s ease; }
  .chip:hover { border-color: var(--ink); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

  /* ---- Calendar ---- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .cal-head h2 { font: 900 26px/1 'Archivo', sans-serif; letter-spacing: -0.03em; }
  .cal-head .row { display: flex; gap: 8px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; background: var(--surface); }
  .cal-dow { padding: 11px 8px; font-size: 12px; font-weight: 600; text-align: center; opacity: .55; border-bottom: 1px solid var(--border); }
  .cal-day {
    min-height: 98px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 5px;
    background: transparent; border: 0; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    transition: background .15s ease;
  }
  .cal-day:nth-child(7n) { border-right: 0; }
  .cal-day.last-row { border-bottom: 0; }
  .cal-day:hover { background: var(--paper-soft); }
  .cal-day.out { opacity: .3; }
  .cal-day .num { font-size: 13px; font-weight: 600; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
  .cal-day.today .num { background: var(--ink); color: var(--paper); }
  .cal-day.selected { background: var(--paper-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cal-chip { display: block; width: 100%; font-size: 11.5px; font-weight: 600; line-height: 1.25; padding: 3px 7px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--accent); color: var(--on-accent); }
  .cal-chip.task { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--border-strong); }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 13px; opacity: .7; }
  .cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; background: var(--accent); }
  .cal-legend i.task { background: transparent; box-shadow: inset 0 0 0 1px var(--border-strong); }

  /* ---- Vanguard ---- */
  .rank-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 16px 20px; }
  .rank-row + .rank-row { border-top: 1px solid var(--border); }
  .rank-row .pos { font: 900 26px/1 'Archivo', sans-serif; letter-spacing: -0.03em; opacity: .4; font-variant-numeric: tabular-nums; }
  .rank-row:first-child .pos { color: var(--accent); opacity: 1; }
  .rank-row.mine { background: var(--paper-soft); }
  .rank-row strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .rank-row small { display: block; opacity: .6; font-size: 13px; }
  .rank-row .bar { margin-top: 9px; height: 5px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .rank-row .bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
  .rank-row .pts { display: flex; align-items: center; gap: 8px; }
  .rank-row .pts b { min-width: 58px; text-align: right; font: 900 24px/1 'Archivo', sans-serif; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .delta { font-weight: 600; font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--ok); }
  .delta.down { color: var(--no); }

  .stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 560px; }
  .chart { display: grid; gap: 16px; }
  .chart-row { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr) 52px; align-items: center; gap: 14px; }
  .chart-label { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
  .chart-track { height: 14px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .chart-track i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
  .chart-track i.down { background: var(--no); }
  .chart-row .delta { text-align: right; }
  @media (max-width: 640px) {
    .chart-row { grid-template-columns: minmax(0, 1fr) 52px; gap: 6px 12px; }
    .chart-label { grid-column: 1 / -1; }
  }
  .proof { display: flex; width: fit-content; align-items: center; gap: 12px; margin-top: 10px; padding: 8px 14px 8px 8px; border: 1px solid var(--border-strong); border-radius: 12px; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600; max-width: 100%; }
  .proof:not(.is-image) { padding-left: 14px; }
  .proof:hover { border-color: var(--accent); }
  .proof img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; flex: none; }
  .proof span { overflow-wrap: anywhere; min-width: 0; }
  .notif-result { display:inline-flex; align-items:center; font-weight:800; font-size:13px; }
  .notif-result.success { color:#55d98a; }
  .notif-result.danger { color:#ff5c68; }
  .poster-upload { display:grid; gap:10px; }
  .poster-file-row { display:flex; align-items:center; gap:10px; }
  .poster-file-row input[type="file"] { flex:1; min-width:0; }
  .poster-clear { flex:0 0 auto; width:42px; min-width:42px; padding:8px 0; font-size:22px; line-height:1; }
  .poster-preview { overflow:hidden; max-width:280px; border:1px solid var(--border); border-radius:14px; background:#111; }
  .poster-preview img { display:block; width:100%; max-height:360px; object-fit:contain; background:#050505; }
  .approval-poster { margin-top:12px; border:1px solid var(--border); border-radius:14px; overflow:hidden; background:#050505; }
  .approval-poster img { display:block; width:100%; max-height:420px; object-fit:contain; background:#050505; }
  .field input[type="file"] { padding: 10px; font-size: 13px; }

  /* ---- Dialog & form ---- */
  dialog { width: min(100% - 32px, 560px); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--border-strong); border-radius: 22px; background: #0B0B0B; color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .72); }
  dialog form { padding: 26px; display: grid; gap: 16px; }
  dialog h2 { font: 900 26px/1.1 'Archivo', sans-serif; letter-spacing: -0.03em; }
  dialog .lead { opacity: .75; }
  .field { display: grid; gap: 7px; }
  .field > span { font-size: 13px; font-weight: 600; opacity: .8; }
  .field input, .field textarea, .field select, .toolbar select {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    background: var(--paper-soft); border: 1px solid var(--border-strong); outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .toolbar select { width: auto; padding: 9px 14px; border-radius: 999px; }
  .field textarea { min-height: 110px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus, .toolbar select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .checks { display: grid; gap: 4px; max-height: 190px; overflow-y: auto; padding: 8px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--paper-soft); }
  .checks label { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .checks label:hover { background: #151515; }
  .checks label[hidden] { display: none; }
  .checks-empty { margin: 6px 8px; font-size: 13px; opacity: .6; }
  .pick-count { font-style: normal; font-weight: 500; opacity: .6; margin-left: 6px; }
  #clubFilter { margin-bottom: 8px; }
  .checks input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
  .form-error { color: var(--no); font-size: 13px; }
  .item .meta a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .item .meta a:hover { color: var(--accent); }
  .item .meta .bad { color: var(--no); }
  .form-section { line-height: 1.5; margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 13px; font-weight: 600; opacity: .7; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .support-category-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .support-category-card { display:grid; gap:7px; text-align:left; padding:16px; border:1px solid var(--border-strong); border-radius:15px; background:var(--paper-soft); color:var(--ink); cursor:pointer; transition:border-color .2s ease, transform .15s ease, box-shadow .2s ease; }
  .support-category-card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .support-category-card.active { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .support-category-card strong { font-size:15px; }
  .support-category-card span { font-size:12px; line-height:1.45; opacity:.65; }
  .support-form-intro { padding:14px 16px; border:1px solid var(--border); border-radius:14px; background:var(--paper-soft); }
  .support-form-intro h3 { font:800 18px/1.2 'Archivo',sans-serif; margin:0; }
  .support-form-intro p { margin:7px 0 0; opacity:.68; line-height:1.5; font-size:13px; }
  .support-info { padding:16px; border:1px solid var(--border); border-radius:14px; background:var(--paper-soft); font-size:13px; line-height:1.6; }
  .support-info p { margin:8px 0 0; opacity:.76; }
  .support-privacy { margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }

    session = next;

  const readSession = () => {
    try { session = JSON.parse(localStorage.getItem(TOKENS)); } catch (_) { session = null; }

    let r, data = {};
    try {
      r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
        method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

    } catch (_) { throw new Error('Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.'); }

  const calculatedPoints = (id) => db.pointLog

    if (isAdmin()) return calculatedPoints(id);

    // The logged-in club's own point_entries are authoritative.
    // Never let a stale 0 from the leaderboard hide the club's real points.
    if (id === state.user) return calculatedPoints(id);

  dlgForm.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) dlg.close(); });

    if ((isAdmin() || owner) && e.status === 'published' && page !== 'ortak') {
      const pendingEdit = pendingEventEdits().find((r) => r.eventId === e.id && r.clubId === state.user);
      if (pendingEdit && !isAdmin()) acts.push('<span class="tag wait">Düzenleme talebi bekliyor</span>');
      else acts.push(`<button class="btn ghost small" data-act="event-edit" data-id="${esc(e.id)}">Düzenle</button>`);
    }
    if (isAdmin() && e.status === 'published') {
      acts.push(`<button class="btn ${e.visible === false ? '' : 'ghost '}small" data-act="event-visibility" data-id="${esc(e.id)}">${e.visible === false ? 'Sitede göster' : 'Siteden gizle'}</button>`);
    } else if (!isAdmin() && mine && owner && e.status === 'published') {
      const pendingVis = pendingVisibility().find((r) => r.eventId === e.id && r.clubId === state.user);
      if (pendingVis) acts.push(`<span class="tag wait">Görünürlük talebi bekliyor</span>`);
      else acts.push(`<button class="btn ghost small" data-act="event-visibility-request" data-id="${esc(e.id)}">${e.visible === false ? 'Görünürlük talebi gönder' : 'Gizleme talebi gönder'}</button>`);
    }
    if (!isAdmin() && mine && e.status === 'rejected') acts.push(`<button class="btn danger small" data-act="rejected-event-delete" data-id="${esc(e.id)}">Reddedilen başvuruyu sil</button>`);
    if (isAdmin() && !mine) acts.push(`<button class="btn danger small" data-act="event-remove" data-id="${esc(e.id)}">Sil</button>`);
    return `
    <article class="card item event">
      ${dateBlock(e.date)}
      <div>
        ${tags.length ? `<div class="meta top">${tags.join('')}${mine ? `<span>${fmtStamp(e.createdAt)} tarihinde gönderildi</span>` : ''}</div>` : ''}
        <h3>${esc(e.title)}</h3>
        ${e.poster ? `<img src="${esc(e.poster)}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:12px;border:1px solid var(--border)">` : ''}
        <p class="body">${esc(e.desc)}</p>
        ${e.address ? `<div class="quote"><small>Açık adres</small><a href="https://www.google.com/maps/search/?api=1&query=${esc(encodeURIComponent(e.address))}" target="_blank" rel="noopener noreferrer" style="color:inherit">${esc(e.address)} → Haritada aç</a></div>` : ''}
        ${e.tags?.length ? `<div class="meta">${e.tags.map(t => `<span class="tag">#${esc(String(t).replace(/^#/,'') )}</span>`).join('')}</div>` : ''}
        ${partner && e.seeking && page !== 'etkinlik' ? `<div class="quote"><small>Aranan ortak</small>${esc(e.seeking)}</div>` : ''}
        ${mine && e.status === 'rejected' && e.note ? `<div class="quote"><small>UniPakt notu</small>${esc(e.note)}</div>` : ''}
        <div class="meta">
          <span>${fmtDay(e.date)}${e.time ? ` · ${esc(e.time)}` : ''}</span>
          ${e.place ? `<span>${esc(e.place)}</span>` : ''}
          <span>Organizatör: ${esc(organizerNames(e).join(', '))}</span>
        </div>
        ${partners.length ? `<div class="meta"><span>Ortaklar:</span>${partners.map((p) => `<span class="tag ok">${esc(who(p.clubId))}</span>`).join('')}</div>` : ''}
        ${isAdmin() && page === 'ortak' && waiting.length ? `<div class="apps"><small>Onay bekleyen ortaklık başvuruları</small>${waiting.map((p) => applicationRow(e, p)).join('')}</div>` : ''}
        ${acts.length ? `<div class="actions">${acts.join('')}</div>` : ''}
      </div>
    </article>`;
  };

  const applicationRow = (e, p) => `
    <div class="app-row">
      <p><strong>${esc(who(p.clubId))}</strong>${p.note ? ` — ${esc(p.note)}` : ''}</p>
      <div class="actions">
        <button class="btn small" data-act="app-approve" data-id="${e.id}" data-sub="${p.id}">Onayla</button>
        <button class="btn ghost small" data-act="app-reject" data-id="${e.id}" data-sub="${p.id}">Reddet</button>
      </div>
    </div>`;

  const FILE_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'application/pdf'];
  const proofFile = (f, taskId) => {
    if (f && f.path) return `<button type="button" class="proof" data-act="proof-open" data-id="${esc(taskId)}"><span>Ek: ${esc(f.name)}</span></button>`;
    if (!f || !FILE_TYPES.includes(f.type) || !String(f.data).startsWith(`data:${f.type};base64,`)) return '';
    const image = f.type.startsWith('image/');
    return `<a class="proof ${image ? 'is-image' : ''}" href="${esc(f.data)}" download="${esc(f.name)}">${image ? `<img src="${esc(f.data)}" alt="">` : ''}<span>Ek: ${esc(f.name)}</span></a>`;
  };
  const taskCard = (t) => {
    const late = t.status === 'open' && t.due && t.due < today();
    return `
    <article class="card item">
      <div class="meta top">
        ${t.status === 'done' ? '<span class="tag ok">Tamamlandı</span>' : late ? '<span class="tag no">Gecikti</span>' : '<span class="tag wait">Açık</span>'}
        ${isAdmin() ? `<span>${esc(who(t.clubId))}</span>` : ''}
        ${t.due ? `<span>Son tarih: ${fmtDay(t.due)}</span>` : ''}
      </div>
      <h3>${esc(t.title)}</h3>
      ${t.desc ? `<p class="body">${esc(t.desc)}</p>` : ''}
      ${t.status === 'done' ? `<div class="quote"><small>Kanıt · ${fmtStamp(t.doneAt)}${t.reviewStatus === 'pending' ? ' · UniPakt incelemesinde' : t.reviewStatus === 'approved' ? ' · UniPakt onayladı' : ''}</small>${esc(t.doneText || '')}${proofFile(t.doneFile, t.id)}</div>` : ''}
      ${t.reviewStatus === 'rejected' ? `<div class="quote"><small>UniPakt red notu</small>${esc(t.reviewNote || '')}</div>` : ''}
      <div class="actions">
        ${!isAdmin() && t.status === 'open' ? `<button class="btn small" data-act="task-done" data-id="${t.id}">Görevi bitir</button>` : ''}
        ${isAdmin() ? `${t.status === 'done' && t.reviewStatus === 'pending' ? `<button class="btn small" data-act="task-approve" data-id="${t.id}">Onayla</button><button class="btn ghost small" data-act="task-reject" data-id="${t.id}">Reddet</button>` : ''}<button class="btn ghost small" data-act="task-remove" data-id="${t.id}">Sil</button>` : ''}
      </div>
    </article>`;
  };

  const views = {
    genel() {
      const events = upcomingEvents().slice(0, 3);
      const eventsBlock = `
        <div>
          <div class="section-head"><h2>Yaklaşan etkinlikler</h2><button class="link-btn" data-go="takvim">Takvim</button></div>
          ${events.length ? `<div class="card">${events.map((e) => `
            <div class="mini-row"><div><strong>${esc(e.title)}</strong><small>${fmtDay(e.date)}${e.time ? ` · ${esc(e.time)}` : ''} · ${esc(who(e.ownerId))}</small></div></div>`).join('')}</div>`
            : empty('Yaklaşan etkinlik yok.')}
        </div>`;

      if (isAdmin()) {
        const pend = [
          ...pendingAnnouncements().map((a) => ({ kind: 'Duyuru', title: a.title, by: who(a.authorId) })),
          ...pendingEvents().map((e) => ({ kind: kindLabel(e), title: e.title, by: who(e.ownerId) })),
          ...pendingCalendar().map((e) => ({ kind: 'Takvim talebi', title: e.title, by: who(e.ownerId) })),
        ];
        const done = db.tasks.filter((t) => t.status === 'done').sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt))).slice(0, 3);
        return `
          ${head('Genel Bakış', 'Ağda bugün olan biten, tek ekranda.')}
          <div class="stats">
            <button class="stat ${pend.length ? 'hot' : ''}" data-go="onaylar"><b>${pend.length}</b><span>Bekleyen onay</span></button>
            <button class="stat" data-go="duyurular"><b>${publishedAnnouncements().length}</b><span>Yayındaki duyuru</span></button>
            <button class="stat" data-go="etkinlikler"><b>${upcomingEvents().length}</b><span>Yaklaşan etkinlik</span></button>
            <button class="stat" data-go="gorevler"><b>${db.tasks.filter((t) => t.status === 'open').length}</b><span>Açık görev</span></button>
          </div>
          <div class="grid-2" style="margin-top:34px">
            <div>
              <div class="section-head"><h2>Onay bekleyenler</h2><button class="link-btn" data-go="onaylar">Tümü</button></div>
              ${pend.length ? `<div class="card">${pend.slice(0, 5).map((p) => `
                <div class="mini-row"><div><strong>${esc(p.title)}</strong><small>${esc(p.kind)} · ${esc(p.by)}</small></div><span class="tag wait">Bekliyor</span></div>`).join('')}</div>`
                : empty('Bekleyen işlem yok.')}
            </div>
            ${eventsBlock}
            <div>
              <div class="section-head"><h2>Son biten görevler</h2><button class="link-btn" data-go="gorevler">Görevler</button></div>
              ${done.length ? `<div class="card">${done.map((t) => `
                <div class="mini-row"><div><strong>${esc(t.title)}</strong><small>${esc(who(t.clubId))} · ${fmtStamp(t.doneAt)}</small></div><span class="tag ok">Bitti</span></div>`).join('')}</div>`
                : empty('Henüz biten görev yok.')}
            </div>
            <div>
              <div class="section-head"><h2>Vanguard ilk üç</h2><button class="link-btn" data-go="vanguard">Sıralama</button></div>
              <div class="card">${ranking().slice(0, 3).map((c, i) => `
                <div class="mini-row"><div><strong>${i + 1}. ${esc(c.name)}</strong><small>${esc(c.uni)}</small></div><strong>${c.points}</strong></div>`).join('')}</div>
            </div>
          </div>`;
      }

      const me = club(state.user);
      const rank = ranking().findIndex((c) => c.id === state.user) + 1;
      const myOpen = visibleTasks().filter((t) => t.status === 'open');
      const myPending = db.announcements.filter((a) => a.authorId === state.user && a.status === 'pending').length
        + db.events.filter((e) => e.ownerId === state.user && e.status === 'pending').length
        + db.events.flatMap((e) => e.applications).filter((p) => p.clubId === state.user && p.status === 'pending').length;
      const latest = publishedAnnouncements().slice(0, 3);
      return `
        ${head('Genel Bakış', `${me.name} · ${me.uni}`)}
        <div class="stats">
          <button class="stat hot" data-go="vanguard"><b>${pts(state.user)}</b><span>Vanguard puanı · ${rank}. sıra</span></button>
          <button class="stat" data-go="gorevler"><b>${myOpen.length}</b><span>Açık görev</span></button>
          <button class="stat" data-go="basvuru"><b>${myPending}</b><span>Onay bekleyen başvurun</span></button>
          <button class="stat" data-go="etkinlikler"><b>${upcomingEvents().length}</b><span>Yaklaşan etkinlik</span></button>
        </div>
        <div class="grid-2" style="margin-top:34px">
          <div>
            <div class="section-head"><h2>Görevlerin</h2><button class="link-btn" data-go="gorevler">Tümü</button></div>
            ${myOpen.length ? `<div class="card">${myOpen.slice(0, 4).map((t) => `
              <div class="mini-row"><div><strong>${esc(t.title)}</strong><small>${t.due ? `Son tarih: ${fmtDay(t.due)}` : 'Son tarih yok'}</small></div>${t.due && t.due < today() ? '<span class="tag no">Gecikti</span>' : '<span class="tag wait">Açık</span>'}</div>`).join('')}</div>`
              : empty('Açık görevin yok.')}
          </div>
          ${eventsBlock}
          <div style="grid-column:1/-1">
            <div class="section-head"><h2>Son duyurular</h2><button class="link-btn" data-go="duyurular">Tümü</button></div>
            ${latest.length ? `<div class="card">${latest.map((a) => `
              <div class="mini-row"><div><strong>${esc(a.title)}</strong><small>${esc(who(a.authorId))} · ${fmtStamp(a.decidedAt || a.createdAt)}</small></div></div>`).join('')}</div>`
              : empty('Henüz duyuru yok.')}
          </div>
        </div>`;
    },

    'destek-taleplerim'() { return SUPPORT_CLUB_TICKETS ? renderSupportTickets() : empty('Destek bölümü henüz kullanıma açılmadı.'); },

    bildirimler() {
      const list = [...(db.notifications || [])].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
      const row = (n) => { const app = notificationApplication(n); const pending = n.type === 'partnership_application' ? !!(app?.p.status === 'pending') : (n.actionable && !n.resolved); return `<article class="card item notification ${!n.readAt ? 'unread' : ''}"><div class="meta top"><span class="tag ${pending?'wait':'ok'}">${pending?'İşlem bekliyor':'Bilgi'}</span><span>${fmtStamp(n.createdAt)}</span></div><h3>${esc(n.title)}</h3><p class="body">${esc(n.body)}</p><div class="actions">${n.type === 'partnership_application' ? notificationAction(n) : (pending ? notificationAction(n) : '')}${!n.readAt ? `<button class="btn ghost small" data-act="notif-read" data-id="${esc(n.id)}">Okundu</button>` : ''}${!pending ? `<button class="btn ghost small" data-act="notif-delete" data-id="${esc(n.id)}">Sil</button>` : ''}</div></article>`; };
      return `${head('Bildirimler','Talepler, sonuçlar ve seninle ilgili önemli gelişmeler. Sonuçlandırılmamış talepler silinemez.')}${list.length ? `<div class="stack">${list.map(row).join('')}</div>` : empty('Henüz bildirimin yok.')}`;
    },

    etkinliklerim() {
      const mine = isAdmin() ? db.events.filter(e=>e.status==='published' && (e.ownerId===ADMIN || e.applications.some(p=>p.status==='approved'))) : db.events.filter(e=>e.status==='published' && (e.ownerId===state.user || e.applications.some(p=>p.status==='approved'&&p.clubId===state.user)));
      const card = (e) => { const partners=e.applications.filter(p=>p.status==='approved'); const host=e.ownerId; const related=!isAdmin()&&host!==state.user; const contact=(id)=>{const c=club(id); if(!c)return ''; return Object.entries(c.contact||{}).filter(([,v])=>v).map(([k,v])=>`<span class="contact-chip"><b>${esc(k)}:</b> ${esc(v)}</span>`).join(' · ')}; return `<article class="card item"><div class="meta top"><span class="tag ${related?'ok':'wait'}">${related?'Ortaksın':'Host'}</span><span>${fmtDay(e.date)}</span></div><h3>${esc(e.title)}</h3><p class="body">Organizatör: ${esc(organizerNames(e).join(', '))}</p><div class="meta"><span><strong>Host iletişim:</strong> ${host===ADMIN?esc('UniPakt'):(contact(host)||esc('İletişim bilgisi yok'))}</span></div><div class="section-head"><h3>Ortaklar</h3></div>${partners.length?`<div class="stack">${partners.map(p=>`<div class="mini-row"><div><strong>${esc(who(p.clubId))}</strong><small>${contact(p.clubId)||esc('İletişim bilgisi yok')}</small></div>${isAdmin()?`<button class="btn danger small" data-act="partner-remove" data-id="${esc(e.id)}" data-sub="${esc(p.clubId)}">Ayır</button>`:''}</div>`).join('')}</div>`:empty('Henüz onaylı ortak yok.')}<div class="actions">${isAdmin()&&host===ADMIN?`<button class="btn small" data-act="event-task" data-id="${esc(e.id)}">Bu etkinlik için görev ata</button>`:''}</div></article>`; };
      return `${head('Etkinliklerim','Host olduğun veya ortak olduğun etkinlikler ve ortakların iletişim bilgileri.')}${mine.length?`<div class="stack">${mine.map(card).join('')}</div>`:empty('Henüz etkinliğin yok.')}`;
    },

    duyurular() {
      const list = publishedAnnouncements();
      return `
        ${head('Duyurular',
          isAdmin() ? 'Senin yayınladıkların ve onay verdiğin kulüp duyuruları. Tüm kulüp başkanları görür.'
                    : 'UniPakt’ın yayınladığı ve onayladığı duyurular.',
          isAdmin() ? '<button class="btn" data-act="ann-new">Yeni duyuru</button>' : '<button class="btn ghost" data-go="basvuru">Duyuru başvurusu</button>')}
        <div class="stack">${list.length ? list.map((a) => announcementCard(a)).join('') : empty('Henüz yayında duyuru yok.')}</div>`;
    },

    etkinlikler() {
      const list = calendarEvents();
      const upcoming = list.filter((e) => e.date >= today());
      const past = list.filter((e) => e.date < today()).reverse();
      return `
        ${head('Etkinlikler',
          isAdmin() ? 'Takvimdeki etkinlikler. “Yeni etkinlik” doğrudan takvime düşer; “Yeni ortak etkinlik” Ortak Arama sayfasına düşer.'
                    : 'Takvimdeki etkinlikler. Kendi etkinliğini ekle; UniPakt onaylayınca takvime düşer.',
          isAdmin() ? '<div class="head-actions"><button class="btn" data-act="event-new" data-id="event">Yeni etkinlik</button><button class="btn ghost" data-act="event-new" data-id="partner">Yeni ortak etkinlik</button></div>'
                    : '<button class="btn" data-act="event-new" data-id="event">Yeni etkinlik</button>')}
        <div class="stack">${upcoming.length ? upcoming.map((e) => eventCard(e)).join('') : empty('Yaklaşan etkinlik yok.')}</div>
        ${past.length ? `<div class="section-head"><h2>Geçmiş etkinlikler</h2></div><div class="stack">${past.map((e) => eventCard(e)).join('')}</div>` : ''}`;
    },

    ortak() {
      const list = partnerEvents();
      const upcoming = list.filter((e) => e.date >= today());
      const past = list.filter((e) => e.date < today()).reverse();
      return `
        ${head('Ortak Arama',
          isAdmin() ? 'Ortak arayan etkinlikler. Ortaklık başvurularını onayla; bir etkinliği “Yayına al” ile takvime gönder.'
                    : 'Ortak arayan etkinlikler. Birine ortak olmak için başvur. Kendi etkinliğini takvime almak için yayına alma talebi gönder.',
          `<button class="btn" data-act="event-new" data-id="partner">${isAdmin() ? 'Yeni ortak etkinlik' : 'Ortak arıyorum'}</button>`)}
        <div class="stack">${upcoming.length ? upcoming.map((e) => eventCard(e, 'ortak')).join('') : empty('Şu an ortak arayan etkinlik yok.')}</div>
        ${past.length ? `<div class="section-head"><h2>Geçmiş</h2></div><div class="stack">${past.map((e) => eventCard(e, 'ortak')).join('')}</div>` : ''}`;
    },

    takvim() {
      const { y, m, sel } = state.cal;
      const first = new Date(y, m, 1);
      const offset = (first.getDay() + 6) % 7;            // Monday first
      const days = new Date(y, m + 1, 0).getDate();
      const cells = Math.ceil((offset + days) / 7) * 7;
      const items = {};
      const add = (date, entry) => { (items[date] = items[date] || []).push(entry); };
      calendarEvents().forEach((e) => add(e.date, { type: 'event', title: e.title, sub: `${e.time ? `${e.time} · ` : ''}${e.place || ''}`, by: who(e.ownerId) }));
      visibleTasks().filter((t) => t.status === 'open' && t.due).forEach((t) => add(t.due, { type: 'task', title: t.title, sub: 'Görev son tarihi', by: who(t.clubId) }));
      const t = today();
      let grid = DOW.map((d) => `<div class="cal-dow">${d}</div>`).join('');
      for (let i = 0; i < cells; i++) {
        const d = new Date(y, m, i - offset + 1);
        const key = ymd(d);
        const list = items[key] || [];
        const cls = ['cal-day', d.getMonth() !== m ? 'out' : '', key === t ? 'today' : '', key === sel ? 'selected' : '', i >= cells - 7 ? 'last-row' : ''].filter(Boolean).join(' ');
        grid += `<button class="${cls}" data-act="cal-pick" data-id="${key}" aria-label="${fmtDay(key)}${list.length ? `, ${list.length} kayıt` : ''}">
          <span class="num">${d.getDate()}</span>
          <span class="chips">${list.slice(0, 3).map((x) => `<span class="cal-chip ${x.type === 'task' ? 'task' : ''}">${esc(x.title)}</span>`).join('')}</span>
        </button>`;
      }
      const selected = items[sel] || [];
      return `
        ${head('Takvim', 'Takvime alınan etkinlikler ve görev son tarihleri. Buradaki etkinlikler unipakt.com’daki takvimde de görünür.')}
        <div class="cal-head">
          <h2>${MONTHS[m]} ${y}</h2>
          <div class="row">
            <button class="btn ghost small" data-act="cal-move" data-id="-1" aria-label="Önceki ay">‹ Önceki</button>
            <button class="btn ghost small" data-act="cal-today">Bugün</button>
            <button class="btn ghost small" data-act="cal-move" data-id="1" aria-label="Sonraki ay">Sonraki ›</button>
          </div>
        </div>
        <div class="cal-grid">${grid}</div>
        <div class="cal-legend"><span><i></i>Etkinlik</span><span><i class="task"></i>Görev son tarihi</span></div>
        <div class="section-head"><h2>${fmtDay(sel)}</h2></div>
        ${selected.length ? `<div class="card">${selected.map((x) => `
          <div class="mini-row"><div><strong>${esc(x.title)}</strong><small>${esc([x.sub, x.by].filter(Boolean).join(' · '))}</small></div><span class="tag ${x.type === 'task' ? '' : 'wait'}">${x.type === 'task' ? 'Görev' : 'Etkinlik'}</span></div>`).join('')}</div>`
          : empty('Bu günde kayıt yok.')}`;
    },

    gorevler() {
      let list = visibleTasks();
      if (isAdmin() && state.taskClub !== 'all') list = list.filter((t) => t.clubId === state.taskClub);
      const open = list.filter((t) => t.status === 'open').sort((a, b) => String(a.due || '9').localeCompare(String(b.due || '9')));
      const done = list.filter((t) => t.status === 'done').sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt)));
      const shown = state.taskTab === 'done' ? done : open;
      return `
        ${head('Görevler',
          isAdmin() ? 'Kulüplere görev ata, bitirdiklerinde bıraktıkları kanıtları gör.'
                    : 'UniPakt’ın kulübüne atadığı görevler. Bitirdiğinde kanıtını mesaj ya da dosya olarak bırak.',
          isAdmin() ? '<button class="btn" data-act="task-new">Görev ata</button>' : '')}
        <div class="toolbar">
          <button class="chip ${state.taskTab === 'open' ? 'active' : ''}" data-act="task-tab" data-id="open">Açık (${open.length})</button>
          <button class="chip ${state.taskTab === 'done' ? 'active' : ''}" data-act="task-tab" data-id="done">Biten (${done.length})</button>
          ${isAdmin() ? `<select id="taskClub" aria-label="Kulübe göre süz">
            <option value="all">Tüm kulüpler</option>
            ${[...db.clubs].sort(byLabel).map((c) => `<option value="${esc(c.id)}" ${state.taskClub === c.id ? 'selected' : ''}>${esc(clubLabel(c))}</option>`).join('')}
          </select>` : ''}
        </div>

            <h3>${esc(a.title)}</h3><p class="body">${esc(a.body)}</p>

        <div class="section-head"><h2>Etkinlik düzenleme talepleri (${pendingEventEdits().length})</h2></div>
        <div class="stack">${pendingEventEdits().length ? pendingEventEdits().map((q) => { const e=db.events.find(x=>x.id===q.eventId); const c=q.changes||{}; const summary=[c.title&&`Başlık: ${c.title}`,c.university&&`Üniversite: ${c.university}`,c.place&&`Mekan: ${c.place}`,c.address&&`Adres: ${c.address}`,c.date&&`Tarih: ${c.date}${c.time?' · '+c.time:''}`,c.feeType&&`Ücret: ${c.feeType==='paid'?`Ücretli · ${c.feeAmount||0} TL`:'Ücretsiz'}`].filter(Boolean).join('\n'); return `<article class="card item"><div class="meta top"><span class="tag wait">Düzenleme</span><span>${esc(who(q.clubId))} · ${fmtStamp(q.createdAt)}</span></div><h3>${esc(e?.title || c.title || 'Etkinlik')}</h3>${c.posterUrl ? `<div class="approval-poster"><img src="${esc(c.posterUrl)}" alt="Yeni etkinlik afişi" loading="lazy"></div>` : ''}<div class="quote"><small>Değişiklik özeti</small>${esc(summary || 'Etkinlik detayları güncellendi.')}</div><div class="actions"><button class="btn small" data-act="event-edit-approve" data-id="${esc(q.id)}">Onayla</button><button class="btn ghost small" data-act="event-edit-reject" data-id="${esc(q.id)}">Reddet</button></div></article>`; }).join('') : empty('Bekleyen etkinlik düzenleme isteği yok.')}</div>

    vanguard() {
      const list = ranking();
      const max = Math.max(1, ...list.map((c) => c.points));
      const newest = (a, b) => String(b.at).localeCompare(String(a.at));
      const logRows = (log, withClub) => log.map((l) => {
        const rawNote = l.note || '';
        const marker = ' · Açıklama: ';
        let generatedDetail = rawNote;
        let userNote = '';
        const markerIndex = rawNote.indexOf(marker);
        if (markerIndex >= 0) {
          generatedDetail = rawNote.slice(0, markerIndex);
          userNote = rawNote.slice(markerIndex + marker.length);
        } else {
          // Eski kayıtlar için: hesaplama metninin sonundaki serbest açıklamayı ayır.
          const legacyMatch = rawNote.match(/^(.* · Yuvarlanan: [^ ·]+)(?: · (.+))$/);
          if (legacyMatch) {
            generatedDetail = legacyMatch[1];
            userNote = legacyMatch[2];
          }
        }
        const eventId = l.eventId || '';
        const pointId = l.id || '';
        const meta = [withClub ? (l.label || OTHER) : '', fmtStamp(l.at)].filter(Boolean).join(' · ');
        const hasDetails = !!(generatedDetail || userNote || eventId || (withClub && pointId));
        return `
        <div class="mini-row" data-point-row data-point-id="${esc(pointId)}">
          <div style="min-width:0">
            <strong>${esc(withClub ? who(l.clubId) : l.label || OTHER)}</strong>
            <small>${esc(meta)}</small>
            <div data-point-detail hidden style="margin-top:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2,#111);line-height:1.55">
              ${withClub && pointId ? `<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)"><small style="display:block;opacity:.65">Puan ID</small><span style="word-break:break-all">${esc(pointId)}</span></div>` : ''}
              ${eventId ? `<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)"><small style="display:block;opacity:.65">Etkinlik ID</small><span style="word-break:break-all">${esc(eventId)}</span></div>` : ''}
              ${generatedDetail ? `<div style="${userNote ? 'margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);' : ''}"><small style="display:block;opacity:.65;margin-bottom:4px">Puan değerlendirmesi</small><span style="white-space:normal">${esc(generatedDetail)}</span></div>` : ''}
              ${userNote ? `<div><small style="display:block;opacity:.65;margin-bottom:4px">Açıklama</small><span style="white-space:normal">${esc(userNote)}</span></div>` : ''}
            </div>
          </div>
          <div class="actions" style="align-items:center;gap:8px">
            ${hasDetails ? `<button class="btn ghost small" type="button" data-act="point-details" data-id="${esc(pointId)}">Detaylar</button>` : ''}
            <span class="delta ${l.delta >= 0 ? 'up' : 'down'}">${signed(l.delta)}</span>
          </div>
        </div>`;
      }).join('');
      const board = `
        <div class="card" style="padding:0;overflow:hidden">
          ${list.map((c, i) => `
            <div class="rank-row ${c.id === state.user ? 'mine' : ''}">
              <span class="pos">${i + 1}</span>
              <div><strong>${esc(c.name)}</strong><small>${esc(c.uni)}</small><div class="bar"><i style="width:${Math.max(0, Math.round(c.points / max * 100))}%"></i></div></div>
              <div class="pts"><b>${c.points}</b>
                ${isAdmin() ? `<button class="btn ghost small" data-act="pts-new" data-id="${c.id}">Puan ver</button>` : ''}</div>
            </div>`).join('')}
        </div>`;

      if (isAdmin()) {
        const log = [...db.pointLog].sort(newest).slice(0, 12);
        return `
          ${head('UniPakt<span>.</span>Vanguard', 'Kulüp seç, etkinliği seç, artı ya da eksi puanı gönder. Kulüp, puanın hangi etkinlikten geldiğini kendi panelinde görür.',
            '<button class="btn" data-act="pts-new">Puan gönder</button>')}
          ${board}
          <div class="section-head"><h2>Son puan hareketleri</h2></div>
          ${log.length ? `<div class="card">${logRows(log, true)}</div>` : empty('Henüz puan hareketi yok.')}`;
      }

      const mine = db.pointLog.filter((l) => l.clubId === state.user);
      const sources = [];
      [...mine].sort((a, b) => String(a.at).localeCompare(String(b.at))).forEach((l) => {
        const label = l.label || OTHER;
        let row = sources.find((x) => x.label === label);
        if (!row) sources.push(row = { label, total: 0 });
        row.total += l.delta;
      });
      const top = Math.max(1, ...sources.map((x) => Math.abs(x.total)));
      const rank = list.findIndex((c) => c.id === state.user) + 1;
      return `
        ${head('UniPakt<span>.</span>Vanguard', 'Kazandığın puanlar ve hangi etkinliklerden geldikleri.')}
        <div class="stats two">
          <div class="stat hot"><b>${pts(state.user)}</b><span>Toplam puan</span></div>
          <div class="stat"><b>${rank}.</b><span>${list.length} kulüp arasında sıran</span></div>
        </div>
        <div class="section-head"><h2>Puanların nereden geldi</h2></div>
        ${sources.length ? `<div class="card chart" role="img" aria-label="Etkinliklere göre puan dağılımı">${sources.map((x) => `
          <div class="chart-row">
            <span class="chart-label">${esc(x.label)}</span>
            <span class="chart-track"><i class="${x.total < 0 ? 'down' : ''}" style="width:${Math.max(2, Math.round(Math.abs(x.total) / top * 100))}%"></i></span>
            <span class="delta ${x.total >= 0 ? 'up' : 'down'}">${signed(x.total)}</span>
          </div>`).join('')}</div>` : empty('Henüz puan kazanmadın.')}
        <div class="section-head"><h2>Puan hareketlerin</h2></div>
        ${mine.length ? `<div class="card">${logRows([...mine].sort(newest), false)}</div>` : empty('Henüz puan hareketi yok.')}
        <div class="section-head"><h2>Ağ sıralaması</h2></div>
        ${board}`;
    },

    kulupler() {
      if (state.accounts === null) {
        state.accounts = 'loading';
        api.accounts().then((map) => { state.accounts = map; }, () => { state.accounts = 'unavailable'; })
          .then(() => { if (state.view === 'kulupler' && state.user && !dlg.open) render(); });
      }
      const accountLine = (c) => {
        if (state.accounts === 'loading') return 'Giriş hesabı: yükleniyor…';
        if (state.accounts === 'unavailable') return 'Giriş hesabı: bilgi alınamadı';
        const email = state.accounts[c.id];
        return email ? `Giriş hesabı: ${esc(email)}` : '<span class="tag no">Giriş hesabı yok</span>';
      };
      const list = [...db.clubs].sort((a, b) => a.name.localeCompare(b.name, 'tr'));
      return `
        ${head('Kulüpler', 'Buradaki kulüpler unipakt.com’daki Ortak Kulüpler sayfasında görünür. İletişim bilgilerini değiştirdiğinde sitede de değişir.',
          '<button class="btn" data-act="club-new">Kulüp ekle</button>')}
        <div class="stack">${list.length ? list.map((c) => {
          const filled = CONTACT_KEYS.filter(([k]) => c.contact && c.contact[k]);
          return `
          <article class="card item">
            <div class="meta top">${c.category ? `<span class="tag">${esc(c.category)}</span>` : '<span class="tag wait">Kategori yok</span>'}<span>${esc(c.uni)}</span></div>
            <h3>${esc(c.name)}</h3>
            <div class="meta">${filled.length ? filled.map(([k, label]) => {
              const link = contactLink(k, c.contact[k]);
              return link ? `<span>${label}: <a href="${esc(link.href)}" ${k === 'email' ? '' : 'target="_blank" rel="noopener noreferrer"'}>${esc(link.text)}</a></span>`
                : `<span class="bad">${label}: ${esc(c.contact[k])} (geçersiz, sitede görünmez)</span>`;
            }).join('') : '<span>İletişim bilgisi eklenmemiş</span>'}</div>
            <div class="meta"><span>${accountLine(c)}</span></div>
            <div class="actions">
              <button class="club-visibility ${c.visible === false ? 'is-hidden' : ''}" data-act="club-visibility" data-id="${esc(c.id)}" aria-label="${c.visible === false ? 'Kulübü sitede görünür yap' : 'Kulübü sitede gizle'}" title="${c.visible === false ? 'Sitede görünür yap' : 'Sitede gizle'}">
                ${c.visible === false
                  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 4.3A11.8 11.8 0 0 1 12 4c5.5 0 9.5 5.7 9.5 8s-1.4 3.4-3.3 4.9"/><path d="M6.1 6.1C3.9 7.7 2.5 10.3 2.5 12c0 2.3 4 8 9.5 8 1 0 2-.2 2.9-.6"/></svg>'
                  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"/><circle cx="12" cy="12" r="2.5"/></svg>'}
              </button>
              <button class="btn ghost small" data-act="club-edit" data-id="${esc(c.id)}">Düzenle</button>
              <button class="btn danger small" data-act="club-remove" data-id="${esc(c.id)}">Sil</button>
            </div>
          </article>`; }).join('') : empty('Henüz kulüp yok.')}</div>`;
    },

    basvuru() {
      const anns = db.announcements.filter((a) => a.authorId === state.user).sort(byNewest);
      const evs = db.events.filter((e) => e.ownerId === state.user).sort(byNewest);
      const apps = db.events.flatMap((e) => e.applications.filter((p) => p.clubId === state.user).map((p) => ({ event: e, app: p })))
        .sort((a, b) => byNewest(a.app, b.app));
      return `
        ${head('Duyuru ve Etkinlik Başvurusu', 'Gönderdiklerin UniPakt’ın Onaylamalar sekmesine düşer. Onaylanınca tüm kulüp başkanları görür.')}
        <div class="grid-3">
          <div class="card item"><h3>Duyuru gönder</h3><p class="body">Diğer kulüplerin görmesini istediğin duyuruyu yaz.</p>
            <div class="actions"><button class="btn" data-act="ann-new">Duyuru başvurusu</button></div></div>
          <div class="card item"><h3>Etkinlik ekle</h3><p class="body">Ortak aramadan, etkinliğini doğrudan takvime göndermek için.</p>
            <div class="actions"><button class="btn" data-act="event-new" data-id="event">Etkinlik başvurusu</button></div></div>
          <div class="card item"><h3>Etkinliğine ortak ara</h3><p class="body">Etkinliğin detaylarını ve nasıl bir ortak aradığını yaz.</p>
            <div class="actions"><button class="btn" data-act="event-new" data-id="partner">Ortak arama başvurusu</button></div></div>
        </div>
        <div class="section-head"><h2>Duyuru başvuruların</h2></div>
        <div class="stack">${anns.length ? anns.map((a) => announcementCard(a, { mine: true })).join('') : empty('Henüz duyuru başvurun yok.')}</div>
        <div class="section-head"><h2>Etkinlik başvuruların</h2></div>
        <div class="stack">${evs.length ? evs.map((e) => eventCard(e, 'mine')).join('') : empty('Henüz etkinlik başvurun yok.')}</div>
        <div class="section-head"><h2>Ortaklık başvuruların</h2></div>
        ${apps.length ? `<div class="card">${apps.map(({ event, app }) => `
          <div class="mini-row"><div><strong>${esc(event.title)}</strong><small>${fmtDay(event.date)} · ${esc(who(event.ownerId))}</small></div><div class="actions">${tag(app.status)}${app.status === 'rejected' ? `<button class="btn danger small" data-act="rejected-app-delete" data-id="${esc(app.id)}" data-sub="${esc(event.id)}">Sil</button>` : ''}</div></div>`).join('')}</div>`
          : empty('Henüz bir etkinliğe ortaklık başvurun yok.')}`;
    },
  };

  /* ------------------------------------------------------------------
     ACTIONS
     ------------------------------------------------------------------ */
  const rejectWithNote = (title, apply) => openForm({
    title, lead: 'İstersen kulübe kısa bir not bırak.',
    fields: field('Not (isteğe bağlı)', '<textarea name="note" maxlength="400"></textarea>'),
    submit: 'Reddet', danger: true,
    onSubmit: async (fd) => { await apply(val(fd, 'note')); toast('Reddedildi.'); },
  });
  const confirmRemove = (title, lead, apply, submit = 'Kaldır') => openForm({
    title, lead, submit, danger: true,
    onSubmit: async () => { await apply(); toast(submit === 'Sil' ? 'Silindi.' : 'Kaldırıldı.'); },
  });

  const actions = {
    'support-ticket-new'() {
      if (isAdmin() || !SUPPORT_CLUB_TICKETS || SUPPORT_MEMBER_TICKETS) return;

      const categoryCards = Object.entries(SUPPORT_CATEGORIES).map(([key, cfg]) => `
        <button type="button" class="support-category-card" data-support-category="${key}">
          <strong>${esc(cfg.label)}</strong>
          <span>${esc(cfg.description)}</span>
        </button>`).join('');

      const renderCategory = (kind) => {
        const cfg = SUPPORT_CATEGORIES[kind];
        const options = cfg.options.map((option) => `<option value="${esc(option)}">${esc(option)}</option>`).join('');
        const events = kind === 'event' ? supportEventOptions() : [];
        const eventField = kind === 'event'
          ? field('Etkinlik', `<select name="eventId" required><option value="">Etkinlik seçiniz</option><option value="__none__">Etkinlik dışı — belirli bir etkinlikle ilgili değil</option>${events.map((e) => `<option value="${esc(e.id)}">${esc(e.title)} · ${esc(e.date ? fmtDay(e.date) : '')}</option>`).join('')}</select>`)
          : '';
        const otherField = `<div data-support-other style="display:none">${field('Konu başlığı', `<input name="subject" maxlength="160" placeholder="${esc(cfg.otherPlaceholder)}">`)}</div>`;
        let info = '';
        if (kind === 'technical') {
          info = `<div class="support-info"><strong>Bilgilendirme</strong><p><strong>UniPakt.</strong> tarafından geliştirilen UniPakt.Panel, kullanıcı deneyimlerinden elde edilen geri bildirimler doğrultusunda sürekli olarak geliştirilmektedir. Bununla birlikte, tüm dijital sistemlerde olduğu gibi teknik sorunlar veya beklenmeyen durumlarla karşılaşılması mümkündür.</p><p>Sorunun hangi işlem sırasında meydana geldiğini, beklediğiniz sonucu ve karşılaştığınız durumu mümkün olduğunca ayrıntılı şekilde belirtmeniz, destek sürecinin daha hızlı ilerlemesine yardımcı olacaktır.</p></div>`;
        }
        if (kind === 'community') {

        submit: 'Talep oluştur',
        onSubmit: async (fd) => {
          const kind = fd.get('supportKind');

          const subject = topic === 'Başka bir konu...' ? val(fd, 'subject').trim() : topic;
          if (!kind || !topic || !subject) throw new Error('Destek kategorisi ve konu zorunludur.');
          const file = fd.get('attachment');
          await api.supportCreate({
            subject,
            category: kind,
            categoryLabel: SUPPORT_CATEGORIES[kind].label,
            body: val(fd, 'body').trim(),
            eventId: val(fd, 'eventId') === '__none__' ? '' : val(fd, 'eventId'),
            attachment: file && file.size ? file : null,
          });

        },
      });

      const modal = dlg;
      if (!modal) return;
      const form = dlgForm;
      const detail = modal.querySelector('[data-support-detail]');
      const hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.name = 'supportKind';
      form.appendChild(hidden);

      const bindCategory = (kind) => {
        hidden.value = kind;
        modal.querySelectorAll('[data-support-category]').forEach((button) => {
          button.classList.toggle('active', button.dataset.supportCategory === kind);
        });
        detail.innerHTML = renderCategory(kind);
        detail.style.display = 'block';
        const topic = detail.querySelector('[data-support-topic]');
        const other = detail.querySelector('[data-support-other]');
        if (topic && other) {
          topic.addEventListener('change', () => {
            const isOther = topic.value === 'Başka bir konu...';
            other.style.display = isOther ? 'block' : 'none';
            if (!isOther) {
              const subject = detail.querySelector('[name="subject"]');
              if (subject) subject.value = '';
            }
          });
        }
      };
      modal.querySelectorAll('[data-support-category]').forEach((button) => {
        button.addEventListener('click', () => bindCategory(button.dataset.supportCategory));
      });

          toast(ids.length > 1 ? `Görev ${ids.length} kulübe atandı.` : 'Görev atandı.');
        },
      });
      const all = dlgForm.querySelector('#allClubs');
      const boxes = [...dlgForm.querySelectorAll('input[name="club"]')];
      const filter = dlgForm.querySelector('#clubFilter');
      // "Tüm kulüpler" works on what the search shows; ticks on hidden clubs are kept.
      const visible = () => boxes.filter((b) => !b.closest('label').hidden);
      const sync = () => {
        const shown = visible();
        all.checked = shown.length > 0 && shown.every((x) => x.checked);
        dlgForm.querySelector('#allClubsLabel').textContent = filter.value.trim() ? `Aramadaki kulüpler (${shown.length})` : 'Tüm kulüpler';
        dlgForm.querySelector('#pickCount').textContent = `${boxes.filter((b) => b.checked).length} seçili`;
        dlgForm.querySelector('#clubFilterEmpty').hidden = shown.length > 0;
      };
      filter.addEventListener('input', () => {
        const q = searchKey(filter.value);
        boxes.forEach((b) => { const label = b.closest('label'); label.hidden = !!q && !label.dataset.search.includes(q); });
        sync();
      });
      // Enter in the search box must not submit the form.
      filter.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });
      all.addEventListener('change', () => { visible().forEach((b) => { b.checked = all.checked; }); sync(); });
      boxes.forEach((b) => b.addEventListener('change', sync));
      sync();
      setTimeout(() => filter.focus(), 0);
    },
    'task-done'(id) {

      openForm({
        title: 'Görevi bitir', lead: `“${t.title}” için kanıtını bırak: mesaj, dosya ya da ikisi birden. UniPakt görür.`,
        fields: field('Mesaj', '<textarea name="text" maxlength="1500"></textarea>')

    // Opened before the request so the browser does not treat it as a pop-up.

      const tab = window.open('', '_blank');

    'pts-new'(id) {
      if (!isAdmin()) return;
      const events = [...publishedEvents()].reverse();
      const hostCategories = [
        ['org', 'Organizasyon Planlama', 10],
        ['ops', 'Operasyon Yönetimi', 10],
        ['participant', 'Katılımcı Memnuniyeti', 10],
        ['resource', 'Kaynak & Tesis Yönetimi', 5],
        ['fairness', 'Adalet & Sorumluluk', 9],
        ['innovation', 'Yenilik & Fikir Geliştirme', 6],
      ];
      const supportCategories = [
        ['supportDuty', 'Görev ve Sorumluluk Yönetimi', 12],
        ['supportOps', 'Operasyonel Katkı', 10],
        ['supportStaff', 'Personel Desteği', 4],
        ['supportTeam', 'Ekip Koordinasyonu', 4],
      ];
      const makeScoreFields = (categories) => categories.map(([name, label, max]) =>
        field(label, `<div class="field-row"><input type="number" name="${name}" min="0" max="100" step="1" value="0" placeholder="0–100"><span class="muted" data-score="${name}">0 / ${max}</span></div>`)
      ).join('');
      const clubOptions = db.clubs.map((c) => `<option value="${esc(c.id)}" ${c.id === id ? 'selected' : ''}>${esc(c.name)} — ${esc(c.uni || c.university || 'Üniversite belirtilmemiş')} (${pts(c.id)})</option>`).join('');
      const eventOptions = events.map((e) => `<option value="${esc(e.id)}">${esc(e.title)} · ${fmtDay(e.date)}</option>`).join('');

      openForm({
        title: 'Puan gönder',
        lead: 'Kulüp ve etkinliği seç. Sistem etkinlikteki rolünü otomatik belirleyip doğru puanlama aracını açar.',
        fields: field('Kulüp', `<select name="club" required><option value="">Kulüp seç</option>${clubOptions}</select>`)
          + field('Etkinlik', `<select name="event"><option value="">${OTHER}</option>${eventOptions}</select>`)
          + `<div data-role-status class="quote"><small>Rol</small>Etkinlik seçildiğinde kulübün Host veya Support rolü burada gösterilir.</div>`
          + `<div data-host-panel hidden><p class="form-section">Host değerlendirmesi · Standart toplam 50 puandır</p>${makeScoreFields(hostCategories)}<label class="checkline"><input type="checkbox" name="crisisBonus" value="5"><span><strong>Kriz Çözüm Bonusu</strong><small>Gerçek operasyonel kriz başarıyla çözüldüyse +5 puan</small></span><b data-crisis-value>+0</b></label><div class="card" style="margin-top:14px;padding:16px"><div class="mini-row"><div><strong>Standart toplam</strong><small>50 puan üzerinden</small></div><b data-standard-total>0 / 50</b></div><div class="mini-row"><div><strong>Kriz Çözüm Bonusu</strong><small>Bonus ayrı değerlendirilir</small></div><b data-bonus-total>+0</b></div><div class="mini-row"><div><strong>Genel toplam</strong><small>55 puan üzerinden</small></div><b data-grand-total>0 / 55</b></div></div></div>`
          + `<div data-support-panel hidden><p class="form-section">Support değerlendirmesi · Standart toplam 30 puandır</p>${makeScoreFields(supportCategories)}<label class="checkline"><input type="checkbox" name="supportBonus" value="5"><span><strong>Ek Sorumluluk Bonusu</strong><small>Ek sorumluluk başarıyla üstlenildiyse +5 puan</small></span><b data-support-bonus-value>+0</b></label><div class="card" style="margin-top:14px;padding:16px"><div class="mini-row"><div><strong>Standart toplam</strong><small>30 puan üzerinden</small></div><b data-support-standard-total>0 / 30</b></div><div class="mini-row"><div><strong>Ek Sorumluluk Bonusu</strong><small>Bonus ayrı değerlendirilir</small></div><b data-support-bonus-total>+0</b></div><div class="mini-row"><div><strong>Genel toplam</strong><small>35 puan üzerinden</small></div><b data-support-grand-total>0 / 35</b></div></div></div>`
          + `<div data-other-panel hidden>${field('Etkinlik dışı puan','<input type="number" name="otherDelta" step="1" placeholder="Örn. 20 veya -10">')}<p class="muted">Etkinlik seçilmezse puan doğrudan bu değer olarak kaydedilir.</p></div>`
          + field('Açıklama (isteğe bağlı)', '<input name="note" maxlength="120" placeholder="Değerlendirme notu">'),
        submit: 'Gönder',
        onSubmit: async (fd) => {
          const c = club(val(fd, 'club')); if (!c) return 'Bir kulüp seç.';
          const eventId = val(fd, 'event');
          const ev = db.events.find((e) => e.id === eventId);
          const userNote = val(fd, 'note');

          if (!ev) {
            const delta = Math.round(Number(fd.get('otherDelta')));
            if (!Number.isFinite(delta) || delta === 0) return 'Etkinlik dışı puan sıfırdan farklı olmalı.';
            await api.addPoints({ clubId: c.id, eventId: '', label: OTHER, delta, note: userNote });
            toast(`${c.name}: ${signed(delta)} puan`);
            return;
          }

          const isHost = ev.ownerId === c.id;
          const isSupport = ev.applications.some((p) => p.clubId === c.id && p.status === 'approved');
          if (!isHost && !isSupport) return 'Bu kulüp seçilen etkinlikte Host veya onaylı Support değil.';

          if (isHost) {
            const values = Object.fromEntries(hostCategories.map(([name]) => [name, Math.max(0, Math.min(100, Number(fd.get(name)) || 0))]));
            const standard = hostCategories.reduce((sum, [name, , max]) => sum + (values[name] * max / 100), 0);
            const crisis = fd.get('crisisBonus') ? 5 : 0;
            const rawTotal = standard + crisis;
            if (rawTotal <= 0) return 'En az bir değerlendirme puanı gir.';
            const total = Math.round(rawTotal);
            const breakdown = hostCategories.map(([name, label, max]) => `${label}: ${(values[name] * max / 100).toFixed(1)}/${max}`).join(' · ');
            const generatedNote = `${breakdown} · Kriz: +${crisis} · Hesaplanan: ${rawTotal.toFixed(1)}/55 · Yuvarlanan: ${total}/55`;
            const note = `${generatedNote}${userNote ? ` · Açıklama: ${userNote}` : ''}`;
            await api.addPoints({ clubId: c.id, eventId: ev.id, label: ev.title, delta: total, note });
            toast(`${c.name}: +${total} Host puanı`);
          } else {
            const values = Object.fromEntries(supportCategories.map(([name]) => [name, Math.max(0, Math.min(100, Number(fd.get(name)) || 0))]));
            const standard = supportCategories.reduce((sum, [name, , max]) => sum + (values[name] * max / 100), 0);
            const bonus = fd.get('supportBonus') ? 5 : 0;
            const rawTotal = standard + bonus;
            if (rawTotal <= 0) return 'En az bir değerlendirme puanı gir.';
            const total = Math.round(rawTotal);
            const breakdown = supportCategories.map(([name, label, max]) => `${label}: ${(values[name] * max / 100).toFixed(1)}/${max}`).join(' · ');
            const generatedNote = `${breakdown} · Ek Sorumluluk: +${bonus} · Hesaplanan: ${rawTotal.toFixed(1)}/35 · Yuvarlanan: ${total}/35`;
            const note = `${generatedNote}${userNote ? ` · Açıklama: ${userNote}` : ''}`;
            await api.addPoints({ clubId: c.id, eventId: ev.id, label: ev.title, delta: total, note });
            toast(`${c.name}: +${total} Support puanı`);
          }
        },
      });

      const hostPanel = dlgForm.querySelector('[data-host-panel]');
      const supportPanel = dlgForm.querySelector('[data-support-panel]');
      const otherPanel = dlgForm.querySelector('[data-other-panel]');
      const roleStatus = dlgForm.querySelector('[data-role-status]');
      const eventSelect = dlgForm.querySelector('[name="event"]');
      const clubSelect = dlgForm.querySelector('[name="club"]');

      const updateRolePreview = () => {
        const c = club(clubSelect?.value || '');
        const ev = db.events.find((e) => e.id === (eventSelect?.value || ''));
        if (!ev) {
          hostPanel.hidden = true; supportPanel.hidden = true; otherPanel.hidden = false;
          if (roleStatus) roleStatus.innerHTML = '<small>Rol</small>Etkinlik dışı puanlama';
          return;
        }
        otherPanel.hidden = true;
        const isHost = !!c && ev.ownerId === c.id;
        const isSupport = !!c && ev.applications.some((p) => p.clubId === c.id && p.status === 'approved');
        hostPanel.hidden = !isHost;
        supportPanel.hidden = !(!isHost && isSupport);
        if (roleStatus) {
          roleStatus.innerHTML = isHost
            ? '<small>Rol</small><strong>Host</strong> · Host puanlama sistemi açıldı.'
            : isSupport
              ? '<small>Rol</small><strong>Support</strong> · Support puanlama sistemi açıldı.'
              : '<small>Rol</small>Bu kulüp bu etkinlikte Host veya onaylı Support değil.';
        }
        updateScorePreview();
      };

      const updateScorePreview = () => {
        let hostStandard = 0;
        hostCategories.forEach(([name, , max]) => {
          const input = dlgForm.querySelector(`[name="${name}"]`);
          const raw = Math.max(0, Math.min(100, Number(input?.value) || 0));
          const score = raw * max / 100;
          hostStandard += score;
          const out = dlgForm.querySelector(`[data-score="${name}"]`);
          if (out) out.textContent = `${score.toFixed(1)} / ${max}`;
        });
        const crisis = dlgForm.querySelector('[name="crisisBonus"]')?.checked ? 5 : 0;
        const hostTotal = Math.round(hostStandard + crisis);
        const hostStdOut = dlgForm.querySelector('[data-standard-total]');
        const hostBonusOut = dlgForm.querySelector('[data-bonus-total]');
        const hostGrandOut = dlgForm.querySelector('[data-grand-total]');
        const crisisOut = dlgForm.querySelector('[data-crisis-value]');
        if (hostStdOut) hostStdOut.textContent = `${hostStandard.toFixed(1)} / 50`;
        if (hostBonusOut) hostBonusOut.textContent = `+${crisis}`;
        if (hostGrandOut) hostGrandOut.textContent = `${hostTotal} / 55`;
        if (crisisOut) crisisOut.textContent = `+${crisis}`;

        let supportStandard = 0;
        supportCategories.forEach(([name, , max]) => {
          const input = dlgForm.querySelector(`[name="${name}"]`);
          const raw = Math.max(0, Math.min(100, Number(input?.value) || 0));
          const score = raw * max / 100;
          supportStandard += score;
          const out = dlgForm.querySelector(`[data-score="${name}"]`);
          if (out) out.textContent = `${score.toFixed(1)} / ${max}`;
        });
        const supportBonus = dlgForm.querySelector('[name="supportBonus"]')?.checked ? 5 : 0;
        const supportTotal = Math.round(supportStandard + supportBonus);
        const supportStdOut = dlgForm.querySelector('[data-support-standard-total]');
        const supportBonusOut = dlgForm.querySelector('[data-support-bonus-total]');
        const supportGrandOut = dlgForm.querySelector('[data-support-grand-total]');
        const supportBonusValue = dlgForm.querySelector('[data-support-bonus-value]');
        if (supportStdOut) supportStdOut.textContent = `${supportStandard.toFixed(1)} / 30`;
        if (supportBonusOut) supportBonusOut.textContent = `+${supportBonus}`;
        if (supportGrandOut) supportGrandOut.textContent = `${supportTotal} / 35`;
        if (supportBonusValue) supportBonusValue.textContent = `+${supportBonus}`;
      };

      eventSelect?.addEventListener('change', updateRolePreview);
      clubSelect?.addEventListener('change', updateRolePreview);
      dlgForm.querySelectorAll('input[type="number"], input[name="crisisBonus"], input[name="supportBonus"]').forEach((input) => input.addEventListener('input', updateScorePreview));
      dlgForm.querySelectorAll('input[name="crisisBonus"], input[name="supportBonus"]').forEach((input) => input.addEventListener('change', updateScorePreview));
      updateRolePreview();
    },

        submit: c ? 'Kaydet' : 'Ekle',

          if (account.password && !account.email) return 'Şifre için giriş e-postası da gerekli.';
          if (account.email && !EMAIL_RE.test(account.email)) return 'Giriş e-postası geçerli değil. ornek@kulup.com gibi bir adres yaz.';

          if (account.email && !known && !account.password) return 'Yeni hesap için şifre gir.';
          if (account.email === known && !account.password) account.email = '';   // nothing to change
          const fields = { name: val(fd, 'name'), uni: val(fd, 'uni'), category: val(fd, 'category'), contact, visible: c ? c.visible !== false : true };

          state.accounts = null;
          if (warning) notice('Giriş hesabı ayarlanamadı', `${warning} Kulübü “Düzenle” ile açıp giriş e-postası ve şifresini yeniden girebilirsin.`);
