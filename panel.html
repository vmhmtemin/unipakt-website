    title, lead, submit, danger: true,
    onSubmit: async () => { await apply(); toast(submit === 'Sil' ? 'Silindi.' : 'Kaldırıldı.'); },
  });

  const actions = {
    'ann-new'() {
      openForm({
        title: isAdmin() ? 'Yeni duyuru' : 'Duyuru isteği gönder',
        lead: isAdmin() ? 'Yayınladığın anda tüm kulüp başkanları görür.' : 'UniPakt onayladığında Duyurular sekmesinde yayınlanır.',
        fields: field('Başlık', '<input name="title" required maxlength="120">')
          + field('Duyuru metni', '<textarea name="body" required maxlength="1500"></textarea>'),
        submit: isAdmin() ? 'Yayınla' : 'Onaya gönder',
        onSubmit: async (fd) => {
          await api.addAnnouncement({ title: val(fd, 'title'), body: val(fd, 'body') });
          toast(isAdmin() ? 'Duyuru yayınlandı.' : 'Duyuru onaya gönderildi.');
        },
      });
    },
    async 'ann-approve'(id) { await api.decideAnnouncement(id, 'published'); toast('Duyuru yayınlandı.'); render(); },
    'ann-reject'(id) { rejectWithNote('Duyuruyu reddet', (note) => api.decideAnnouncement(id, 'rejected', note)); },
    'ann-remove'(id) { confirmRemove('Duyuruyu kaldır', 'Duyuru tüm kulüplerin panelinden kalkar.', () => api.removeAnnouncement(id)); },

    'event-new'(kind) {
      const partner = kind !== 'event';
      openForm({
        title: partner ? (isAdmin() ? 'Yeni ortak etkinlik' : 'Ortak arıyorum') : 'Yeni etkinlik',
        lead: partner
          ? (isAdmin() ? 'Yayınladığın anda Ortak Arama sayfasına düşer. Takvime almak için “Yayına al”ı kullan.' : 'UniPakt onayladığında Ortak Arama sayfasına düşer.')
          : (isAdmin() ? 'Yayınladığın anda takvimde görünür.' : 'UniPakt onayladığında takvimde görünür.'),
        fields: field('Etkinlik adı', '<input name="title" required maxlength="120">')
          + field('Afiş / etkinlik görseli', '<input type="file" name="poster" accept="image/jpeg,image/png,image/webp">')
          + field('Açıklama', '<textarea name="desc" required maxlength="2000"></textarea>')
          + `<div class="field-row">${field('İlk tarih', `<input type="date" name="date" required min="${today()}">`)}${field('Saat', '<input type="time" name="time">')}</div>`
          + field('Ek etkinlik tarihleri', '<textarea name="extraDates" placeholder="Her satıra: YYYY-AA-GG HH:MM\nÖrn: 2026-11-07 21:00"></textarea>')
          + field('Etkinlik yeri', '<input name="place" maxlength="120" placeholder="Volkswagen Arena">')
          + field('Üniversite', '<input name="university" maxlength="120" placeholder="İstinye University">')
          + field('Açık adres', '<textarea name="address" required maxlength="300" placeholder="Tam adresi yazın. Ziyaretçi tıkladığında Google Maps açılır."></textarea>')
          + field('Etkinlik bilgileri / kurallar', '<textarea name="rules" maxlength="2000" placeholder="Katılım koşulları, kontenjan, yaş sınırı vb."></textarea>')
          + field('Etiketler', '<input name="tags" maxlength="300" placeholder="Workshop, Yazılım, Networking">')
          + field('Kayıt / katılım bağlantısı (isteğe bağlı)', '<input type="url" name="registration" maxlength="1000" placeholder="https://...">')
          + field('Ücret durumu', '<select name="feeType"><option value="free">Ücretsiz</option><option value="paid">Ücretli</option></select>')
          + field('Ücret (TL) — ücretliyse', '<input type="number" name="feeAmount" min="0" step="0.01" inputmode="decimal" placeholder="Örn. 150">')
          + (partner ? field('Nasıl bir ortak arıyorsun?', '<input name="seeking" required maxlength="200">') : ''),
        submit: isAdmin() ? 'Yayınla' : 'Onaya gönder',
        onSubmit: async (fd) => {
          const poster = fd.get('poster');
          const occurrences = [{ date: val(fd,'date'), time: val(fd,'time') }];
          String(val(fd,'extraDates')).split(/\n+/).map(x => x.trim()).filter(Boolean).forEach(line => {
            const m = line.match(/^(\d{4}-\d{2}-\d{2})(?:\s+(\d{1,2}:\d{2}))?$/);
            if (m) occurrences.push({ date: m[1], time: m[2] || '' });
          });
          const unique = [...new Map(occurrences.map(o => [`${o.date} ${o.time}`, o])).values()].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
          const posterUrl = poster && poster.size ? await api.uploadEventPoster(poster) : '';
          await api.addEvent({
            title: val(fd,'title'), desc: val(fd,'desc'), date: unique[0].date, time: unique[0].time,
            occurrences: unique, place: val(fd,'place'), university: val(fd,'university'), address: val(fd,'address'), rules: val(fd,'rules'), posterUrl,
            tags: String(val(fd,'tags')).split(',').map(x => x.trim()).filter(Boolean).slice(0,12), registration: val(fd,'registration'), feeType: val(fd,'feeType') || 'free', feeAmount: val(fd,'feeAmount'),
            seeking: partner ? val(fd,'seeking') : '', kind: partner ? 'partner' : 'event'
          });
          toast(isAdmin() ? (partner ? 'Ortak Arama’da yayınlandı.' : 'Etkinlik takvime eklendi.') : 'Etkinlik onaya gönderildi.');
        },
      });
    },
    async 'pub-request'(id) { await api.requestCalendar(id); toast('Yayına alma talebin gönderildi.'); render(); },
    async 'pub-approve'(id) { await api.setCalendar(id, 'on'); toast('Etkinlik takvime alındı.'); render(); },
    async 'pub-reject'(id) { await api.setCalendar(id, 'none'); toast('Takvim talebi reddedildi.'); render(); },
    async 'pub-remove'(id) { await api.setCalendar(id, 'none'); toast('Etkinlik takvimden kaldırıldı.'); render(); },
    async 'event-approve'(id) { await api.decideEvent(id, 'published'); toast('Etkinlik onaylandı.'); render(); },
    'event-reject'(id) { rejectWithNote('Etkinliği reddet', (note) => api.decideEvent(id, 'rejected', note)); },
    'event-remove'(id) { confirmRemove('Etkinliği sil', 'Etkinlik takvimden, Ortak Arama’dan ve tüm panellerden silinir; ortaklık başvuruları da gider.', () => api.removeEvent(id), 'Sil'); },
    'event-apply'(id) {
      const e = db.events.find((x) => x.id === id); if (!e) return;
      openForm({
        title: 'Ortak ol', lead: `“${e.title}” için ortaklık başvurusu. UniPakt onayladığında ortak olarak görünürsün.`,
        fields: field('Nasıl katkı sağlayacaksınız?', '<textarea name="note" required maxlength="500"></textarea>'),
        submit: 'Başvur',
        onSubmit: async (fd) => { await api.applyEvent(id, val(fd, 'note')); toast('Başvurun onaya gönderildi.'); },
      });
    },
    async 'app-approve'(id, sub) { await api.decideApplication(id, sub, 'approved'); toast('Ortaklık onaylandı.'); render(); },
    async 'app-reject'(id, sub) { await api.decideApplication(id, sub, 'rejected'); toast('Başvuru reddedildi.'); render(); },

    'task-new'() {
      openForm({
        title: 'Görev ata',
        fields: `<div class="field"><span>Kulüpler <em class="pick-count" id="pickCount">0 seçili</em></span>
            <input type="search" id="clubFilter" placeholder="Kulüp ya da üniversite ara" autocomplete="off" aria-label="Kulüp ara">
            <div class="checks">
              <label><input type="checkbox" id="allClubs"> <strong id="allClubsLabel">Tüm kulüpler</strong></label>
              ${[...db.clubs].sort(byLabel).map((c) => `<label data-search="${esc(searchKey(clubLabel(c)))}"><input type="checkbox" name="club" value="${esc(c.id)}"> ${esc(clubLabel(c))}</label>`).join('')}
              <p class="checks-empty" id="clubFilterEmpty" hidden>Aramana uyan kulüp yok.</p>
            </div></div>`
          + field('Görev', '<input name="title" required maxlength="120">')
          + field('Açıklama (isteğe bağlı)', '<textarea name="desc" maxlength="1000"></textarea>')
          + field('Son tarih (isteğe bağlı)', '<input type="date" name="due">'),
        submit: 'Ata',
        onSubmit: async (fd) => {
          const ids = fd.getAll('club');
          if (!ids.length) return 'En az bir kulüp seç.';
          await api.addTasks(ids, { title: val(fd, 'title'), desc: val(fd, 'desc'), due: val(fd, 'due') });
          state.taskTab = 'open';
          toast(ids.length > 1 ? `Görev ${ids.length} kulübe atandı.` : 'Görev atandı.');
        },
      });
      const all = dlgForm.querySelector('#allClubs');
      const boxes = [...dlgForm.querySelectorAll('input[name="club"]')];
      const filter = dlgForm.querySelector('#clubFilter');
      // "Tüm kulüpler" works on what the search shows; ticks on hidden clubs are kept.
      const visible = () => boxes.filter((b) => !b.closest('label').hidden);
      const sync = () => {
        const shown = visible();
        all.checked = shown.length > 0 && shown.every((x) => x.checked);
        dlgForm.querySelector('#allClubsLabel').textContent = filter.value.trim() ? `Aramadaki kulüpler (${shown.length})` : 'Tüm kulüpler';
        dlgForm.querySelector('#pickCount').textContent = `${boxes.filter((b) => b.checked).length} seçili`;
        dlgForm.querySelector('#clubFilterEmpty').hidden = shown.length > 0;
      };
      filter.addEventListener('input', () => {
        const q = searchKey(filter.value);
        boxes.forEach((b) => { const label = b.closest('label'); label.hidden = !!q && !label.dataset.search.includes(q); });
        sync();
      });
      // Enter in the search box must not submit the form.
      filter.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });
      all.addEventListener('change', () => { visible().forEach((b) => { b.checked = all.checked; }); sync(); });
      boxes.forEach((b) => b.addEventListener('change', sync));
      sync();
      setTimeout(() => filter.focus(), 0);
    },
    'task-done'(id) {
      const t = db.tasks.find((x) => x.id === id); if (!t || t.clubId !== state.user) return;
      openForm({
        title: 'Görevi bitir', lead: `“${t.title}” için kanıtını bırak: mesaj, dosya ya da ikisi birden. UniPakt görür.`,
        fields: field('Mesaj', '<textarea name="text" maxlength="1500"></textarea>')
          + field(`Dosya (PNG, JPG, WEBP ya da PDF · en çok ${MAX_FILE / 1048576} MB)`, `<input type="file" name="file" accept="${FILE_TYPES.join(',')}">`),
        submit: 'Görevi bitir',
        onSubmit: async (fd) => {
          const text = val(fd, 'text');
          const picked = fd.get('file');
          const file = picked && picked.size ? picked : null;
          if (file && (!FILE_TYPES.includes(file.type) || file.size > MAX_FILE)) return `Dosya PNG, JPG, WEBP ya da PDF olmalı ve ${MAX_FILE / 1048576} MB’ı geçmemeli.`;
          if (!text && !file) return 'Bir mesaj yaz ya da dosya ekle.';
          await api.completeTask(t, text, file);
          toast('Görev tamamlandı.');
        },
      });
    },
    'task-remove'(id) { confirmRemove('Görevi sil', 'Görev kulübün panelinden de silinir.', () => api.removeTask(id), 'Sil'); },
    'task-tab'(id) { state.taskTab = id; render(); },
    // Opened before the request so the browser does not treat it as a pop-up.
    async 'proof-open'(id) {
      const t = db.tasks.find((x) => x.id === id); if (!t || !t.doneFile || !t.doneFile.path) return;
      const tab = window.open('', '_blank');
      try {
        const url = await api.proofUrl(t.doneFile.path);
        if (tab) { tab.opener = null; tab.location.href = url; } else location.href = url;
      } catch (error) { if (tab) tab.close(); throw error; }
    },

    'pts-new'(id) {
      const events = [...publishedEvents()].reverse();
      openForm({
        title: 'Puan gönder', lead: 'Artı ya da eksi puan. Kulüp bu kaydı kendi Vanguard sayfasında görür.',
        fields: field('Kulüp', `<select name="club" required><option value="">Kulüp seç</option>${db.clubs.map((c) => `<option value="${esc(c.id)}" ${c.id === id ? 'selected' : ''}>${esc(c.name)} (${pts(c.id)})</option>`).join('')}</select>`)
          + field('Etkinlik', `<select name="event"><option value="">${OTHER}</option>${events.map((e) => `<option value="${esc(e.id)}">${esc(e.title)} · ${fmtDay(e.date)}</option>`).join('')}</select>`)
          + field('Puan (eksi için başına − koy)', '<input type="number" name="delta" required step="1" placeholder="Örn. 20 ya da -10">')
          + field('Açıklama (isteğe bağlı)', '<input name="note" maxlength="120">'),
        submit: 'Gönder',
        onSubmit: async (fd) => {
          const delta = Math.round(Number(fd.get('delta')));
          if (!Number.isFinite(delta) || delta === 0) return 'Sıfırdan farklı bir puan gir.';
          const c = club(val(fd, 'club')); if (!c) return 'Bir kulüp seç.';
          const ev = db.events.find((e) => e.id === val(fd, 'event'));
          await api.addPoints({ clubId: c.id, eventId: ev ? ev.id : '', label: ev ? ev.title : OTHER, delta, note: val(fd, 'note') });
          toast(`${c.name}: ${signed(delta)} puan`);
        },
      });
    },

    async 'club-visibility'(id) {
      const c = club(id); if (!c) return;
      const next = c.visible === false;
      await api.setClubVisibility(id, next);
      c.visible = next;
      toast(next ? 'Kulüp ortak kulüplerde görünür.' : 'Kulüp sitede gizlendi.');
      render();
    },
    'club-new'() { actions['club-edit'](''); },
    'club-edit'(id) {
      const c = id ? club(id) : null;
      if (id && !c) return;
      const known = state.accounts && typeof state.accounts === 'object' ? state.accounts[id] || '' : '';
      const text = (name, label, value, extra = '') => field(label, `<input name="${name}" value="${esc(value || '')}" ${extra}>`);
      openForm({
        title: c ? 'Kulübü düzenle' : 'Kulüp ekle',
        fields: text('name', 'Kulüp adı', c && c.name, 'required maxlength="120"')
          + text('uni', 'Üniversite', c && c.uni, 'required maxlength="120"')
          + field('Kategori', `<select name="category"><option value="">Seç</option>${CLUB_CATEGORIES.map((k) => `<option ${c && c.category === k ? 'selected' : ''}>${k}</option>`).join('')}</select>`)
          + '<p class="form-section">İletişim · sitede tıklanabilir bağlantı olarak görünür. Kullanıcı adı ya da tam bağlantı yazabilirsin; boş bıraktığın sitede hiç çıkmaz.</p>'
          + `<div class="field-row">${text('email', 'E-posta', c && c.contact.email, 'type="email" maxlength="200"')}${text('instagram', 'Instagram', c && c.contact.instagram, 'maxlength="200" placeholder="kullanıcı adı ya da bağlantı"')}</div>`
          + `<div class="field-row">${text('x', 'X', c && c.contact.x, 'maxlength="200" placeholder="kullanıcı adı ya da bağlantı"')}${text('tiktok', 'TikTok', c && c.contact.tiktok, 'maxlength="200" placeholder="kullanıcı adı ya da bağlantı"')}</div>`
          + `<div class="field-row">${text('linkedin', 'LinkedIn', c && c.contact.linkedin, 'maxlength="200" placeholder="kullanıcı adı ya da bağlantı"')}${text('web', 'Web sitesi', c && c.contact.web, 'maxlength="200" placeholder="https://"')}</div>`
          + '<p class="form-section">Panel girişi · kulüp başkanının hesabı</p>'
          + `<div class="field-row">${text('accountEmail', 'Giriş e-postası', known, 'type="email" maxlength="200" autocomplete="off"')}${text('accountPassword', known ? 'Yeni şifre (boşsa değişmez)' : 'Şifre (en az 8 karakter)', '', 'type="password" minlength="8" maxlength="72" autocomplete="new-password"')}</div>`,
        submit: c ? 'Kaydet' : 'Ekle',
        onSubmit: async (fd) => {
          const account = { email: val(fd, 'accountEmail').toLowerCase(), password: String(fd.get('accountPassword') || '') };
          const contact = Object.fromEntries(CONTACT_KEYS.map(([k]) => [k, val(fd, k)]));
          const bad = CONTACT_KEYS.find(([k]) => contact[k] && !contactLink(k, contact[k]));
          if (bad) return `${bad[1]} geçerli değil. ${bad[0] === 'email' ? 'ornek@kulup.com gibi bir adres yaz.' : 'Kullanıcı adı ya da tam bağlantı yaz.'}`;
          if (account.password && !account.email) return 'Şifre için giriş e-postası da gerekli.';
          if (account.email && !EMAIL_RE.test(account.email)) return 'Giriş e-postası geçerli değil. ornek@kulup.com gibi bir adres yaz.';
          if (account.password && account.password.length < 8) return 'Şifre en az 8 karakter olmalı.';
          if (account.email && !known && !account.password) return 'Yeni hesap için şifre gir.';
          if (account.email === known && !account.password) account.email = '';   // nothing to change
          const fields = { name: val(fd, 'name'), uni: val(fd, 'uni'), category: val(fd, 'category'), contact, visible: c ? c.visible !== false : true };
          const warning = await api.saveClub(id || null, fields, account);
          state.accounts = null;
          if (warning) notice('Giriş hesabı ayarlanamadı', `${warning} Kulübü “Düzenle” ile açıp giriş e-postası ve şifresini yeniden girebilirsin.`);
          else toast(c ? 'Kulüp güncellendi.' : 'Kulüp eklendi.');
        },
      });
    },
    'club-remove'(id) {
      const c = club(id); if (!c) return;
      openForm({
        title: 'Kulübü sil', submit: 'Kulübü sil', danger: true,
        lead: `“${c.name}” siteden kalkar; giriş hesabı, duyuruları, etkinlikleri, başvuruları, görevleri ve puanları da silinir. Bu geri alınamaz.`,
        fields: field(`Onaylamak için kulübün adını yaz: ${esc(c.name)}`, '<input name="confirm" required autocomplete="off">'),
        onSubmit: async (fd) => {
          if (val(fd, 'confirm') !== c.name) return 'Kulüp adı eşleşmiyor.';
          const warning = await api.removeClub(id);
          state.accounts = null;
          if (warning) notice('Giriş hesabı silinemedi', warning); else toast('Kulüp silindi.');
        },
      });
    },

    'cal-pick'(id) { state.cal.sel = id; const d = parseYmd(id); state.cal.y = d.getFullYear(); state.cal.m = d.getMonth(); render(); },
    'cal-move'(id) { const d = new Date(state.cal.y, state.cal.m + Number(id), 1); state.cal.y = d.getFullYear(); state.cal.m = d.getMonth(); render(); },
    'cal-today'() { const d = new Date(); state.cal = { y: d.getFullYear(), m: d.getMonth(), sel: ymd(d) }; render(); },

    // Demo only: pick an account, no password.
    login(id) {
      if (!DEMO) return;
      state.user = id; state.view = 'genel';
      try { sessionStorage.setItem(SESSION, id); } catch (_) {}
      history.replaceState(null, '', `${location.pathname}${location.search}#genel`);
      render(); window.scrollTo(0, 0);
    },
    logout() {
      state.user = null;
      if (DEMO) { try { sessionStorage.removeItem(SESSION); } catch (_) {} }
      else { remote.logout(); db = null; }
      state.accounts = null;
      history.replaceState(null, '', location.pathname + location.search);
      render(); window.scrollTo(0, 0);
    },
    reset() {
      if (!DEMO) return;
      openForm({ title: 'Demo verisini sıfırla', lead: 'Bu tarayıcıdaki tüm panel verisi silinir ve örnek veriler geri gelir.', submit: 'Sıfırla', danger: true,
        onSubmit: () => { db = seed(); save(); toast('Demo verisi sıfırlandı.'); } });
    },
  };

  /* ------------------------------------------------------------------
     RENDER
     ------------------------------------------------------------------ */
  const go = (view) => {
    if (!NAV().some(([id]) => id === view)) view = 'genel';
    state.view = view;
    if (location.hash !== `#${view}`) history.pushState(null, '', `#${view}`);
    render(); window.scrollTo(0, 0);
  };

  const renderLogin = (message = '') => {
    if (!DEMO) {
      root.innerHTML = `
        <main class="login"><div class="login-box">
          <a class="wordmark" href="https://unipakt.com/">UniPakt<span>.</span></a>
          <p class="kicker">Panel</p>
          <form class="login-form" id="loginForm" novalidate>
            ${field('E-posta', '<input type="email" name="email" required autocomplete="username">')}
            ${field('Şifre', '<input type="password" name="password" required autocomplete="current-password">')}
            <p class="form-error" id="loginError" ${message ? '' : 'hidden'}>${esc(message)}</p>
            <button type="submit" class="btn">Giriş yap</button>
          </form>
          <p class="demo-note">Şifreni unuttuysan UniPakt’tan yeni bir şifre isteyebilirsin; hesaplar yalnızca UniPakt tarafından düzenlenir. <a href="mailto:iletisim@unipakt.com">iletisim@unipakt.com</a></p>
        </div></main>`;
      return;
    }
    root.innerHTML = `
      <main class="login"><div class="login-box">
        <a class="wordmark" href="https://unipakt.com/">UniPakt<span>.</span></a>
        <p class="kicker">Panel</p>
        <h2>Demo girişi: bir hesap seç</h2>
        <div class="account-list">
          <button class="account is-admin" data-act="login" data-id="${ADMIN}"><span><strong>UniPakt</strong><small>Tüm panelleri yönetir</small></span><span class="role">UniPakt yetkilisi</span></button>
          ${db.clubs.map((c) => `<button class="account" data-act="login" data-id="${c.id}"><span><strong>${esc(c.name)}</strong><small>${esc(c.uni)}</small></span><span class="role">Kulüp başkanı</span></button>`).join('')}
        </div>
        <p class="demo-note">Bu bir demo. Şifre yok ve veriler yalnızca bu tarayıcıda saklanıyor.</p>
      </div></main>`;
  };

  const render = () => {
    if (!db || !state.user || (state.user !== ADMIN && !club(state.user))) { state.user = null; renderLogin(); return; }
    const nav = NAV();
    if (!nav.some(([id]) => id === state.view)) state.view = 'genel';
    const me = isAdmin() ? { name: 'UniPakt', role: 'UniPakt yetkilisi' } : { name: club(state.user).name, role: 'Kulüp başkanı' };
    root.innerHTML = `
      <div class="app">
        <aside class="side">
          <div class="side-brand">
            <a class="wordmark" href="https://unipakt.com/" title="unipakt.com’a git">UniPakt<span>.</span></a>
            <p class="kicker">Panel</p>
          </div>
          <nav class="side-nav" aria-label="Panel">
            ${nav.map(([id, label, count]) => `<button class="nav-item ${state.view === id ? 'active' : ''}" data-go="${id}" ${state.view === id ? 'aria-current="page"' : ''}>${esc(label)}${count ? `<span class="badge">${count}</span>` : ''}</button>`).join('')}
          </nav>
          <div class="side-foot">
            <div class="side-user"><strong>${esc(me.name)}</strong><small>${me.role}</small></div>
            <div class="row"><button class="btn ghost small" data-act="logout">Çıkış</button></div>
            ${DEMO ? '<button class="link-btn" data-act="reset">Demo verisini sıfırla</button>' : ''}
          </div>
        </aside>
        <main class="main"><div class="main-inner">
          <p class="mobile-user">${esc(me.name)} · ${me.role}</p>
          ${DEMO ? '<div class="demo-bar"><span><b>Demo</b> — veriler yalnızca bu tarayıcıda saklanıyor.</span></div>' : ''}
          ${views[state.view]()}
        </div></main>
      </div>`;
    root.querySelector('.nav-item.active')?.scrollIntoView({ block: 'nearest', inline: 'center' });
  };

  // A failed action says why; if it signed the user out, the login screen follows.
  const fail = (error) => { toast(error.message || 'İşlem yapılamadı.'); if (!state.user) render(); };

  document.addEventListener('click', (e) => {
    const goBtn = e.target.closest('[data-go]');
    if (goBtn) { go(goBtn.dataset.go); return; }
    const btn = e.target.closest('[data-act]');
    if (!btn || dlg.contains(btn) || btn.disabled) return;
    const run = actions[btn.dataset.act];
    if (!run) return;
    let result;
    try { result = run(btn.dataset.id, btn.dataset.sub); } catch (error) { fail(error); return; }
    if (result && typeof result.then === 'function') {
      btn.disabled = true;
      result.catch(fail).finally(() => { btn.disabled = false; });
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'taskClub') { state.taskClub = e.target.value; render(); }
  });
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'loginForm') return;
    e.preventDefault();
    const form = e.target;
    const err = form.querySelector('#loginError');
    const button = form.querySelector('button[type="submit"]');
    const email = form.elements.email.value.trim();
    const password = form.elements.password.value;
    if (!email || !password) { err.textContent = 'E-posta ve şifreni yaz.'; err.hidden = false; return; }
    button.disabled = true; button.textContent = 'Giriş yapılıyor…'; err.hidden = true;
    try {
      await remote.login(email, password);
      state.view = 'genel';
      render(); window.scrollTo(0, 0);
    } catch (error) {
      if (!document.body.contains(form)) { renderLogin(error.message); return; }
      err.textContent = error.message || 'Giriş yapılamadı.'; err.hidden = false;
      button.disabled = false; button.textContent = 'Giriş yap';
    }
  });
  window.addEventListener('hashchange', () => { state.view = location.hash.slice(1) || 'genel'; if (state.user) render(); });

  // Keep the screen current: another tab in the demo, or coming back to the tab with Supabase.
  let lastSync = Date.now();
  const sync = async () => {
    if (!state.user || dlg.open) return;
    try { await api.refresh(); lastSync = Date.now(); render(); } catch (error) { fail(error); }
  };
  if (DEMO) window.addEventListener('storage', (e) => { if (e.key === KEY) sync(); });
  else document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastSync > 30000) sync(); });

  const start = async () => {
    state.view = location.hash.slice(1) || 'genel';
    if (DEMO) { loadLocal(); render(); return; }
    state.user = null;
    readSession();
    if (!session) { renderLogin(); return; }
    root.innerHTML = '<main class="login"><p class="loading">Yükleniyor…</p></main>';
    try { await loadRemote(); lastSync = Date.now(); render(); }
    catch (error) { renderLogin(state.user ? '' : error.message); if (state.user) { state.user = null; renderLogin(error.message); } }
  };
  start();
})();
</script>
