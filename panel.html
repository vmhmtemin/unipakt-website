          + field('Kategori', `<select name="category"><option value="">Seç</option>${CLUB_CATEGORIES.map((k) => `<option ${c && c.category === k ? 'selected' : ''}>${k}</option>`).join('')}</select>`)
          + '<p class="form-section">İletişim · sitede tıklanabilir bağlantı olarak görünür. Kullanıcı adı ya da tam bağlantı yazabilirsin; boş bıraktığın sitede hiç çıkmaz.</p>'
          + `<div class="field-row">${text('email', 'E-posta', c && c.contact.email, 'type="email" maxlength="200"')}${text('instagram', 'Instagram', c && c.contact.instagram, 'maxlength="200" placeholder="kullanıcı adı ya da bağlantı"')}</div>`
          + `<div class="field-row">${text('x', 'X', c && c.contact.x, 'maxlength="200" placeholder="kullanıcı adı ya da bağlantı"')}${text('tiktok', 'TikTok', c && c.contact.tiktok, 'maxlength="200" placeholder="kullanıcı adı ya da bağlantı"')}</div>`
          + `<div class="field-row">${text('linkedin', 'LinkedIn', c && c.contact.linkedin, 'maxlength="200" placeholder="kullanıcı adı ya da bağlantı"')}${text('web', 'Web sitesi', c && c.contact.web, 'maxlength="200" placeholder="https://"')}</div>`
          + '<p class="form-section">Panel girişi · kulüp başkanının hesabı</p>'
          + `<div class="field-row">${text('accountEmail', 'Giriş e-postası', known, 'type="email" maxlength="200" autocomplete="off"')}${text('accountPassword', known ? 'Yeni şifre (boşsa değişmez)' : 'Şifre (en az 8 karakter)', '', 'type="password" minlength="8" maxlength="72" autocomplete="new-password"')}</div>`,
        submit: c ? 'Kaydet' : 'Ekle',
        onSubmit: async (fd) => {
          const account = { email: val(fd, 'accountEmail').toLowerCase(), password: String(fd.get('accountPassword') || '') };
          const contact = Object.fromEntries(CONTACT_KEYS.map(([k]) => [k, val(fd, k)]));
          const bad = CONTACT_KEYS.find(([k]) => contact[k] && !contactLink(k, contact[k]));
          if (bad) return `${bad[1]} geçerli değil. ${bad[0] === 'email' ? 'ornek@kulup.com gibi bir adres yaz.' : 'Kullanıcı adı ya da tam bağlantı yaz.'}`;
          if (account.password && !account.email) return 'Şifre için giriş e-postası da gerekli.';
          if (account.email && !EMAIL_RE.test(account.email)) return 'Giriş e-postası geçerli değil. ornek@kulup.com gibi bir adres yaz.';
          if (account.password && account.password.length < 8) return 'Şifre en az 8 karakter olmalı.';
          if (account.email && !known && !account.password) return 'Yeni hesap için şifre gir.';
          if (account.email === known && !account.password) account.email = '';   // nothing to change
          const fields = { name: val(fd, 'name'), uni: val(fd, 'uni'), category: val(fd, 'category'), contact, visible: c ? c.visible !== false : true };
          const warning = await api.saveClub(id || null, fields, account);
          state.accounts = null;
          if (warning) notice('Giriş hesabı ayarlanamadı', `${warning} Kulübü “Düzenle” ile açıp giriş e-postası ve şifresini yeniden girebilirsin.`);
          else if (c && c.kvkkConsentAt && (c.contact.email || '') !== contact.email) notice('KVKK onayı sıfırlandı', 'Kulübün e-postası değiştiği için KVKK onayı sıfırlandı; iletişim bilgileri yeni adresten onay alınıp kaydedilene kadar sitede görünmez.');
          else toast(c ? 'Kulüp güncellendi.' : 'Kulüp eklendi.');
        },
      });
    },
    'club-remove'(id) {
      const c = club(id); if (!c) return;
      openForm({
        title: 'Kulübü sil', submit: 'Kulübü sil', danger: true,
        lead: `“${c.name}” siteden kalkar; giriş hesabı, duyuruları, etkinlikleri, başvuruları, görevleri ve puanları da silinir. Bu geri alınamaz.`,
        fields: field(`Onaylamak için kulübün adını yaz: ${c.name}`, '<input name="confirm" required autocomplete="off">'),
        onSubmit: async (fd) => {
          if (val(fd, 'confirm') !== c.name) return 'Kulüp adı eşleşmiyor.';
          const warning = await api.removeClub(id);
          state.accounts = null;
          if (warning) notice('Giriş hesabı silinemedi', warning); else toast('Kulüp silindi.');
        },
      });
    },

    'point-details'(id) {
      const btn = document.querySelector(`[data-act=\"point-details\"][data-id=\"${CSS.escape(id || '')}\"]`);
      const row = btn?.closest('[data-point-row]');
      const detail = row?.querySelector('[data-point-detail]');
      if (!detail) return;
      const open = !detail.hidden;
      detail.hidden = open;
      if (btn) btn.textContent = open ? 'Detaylar' : 'Gizle';
    },

    'cal-pick'(id) { state.cal.sel = id; const d = parseYmd(id); state.cal.y = d.getFullYear(); state.cal.m = d.getMonth(); render(); },
    'cal-move'(id) { const d = new Date(state.cal.y, state.cal.m + Number(id), 1); state.cal.y = d.getFullYear(); state.cal.m = d.getMonth(); render(); },
    'cal-today'() { const d = new Date(); state.cal = { y: d.getFullYear(), m: d.getMonth(), sel: ymd(d) }; render(); },

    // Demo only: pick an account, no password.
    login(id) {
      if (!DEMO) return;
      state.user = id; state.view = 'genel';
      try { sessionStorage.setItem(SESSION, id); } catch (_) {}
      applyDemoUser(); state.team = { rows: null, loading: false, error: '' }; state.activity = freshActivity();
      history.replaceState(null, '', `${location.pathname}${location.search}#genel`);
      render(); window.scrollTo(0, 0); startMatrix();
    },
    logout() {
      stopMatrix();
      state.user = null; state.member = null; state.team = { rows: null, loading: false, error: '' }; state.activity = freshActivity();
      if (DEMO) { try { sessionStorage.removeItem(SESSION); } catch (_) {} }
      else { remote.logout(); db = null; }
      state.accounts = null;
      // The 30-day trusted-browser token stays, so this browser is not asked again.
      state.mfa = freshMfaState();
      state.regBoard = freshRegBoard(); state.staffView = freshStaffView();
      state.inbox = { tab: 'contact', data: null, error: null, loading: false, count: null };
      history.replaceState(null, '', location.pathname + location.search);
      render(); window.scrollTo(0, 0);
    },
    reset() {
      if (!DEMO) return;
      openForm({ title: 'Demo verisini sıfırla', lead: 'Bu tarayıcıdaki tüm panel verisi silinir ve örnek veriler geri gelir.', submit: 'Sıfırla', danger: true,
        onSubmit: () => { db = seed(); save(); toast('Demo verisi sıfırlandı.'); } });
    },
  };

  /* ------------------------------------------------------------------
     TWO-STEP VERIFICATION (2FA) — e-mail code
     The database refuses everything to a 2FA account's session until that
     session is verified; this is the screen that verifies it. A browser that
     verified once keeps a 30-day token (localStorage) and is let through
     without a code next time.
     ------------------------------------------------------------------ */
  const MFA_LEN = 6;
  const mfaDeviceKey = () => `unipaktMfaDevice.${session?.user_id || state.user || ''}`;
  const mfaLead = () => `<b>${esc(state.mfa.email || 'E-posta adresine')}</b> ${state.mfa.email ? 'adresine' : ''} 6 haneli bir kod gönderdik. Kod 10 dakika geçerli.`;
  const mfaCodeHtml = (purpose) => `<form class="mfa" id="mfaForm" data-purpose="${esc(purpose)}" novalidate autocomplete="off">
      <div class="mfa-digits" role="group" aria-label="6 haneli doğrulama kodu">
        ${Array.from({ length: MFA_LEN }, (_, i) => `<input class="mfa-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="${i === 0 ? MFA_LEN : 1}" aria-label="${i + 1}. hane" data-mfa-digit="${i}" ${i === 0 ? 'autocomplete="one-time-code"' : 'autocomplete="off"'}>`).join('')}
      </div>
      <p class="mfa-msg" data-mfa-msg aria-live="polite"></p>
      <div class="mfa-actions">
        <button class="btn" type="submit">Doğrula</button>
        <button class="link-btn" type="button" data-mfa-resend>Kodu tekrar gönder</button>
      </div>
    </form>`;
  const setMfaMsg = (text, isError = false) => {
    const el = document.querySelector('[data-mfa-msg]');
    if (!el) return;
    el.textContent = text || ''; el.classList.toggle('is-error', !!isError);
  };
  // "Kodu tekrar gönder" is disabled while the 45-second wait runs.
  let mfaTimer = null;
  const tickMfaResend = () => {
    clearInterval(mfaTimer);
    const update = () => {
      const btn = document.querySelector('[data-mfa-resend]');
      if (!btn) { clearInterval(mfaTimer); return; }
      const left = Math.ceil((state.mfa.resendAt - Date.now()) / 1000);
      btn.disabled = left > 0;
      btn.textContent = left > 0 ? `Kodu tekrar gönder (${left})` : 'Kodu tekrar gönder';
      if (left <= 0) clearInterval(mfaTimer);
    };
    update(); mfaTimer = setInterval(update, 1000);
  };
  const requestMfaCode = async (purpose) => {
    try {
      const r = await api.mfa('send', { purpose });
      if (r?.email) state.mfa.email = r.email;
      state.mfa.resendAt = Date.now() + 45000;
      const lead = document.querySelector('[data-mfa-lead]');
      if (lead) lead.innerHTML = mfaLead();
      setMfaMsg('');
    } catch (error) {
      if (error.data?.retry_after) state.mfa.resendAt = Date.now() + error.data.retry_after * 1000;
      setMfaMsg(error.message || 'Kod gönderilemedi.', true);
    }
    tickMfaResend();
  };
  const mountMfa = () => {
    document.querySelector('[data-mfa-digit="0"]')?.focus();
    tickMfaResend();
  };
  const mfaDigits = (form) => [...form.querySelectorAll('[data-mfa-digit]')];
  // Put a run of digits into the boxes from `start` (typing, paste, autofill).
  const fillMfaDigits = (form, start, text) => {
    const boxes = mfaDigits(form);
    const digits = String(text).replace(/\D/g, '').slice(0, MFA_LEN - start).split('');
    digits.forEach((d, k) => { boxes[start + k].value = d; });
    const next = Math.min(start + digits.length, MFA_LEN - 1);
    boxes[next].focus();
    if (boxes.every((b) => b.value)) form.requestSubmit();
  };
  // Wrong code: every digit hops up a little and falls out of its box.
  const spillMfaDigits = (form) => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    mfaDigits(form).forEach((box, i) => {
      const value = box.value;
      box.value = '';
      if (!value) return;
      const r = box.getBoundingClientRect();
      const cs = getComputedStyle(box);
      const drop = document.createElement('span');
      drop.className = 'mfa-drop';
      drop.textContent = value;
      Object.assign(drop.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`, font: cs.font, color: cs.color });
      document.body.append(drop);
      const fall = window.innerHeight - r.top + 120;
      const drift = (Math.random() - 0.5) * 70;
      const spin = (Math.random() - 0.5) * 90;
      const anim = drop.animate(reduce
        ? [{ opacity: 1 }, { opacity: 0 }]
        : [
          { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
          { transform: `translate(${drift * 0.15}px, -16px) rotate(${spin * 0.1}deg)`, opacity: 1, offset: 0.16, easing: 'cubic-bezier(.5, 0, .9, .5)' },
          { transform: `translate(${drift}px, ${fall}px) rotate(${spin}deg)`, opacity: 0.85 },
        ], { duration: reduce ? 250 : 950 + Math.random() * 300, delay: reduce ? 0 : i * 60, fill: 'forwards' });
      anim.onfinish = () => drop.remove();
    });
    form.classList.remove('is-wrong'); void form.offsetWidth; form.classList.add('is-wrong');
    setTimeout(() => form.querySelector('[data-mfa-digit="0"]')?.focus(), 150);
  };
  const verifyMfa = async (form) => {
    const purpose = form.dataset.purpose;
    const code = mfaDigits(form).map((b) => b.value).join('');
    if (code.length !== MFA_LEN) { setMfaMsg('Kodun 6 hanesini de gir.', true); return; }
    if (state.mfa.busy) return;
    state.mfa.busy = true;
    const button = form.querySelector('button[type="submit"]');
    button.disabled = true; setMfaMsg('Doğrulanıyor…');
    try {
      const r = await api.mfa('verify', { purpose, code });
      if (r?.device_token && !DEMO) { try { localStorage.setItem(mfaDeviceKey(), r.device_token); } catch (_) {} }
      form.classList.add('is-ok'); setMfaMsg('Doğrulandı.');
      await new Promise((ok) => setTimeout(ok, 450));
      state.mfa.flow = null;
      if (purpose === 'login') { await enterPanel(); return; }
      if (purpose === 'enable') { state.mfa.enabled = true; toast('İki adımlı doğrulama açıldı.'); }
      if (purpose === 'disable') {
        state.mfa.enabled = false;
        try { localStorage.removeItem(mfaDeviceKey()); } catch (_) {}
        toast('İki adımlı doğrulama kapatıldı.');
      }
      go('hesap');
    } catch (error) {
      if (!state.user && !session && !DEMO) { renderLogin(error.message); return; }
      spillMfaDigits(form);
      const kind = error.data?.error;
      setMfaMsg(error.message || 'Kod doğrulanamadı.', true);
      if (kind === 'expired' || kind === 'locked') { state.mfa.resendAt = 0; tickMfaResend(); }
    } finally {
      state.mfa.busy = false;
      if (document.body.contains(button)) button.disabled = false;
    }
  };
  // Full-screen code page shown after sign-in, before any panel data loads.
  const renderMfaGate = () => {
    root.innerHTML = `
      <main class="login"><div class="login-box mfa-box">
        <a class="wordmark" href="https://unipakt.com/" aria-label="UniPakt"><img data-tint="unipakt-logo-bg-white" class="wordmark-img" src="unipakt-logo-bg-white.png?v=5" alt="UniPakt"></a>
        <p class="kicker">Panel</p>
        <h1 class="mfa-title">Bu tarayıcıyı doğrula</h1>
        <p class="mfa-lead" data-mfa-lead>İki adımlı doğrulama açık. ${mfaLead()}</p>
        ${mfaCodeHtml('login')}
        <p class="mfa-note">Doğruladığın tarayıcı 30 gün boyunca tekrar kod istemez.</p>
        <button class="link-btn mfa-signout" type="button" data-mfa-signout>Farklı bir hesapla giriş yap</button>
      </div></main>`;
    mountMfa();
  };
  const showMfaGate = async () => {
    state.mfa.flow = { purpose: 'login' };
    renderMfaGate();
    await requestMfaCode('login');
  };
  // True when this session may load the panel; otherwise the code page is shown.
  const passMfaGate = async () => {
    let status;
    // If the check itself is unreachable, carry on: the database still enforces 2FA.
    try { status = await remote.mfa('status'); } catch (error) { if (!session) throw error; return true; }
    state.mfa.enabled = !!status.enabled; state.mfa.email = status.email || '';
    if (status.verified) return true;
    let token = '';
    try { token = localStorage.getItem(mfaDeviceKey()) || ''; } catch (_) {}
    if (token) {
      const trusted = await remote.mfa('trust', { device_token: token }).catch(() => null);
      if (trusted?.verified) return true;
      try { localStorage.removeItem(mfaDeviceKey()); } catch (_) {}
    }
    await showMfaGate();
    return false;
  };
  // Sign-in → 2FA (if on) → data → panel.
  const enterPanel = async () => {
    root.innerHTML = '<main class="login"><p class="loading">Yükleniyor…</p></main>';
    try {
      if (!DEMO && !(await passMfaGate())) return;
      await loadRemote(); lastSync = Date.now();
      if (!knownView(state.view)) state.view = homeView();
      render(); window.scrollTo(0, 0);
      loadSiteInboxCount(); startMatrix();
    } catch (error) {
      if (error.mfa) { await showMfaGate(); return; }
      state.user = null; renderLogin(error.message);
    }
  };

  /* ------------------------------------------------------------------
     BİRİM ÇALIŞMA ALANI — birim hesaplarının ve Merkez Yönetim'in ortak araçları
     (Genel Bakış, Bildirimler, Görevler, Duyurular, Belgeler, İşlem Kaydı) ve
     birim sayfaları. Görünüm kimlikleri "b-" ile başlar.
     Sunucu: unit_workspace() tek okuma, uw(işlem, veri) tek yazma kapısıdır;
     yetkiyi sunucu denetler, buradaki koşullar yalnızca düğmeleri gizler.
     ------------------------------------------------------------------ */
  state.uw = { data: null, loading: false, error: '' };
  state.uwTab = {};          // görünüm başına seçili sekme
  state.uwFilter = {};       // görünüm başına süzgeç
  const UWD = () => state.uw.data || {};
  const uwMe = () => UWD().me || { admin: isAdmin(), perms: [], unit_id: null, is_head: false, units: [] };
  const uwUnits = () => uwMe().units || [];
  const uwUnit = (id) => uwUnits().find((u) => u.id === id);
  const uwMyUnit = () => uwUnit(uwMe().unit_id);
  const uwUnitOfKind = (k) => uwUnits().find((u) => u.kind === k);
  const uwAdmin = () => isAdmin();
  const uwHead = () => !!state.unitAcc && !!uwMe().is_head;
  const uwHas = (perm) => !!state.unitAcc && (uwMe().is_head || (uwMe().perms || []).includes(perm) || (state.unitAcc.perms || []).includes(perm));
  const uwLead = () => uwHead() || uwHas('team');
  const uwKindIs = (k) => (uwMyUnit()?.kind || null) === k;
  const uwCan = (k, perm) => uwKindIs(k) && uwHas(perm);
  const uwPerson = (id) => { for (const u of uwUnits()) { const m = (u.members || []).find((x) => x.id === id); if (m) return { ...m, unit: u }; } return null; };
  const uwList = (key) => (Array.isArray(UWD()[key]) ? UWD()[key] : []);
  const uwUnread = () => uwList('notifications').filter((n) => !n.read_at).length;
  const uwDate = (v) => (v ? fmtDay(String(v).slice(0, 10)) : '');
  const uwWhen = (v) => (v ? fmtStamp(v) : '');
  const uwTabOf = (view, def) => state.uwTab[view] || def;
  const uwTabs = (view, tabs, def) => `<div class="toolbar">${tabs.map(([id, label, n]) => `<button class="chip ${uwTabOf(view, def) === id ? 'active' : ''}" data-act="uw-tab" data-id="${esc(view)}" data-sub="${esc(id)}">${esc(label)}${n !== undefined ? ` (${n})` : ''}</button>`).join('')}</div>`;
  const uwLoading = (title, sub) => {
    const top = head(title, sub);
    if (state.uw.error) return `${top}<section class="card"><p class="body">${esc(state.uw.error)}</p><button class="btn small" data-act="uw-reload">Tekrar dene</button></section>`;
    return state.uw.data ? '' : `${top}<section class="card"><p class="body">Yükleniyor…</p></section>`;
  };
  const uwLink = (url, label = 'Bağlantıyı aç') => (url && /^https?:\/\//i.test(url) ? `<a class="link-btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>` : '');
  const uwText = (t) => esc(t || '').replace(/\n/g, '<br>');

  const loadUw = async () => {
    if (state.uw.loading) return;
    state.uw.loading = true; state.uw.error = '';
    try { state.uw.data = await api.workspace(); }
    catch (error) { state.uw.error = error.message || 'Birim verileri yüklenemedi.'; }
    state.uw.loading = false;
    if (state.user && !busy()) render();
  };
  // Yazma: sunucuya gönder, ardından çalışma alanını yeniden oku.
  const uwDo = async (action, data = {}) => {
    const result = await api.uw(action, data);
    try { state.uw.data = await api.workspace(); } catch (_) { /* bir sonraki açılışta yenilenir */ }
    return result;
  };
  // Form gönderimi: hata metni döner (openForm gösterir), başarıda bildirim çıkar.
  const uwSubmit = (action, build, ok) => async (fd) => {
    try { await uwDo(action, build(fd)); if (ok) toast(ok); return null; }
    catch (error) { return error.message || 'İşlem yapılamadı.'; }
  };
  const uwRun = async (action, data, ok) => { await uwDo(action, data); if (ok) toast(ok); render(); };

  // Seçim kutuları
  const uwMemberOptions = (unitId, selected = '', { none = '' } = {}) => {
    const u = uwUnit(unitId);
    return `${none ? `<option value="">${esc(none)}</option>` : ''}${(u?.members || []).map((m) => `<option value="${esc(m.id)}" ${m.id === selected ? 'selected' : ''}>${esc(m.name)}${m.is_head ? ' (Başkan)' : ''}</option>`).join('')}`;
  };
  const uwUnitOptions = (selected = '', { all = '' } = {}) => `${all ? `<option value="">${esc(all)}</option>` : ''}${uwUnits().map((u) => `<option value="${esc(u.id)}" ${u.id === selected ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}`;

  /* ---------------- Genel Bakış (birim hesabı) ---------------- */
  // Birim sayfaları kendi sayaçlarını buraya ekler: () => [{ label, n, go, hot }]
  const UW_HOME_STATS = [];
  const uwHomeView = () => {
    const wait = uwLoading('Genel Bakış', 'Birimindeki işler tek ekranda.'); if (wait) return wait;
    const me = uwMe(), u = uwMyUnit();
    const tasks = uwList('tasks').filter((t) => t.status === 'open' && (t.assignee === me.id || (!t.assignee && uwLead())));
    const review = uwLead() ? uwList('tasks').filter((t) => !t.by_admin && t.review_status === 'pending') : [];
    const anns = uwList('announcements');
    const unreadAnn = anns.filter((a) => !a.read_at);
    const extra = UW_HOME_STATS.flatMap((f) => f() || []);
    const stats = [
      { label: 'Okunmamış bildirim', n: uwUnread(), go: 'b-bildirimler', hot: uwUnread() > 0 },
      { label: 'Açık görevim', n: tasks.length, go: 'b-gorevler', hot: tasks.some((t) => t.due_date && t.due_date <= today()) },
      ...(uwLead() ? [{ label: 'İncelemeni bekleyen görev', n: review.length, go: 'b-gorevler', hot: review.length > 0 }] : []),
      { label: 'Yeni duyuru', n: unreadAnn.length, go: 'b-duyurular', hot: unreadAnn.length > 0 },
      ...extra,
    ];
    const events = upcomingEvents().slice(0, 4);
    return `
      ${head('Genel Bakış', `${u?.name || state.unitAcc?.unitName || 'Birim'} · ${state.unitAcc?.roleName || ''}`)}
      <div class="stats uw-stats">${stats.map((s) => `<button class="stat ${s.hot ? 'hot' : ''}" data-go="${esc(s.go)}"><b>${s.n}</b><span>${esc(s.label)}</span></button>`).join('')}</div>
      <div class="grid-2" style="margin-top:34px">
        <div>
          <div class="section-head"><h2>Görevlerim</h2><button class="link-btn" data-go="b-gorevler">Tümü</button></div>
          ${tasks.length ? `<div class="card">${tasks.slice(0, 5).map((t) => `<div class="mini-row"><div><strong>${esc(t.title)}</strong><small>${t.due_date ? `Son tarih ${uwDate(t.due_date)} · ` : ''}${t.by_admin ? 'Merkez Yönetim' : esc(t.created_by_name || '')}</small></div>${t.due_date && t.due_date < today() ? '<span class="tag no">Gecikti</span>' : '<span class="tag wait">Açık</span>'}</div>`).join('')}</div>` : empty('Açık görevin yok.')}
        </div>
        <div>
          <div class="section-head"><h2>Duyurular</h2><button class="link-btn" data-go="b-duyurular">Tümü</button></div>
          ${anns.length ? `<div class="card">${anns.slice(0, 4).map((a) => `<div class="mini-row"><div><strong>${esc(a.title)}</strong><small>${uwWhen(a.created_at)} · ${esc(a.created_by_name || 'Merkez Yönetim')}</small></div>${a.read_at ? '' : '<span class="tag wait">Yeni</span>'}</div>`).join('')}</div>` : empty('Duyuru yok.')}
        </div>
        <div>
          <div class="section-head"><h2>Yaklaşan etkinlikler</h2><button class="link-btn" data-go="b-takvim">Takvim</button></div>
          ${events.length ? `<div class="card">${events.map((e) => `<div class="mini-row"><div><strong>${esc(e.title)}</strong><small>${fmtDay(e.date)}${e.time ? ` · ${esc(e.time)}` : ''} · ${esc(who(e.ownerId))}</small></div></div>`).join('')}</div>` : empty('Yaklaşan etkinlik yok.')}
        </div>
      </div>`;
  };

  /* ---------------- Bildirimler ---------------- */
  const uwNotifView = () => {
    const title = uwAdmin() ? 'Birim Bildirimleri' : 'Bildirimler';
    const sub = uwAdmin() ? 'Birimlerden gelen onay istekleri, tamamlanan görevler ve raporlar.' : 'Sana ve birimine gelen görevler, onay sonuçları ve duyurular.';
    const wait = uwLoading(title, sub); if (wait) return wait;
    const list = uwList('notifications');
    return `${head(title, sub, list.some((n) => !n.read_at) ? '<button class="btn ghost" data-act="uw-notif-readall">Tümünü okundu say</button>' : '')}
      ${list.length ? `<div class="stack">${list.map((n) => `
        <article class="card item notification ${n.read_at ? '' : 'unread'}">
          <div class="meta top"><span class="tag ${n.read_at ? '' : 'wait'}">${n.read_at ? 'Okundu' : 'Yeni'}</span><span>${uwWhen(n.created_at)}</span></div>
          <h3>${esc(n.title)}</h3>${n.body ? `<p class="body notif-body">${esc(n.body)}</p>` : ''}
          <div class="actions">
            ${n.view && knownView(n.view) ? `<button class="btn small" data-act="uw-notif-open" data-id="${esc(n.id)}" data-sub="${esc(n.view)}">Aç</button>` : ''}
            ${n.read_at ? '' : `<button class="btn ghost small" data-act="uw-notif-read" data-id="${esc(n.id)}">Okundu</button>`}
            <button class="btn ghost small" data-act="uw-notif-hide" data-id="${esc(n.id)}">Sil</button>
          </div>
        </article>`).join('')}</div>` : empty('Bildirim yok.')}`;
  };

  /* ---------------- Görevler ---------------- */
  const uwTaskCanReview = (t) => t.review_status === 'pending' && (t.by_admin ? uwAdmin() : (!!state.unitAcc && t.unit_id === uwMe().unit_id && uwLead()));
  const uwTaskCanComplete = (t) => t.status === 'open' && !!state.unitAcc && t.unit_id === uwMe().unit_id && (t.assignee === uwMe().id || (!t.assignee && uwLead()));
  const uwTaskCanDelete = (t) => uwAdmin() || (!t.by_admin && !!state.unitAcc && t.unit_id === uwMe().unit_id && uwLead());
  const uwTaskCard = (t) => {
    const late = t.status === 'open' && t.due_date && t.due_date < today();
    const st = t.review_status === 'pending' ? ['wait', 'İncelemede'] : t.review_status === 'approved' ? ['ok', 'Onaylandı'] : t.review_status === 'rejected' && t.status === 'open' ? ['no', 'Geri gönderildi'] : late ? ['no', 'Gecikti'] : ['wait', 'Açık'];
    return `<article class="card item">
      <div class="meta top"><span class="tag ${st[0]}">${st[1]}</span><span>${uwAdmin() ? `${esc(uwUnit(t.unit_id)?.name || 'Birim')} · ` : ''}${t.assignee ? esc(t.assignee_name || 'Kişi') : 'Birime'}${t.due_date ? ` · Son tarih ${uwDate(t.due_date)}` : ''}</span></div>
      <h3>${esc(t.title)}</h3>
      ${t.description ? `<p class="body">${uwText(t.description)}</p>` : ''}
      <div class="meta"><span>Atayan: ${t.by_admin ? 'Merkez Yönetim' : esc(t.created_by_name || '—')} · ${uwWhen(t.created_at)}</span></div>
      ${t.review_note ? `<div class="quote"><small>${t.review_status === 'rejected' ? 'Geri gönderme notu' : 'İnceleme notu'}</small>${uwText(t.review_note)}</div>` : ''}
      ${t.status === 'done' ? `<div class="quote"><small>Tamamlayan: ${esc(t.done_by_name || '—')} · ${uwWhen(t.done_at)}</small>${uwText(t.proof_text || '')}${t.proof_link ? `<div>${uwLink(t.proof_link)}</div>` : ''}</div>` : ''}
      <div class="actions">
        ${uwTaskCanComplete(t) ? `<button class="btn small" data-act="uw-task-complete" data-id="${esc(t.id)}">Tamamladım</button>` : ''}
        ${uwTaskCanReview(t) ? `<button class="btn small" data-act="uw-task-approve" data-id="${esc(t.id)}">Onayla</button><button class="btn ghost small" data-act="uw-task-reject" data-id="${esc(t.id)}">Geri gönder</button>` : ''}
        ${uwTaskCanDelete(t) ? `<button class="btn ghost small" data-act="uw-task-delete" data-id="${esc(t.id)}">Sil</button>` : ''}
      </div>
    </article>`;
  };
  const uwTasksView = () => {
    const title = uwAdmin() ? 'Birim Görevleri' : 'Görevler';
    const sub = uwAdmin() ? 'Birimlere ya da birimdeki bir kişiye görev ata; tamamlananları incele.' : (uwLead() ? 'Sana atanan görevler ve ekibine atadıkların. Tamamlanan görevi sen incelersin.' : 'Sana atanan görevler. Bitirince kısa bir not ya da bağlantı bırak.');
    const wait = uwLoading(title, sub); if (wait) return wait;
    let list = uwList('tasks');
    const unitFilter = state.uwFilter['b-gorevler'] || '';
    if (uwAdmin() && unitFilter) list = list.filter((t) => t.unit_id === unitFilter);
    const open = list.filter((t) => t.status === 'open').sort((a, b) => String(a.due_date || '9').localeCompare(String(b.due_date || '9')));
    const pending = list.filter((t) => t.review_status === 'pending');
    const done = list.filter((t) => t.review_status === 'approved');
    const tab = uwTabOf('b-gorevler', 'open');
    const shown = tab === 'review' ? pending : tab === 'done' ? done : open;
    return `${head(title, sub, uwAdmin() || uwLead() ? '<button class="btn" data-act="uw-task-new">Görev ata</button>' : '')}
      <div class="toolbar">
        ${[['open', 'Açık', open.length], ['review', 'İncelemede', pending.length], ['done', 'Onaylanan', done.length]].map(([id, label, n]) => `<button class="chip ${tab === id ? 'active' : ''}" data-act="uw-tab" data-id="b-gorevler" data-sub="${id}">${label} (${n})</button>`).join('')}
        ${uwAdmin() ? `<select data-uw-filter="b-gorevler" aria-label="Birime göre süz">${uwUnitOptions(unitFilter, { all: 'Tüm birimler' })}</select>` : ''}
      </div>
      <div class="stack">${shown.length ? shown.map(uwTaskCard).join('') : empty(tab === 'review' ? 'İnceleme bekleyen görev yok.' : tab === 'done' ? 'Onaylanan görev yok.' : 'Açık görev yok.')}</div>`;
  };

  /* ---------------- Duyurular ---------------- */
  const uwAnnView = () => {
    const title = uwAdmin() ? 'Birim Duyuruları' : 'Duyurular';
    const sub = uwAdmin() ? 'Birimlere yaptığın iç duyurular. Kulüpler bunları görmez.' : 'Merkez Yönetim’in birimlere duyuruları.';
    const wait = uwLoading(title, sub); if (wait) return wait;
    const list = uwList('announcements');
    const aud = (a) => (a.audience?.length ? a.audience.map((id) => uwUnit(id)?.name).filter(Boolean).join(', ') : 'Tüm birimler');
    return `${head(title, sub, uwAdmin() ? '<button class="btn" data-act="uw-ann-new">Yeni birim duyurusu</button>' : '')}
      ${list.length ? `<div class="stack">${list.map((a) => `
        <article class="card item ${!uwAdmin() && !a.read_at ? 'unread' : ''}">
          <div class="meta top"><span class="tag ${!uwAdmin() && !a.read_at ? 'wait' : 'ok'}">${uwAdmin() ? esc(aud(a)) : a.read_at ? 'Okundu' : 'Yeni'}</span><span>${uwWhen(a.created_at)} · ${esc(a.created_by_name || 'Merkez Yönetim')}</span></div>
          <h3>${esc(a.title)}</h3><p class="body">${uwText(a.body)}</p>
          <div class="actions">
            ${uwAdmin() ? `<span class="hint">${Number(a.reads || 0)} kişi okudu</span><button class="btn ghost small" data-act="uw-ann-delete" data-id="${esc(a.id)}">Sil</button>` : a.read_at ? '' : `<button class="btn small" data-act="uw-ann-read" data-id="${esc(a.id)}">Okudum</button>`}
          </div>
        </article>`).join('')}</div>` : empty('Henüz duyuru yok.')}`;
  };

  /* ---------------- Belgeler ---------------- */
  const uwDocsView = () => {
    const sub = 'Protokoller, revizyon belgeleri ve kurumsal Drive bağlantıları. Merkez Yönetim ve birim başkanları ekler, herkes görür.';
    const wait = uwLoading('Belgeler', sub); if (wait) return wait;
    const docs = uwList('docs');
    const groups = [[null, 'Tüm UniPakt'], ...uwUnits().map((u) => [u.id, u.name])].map(([id, name]) => [id, name, docs.filter((d) => (d.unit_id || null) === id)]).filter(([, , l]) => l.length);
    const canDel = (d) => uwAdmin() || (uwHead() && d.unit_id === uwMe().unit_id);
    return `${head('Belgeler', sub, uwAdmin() || uwHead() ? '<button class="btn" data-act="uw-doc-new">Belge ekle</button>' : '')}
      ${groups.length ? groups.map(([, name, l]) => `<div class="section-head"><h2>${esc(name)}</h2></div><div class="card">${l.map((d) => `
        <div class="mini-row"><div><strong>${esc(d.title)}</strong><small>${d.note ? `${esc(d.note)} · ` : ''}${esc(d.created_by_name || '')} · ${uwWhen(d.created_at)}</small></div>
          <div class="row">${uwLink(d.url, 'Aç')}${canDel(d) ? `<button class="btn ghost small" data-act="uw-doc-delete" data-id="${esc(d.id)}">Sil</button>` : ''}</div></div>`).join('')}</div>`).join('') : empty('Henüz belge eklenmedi.')}`;
  };

  /* ---------------- İşlem Kaydı (birim başkanı) ---------------- */
  const uwActivityView = () => {
    const sub = 'Biriminde kimin ne zaman ne yaptığı. Yalnızca birim başkanı görür.';
    const wait = uwLoading('İşlem Kaydı', sub); if (wait) return wait;
    const rows = uwList('activity');
    return `${head('İşlem Kaydı', sub, '<button class="btn ghost" data-act="uw-reload">Yenile</button>')}
      ${rows.length ? `<div class="card">${rows.map((r) => `<div class="mini-row"><div><strong>${esc(r.actor_name)} · ${esc(r.action)}</strong><small>${esc(r.actor_title || '')}${r.target ? ` · ${esc(r.target)}` : ''}</small></div><span class="hint">${uwWhen(r.created_at)} ${new Date(r.created_at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })}</span></div>`).join('')}</div>` : empty('Henüz kayıt yok.')}`;
  };

  /* ---------------- Merkez Genel Bakış'a birim özeti ---------------- */
  const uwAdminSummary = () => {
    if (!isAdmin()) return '';
    if (!state.uw.data) return '';
    const tasks = uwList('tasks');
    const rows = uwUnits().map((u) => ({ u, people: (u.members || []).length, open: tasks.filter((t) => t.unit_id === u.id && t.status === 'open').length, review: tasks.filter((t) => t.unit_id === u.id && t.by_admin && t.review_status === 'pending').length }));
    const pend = UW_ADMIN_PENDING.reduce((n, f) => n + (f() || 0), 0);
    return `<div style="margin-top:34px">
      <div class="section-head"><h2>Birimler</h2><button class="link-btn" data-go="b-onaylar">Birim Onayları${pend ? ` (${pend})` : ''}</button></div>
      <div class="card">${rows.map(({ u, people, open, review }) => `<div class="mini-row"><div><strong>${esc(u.name)}</strong><small>${people} aktif kişi · ${open} açık görev${review ? ` · ${review} görev incelemende` : ''}</small></div>${people ? '' : '<span class="tag">Ekip yok</span>'}</div>`).join('')}</div>
    </div>`;
  };
  // Merkez'in onay bekleyen birim işleri (Birim Onayları sayfası doldurur).
  const UW_ADMIN_PENDING = [];

  /* ---------------- Görünümler ve menü ---------------- */
  // [id, etiket (fonksiyon), sayaç, grup, izin, çizim]
  const UW_VIEWS = {};
  const uwView = (id, def) => { UW_VIEWS[id] = def; };
  uwView('b-genel', { label: () => 'Genel Bakış', group: 'unipakt', order: 0, allow: () => !!state.unitAcc, render: uwHomeView });
  uwView('b-bildirimler', { label: () => (isAdmin() ? 'Birim Bildirimleri' : 'Bildirimler'), group: () => (isAdmin() ? 'birim' : 'unipakt'), order: 1, count: uwUnread, allow: () => isAdmin() || !!state.unitAcc, render: uwNotifView });
  uwView('b-gorevler', { label: () => (isAdmin() ? 'Birim Görevleri' : 'Görevler'), group: () => (isAdmin() ? 'birim' : 'unipakt'), order: 2,
    count: () => (isAdmin() ? uwList('tasks').filter((t) => t.by_admin && t.review_status === 'pending').length : uwList('tasks').filter((t) => (t.status === 'open' && (t.assignee === uwMe().id || (!t.assignee && uwLead()))) || (uwLead() && !t.by_admin && t.review_status === 'pending')).length),
    allow: () => isAdmin() || !!state.unitAcc, render: uwTasksView });
  uwView('b-duyurular', { label: () => (isAdmin() ? 'Birim Duyuruları' : 'Duyurular'), group: () => (isAdmin() ? 'birim' : 'unipakt'), order: 3, count: () => (isAdmin() ? 0 : uwList('announcements').filter((a) => !a.read_at).length), allow: () => isAdmin() || !!state.unitAcc, render: uwAnnView });
  uwView('b-belgeler', { label: () => 'Belgeler', group: () => (isAdmin() ? 'birim' : 'unipakt'), order: 5, allow: () => isAdmin() || !!state.unitAcc, render: uwDocsView });
  uwView('b-islem', { label: () => 'İşlem Kaydı', group: 'unipakt', order: 7, allow: () => !!state.unitAcc && uwHead(), render: uwActivityView });
  const uwNavItems = (group) => Object.entries(UW_VIEWS)
    .filter(([, d]) => (typeof d.group === 'function' ? d.group() : d.group) === group)
    .sort((a, b) => (a[1].order ?? 50) - (b[1].order ?? 50))
    .map(([id, d]) => [id, d.label(), d.count ? d.count() : 0, group]);
  Object.entries(UW_VIEWS).forEach(([id, d]) => { views[id] = () => d.render(); });

  /* ---------------- İşlemler ---------------- */
  const uwActions = {
    'uw-reload'() { state.uw.data = null; return loadUw(); },
    'uw-tab'(view, tab) { state.uwTab[view] = tab; render(); },
    'uw-notif-open'(id, view) { if (!UWD().notifications?.find((n) => n.id === id)?.read_at) uwDo('notif_read', { id }).catch(() => {}); go(view); },
    'uw-notif-read'(id) { return uwRun('notif_read', { id }); },
    'uw-notif-readall'() { return uwRun('notif_read', {}, 'Tüm bildirimler okundu.'); },
    'uw-notif-hide'(id) { return uwRun('notif_hide', { id }); },
    'uw-task-new'() {
      const admin = uwAdmin();
      const pick = admin
        ? field('Kime', `<select name="target" required>${uwUnits().map((u) => `<optgroup label="${esc(u.name)}"><option value="${esc(u.id)}|">${esc(u.name)} (birime)</option>${(u.members || []).map((m) => `<option value="${esc(u.id)}|${esc(m.id)}">${esc(m.name)}${m.is_head ? ' (Başkan)' : ''}</option>`).join('')}</optgroup>`).join('')}</select>`)
        : field('Kime', `<select name="target" required>${(uwMyUnit()?.members || []).filter((m) => m.id !== uwMe().id).map((m) => `<option value="|${esc(m.id)}">${esc(m.name)}</option>`).join('') || '<option value="">Ekibinde başka kişi yok</option>'}</select>`);
      openForm({ title: 'Görev ata', lead: admin ? 'Birime atarsan başkan ve ekip yönetimi yetkisi olanlar görür.' : 'Görev, seçtiğin kişinin Görevler sayfasına düşer. Tamamlandığında sen incelersin.', submit: 'Ata',
        fields: `${pick}${field('Başlık', '<input name="title" required maxlength="160">')}${field('Açıklama', '<textarea name="description" rows="4" maxlength="2000"></textarea>')}${field('Son tarih', '<input type="date" name="due_date">')}`,
        onSubmit: uwSubmit('task_create', (fd) => { const [unit, who2] = val(fd, 'target').split('|'); return { unit_id: unit || null, assignee: who2 || null, title: val(fd, 'title'), description: val(fd, 'description'), due_date: val(fd, 'due_date') }; }, 'Görev atandı.') });
    },
    'uw-task-complete'(id) {
      openForm({ title: 'Görevi tamamla', lead: 'Ne yaptığını kısaca yaz; varsa dosyanın ya da paylaşımın bağlantısını ekle.', submit: 'Gönder',
        fields: `${field('Not', '<textarea name="text" rows="4" maxlength="2000"></textarea>')}${field('Bağlantı (isteğe bağlı)', '<input name="link" type="url" placeholder="https://">')}`,
        onSubmit: uwSubmit('task_complete', (fd) => ({ id, text: val(fd, 'text'), link: val(fd, 'link') }), 'İncelemeye gönderildi.') });
    },
    'uw-task-approve'(id) { return uwRun('task_review', { id, status: 'approved' }, 'Görev onaylandı.'); },
    'uw-task-reject'(id) {
      openForm({ title: 'Görevi geri gönder', submit: 'Geri gönder', fields: field('Not', '<textarea name="note" rows="3" required maxlength="500"></textarea>'),
        onSubmit: uwSubmit('task_review', (fd) => ({ id, status: 'rejected', note: val(fd, 'note') }), 'Görev geri gönderildi.') });
    },
    'uw-task-delete'(id) { if (!confirm('Bu görev silinsin mi?')) return; return uwRun('task_delete', { id }, 'Görev silindi.'); },
    'uw-ann-new'() {
      openForm({ title: 'Birimlere duyuru', lead: 'Hiç birim seçmezsen tüm birimler görür. Kulüpler görmez.', submit: 'Yayınla',
        fields: `${field('Başlık', '<input name="title" required maxlength="160">')}${field('Metin', '<textarea name="body" rows="6" required maxlength="5000"></textarea>')}
          <fieldset class="field"><span>Kimler görsün</span><div class="check-grid">${uwUnits().map((u) => `<label class="check"><input type="checkbox" name="audience" value="${esc(u.id)}"> ${esc(u.name)}</label>`).join('')}</div></fieldset>`,
        onSubmit: uwSubmit('ann_create', (fd) => ({ title: val(fd, 'title'), body: val(fd, 'body'), audience: fd.getAll('audience') }), 'Duyuru yayınlandı.') });
    },
    'uw-ann-delete'(id) { if (!confirm('Duyuru silinsin mi?')) return; return uwRun('ann_delete', { id }, 'Duyuru silindi.'); },
    'uw-ann-read'(id) { return uwRun('ann_read', { id }); },
    'uw-doc-new'() {
      openForm({ title: 'Belge ekle', lead: 'Belgeyi Drive’a yükleyip bağlantısını buraya ekle. Bağlantının erişim ayarını Drive’da sen belirlersin.', submit: 'Ekle',
        fields: `${field('Belge adı', '<input name="title" required maxlength="160">')}${field('Bağlantı', '<input name="url" type="url" required placeholder="https://drive.google.com/…">')}${field('Kısa not', '<input name="note" maxlength="500">')}
          ${uwAdmin() ? field('Nereye', `<select name="unit_id">${uwUnitOptions('', { all: 'Tüm UniPakt' })}</select>`) : ''}`,
        onSubmit: uwSubmit('doc_add', (fd) => ({ title: val(fd, 'title'), url: val(fd, 'url'), note: val(fd, 'note'), unit_id: val(fd, 'unit_id') || null }), 'Belge eklendi.') });
    },
    'uw-doc-delete'(id) { if (!confirm('Belge listeden kaldırılsın mı? (Drive’daki dosya silinmez.)')) return; return uwRun('doc_delete', { id }, 'Belge kaldırıldı.'); },
  };
  Object.assign(actions, uwActions);
  document.addEventListener('change', (e) => {
    const view = e.target.dataset?.uwFilter; if (!view) return;
    state.uwFilter[view] = e.target.value; render();
  });

  /* ---------------- Demo: birim çalışma alanı bu tarayıcıda ---------------- */
  // Sunucudaki unit_workspace() / uw() ile aynı kurallar. Yalnızca panel.html?demo.
  const demoUw = () => (db.uw ||= { seq: 0, notifications: [], states: {}, tasks: [], anns: [], reads: {}, docs: [], activity: [] });
  const demoCtx = () => {
    const admin = isAdmin();
    const units = db.units || [];
    const meId = admin ? 'admin' : state.unitAcc?.id;
    const u = units.find((x) => x.members.some((m) => m.id === meId && m.status === 'active'));
    const m = u?.members.find((x) => x.id === meId);
    const kp = u?.kind_perms || ['team', 'roles', 'chat'];
    const perms = m ? (m.is_head ? kp : [...new Set([...(u.roles.find((r) => r.id === m.role_id)?.permissions || []), ...(m.permissions || [])])].filter((p) => kp.includes(p))) : [];
    return { admin, id: meId, unit: u?.id || null, kind: u?.kind || null, head: !!m?.is_head, perms, has: (p) => !!u && perms.includes(p) };
  };
  const demoName = (id) => (id === 'admin' ? 'UniPakt' : (db.units || []).flatMap((u) => u.members).find((m) => m.id === id)?.full_name || (id ? 'İsimsiz' : null));
  const demoLog = (action, target) => {
    const c = demoCtx(); const u = (db.units || []).find((x) => x.id === c.unit);
    const m = u?.members.find((x) => x.id === c.id);
    demoUw().activity.unshift({ id: uid(), unit_id: c.unit, actor_name: demoName(c.id), actor_title: c.admin ? 'UniPakt yetkilisi' : `${u?.name} · ${m?.is_head ? 'Birim Başkanı' : (u?.roles.find((r) => r.id === m?.role_id)?.name || 'Üye')}`, action, target, created_at: stamp() });
  };

      ${lead ? `<div class="actions">

        ${c.status === 'approved' ? `<button class="btn small" data-act="uw-post-request" data-id="${esc(c.title)}">Sosyal Medya’ya paylaşım talebi</button><button class="btn ghost small" data-act="uw-camp-done" data-id="${esc(c.id)}">Tamamlandı</button>` : ''}

  Object.assign(actions, {

          ${field('Plan tarihi', `<input type="datetime-local" name="plan_at" value="${esc(toLocalInput(p.plan_at))}">`)}${field('Sorumlu', `<select name="assignee"><option value="">—</option>${team.map((m) => `<option value="${esc(m.id)}" ${p.assignee === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>`)}`,

        fields: `${field('Kampanya adı', `<input name="title" required maxlength="160" value="${esc(c.title || '')}">`)}${field('Fikir', `<textarea name="idea" rows="4" maxlength="4000">${esc(c.idea || '')}</textarea>`)}${field('Hedef', `<textarea name="goal" rows="3" maxlength="2000">${esc(c.goal || '')}</textarea>`)}
          <label class="check"><input type="checkbox" name="has_budget" ${c.has_budget ? 'checked' : ''}> Bütçe gerekiyor (YK’dan sonra Merkez onayına gider)</label>${field('Bütçe açıklaması', `<textarea name="budget_note" rows="2" maxlength="1000">${esc(c.budget_note || '')}</textarea>`)}`,
        onSubmit: uwSubmit('camp_save', (fd) => ({ id: id || null, title: val(fd, 'title'), idea: val(fd, 'idea'), goal: val(fd, 'goal'), has_budget: fd.get('has_budget') === 'on', budget_note: val(fd, 'budget_note') }), 'Kampanya kaydedildi.') });

  /* ---------------- Demo: onay, yayın, kampanya ---------------- */
  const dU = () => demoUw();

  const demoCanDecide = (r, c) => (r.status === 'board' ? (r.kind === 'post' ? demoBoard(c) || c.admin : demoBoard(c)) : r.status === 'center' ? c.admin : false);
  const demoReqOpen = (c, kind, ref, title, summary, budget, budgetNote, status) => {
    const r = { id: uid(), kind, ref_id: ref, from_unit: c.unit, title, summary, needs_budget: !!budget, budget_note: budgetNote || null, status, board_by: null, board_at: null, center_by: null, center_at: null, note: null, created_by: c.id, created_at: stamp() };
    (dU().requests ||= []).unshift(r);
    const label = kind === 'post' ? 'Yayın onayı' : kind === 'campaign' ? 'Kampanya onayı' : 'Bütçe onayı';
    if (status === 'board') { demoNotify(null, demoUnitOfKind('board'), 'approve', false, 'request', `${label} bekliyor`, title, 'b-onaylar'); if (kind === 'post') demoNotify(null, null, null, true, 'request', `${label} bekliyor`, title, 'b-onaylar'); }

      const list = [...d.clubs].sort((a, b) => daysSince(b.last_contact) - daysSince(a.last_contact));
      body = list.length ? `<div class="stack">${list.map((c) => { const ds = daysSince(c.last_contact); const recent = d.contacts.filter((x) => x.club_id === c.id).slice(0, 3); return `<article class="card item">
          <div class="meta top">${ds > COOL_DAYS ? '<span class="tag no">İlişki soğuyor</span>' : '<span class="tag ok">Temas sürüyor</span>'}<span>${esc(c.university || '')}${c.category ? ` · ${esc(c.category)}` : ''} · Son temas: ${c.last_contact ? `${uwDate(c.last_contact)} (${ds} gün)` : 'hiç'}${c.satisfaction ? ` · Memnuniyet ${c.satisfaction}/5` : ''}</span></div>
          <h3>${esc(c.name)}</h3>
          ${c.notes ? `<p class="body">${uwText(c.notes)}</p>` : ''}
          ${recent.length ? `<div class="card uw-mini">${recent.map((x) => `<div class="mini-row"><div><strong>${esc((CL_CONTACT.find(([k]) => k === x.kind) || ['', x.kind])[1])} · ${uwDate(x.at)}</strong><small>${esc(x.note || '')}${x.satisfaction ? ` · ${x.satisfaction}/5` : ''} · ${esc(x.by_name || '')}</small></div>${lead ? `<button class="btn ghost small" data-act="uw-cl-contact-del" data-id="${esc(x.id)}">Sil</button>` : ''}</div>`).join('')}</div>` : ''}
          ${lead ? `<div class="actions"><button class="btn small" data-act="uw-cl-contact" data-id="${esc(c.id)}">Temas kaydet</button><button class="btn ghost small" data-act="uw-cl-note" data-id="${esc(c.id)}">Not</button></div>` : ''}
        </article>`; }).join('')}</div>` : empty('Ağda kulüp yok.');
    } else if (tab === 'cands') {
      body = `${lead ? '<div class="actions" style="margin-bottom:14px"><button class="btn small" data-act="uw-cl-cand">Aday kulüp ekle</button></div>' : ''}
        ${d.candidates.length ? `<div class="card">${d.candidates.map((k) => { const [, l, c] = CL_CAND.find(([s]) => s === k.status) || ['', k.status, '']; return `<div class="mini-row"><div><strong>${esc(k.name)}</strong><small>${esc([k.university, k.contact, k.note].filter(Boolean).join(' · '))}</small></div><div class="row"><span class="tag ${c}">${esc(l)}</span>${lead ? `<button class="btn ghost small" data-act="uw-cl-cand" data-id="${esc(k.id)}">Düzenle</button><button class="btn ghost small" data-act="uw-cl-cand-del" data-id="${esc(k.id)}">Sil</button>` : ''}</div></div>`; }).join('')}</div>` : empty('Aday listesi boş.')}`;
    } else {
      const total = d.clubs.length;
      const new90 = d.clubs.filter((c) => daysSince(c.joined_at) <= 90).length;
      const touched = d.clubs.filter((c) => daysSince(c.last_contact) <= 30).length;
      const sats = d.clubs.map((c) => c.satisfaction).filter(Boolean);
      const avg = sats.length ? (sats.reduce((a, b) => a + b, 0) / sats.length).toFixed(1) : '—';
      const months = [...Array(6)].map((_, i) => { const x = new Date(); x.setDate(1); x.setMonth(x.getMonth() - 5 + i); return [x.getFullYear(), x.getMonth()]; });
      body = `<div class="stats uw-stats">
          <div class="stat"><b>${total}</b><span>Ağdaki kulüp</span></div>
          <div class="stat"><b>+${new90}</b><span>Son 90 günde katılan</span></div>
          <div class="stat ${touched < total / 2 ? 'hot' : ''}"><b>%${total ? Math.round((touched / total) * 100) : 0}</b><span>Son 30 günde temas edilen (${touched}/${total})</span></div>
          <div class="stat"><b>${avg}</b><span>Ortalama memnuniyet (${sats.length} kulüp)</span></div>
        </div>
        <div class="section-head"><h2>Aylara göre katılım</h2></div>
        <div class="card">${months.map(([y, m]) => { const n = d.clubs.filter((c) => { const j = new Date(c.joined_at); return j.getFullYear() === y && j.getMonth() === m; }).length; return `<div class="mini-row"><div><strong>${MONTHS[m]} ${y}</strong></div><span>${n ? `+${n}` : '0'}</span></div>`; }).join('')}</div>
        <p class="hint">Memnuniyet, temas kaydına girilen 1–5 puandan gelir (her kulübün en son puanı). Dönemlik kısa anket olarak her kulüpten dönemde bir kez puan almak yeterli.</p>`;
    }
    return `${head('Kulüp Ağı', sub)}${uwTabs('b-kulupler', [['clubs', 'Kulüpler', d.clubs.length], ['cands', 'Adaylar', d.candidates.length], ['stats', 'Göstergeler']], 'clubs')}
      ${cooling.length && tab === 'clubs' ? `<p class="hint">${cooling.length} kulüpte ${COOL_DAYS} günden uzun süredir temas yok.</p>` : ''}${body}`;
  };

  /* ---------------- Denetim Kayıtları ---------------- */
  const AU_LEVEL = { note: ['', 'Tespit notu'], verbal1: ['wait', '1. sözlü uyarı'], verbal2: ['wait', '2. sözlü uyarı'], written: ['no', 'Yazılı uyarı'], report: ['no', 'Merkez’e rapor'] };
  const AU_TYPE = { unit: 'Birim', event: 'Etkinlik', club: 'Kulüp' };
  const auData = () => UWD().audit || { records: [], events: [] };
  const auNext = (type, id) => { const n = auData().records.filter((r) => r.target_type === type && r.target_id === id && r.level !== 'note').length; return ['verbal1', 'verbal2', 'written', 'report'][Math.min(n, 3)]; };
  const uwAuditCard = (r, { admin = false } = {}) => `<article class="card item">
      <div class="meta top">${stTag(AU_LEVEL, r.level)}${r.skipped ? '<span class="tag no">Basamak atlandı</span>' : ''}<span>${esc(AU_TYPE[r.target_type])} · ${uwDate(r.occurred_on)} · ${esc(r.created_by_name || '')}</span></div>
      <h3>${esc(r.target_label)}</h3>
      <p class="body">${uwText(r.violation)}</p>
      ${r.skipped ? `<div class="quote"><small>Atlama gerekçesi</small>${uwText(r.skip_reason || '')}</div>` : ''}
      ${r.evidence || r.evidence_url ? `<div class="quote"><small>Kanıt</small>${uwText(r.evidence || '')}${r.evidence_url ? `<div>${uwLink(r.evidence_url, 'Kanıtı aç')}</div>` : ''}</div>` : ''}
      ${r.defense ? `<div class="quote"><small>Savunma (elden alındı · ${uwWhen(r.defense_at)})</small>${uwText(r.defense)}</div>` : r.level !== 'note' ? '<p class="hint">Savunma henüz kayda geçirilmedi.</p>' : ''}
      <div class="meta">${r.drive_url ? uwLink(r.drive_url, 'Drive arşivi') : ''}${r.level === 'report' ? (r.center_seen_at ? `<span>Merkez inceledi: ${esc(r.center_seen_by_name || '')} · ${uwWhen(r.center_seen_at)}${r.center_note ? ` · ${esc(r.center_note)}` : ''}</span>` : '<span>Merkez henüz incelemedi</span>') : ''}</div>
      <div class="actions">
        ${uwCan('audit', 'audit') ? `<button class="btn ghost small" data-act="uw-au-edit" data-id="${esc(r.id)}">Savunma / kanıt / arşiv</button>` : ''}
        ${admin && r.level === 'report' && !r.center_seen_at ? `<button class="btn small" data-act="uw-au-seen" data-id="${esc(r.id)}">İncelendi</button>` : ''}
      </div>
    </article>`;
  const uwAuditView = () => {
    const sub = 'Birimler (YK dahil), etkinlikler ve kulüpler; Merkez kapsam dışı. Denetim operasyonu durdurmaz: tespit eder, kayda alır, raporlar. Yüksek performans kültür ihlalini telafi etmez.';
    const wait = uwLoading('Denetim Kayıtları', sub); if (wait) return wait;
    const d = auData(), full = isAdmin() || uwCan('audit', 'audit') || uwCan('audit', 'audit_assign');
    const mine = d.events.filter((e) => e.assignees.some((a) => a.user_id === uwMe().id));
    const tab = uwTabOf('b-denetim', full ? 'records' : 'mine');
    let body = '';
    if (tab === 'records') {
      const t = state.uwFilter['b-denetim-type'] || '';
      const list = d.records.filter((r) => !t || r.target_type === t);
      body = `<div class="act-filters"><select data-uw-filter="b-denetim-type"><option value="">Tüm hedefler</option>${Object.entries(AU_TYPE).map(([k, l]) => `<option value="${k}" ${t === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        ${list.length ? `<div class="stack">${list.map((r) => uwAuditCard(r)).join('')}</div>` : empty('Kayıt yok.')}`;
    } else if (tab === 'targets') {
      const map = new Map();
      d.records.forEach((r) => { const k = `${r.target_type}:${r.target_id}`; const x = map.get(k) || { r, n: 0, notes: 0 }; if (r.level === 'note') x.notes++; else x.n++; map.set(k, x); });
      const rows = [...map.values()].sort((a, b) => b.n - a.n);
      body = rows.length ? `<div class="card">${rows.map(({ r, n, notes }) => { const nx = auNext(r.target_type, r.target_id); return `<div class="mini-row"><div><strong>${esc(r.target_label)}</strong><small>${esc(AU_TYPE[r.target_type])} · ${n} uyarı${notes ? ` · ${notes} tespit notu` : ''} · Sıradaki: ${esc(AU_LEVEL[nx][1])}</small></div><div class="uw-steps">${['verbal1', 'verbal2', 'written', 'report'].map((s, i) => `<i class="${i < n ? 'on' : ''}" title="${esc(AU_LEVEL[s][1])}"></i>`).join('')}</div></div>`; }).join('')}</div>` : empty('Henüz uyarı alan yok.');
    } else if (tab === 'events') {
      const canAssign = uwCan('audit', 'audit_assign');
      const up = d.events.filter((e) => e.date >= today()).sort((a, b) => a.date.localeCompare(b.date)), past = d.events.filter((e) => e.date < today());
      const ev = (e) => `<article class="card item event">${dateBlock(e.date)}<div>
          <div class="meta top"><span class="tag ${e.status === 'published' ? 'ok' : 'wait'}">${e.status === 'published' ? 'Yayında' : e.status === 'pending' ? 'Onay bekliyor' : esc(e.status)}</span><span>${esc(e.club_name || '')}${e.time ? ` · ${esc(String(e.time).slice(0, 5))}` : ''}${e.place ? ` · ${esc(e.place)}` : ''}</span></div>
          <h3>${esc(e.title)}</h3>
          ${e.assignees.length ? `<div class="card uw-mini">${e.assignees.map((a) => `<div class="mini-row"><div><strong>${esc(a.name)}</strong><small>${a.check_note ? `Kontrol: ${esc(a.check_note)} · ${uwWhen(a.checked_at)}` : 'Kontrol notu bekleniyor'}${a.note ? ` · Görev: ${esc(a.note)}` : ''}</small></div>${canAssign ? `<button class="btn ghost small" data-act="uw-au-unassign" data-id="${esc(e.id)}" data-sub="${esc(a.user_id)}">Kaldır</button>` : ''}</div>`).join('')}</div>` : '<p class="hint">Sorumlu atanmadı.</p>'}
          <div class="actions">${canAssign ? `<button class="btn small" data-act="uw-au-assign" data-id="${esc(e.id)}">Sorumlu ata</button>` : ''}${uwCan('audit', 'audit') ? `<button class="btn ghost small" data-act="uw-au-new" data-id="event:${esc(e.id)}">Kayıt aç</button>` : ''}</div>
        </div></article>`;
      body = `${up.length ? `<div class="stack">${up.map(ev).join('')}</div>` : empty('Yaklaşan kulüp etkinliği yok.')}${past.length ? `<div class="section-head"><h2>Geçmiş</h2></div><div class="stack">${past.slice(0, 30).map(ev).join('')}</div>` : ''}`;
    } else if (tab === 'mine') {
      body = mine.length ? `<div class="stack">${mine.map((e) => { const a = e.assignees.find((x) => x.user_id === uwMe().id); return `<article class="card item event">${dateBlock(e.date)}<div><div class="meta top">${a.check_note ? '<span class="tag ok">Kontrol edildi</span>' : '<span class="tag wait">Kontrol bekleniyor</span>'}<span>${esc(e.club_name || '')}${e.place ? ` · ${esc(e.place)}` : ''}</span></div><h3>${esc(e.title)}</h3>${a.note ? `<div class="quote"><small>Görev notu</small>${uwText(a.note)}</div>` : ''}${a.check_note ? `<div class="quote"><small>Kontrol notun · ${uwWhen(a.checked_at)}</small>${uwText(a.check_note)}</div>` : ''}<div class="actions"><button class="btn small" data-act="uw-au-check" data-id="${esc(e.id)}">${a.check_note ? 'Notu güncelle' : 'Kontrol notu gir'}</button></div></div></article>`; }).join('')}</div>` : empty('Sana atanmış etkinlik kontrolü yok.');
    } else {
      const unit = uwUnitOfKind('audit');
      const docs = uwList('docs').filter((x) => x.unit_id === unit?.id);
      body = `<p class="hint">Raporlar kurumsal Drive arşivinde tutulur. Arşiv klasörlerinin bağlantılarını birim başkanı buraya ekler; her kayda ayrıca kendi Drive bağlantısı eklenebilir.</p>
        ${docs.length ? `<div class="card">${docs.map((x) => `<div class="mini-row"><div><strong>${esc(x.title)}</strong><small>${esc(x.note || '')}</small></div><div class="row">${uwLink(x.url, 'Aç')}${uwHead() ? `<button class="btn ghost small" data-act="uw-doc-delete" data-id="${esc(x.id)}">Sil</button>` : ''}</div></div>`).join('')}</div>` : empty('Arşiv bağlantısı eklenmedi.')}
        ${uwHead() || isAdmin() ? '<div class="actions"><button class="btn small" data-act="uw-doc-new">Arşiv bağlantısı ekle</button></div>' : ''}`;
    }
    const tabs = full ? [['records', 'Kayıtlar', d.records.length], ['targets', 'Hedefler'], ['events', 'Etkinlikler', d.events.filter((e) => e.date >= today()).length], ...(state.unitAcc ? [['mine', 'Kontrollerim', mine.filter((e) => !e.assignees.find((a) => a.user_id === uwMe().id)?.check_note).length]] : []), ['archive', 'Arşiv']] : [['mine', 'Kontrollerim'], ['archive', 'Arşiv']];
    return `${head('Denetim Kayıtları', sub, uwCan('audit', 'audit') ? '<button class="btn" data-act="uw-au-new">Kayıt aç</button>' : '')}${uwTabs('b-denetim', tabs, full ? 'records' : 'mine')}${body}`;
  };
  // Merkez: Birim Onayları içinde Denetim Raporları sekmesi.
  UW_APPROVAL_TABS.push({ id: 'audit', label: 'Denetim Raporları', allow: () => isAdmin(), count: () => auData().records.filter((r) => r.level === 'report' && !r.center_seen_at).length,
    render: () => { const l = auData().records.filter((r) => r.level === 'report'); return l.length ? `<div class="stack">${l.map((r) => uwAuditCard(r, { admin: true })).join('')}</div>` : empty('Denetim’den gelen rapor yok.'); } });
  UW_ADMIN_PENDING.push(() => auData().records.filter((r) => r.level === 'report' && !r.center_seen_at).length);

  /* ---------------- Takvim (birim) ---------------- */
  const uwCalendarView = () => {
    const sub = 'Etkinlikler, planlanan yayınlar, görev son tarihleri, sponsor görüşmeleri ve denetim kontrolleri; görme yetkin olanlar.';
    const wait = uwLoading('Takvim', sub); if (wait) return wait;
    const st = state.uwFilter['b-takvim'] || { y: now.getFullYear(), m: now.getMonth(), sel: today() };
    const { y, m, sel } = st;
    const items = {};
    const add = (date, x) => { if (date) (items[String(date).slice(0, 10)] ||= []).push(x); };
    calendarEvents().forEach((e) => add(e.date, { type: 'event', title: e.title, sub: `${e.time || ''} ${e.place || ''}`.trim() }));
    uwList('posts').filter((p) => p.plan_at && ['preparing', 'approval', 'planned', 'published'].includes(p.status)).forEach((p) => add(ymd(new Date(new Date(p.plan_at).toLocaleString('en-US', { timeZone: 'Europe/Istanbul' }))), { type: 'post', title: p.title, sub: `Yayın · ${POST_ST[p.status][1]}` }));
    uwList('tasks').filter((t) => t.status === 'open' && t.due_date).forEach((t) => add(t.due_date, { type: 'task', title: t.title, sub: 'Görev son tarihi' }));
    (spData().contacts || []).forEach((c) => { const s = (spData().rows || []).find((x) => x.id === c.sponsor_id); add(c.at, { type: 'sponsor', title: s?.brand || 'Sponsor', sub: `Sponsor · ${(SP_CONTACT.find(([k]) => k === c.kind) || ['', c.kind])[1]}` }); });
    auData().events.filter((e) => e.assignees.length).forEach((e) => add(e.date, { type: 'audit', title: e.title, sub: `Denetim · ${e.assignees.map((a) => a.name).join(', ')}` }));
    uwList('reports').filter((r) => r.status === 'open' && r.due_date).forEach((r) => add(r.due_date, { type: 'task', title: r.title, sub: 'Rapor son tarihi' }));
    const first = new Date(y, m, 1), offset = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate(), cells = Math.ceil((offset + days) / 7) * 7;
    let grid = DOW.map((d) => `<div class="cal-dow">${d}</div>`).join('');
    for (let i = 0; i < cells; i++) {
      const d = new Date(y, m, i - offset + 1), key = ymd(d), list = items[key] || [];
      grid += `<button class="cal-day ${d.getMonth() !== m ? 'out' : ''} ${key === today() ? 'today' : ''} ${key === sel ? 'selected' : ''} ${i >= cells - 7 ? 'last-row' : ''}" data-act="uw-tcal-pick" data-id="${key}"><span class="num">${d.getDate()}</span><span class="chips">${list.slice(0, 3).map((x) => `<span class="cal-chip uw-c-${x.type}">${esc(x.title)}</span>`).join('')}</span></button>`;
    }
    const selected = items[sel] || [];
    const T = { event: 'Etkinlik', post: 'Yayın', task: 'Son tarih', sponsor: 'Sponsor', audit: 'Denetim' };
    return `${head('Takvim', sub)}
      <div class="cal-head"><h2>${MONTHS[m]} ${y}</h2><div class="row"><button class="btn ghost small" data-act="uw-tcal" data-id="-1">‹ Önceki</button><button class="btn ghost small" data-act="uw-tcal" data-id="0">Bugün</button><button class="btn ghost small" data-act="uw-tcal" data-id="1">Sonraki ›</button></div></div>
      <div class="cal-grid">${grid}</div>
      <div class="cal-legend">${Object.entries(T).map(([k, l]) => `<span><i class="uw-c-${k}"></i>${l}</span>`).join('')}</div>
      <div class="section-head"><h2>${fmtDay(sel)}</h2></div>
      ${selected.length ? `<div class="card">${selected.map((x) => `<div class="mini-row"><div><strong>${esc(x.title)}</strong><small>${esc(x.sub)}</small></div><span class="tag">${T[x.type]}</span></div>`).join('')}</div>` : empty('Bu günde kayıt yok.')}`;
  };

  /* ---------------- Destek (birim → Merkez) ---------------- */
  const TK_ST = { open: ['wait', 'Açık'], answered: ['ok', 'Yanıtlandı'], closed: ['', 'Kapandı'] };
  const uwSupportView = () => {
    const title = isAdmin() ? 'Birim Destek Talepleri' : 'UniPakt Destek';
    const sub = isAdmin() ? 'Birim üyelerinin Merkez Yönetim’e açtığı destek talepleri.' : 'Merkez Yönetim’e soru, sorun ya da istek ilet. Yanıt geldiğinde bildirim alırsın.';
    const wait = uwLoading(title, sub); if (wait) return wait;
    const list = uwList('support');
    return `${head(title, sub, state.unitAcc ? '<button class="btn" data-act="uw-tk-new">Yeni talep</button>' : '')}
      ${list.length ? `<div class="stack">${list.map((t) => `<article class="card item">
        <div class="meta top">${stTag(TK_ST, t.status)}<span>${isAdmin() ? `${esc(unitName(t.unit_id))} · ` : ''}${esc(t.created_by_name || '')} · ${uwWhen(t.updated_at)}</span></div>
        <h3>${esc(t.subject)}</h3>
        <div class="uw-thread">${t.messages.map((m) => `<div class="quote ${m.from_admin ? 'uw-from-admin' : ''}"><small>${m.from_admin ? 'Merkez Yönetim' : esc(m.author_name || '')} · ${uwWhen(m.created_at)}</small>${uwText(m.body)}</div>`).join('')}</div>
        <div class="actions">${t.status !== 'closed' || isAdmin() ? `<button class="btn small" data-act="uw-tk-reply" data-id="${esc(t.id)}">Yanıtla</button>` : ''}${t.status !== 'closed' ? `<button class="btn ghost small" data-act="uw-tk-close" data-id="${esc(t.id)}">Kapat</button>` : isAdmin() ? `<button class="btn ghost small" data-act="uw-tk-close" data-id="${esc(t.id)}" data-sub="reopen">Yeniden aç</button>` : ''}</div>
      </article>`).join('')}</div>` : empty('Destek talebi yok.')}`;
  };

  uwView('b-sponsorlar', { label: () => 'Sponsor Ağı', group: 'birim', order: 12, allow: () => isAdmin() || uwKindIs('sponsor'), render: uwSponsorsView });
  uwView('b-kulupler', { label: () => 'Kulüp Ağı', group: 'birim', order: 13, count: () => (uwKindIs('clubs') ? (UWD().clubnet?.clubs || []).filter((c) => daysSince(c.last_contact) > COOL_DAYS).length : 0), allow: () => isAdmin() || uwKindIs('clubs'), render: uwClubsView });
  uwView('b-denetim', { label: () => 'Denetim Kayıtları', group: 'birim', order: 14, count: () => (uwKindIs('audit') ? auData().events.filter((e) => e.assignees.some((a) => a.user_id === uwMe().id && !a.check_note)).length : 0), allow: () => isAdmin() || uwKindIs('audit'), render: uwAuditView });
  uwView('b-takvim', { label: () => 'Takvim', group: 'unipakt', order: 4, allow: () => !!state.unitAcc, render: uwCalendarView });
  uwView('b-destek', { label: () => (isAdmin() ? 'Birim Destek Talepleri' : 'UniPakt Destek'), group: () => (isAdmin() ? 'birim' : 'unipakt'), order: 8, count: () => (isAdmin() ? uwList('support').filter((t) => t.status === 'open').length : uwList('support').filter((t) => t.status === 'answered').length), allow: () => isAdmin() || !!state.unitAcc, render: uwSupportView });
  ['b-sponsorlar', 'b-kulupler', 'b-denetim', 'b-takvim', 'b-destek'].forEach((id) => { views[id] = () => UW_VIEWS[id].render(); });
  UW_HOME_STATS.push(() => [
    ...(uwKindIs('sponsor') ? [{ label: 'Sorumlu olduğun sponsor', n: (spData().rows || []).filter((s) => s.owner === uwMe().id && !['deal', 'lost'].includes(s.stage)).length, go: 'b-sponsorlar' }] : []),

  // ---- Yanıtlama: mesajın üstüne gelince çıkan ok, telefonda mesajı sağa çekmek ----
  const imWhoName = (r) => (r.mine ? 'Sen' : imPeerInfo(state.chat.peer).name);
  const imSnippet = (s) => { const one = String(s || '').replace(/\s+/g, ' ').trim(); return one.length > 140 ? `${one.slice(0, 140)}…` : one; };
  const imQuoteHtml = (r) => r.missing
    ? '<span class="im-quote is-missing">Önceki bir mesaj</span>'
    : `<button type="button" class="im-quote ${r.mine ? 'is-mine' : ''}" data-im-jump="${esc(r.eventId)}"><b>${esc(imWhoName(r))}</b><span>${esc(imSnippet(r.body))}</span></button>`;
  const imReplyBarHtml = () => {
    const r = state.chat.replies[state.chat.peer];
    if (!r) return '';
    return `<div class="im-replying"><div class="im-quote ${r.mine ? 'is-mine' : ''}"><b>${esc(imWhoName(r))} yanıtlanıyor</b><span>${esc(imSnippet(r.body))}</span></div>
      <button type="button" class="im-icon-btn ghost" data-im-reply-cancel aria-label="Yanıtlamayı iptal et">${IM_ICON.close}</button></div>`;
  };
  const updateImReplyBar = () => { const box = document.getElementById('imReplyBar'); if (box) box.innerHTML = imReplyBarHtml(); };
  const startImReply = (eventId) => {
    const room = imRoomFor(state.chat.peer);
    const m = room?.messages.find((x) => x.eventId === eventId);
    if (!m) return;
    state.chat.replies[state.chat.peer] = { eventId, mine: m.mine, body: m.body };
    updateImReplyBar();
    const ta = document.querySelector('[data-im-input]');

    if (msgs && msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 160) msgs.scrollTop = msgs.scrollHeight;

  const cancelImReply = () => { delete state.chat.replies[state.chat.peer]; updateImReplyBar(); };
  document.addEventListener('click', (e) => {
    const r = e.target.closest?.('[data-im-reply]');
    if (r) { e.preventDefault(); startImReply(r.dataset.imReply); return; }
    if (e.target.closest?.('[data-im-reply-cancel]')) { e.preventDefault(); cancelImReply(); document.querySelector('[data-im-input]')?.focus({ preventScroll: true }); return; }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.view === 'ims' && state.chat.replies[state.chat.peer]) cancelImReply();

  // Telefonda: mesajı parmakla sağa çek → yanıtla (yeterince çekilince titrer ve ok belirir).
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    const msg = e.target.closest?.('.im-msg[data-eid]');
    if (!msg || e.target.closest('.im-reply-btn, a')) return;
    const x0 = e.clientX, y0 = e.clientY;
    let dx = 0, decided = false, swiping = false, armed = false;
    const move = (ev) => {
      if (ev.pointerId !== e.pointerId) return;
      const mx = ev.clientX - x0, my = ev.clientY - y0;
      if (!decided) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        decided = true; swiping = mx > 0 && Math.abs(mx) > Math.abs(my) * 1.4;
        if (!swiping) return end();
        msg.classList.add('swiping');
      }
      dx = Math.max(0, Math.min(mx, 90));
      msg.style.setProperty('--swipe', `${dx}px`);
      const nowArmed = dx > 58;
      if (nowArmed !== armed) { armed = nowArmed; msg.classList.toggle('armed', armed); if (armed) navigator.vibrate?.(12); }
    };
    const end = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', end);
      document.removeEventListener('pointercancel', end);
      if (!swiping) return;
      msg.classList.remove('swiping', 'armed');
      msg.style.removeProperty('--swipe');
      // Kaydırmanın sonunda gelen tıklama (ör. alıntıya atlama) yutulur.
      const swallow = (ce) => { ce.stopPropagation(); ce.preventDefault(); };
      document.addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => document.removeEventListener('click', swallow, { capture: true }), 400);
      if (armed) startImReply(msg.dataset.eid);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);

  // Telefonda klavye açılınca sohbet görünür alana sığar (altta boşluk / sayfa kayması olmaz).
  const fitImViewport = () => {

  // Matrix changed: patch the chat page in place (batched to one frame).

  // baştan yazmak profil fotoğraflarını her seferinde yeniden yükletip titretiyordu; bunun yerine
  // yalnızca değişen düğümler güncellenir (aynı <img> öğesi yerinde kalır).
  const morphNode = (from, to) => {
    if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) { from.replaceWith(to.cloneNode(true)); return; }
    if (from.nodeType === 3 || from.nodeType === 8) { if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
    if (from.nodeType !== 1) return;
    [...from.attributes].forEach((a) => { if (!to.hasAttribute(a.name)) from.removeAttribute(a.name); });
    [...to.attributes].forEach((a) => { if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value); });
    morphChildren(from, to);
  };
  const morphChildren = (from, to) => {
    const a = [...from.childNodes], b = [...to.childNodes];
    b.forEach((n, i) => { if (a[i]) morphNode(a[i], n); else from.appendChild(n.cloneNode(true)); });
    for (let i = a.length - 1; i >= b.length; i--) a[i].remove();
  };
  const setHtml = (el, html) => {
    if (!el || el._html === html) return;
    el._html = html;
    const t = document.createElement('template'); t.innerHTML = html;
    morphChildren(el, t.content);
  };
  let imRefreshQueued = false;
  const refreshIm = () => {
    if (!matrixModule || !state.user || !db) return;

    const peer = state.chat.peer;
    const reply = state.chat.replies[peer] || null;
    ta.value = ''; state.chat.drafts[peer] = ''; autosizeIm(ta); ta.focus();

    try {

      if (state.chat.peer === peer && !ta.value) { ta.value = body; state.chat.drafts[peer] = body; autosizeIm(ta); }

  const renderLogin = (message = '') => {

        </div></main>`;
      return;
    }
    root.innerHTML = `
      <main class="login"><div class="login-box">
        <a class="wordmark" href="https://unipakt.com/" aria-label="UniPakt"><img data-tint="unipakt-logo-bg-white" class="wordmark-img" src="unipakt-logo-bg-white.png?v=5" alt="UniPakt"></a>
        <p class="kicker">Panel</p>
        <h2>Demo girişi: bir hesap seç</h2>

          ${db.clubs.map((c) => `<button class="account" data-act="login" data-id="${esc(c.id)}"><span><strong>${esc(c.name)}</strong><small>${esc(c.uni)}</small></span><span class="role">Kulüp başkanı</span></button>`
            + (db.team || []).filter((m) => m.clubId === c.id).map((m) => `<button class="account" data-act="login" data-id="member:${esc(m.id)}"><span><strong>${esc(m.name)}</strong><small>${esc(c.name)} ekibi</small></span><span class="role">${esc(m.title)}</span></button>`).join('')).join('')}
        </div>
        <p class="demo-note">Bu bir demo. Şifre yok ve veriler yalnızca bu tarayıcıda saklanıyor.</p>

  };

  // Merkez Yönetim hesabı ilk girişte kullanıcı adını seçer (panelde ve mesajlaşmada bu ad görünür).
  const USERNAME_RE = /^[a-z0-9._]{3,24}$/;
  const askUsername = () => openForm({
    title: 'Kullanıcı adını seç',
    lead: 'Panelde ve UniPakt Instant Messages’ta bu adla görüneceksin. 3–24 karakter; küçük harf, rakam, nokta ve alt çizgi.',
    fields: field('Kullanıcı adı', `<input name="username" required minlength="3" maxlength="24" pattern="[a-z0-9._]{3,24}" autocomplete="username" spellcheck="false" value="${esc(state.profile.username || '')}" placeholder="ör. mehmetemin">`),

  const render = () => {

    root.innerHTML = `
      <div class="app">

          <div class="side-brand">
            <a class="wordmark" href="https://unipakt.com/" title="unipakt.com’a git" aria-label="UniPakt"><img data-tint="unipakt-logo-bg-white" class="wordmark-img" src="unipakt-logo-bg-white.png?v=5" alt="UniPakt"></a>
            <p class="kicker">Panel</p>

            ${NAV_GROUPS.filter(([g]) => nav.some((n) => n[3] === g)).map(([g, title]) => `<p class="nav-group">${esc(title)}</p>${nav.filter((n) => n[3] === g).map(([id, label, count]) => `<button class="nav-item ${state.view === id ? 'active' : ''}" data-go="${id}" ${state.view === id ? 'aria-current="page"' : ''}>${esc(label)}${count ? `<span class="badge">${count}</span>` : ''}</button>`).join('')}`).join('')}

  // A failed action says why; if it signed the user out, the login screen follows.

  document.addEventListener('click', (e) => {
    if (state.profileMenuOpen && !e.target.closest('.profile-menu')) {

      const dropdown = document.querySelector('.profile-dropdown');
      if (dropdown) dropdown.hidden = true;

    const goBtn = e.target.closest('[data-go]');
    if (goBtn) { go(goBtn.dataset.go); return; }
    const btn = e.target.closest('[data-act]');
    if (!btn || dlg.contains(btn) || btn.disabled) return;
    const run = actions[btn.dataset.act];
