<style>
  /* Same colour roles as the public site (index.html): charcoal ground and
     off-white type instead of pure black/white; cards are soft filled
     surfaces without outlines; orange stays the single signal colour. */
  :root {
    color-scheme: dark;
    --ink: #F2F1EE;
    --paper: #0C0C0D;
    --paper-soft: #1E1E21;
    --surface: #161618;
    --border: #F2F1EE17;
    --border-strong: #F2F1EE30;
    /*brand:start*/ --brand-grad: linear-gradient(135deg, #8F244D, #A94B86); --brand-on-dark: #A94B86; --brand-on-light: #8F244D; --brand-on-accent: #FFFFFF; /*brand:end*/
    --accent: var(--brand-on-dark); --accent-grad: var(--brand-grad); --on-accent: var(--brand-on-accent);
    --ok: #4ADE80;
    --no: #F87171;
    --side-w: 264px;
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15px/1.55 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--on-accent); }
  .cp-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 24px; align-items: start; }
  @media (max-width: 980px) { .cp-grid { grid-template-columns: minmax(0, 1fr); } }
  /* Kulüp sayfası önizlemesi (sitedeki /kulup sayfasının küçük kopyası) */
  .cpv { border-radius: 18px; overflow: hidden; border: 1px solid var(--border); background: #0C0C0D; }
  .cpv-hero { position: relative; isolation: isolate; overflow: hidden; display: grid; justify-items: center; gap: 6px; padding: 34px 16px 24px; text-align: center; color: var(--cp-ink, #fff); background: #0C0C0D; }
  .cpv-hero::before { content: ''; position: absolute; inset: 0; z-index: -2; background: var(--cp-banner, none) center / cover no-repeat; display: none; }
  .cpv-hero::after { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(#ffffff26 1px, transparent 1.3px) 0 0 / 12px 12px; }
  .cpv-has-banner, .cpv-bg-clear, .cpv-bg-blur { padding-top: 56px; }
  .cpv-has-banner::before, .cpv-bg-clear::before, .cpv-bg-blur::before { display: block; }
  .cpv-has-banner::after { background: radial-gradient(#ffffff30 1px, transparent 1.3px) 0 0 / 12px 12px, rgba(0, 0, 0, .62); }
  .cpv-bg-clear::after { background: linear-gradient(180deg, rgba(0, 0, 0, .12), rgba(0, 0, 0, .7)); }
  .cpv-bg-blur::before { filter: blur(20px) saturate(1.35); transform: scale(1.25); }
  .cpv-bg-blur::after { background: rgba(0, 0, 0, .42); }
  .cpv-bg-color { background: var(--cp-bgc); }
  .cpv-bg-gradient { background: linear-gradient(135deg, var(--cp-bgc), var(--cp-grad2)); }
  .cpv-bg-color::after, .cpv-bg-gradient::after { background: radial-gradient(color-mix(in srgb, var(--cp-ink) 20%, transparent) 1px, transparent 1.3px) 0 0 / 12px 12px; }
  .cpv-logo { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #1E1E21; border: 1px solid #ffffff2e; font: 900 22px/1 'Archivo', sans-serif; color: #fff; }
  .cpv.has-acc .cpv-logo { border: 2px solid var(--cp-acc); }
  .cpv-logo img { width: 100%; height: 100%; object-fit: cover; }
  .cpv-hero h3 { margin: 4px 0 0; font: 900 24px/1.05 'Archivo', sans-serif; letter-spacing: -0.02em; }
  .cpv-hero p { margin: 0; font-size: 12px; opacity: .8; }
  .cpv-title-left { justify-items: start; text-align: left; }
  .cpv-title-left h3 { font-size: 30px; }
  .cpv-title-compact h3 { font-size: 17px; font-weight: 800; }
  .cpv-title-outline h3 { color: transparent; -webkit-text-stroke: 1px var(--cp-ink, #fff); }
  .cpv-title-caps h3 { text-transform: uppercase; letter-spacing: .05em; font-size: 18px; font-weight: 800; }
  .cpv-title-hand h3 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 32px; letter-spacing: 0; }
  .cpv-body { display: grid; gap: 10px; padding: 14px; background: #0C0C0D; color: #F2F1EE; }
  .cpv-ev { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: #161618; }
  .cpv-ev b { font: 800 18px/1 'Archivo', sans-serif; text-align: center; }
  .cpv.has-acc .cpv-ev b, .cpv.has-acc .cpv-ev i { color: var(--cp-acc); }
  .cpv-ev span { display: grid; gap: 2px; font-size: 13px; } .cpv-ev small { opacity: .6; font-size: 11.5px; }
  .cpv-ev i { font-style: normal; opacity: .7; }
  .cpv-btn { justify-self: start; padding: 8px 16px; border-radius: 999px; background: var(--accent-grad); color: var(--on-accent); font-weight: 700; font-size: 13px; }
  .cpv.has-acc .cpv-btn { background: var(--cp-acc); color: #fff; }
  /* Vanguard: ıslak zemin levhası */
  .wet-floor { display: grid; justify-items: center; gap: 10px; padding: clamp(32px, 6vw, 64px) 20px; text-align: center; }
  .wet-sign { width: clamp(180px, 26vw, 260px); height: auto; filter: drop-shadow(0 18px 30px #0008); }
  /* Birimler */
  .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .unit-card { display: flex; flex-direction: column; gap: 14px; text-align: left; cursor: pointer; color: inherit; font: inherit; transition: border-color .2s, transform .2s; }
  .unit-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .unit-card.is-mine { border-color: var(--accent); }
  .unit-name { font: 800 19px/1.25 'Archivo', sans-serif; }
  .unit-head { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .unit-head span { display: flex; flex-direction: column; }
  .unit-head small, .unit-count { opacity: .6; font-size: 13px; }
  .unit-nohead { opacity: .55; font-style: italic; }
  .unit-detail { display: flex; flex-direction: column; gap: 14px; }
  .unit-detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .unit-detail-head h2 { margin: 0; font: 800 clamp(24px, 3vw, 32px)/1.1 'Archivo', sans-serif; flex: 1 1 auto; }
  .unit-headline { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .unit-headline > div { flex: 1 1 auto; }
  .unit-headline h3 { margin: 2px 0 0; }
  .unit-headline small { opacity: .6; }
  .unit-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .unit-section-head h3 { margin: 0; }
  .unit-section-head h3 small { opacity: .55; font-weight: 500; font-size: 14px; margin-left: 6px; }
  .unit-members { display: flex; flex-direction: column; gap: 0; padding-top: 6px; padding-bottom: 6px; }
  .unit-member { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line, #2a2a2d); flex-wrap: wrap; }
  .unit-member:last-child { border-bottom: 0; }
  .unit-member.is-passive { opacity: .55; }
  .unit-member-main { flex: 1 1 220px; min-width: 0; }
  .unit-member-main p { margin: 0; }
  .unit-member-main small { opacity: .6; }
  .unit-member-actions { flex-wrap: wrap; gap: 6px; }
  .unit-roles { display: flex; flex-direction: column; }
  .unit-role { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line, #2a2a2d); flex-wrap: wrap; }
  .unit-role:last-child { border-bottom: 0; }
  .unit-warn { border: 1px solid #e0a43a; background: #e0a43a14; border-radius: 14px; padding: 12px 14px; margin: 4px 0 12px; }
  .unit-warn p { margin: 0 0 10px; line-height: 1.5; }
  .wet-text { margin: 18px 0 0; font: 800 clamp(20px, 2.6vw, 28px)/1.25 'Archivo', sans-serif; }
  .wet-sub { margin: 0; opacity: .65; font-size: 15px; }
  /* Marka rengi sayfası */
  .brand-presets { display: flex; flex-wrap: wrap; gap: 8px; }
  .brand-presets .chip { display: inline-flex; align-items: center; gap: 8px; }
  .brand-presets .chip i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
  .brand-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 860px) { .brand-grid { grid-template-columns: minmax(0, 1fr); } }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand-row input[type="color"] { width: 46px; height: 40px; padding: 2px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--paper-soft); cursor: pointer; }
  .brand-row input[type="text"] { width: 110px; font-family: ui-monospace, monospace; text-transform: uppercase; }
  .brand-out { display: grid; gap: 16px; }
  .brand-swatch { height: 88px; border-radius: 16px; border: 1px solid var(--border); }
  .brand-samples { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .brand-light { background: #FFFFFF; padding: 6px 12px; border-radius: 8px; font-weight: 700; }
  .brand-logo { width: 100%; max-width: 420px; height: auto; background: #0C0C0D; border-radius: 14px; padding: 12px; }
  .field-label { margin: 0; font-weight: 600; }
  /* Marka gradyanı: büyük vurgulu yazılarda yazının kendisi gradyan */
  .wordmark span, .kicker, .page-head h1 span, .evp-head h1 span, .im-side-head h2 span { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---- Wordmark ---- */
  .wordmark {
    display: inline-block; color: var(--ink); text-decoration: none;
    font: 900 30px/1 'Archivo', sans-serif; letter-spacing: -0.04em;
  }
  .wordmark span { color: var(--accent); }
  /* Logo görseli: asıl UniPakt logosu, noktası turuncu kare (koyu panelde beyaz yazılı). */
  .wordmark-img { display: block; height: .9em; width: auto; }
  .wordmark:hover { opacity: .8; }
  .kicker { font: 700 22px/1 'Caveat', cursive; color: var(--accent); }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 20px; border-radius: 999px; white-space: nowrap;
    font-weight: 600; font-size: 14px; line-height: 1;
    background: var(--accent-grad); color: var(--on-accent); border: 1.5px solid var(--accent);
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn:hover { background: transparent; color: var(--accent); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--border-strong); }
  .btn.ghost:hover { border-color: var(--ink); color: var(--ink); }
  .btn.danger { background: transparent; color: var(--no); border-color: color-mix(in srgb, var(--no) 45%, transparent); }
  .btn.danger:hover { border-color: var(--no); color: var(--no); }
  .btn.small { padding: 8px 14px; font-size: 13px; }
  .club-visibility {
    width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-strong); border-radius: 10px; background: transparent; color: var(--ink);
    opacity: .72; transition: opacity .2s ease, border-color .2s ease, color .2s ease;
  }
  .club-visibility:hover { opacity: 1; border-color: var(--ink); }
  .club-visibility.is-hidden { color: var(--no); border-color: color-mix(in srgb, var(--no) 45%, transparent); opacity: 1; }
  .club-visibility svg { width: 18px; height: 18px; display: block; }

  /* ---- Login ---- */
  .login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; }
  .login-box { width: min(100%, 520px); }
  .login-box .wordmark { font-size: clamp(54px, 12vw, 84px); }
  .login-box .kicker { font-size: 30px; margin: 6px 0 34px; }
  .login-box h2 { font: 700 15px/1.3 'Inter', sans-serif; opacity: .7; margin-bottom: 14px; }
  .account-list { display: grid; gap: 10px; }
  .account {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left;
    padding: 16px 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border);
    transition: border-color .2s ease, background .2s ease;
  }
  .account:hover { border-color: var(--accent); background: var(--paper-soft); }
  .account strong { display: block; font-weight: 600; font-size: 16px; }
  .account small { display: block; opacity: .6; font-size: 13px; margin-top: 2px; }
  .account .role { font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; }
  .account.is-admin .role { background: var(--accent-grad); color: var(--on-accent); border-color: var(--accent); }
  .login-form { display: grid; gap: 16px; }
  .login-form .btn { justify-self: start; padding: 14px 28px; font-size: 15px; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .loading { opacity: .6; }
  button.proof { background: transparent; cursor: pointer; text-align: left; }
  .demo-note { margin-top: 22px; font-size: 13px; line-height: 1.6; opacity: .6; }

  /* ---- İki adımlı doğrulama (kod ekranı) ---- */
  .mfa { display: grid; gap: 18px; }
  .mfa-digits { display: grid; grid-template-columns: repeat(6, minmax(0, 58px)); gap: clamp(6px, 1.6vw, 12px); }
  .mfa-digit {
    width: 100%; min-width: 0; height: clamp(54px, 14vw, 70px); padding: 0; text-align: center;
    font: 800 clamp(26px, 6vw, 32px)/1 'Archivo', sans-serif; color: var(--ink); caret-color: var(--accent);
    border: 1px solid var(--border-strong); border-radius: 14px; background: color-mix(in srgb, var(--ink) 4%, transparent);
    transition: border-color .2s ease, box-shadow .2s ease, color .2s ease;
  }
  .mfa-digit:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .mfa-digit:disabled { opacity: .6; }
  .mfa.is-wrong .mfa-digit { animation: mfaWrong 1s ease; }
  @keyframes mfaWrong { 0%, 55% { border-color: var(--no); box-shadow: 0 0 0 4px color-mix(in srgb, var(--no) 18%, transparent); } }
  .mfa.is-ok .mfa-digit { border-color: var(--ok); color: var(--ok); }
  .mfa-msg { min-height: 21px; font-size: 14px; opacity: .75; }
  .mfa-msg.is-error { color: var(--no); opacity: 1; }
  .mfa-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .mfa-actions .link-btn:disabled { opacity: .4; cursor: default; text-decoration: none; }
  /* A digit falling out of its box after a wrong code. */
  .mfa-drop { position: fixed; z-index: 3000; display: grid; place-items: center; pointer-events: none; will-change: transform, opacity; }
  .mfa-title { font: 900 clamp(30px, 5vw, 44px)/1.05 'Archivo', sans-serif; letter-spacing: -0.04em; margin-bottom: 12px; }
  .mfa-lead { opacity: .72; margin-bottom: 26px; max-width: 46ch; }
  .mfa-lead b { color: var(--ink); opacity: 1; }
  .mfa-note { margin-top: 24px; font-size: 13px; opacity: .55; }
  .mfa-box .link-btn.mfa-signout { margin-top: 14px; }
  .mfa-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mfa-card .body { margin: 10px 0 18px; opacity: .72; max-width: 62ch; }
  /* ---- Logo kırpma (profil fotoğrafı hizalama) ---- */
  .crop-dlg { width: min(100% - 24px, 440px); }
  .crop { display: grid; gap: 16px; padding: 24px; }
  .crop h2 { font: 900 26px/1.1 'Archivo', sans-serif; letter-spacing: -0.03em; }
  .crop .lead { margin-top: -8px; opacity: .7; font-size: 14px; }
  .crop-stage { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; border-radius: 16px; background: #0C0C0D; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; }
  .crop-stage:active { cursor: grabbing; }
  .crop-stage:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .crop-stage img { position: absolute; left: 50%; top: 50%; max-width: none; pointer-events: none; will-change: transform; }
  /* The circle is what will be kept; everything outside it is dimmed. */
  .crop-ring { position: absolute; inset: 7%; border-radius: 50%; pointer-events: none; overflow: hidden;
    box-shadow: 0 0 0 9999px rgba(12, 12, 13, .7); outline: 1.5px solid rgba(242, 241, 238, .85); outline-offset: -1px; }
  .crop-ring::before { content: ''; position: absolute; inset: 0; opacity: .55;
    background:
      linear-gradient(to right, transparent calc(33.333% - .5px), rgba(242,241,238,.8) calc(33.333% - .5px), rgba(242,241,238,.8) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgba(242,241,238,.8) calc(66.666% - .5px), rgba(242,241,238,.8) calc(66.666% + .5px), transparent calc(66.666% + .5px)),
      linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(242,241,238,.8) calc(33.333% - .5px), rgba(242,241,238,.8) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgba(242,241,238,.8) calc(66.666% - .5px), rgba(242,241,238,.8) calc(66.666% + .5px), transparent calc(66.666% + .5px)); }
  /* Small centre mark so the logo can be centred by eye. */
  .crop-ring::after { content: ''; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); opacity: .8;
    background: linear-gradient(rgba(242,241,238,.9), rgba(242,241,238,.9)) center / 100% 1px no-repeat, linear-gradient(rgba(242,241,238,.9), rgba(242,241,238,.9)) center / 1px 100% no-repeat; }
  .crop-zoom { display: flex; align-items: center; gap: 12px; }

  .stat { text-align: left; background: var(--surface); border: 1px solid transparent; border-radius: 20px; padding: 22px; transition: border-color .2s ease, background .2s ease; }

  .item h3 { font: 700 18px/1.3 'Archivo', sans-serif; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .item .body { margin-top: 8px; opacity: .82; white-space: pre-line; overflow-wrap: anywhere; }

  .item .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; }
  .tag.wait { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .tag.no { color: var(--no); border-color: color-mix(in srgb, var(--no) 45%, transparent); }
  .quote { margin-top: 14px; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--paper-soft); border-radius: 0 12px 12px 0; white-space: pre-line; overflow-wrap: anywhere; }
  .quote small { display: block; font-size: 12px; font-weight: 600; opacity: .6; margin-bottom: 4px; }
  .empty { padding: 28px 22px; border: 1px dashed var(--border-strong); border-radius: 18px; text-align: center; opacity: .6; }

  .event { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 20px; }
  .date-block { align-self: start; text-align: center; padding: 12px 6px; border: 1px solid var(--border-strong); border-radius: 14px; }
  .date-block b { display: block; font: 900 30px/1 'Archivo', sans-serif; letter-spacing: -0.03em; }
  .date-block span { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
  .apps { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); display: grid; gap: 10px; }
  .apps > small { font-size: 12px; font-weight: 600; opacity: .6; }
  .app-row { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
  .app-row p { opacity: .82; min-width: 0; overflow-wrap: anywhere; }
  .app-row .actions { margin: 0; }

  .mini-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .mini-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .mini-row:first-child { padding-top: 0; }
  .mini-row strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .mini-row small { display: block; opacity: .6; font-size: 13px; }
  .mini-row > :last-child { flex: none; }

  /* ---- Filters ---- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
  .chip { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border-strong); background: transparent; font-size: 14px; font-weight: 500; transition: border-color .2s ease; }
  .chip:hover { border-color: var(--ink); }
  .chip.active { background: var(--accent-grad); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

  /* ---- Calendar ---- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .cal-head h2 { font: 900 26px/1 'Archivo', sans-serif; letter-spacing: -0.03em; }
  .cal-head .row { display: flex; gap: 8px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; background: var(--surface); }
  .cal-dow { padding: 11px 8px; font-size: 12px; font-weight: 600; text-align: center; opacity: .55; border-bottom: 1px solid var(--border); }
  .cal-day {
    min-height: 98px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 5px;
    background: transparent; border: 0; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    transition: background .15s ease;
  }
  .cal-day:nth-child(7n) { border-right: 0; }
  .cal-day.last-row { border-bottom: 0; }
  .cal-day:hover { background: var(--paper-soft); }
  .cal-day.out { opacity: .3; }

  .cal-day.today .num { background: var(--ink); color: var(--paper); }
  .cal-day.selected { background: var(--paper-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cal-chip { display: block; width: 100%; font-size: 11.5px; font-weight: 600; line-height: 1.25; padding: 3px 7px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--accent-grad); color: var(--on-accent); }
  .cal-chip.task { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--border-strong); }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 13px; opacity: .7; }
  .cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; background: var(--accent-grad); }
  .cal-legend i.task { background: transparent; box-shadow: inset 0 0 0 1px var(--border-strong); }

  /* ---- Vanguard ---- */
  .rank-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 16px 20px; }
  .rank-row + .rank-row { border-top: 1px solid var(--border); }
  .rank-row .pos { font: 900 26px/1 'Archivo', sans-serif; letter-spacing: -0.03em; opacity: .4; font-variant-numeric: tabular-nums; }
  .rank-row:first-child .pos { color: var(--accent); opacity: 1; }
  .rank-row.mine { background: var(--paper-soft); }
  .rank-row strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .rank-row small { display: block; opacity: .6; font-size: 13px; }
  .rank-row .bar { margin-top: 9px; height: 5px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .rank-row .bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent-grad); }
  .rank-row .pts { display: flex; align-items: center; gap: 8px; }
  .rank-row .pts b { min-width: 58px; text-align: right; font: 900 24px/1 'Archivo', sans-serif; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .delta { font-weight: 600; font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--ok); }
  .delta.down { color: var(--no); }

  .stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 560px; }
  .chart { display: grid; gap: 16px; }
  .chart-row { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr) 52px; align-items: center; gap: 14px; }
  .chart-label { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
  .chart-track { height: 14px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .chart-track i { display: block; height: 100%; border-radius: inherit; background: var(--accent-grad); }
  .chart-track i.down { background: var(--no); }
  .chart-row .delta { text-align: right; }

    .chart-row { grid-template-columns: minmax(0, 1fr) 52px; gap: 6px 12px; }

  .proof { display: flex; width: fit-content; align-items: center; gap: 12px; margin-top: 10px; padding: 8px 14px 8px 8px; border: 1px solid var(--border-strong); border-radius: 12px; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600; max-width: 100%; }
  .proof:not(.is-image) { padding-left: 14px; }
  .proof:hover { border-color: var(--accent); }

  .proof span { overflow-wrap: anywhere; min-width: 0; }
  .notif-result { display:inline-flex; align-items:center; font-weight:800; font-size:13px; }
  .notif-result.success { color:#55d98a; }
  .notif-result.danger { color:#ff5c68; }
  .poster-upload { display:grid; gap:10px; }
  .poster-file-row { display:flex; align-items:center; gap:10px; }
  .poster-file-row input[type="file"] { flex:1; min-width:0; }
  .poster-clear { flex:0 0 auto; width:42px; min-width:42px; padding:8px 0; font-size:22px; line-height:1; }
  .poster-preview { overflow:hidden; max-width:280px; border:1px solid var(--border); border-radius:14px; background:#111; }
  .poster-preview img { display:block; width:100%; max-height:360px; object-fit:contain; background:#050505; }
  .approval-poster { margin-top:12px; border:1px solid var(--border); border-radius:14px; overflow:hidden; background:#050505; }
  .approval-poster img { display:block; width:100%; max-height:420px; object-fit:contain; background:#050505; }
  .field input[type="file"] { padding: 10px; font-size: 13px; }

  /* ---- Dialog & form ---- */
  dialog { width: min(100% - 32px, 560px); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--border-strong); border-radius: 22px; background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .72); }
  dialog form { padding: 26px; display: grid; gap: 16px; }
  dialog h2 { font: 900 26px/1.1 'Archivo', sans-serif; letter-spacing: -0.03em; }
  dialog .lead { opacity: .75; }
  .field { display: grid; gap: 7px; }
  .field > span { font-size: 13px; font-weight: 600; opacity: .8; }
  .field input, .field textarea, .field select, .toolbar select, .act-filters input, .act-filters select {
    width: 100%; padding: 12px 16px; border-radius: 14px;
    background: color-mix(in srgb, var(--ink) 4%, transparent); border: 1px solid var(--border-strong); outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .toolbar select { width: auto; padding: 9px 14px; border-radius: 999px; }
  .field textarea { min-height: 110px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus, .toolbar select:focus, .act-filters input:focus, .act-filters select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .checks { display: grid; gap: 4px; max-height: 190px; overflow-y: auto; padding: 8px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--paper-soft); }
  .checks label { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .checks label:hover { background: var(--surface); }
  .checks label[hidden] { display: none; }
  .checks-empty { margin: 6px 8px; font-size: 13px; opacity: .6; }
  .pick-count { font-style: normal; font-weight: 500; opacity: .6; margin-left: 6px; }
  #clubFilter { margin-bottom: 8px; }
  .checks input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
  .form-error { color: var(--no); font-size: 13px; }
  .item .meta a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .item .meta a:hover { color: var(--accent); }
  .item .meta .bad { color: var(--no); }
  .form-section { line-height: 1.5; margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 13px; font-weight: 600; opacity: .7; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .support-category-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .support-category-card { display:grid; gap:7px; text-align:left; padding:16px; border:1px solid var(--border-strong); border-radius:15px; background:var(--paper-soft); color:var(--ink); cursor:pointer; transition:border-color .2s ease, transform .15s ease, box-shadow .2s ease; }
  .support-category-card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .support-category-card.active { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .support-category-card strong { font-size:15px; }
  .support-category-card span { font-size:12px; line-height:1.45; opacity:.65; }
  .support-form-intro { padding:14px 16px; border:1px solid var(--border); border-radius:14px; background:var(--paper-soft); }
  .support-form-intro h3 { font:800 18px/1.2 'Archivo',sans-serif; margin:0; }
  .support-form-intro p { margin:7px 0 0; opacity:.68; line-height:1.5; font-size:13px; }
  .support-info { padding:16px; border:1px solid var(--border); border-radius:14px; background:var(--paper-soft); font-size:13px; line-height:1.6; }
  .support-info p { margin:8px 0 0; opacity:.76; }
  .support-privacy { margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .support-admin-toolbar { display:grid; grid-template-columns:minmax(260px,1.6fr) minmax(160px,.7fr) minmax(190px,.8fr); gap:10px; margin:18px 0 12px; }
  .support-admin-toolbar input, .support-admin-toolbar select { width:100%; }
  .support-admin-stats { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin:0 0 24px; }
  .support-status-chip { display:grid; gap:4px; text-align:left; padding:12px; border:1px solid var(--border); border-radius:13px; background:var(--paper-soft); color:var(--ink); cursor:pointer; }
  .support-status-chip.active { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent); }
  .support-status-chip b { font-size:20px; }
  .support-status-chip span { font-size:11px; opacity:.68; line-height:1.25; }
  .support-meta-grid, .support-admin-overview { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:14px; }
  .support-meta-grid span, .support-admin-overview span { display:grid; gap:4px; padding:10px 12px; border:1px solid var(--border); border-radius:11px; font-size:12px; line-height:1.35; }
  .support-meta-grid b, .support-admin-overview b { font-size:11px; opacity:.55; text-transform:uppercase; letter-spacing:.04em; }
  .support-admin-edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
  .support-admin-detail-actions { display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 18px; }
  @media (max-width:760px) { .support-admin-toolbar,.support-admin-stats,.support-meta-grid,.support-admin-overview,.support-admin-edit-grid { grid-template-columns:1fr; } }

  .field-label { display:block; font-size:13px; font-weight:600; opacity:.8; margin-bottom:7px; }
  .muted { display:block; margin-top:5px; font-size:12px; opacity:.55; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); z-index: 50;
    padding: 12px 20px; border-radius: 999px; background: var(--ink); color: var(--paper);
    font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---- Menü grupları ---- */
  .nav-group { margin: 6px 12px 2px; font-size: 12px; font-weight: 700; letter-spacing: .02em; opacity: .45; }
  /* Masaüstü: kenar çubuğu ekran boyunda; logo ve alttaki kullanıcı/Çıkış hep görünür, gerekirse yalnızca menü listesi kayar. */
  @media (min-width: 901px) {
    .side { overflow: hidden; gap: 10px; padding-top: 18px; padding-bottom: 14px; }
    .side-nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; gap: 2px; align-content: start; scrollbar-width: thin; }
    .side-nav .nav-item { padding: 6px 12px; font-size: 14.5px; line-height: 1.4; }
    .side-brand .kicker { margin-top: 0; }
    .side-foot { flex: none; padding-top: 12px; gap: 8px; }
  }
  .nav-group:first-child { margin-top: 0; }

  /* ---- Etkinlik oluşturma sayfası ---- */
  .evp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .evp-head h1 { font: 900 clamp(26px, 3.4vw, 38px)/1.05 'Archivo', sans-serif; letter-spacing: -0.03em; }
  .evp-head h1 span { color: var(--accent); }
  .evp-types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 760px; }
  .evp-type { display: grid; gap: 12px; align-content: start; padding: 26px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); }
  .evp-type:hover { border-color: var(--accent); }
  .evp-type h2 { font: 800 22px/1.15 'Archivo', sans-serif; letter-spacing: -0.02em; }
  .evp-type .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-grad); }
  .evp-type.free .dot { background: transparent; border: 2px solid var(--accent); }
  .evp-type p { opacity: .72; font-size: 14px; }
  .evp-type .btn { justify-self: start; margin-top: 6px; }
  .evp-note { margin-top: 18px; padding: 12px 16px; border: 1px dashed var(--border-strong); border-radius: 12px; font-size: 13.5px; opacity: .85; max-width: 760px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .evp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 26px; align-items: start; }
  .evp-form { display: grid; gap: 18px; min-width: 0; }
  .evp-sec { display: grid; gap: 14px; }
  .evp-sec > h2 { font: 800 17px/1.2 'Archivo', sans-serif; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .evp-sec > h2::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-grad); }
  .evp-sec > .hint { font-size: 12.5px; opacity: .6; margin-top: -8px; }
  .field-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .field .opt { font-weight: 400; opacity: .6; }
  .field small.hint { font-size: 12px; opacity: .6; }
  .evp-img { display: grid; gap: 8px; }
  .evp-img .thumb { border: 1px dashed var(--border-strong); border-radius: 12px; background: #050505; overflow: hidden; display: grid; place-items: center; font-size: 12px; opacity: .9; }
  .evp-img .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .evp-img .thumb.banner { aspect-ratio: 5 / 1; }
  .evp-img .thumb.poster { aspect-ratio: 1 / 1; max-width: 220px; }
  .evp-img .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .evp-toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .evp-toolbar button { padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--paper-soft); font-size: 13px; }
  .evp-toolbar button:hover { border-color: var(--accent); }
  /* Kayıt toplama: form kurucu, pano, görevliler */
  .regb { display: grid; gap: 14px; }
  [data-regb-host] { display: grid; gap: 14px; }
  .regb-list { display: grid; gap: 10px; }
  .regb-fixed { display: grid; gap: 0; padding: 12px 14px; border: 1px dashed var(--border-strong); border-radius: 16px; }
  .regb-fixed-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 8px; }
  .regb-fixed-head small, .regb-fixed-note { font-size: 12.5px; opacity: .6; }
  .regb-fixed-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .regb-fixed-row em { font-style: normal; font-size: 12px; opacity: .55; white-space: nowrap; }
  .regb-lock svg { width: 15px; height: 15px; opacity: .55; display: block; }
  .regb-fixed-note { margin: 8px 0 0; }
  .regb-q { position: relative; display: grid; gap: 10px; padding: 14px 14px 14px 40px; border: 1px solid var(--border); border-radius: 16px; background: var(--bg); }
  .regb-handle { position: absolute; left: 0; top: 0; bottom: 0; width: 30px; display: grid; place-items: center; padding: 0; border: 0; border-right: 1px dashed var(--border); border-radius: 16px 0 0 16px; background: transparent; color: var(--ink); opacity: .45; cursor: grab; touch-action: none; transition: opacity .15s ease, background .15s ease; }
  .regb-handle svg { width: 10px; height: 16px; fill: currentColor; }
  .regb-handle:hover, .regb-handle:focus-visible { opacity: 1; background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .regb-q.dragging { z-index: 5; transform: translateY(var(--dy, 0px)) scale(1.015); box-shadow: 0 18px 40px rgba(0, 0, 0, .35); border-color: var(--accent); }

    var box = document.getElementById('pfIntro'), stage = document.getElementById('pfStage');
    if (!box || !stage) return;

  // Remote writes are followed by a fresh read, so the screen shows what the server kept.
  const api = DEMO ? local : new Proxy(remote, {
    get: (target, name) => (['refresh', 'proofUrl', 'login', 'logout', 'accounts', 'account', 'recoverPassword', 'resetPassword', 'matrixSession', 'mfa', 'team', 'activity', 'regSettingsAll', 'regSettings', 'setRegistration', 'registrations', 'setCheckin', 'deleteRegistration', 'staffList', 'addStaff', 'removeStaff', 'grants', 'grantStaff', 'revokeGrant', 'supportCreate', 'supportReply', 'supportUpdate', 'supportDelete', 'siteInbox', 'siteInboxDelete', 'siteInboxDeleteAll', 'siteInboxCount', 'workspace', 'uw'].includes(name) ? target[name]

  /* ------------------------------------------------------------------
     STATE
     ------------------------------------------------------------------ */
  const now = new Date();

    view: 'genel',
    cal: { y: now.getFullYear(), m: now.getMonth(), sel: ymd(now) },
    taskTab: 'open',
    taskClub: 'all',
    accounts: null,   // { clubId: login e-mail } once loaded, 'loading', or 'unavailable'
    support: { q: '', category: 'all', status: 'all' },
    inbox: { tab: 'contact', data: null, error: null, loading: false, count: null },   // Site Mesajları (yalnızca yetkili)

    team: { rows: null, loading: false, error: '' },   // Ekip sayfası (yalnızca başkan)

  };
  let profileLogoPreviewUrl = '';
  if (DEMO) { try { state.user = sessionStorage.getItem(SESSION); } catch (_) {} }

  /* ------------------------------------------------------------------
     UNIPAKT INSTANT MESSAGES — Matrix connection
     The connection starts right after login, so unread counts show up in
     the menu on every page. Matrix events only patch the chat page (and the
     menu badge) in place; they never re-render the whole panel, so a form
     being filled in elsewhere is never wiped.
     ------------------------------------------------------------------ */
  let matrixModule = null;
  let matrixLoadingPromise = null;
  const matrixSessionKey = (userId) => `unipaktMatrixSession.${userId}`;
  const matrixDeviceKey = (userId) => `unipaktMatrixDevice.${userId}`;
  // panel.html?demo&hs=http://127.0.0.1:8008 talks to a local test Synapse
  // (accounts club_<id> / unipakt with password "demo"). Local machine only.

  const demoMatrixSession = async (deviceId) => {

  const startMatrix = async () => {
    const panelUserId = DEMO ? state.user : session?.user_id;

    matrixLoadingPromise = (async () => {
      try {
        matrixModule ||= await import('/assets/matrix/matrix-client.js');

  };

  const isAdmin = () => state.user === ADMIN;
  // Ekip üyesi yalnızca başkanın verdiği yetkileri kullanır (sunucu da aynısını zorlar).
  const can = (perm) => state.unitAcc ? (perm === 'chat' && state.unitAcc.chat) : (!state.member || state.member.perms.includes(perm));
  const isPresident = () => !!state.user && !isAdmin() && !state.member && !state.unitAcc;
  const UNIT_VIEWS = ['birimler', 'ims', 'ayarlar', 'hesap', 'dogrulama'];
  const homeView = () => (state.unitAcc ? 'b-genel' : 'genel');
  const VIEW_PERM = { etkinliklerim: 'events', basvuru: 'events', 'etkinlik-olustur': 'events', gorevliler: 'registrations', kayitlar: 'registrations', ims: 'chat', 'destek-taleplerim': 'support', gorevler: 'tasks' };
  const viewAllowed = (view) => UW_VIEWS[view] ? UW_VIEWS[view].allow() : state.unitAcc ? ((UNIT_VIEWS.includes(view) && (view !== 'ims' || state.unitAcc.chat)) || (view === 'marka' && (state.unitAcc.perms || []).includes('brand'))) : (view === 'marka' ? isAdmin() : view === 'birimler' ? (isAdmin() || !!state.unitAcc) : view === 'kulup-sayfasi' ? isPresident() : view === 'ekip' ? isPresident() : (view === 'ayarlar' || view === 'islem-kaydi') ? !state.member : !VIEW_PERM[view] || can(VIEW_PERM[view]));
  const actPerm = (act) => {
    if (/^profile-avatar/.test(act)) return '';
    if (/^(team-|club-|activity-)/.test(act)) return 'president';
    if (/^(reg-|staff-|grant-)/.test(act)) return 'registrations';
    if (/^(event-|ev-|app-|notif-app-|partner-|rejected-event)/.test(act)) return 'events';
    if (act === 'ann-new') return 'announcements';
    if (act === 'task-done') return 'tasks';
    if (/^support-ticket-new/.test(act)) return 'support';
    if (/^ims-new/.test(act)) return 'chat';

  };
  const actAllowed = (act) => { const p = actPerm(act); return !p || (p === 'president' ? isPresident() : can(p)); };
  const NO_PERM = 'Bu işlem için yetkin yok. Kulüp başkanından yetki iste.';
  // Demo: ekip üyesi olarak giriş "member:<id>" diye saklanır.
  const applyDemoUser = () => {
    state.member = null; state.unitAcc = null;
    const raw = String(state.user || '');
    if (raw.startsWith('unit:')) {   // demo birim hesabı: "unit:<kişi id>"
      const u = (db.units || []).find((x) => x.members.some((m) => m.id === raw.slice(5) && m.status === 'active'));
      const m = u?.members.find((x) => x.id === raw.slice(5));

    const openMine = visibleTasks().filter((t) => t.status === 'open').length;
    const items = [
      ['etkinlikler', 'Etkinlikler', 0, 'events'],
      ['ortak', 'Ortak Arama', 0, 'events'],
      ['takvim', 'Takvim', 0, 'events'],
      ['etkinliklerim', 'Etkinliklerim', 0, 'events'],
      ['gorevliler', 'Görevliler', 0, 'events'],
      // Etkinlik yetkisi olmayan kayıt sorumlusu Kayıtlar'a doğrudan girer.
      ...(state.member && !can('events') ? [['kayitlar', 'Kayıtlar', 0, 'events']] : []),
      ...(isAdmin() ? [['onaylar', 'Onaylamalar', pendingCount(), 'events']] : []),
      ['basvuru', 'Başvurular', 0, 'events'],
      ['genel', 'Genel Bakış', 0, 'unipakt'],
      ...uwNavItems('unipakt'),
      ['ims', IM_TITLE, imUnreadTotal(), 'unipakt'],
      ['vanguard', 'UniPakt.Vanguard', 0, 'unipakt'],
      ['duyurular', 'Duyurular', 0, 'unipakt'],
      ['gorevler', 'Görevler', isAdmin() ? 0 : openMine, 'unipakt'],
      ['bildirimler', 'Bildirimler', (db.notifications || []).filter(n => !n.readAt).length, 'unipakt'],
      ...(isAdmin() ? [['kulupler', 'Kulüpler', 0, 'unipakt'], ['site-mesajlari', 'Site Mesajları', siteInboxTotal(), 'unipakt'], ['marka', 'Marka rengi', 0, 'unipakt']] : []),
      ...(isAdmin() || state.unitAcc ? [['birimler', 'Birimler', 0, 'unipakt']] : []),
      ...(state.unitAcc && (state.unitAcc.perms || []).includes('brand') ? [['marka', 'Marka rengi', 0, 'unipakt']] : []),
      ['destek-taleplerim', isAdmin() ? 'Destek Talepleri' : 'UniPakt Destek', supportNewCount(), 'unipakt'],
      ...(isPresident() ? [['ekip', 'Ekip', 0, 'unipakt']] : []),
      ...(state.member ? [] : [['islem-kaydi', 'İşlem Kaydı', 0, 'unipakt']]),

      ...uwNavItems('birim'),
    ];
    return items.filter(([id]) => viewAllowed(id));
  };
  // Menüde görünmeyen ama açılabilen sayfalar.
  const HIDDEN_VIEWS = ['etkinlik-olustur', 'ayarlar', 'hesap', 'dogrulama', 'kayitlar', 'kulup-sayfasi'];
  const knownView = (view) => (HIDDEN_VIEWS.includes(view) && viewAllowed(view)) || NAV().some(([id]) => id === view);

  /* ------------------------------------------------------------------
     SMALL UI HELPERS
     ------------------------------------------------------------------ */
  const root = document.getElementById('root');
  const dlg = document.getElementById('dlg');
  const dlgForm = document.getElementById('dlgForm');
  const toastEl = document.getElementById('toast');
  let toastTimer;
  const toast = (msg) => {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  };

  const STATUS = {
    pending: ['wait', 'Onay bekliyor'],
    published: ['ok', 'Yayında'],
    approved: ['ok', 'Onaylandı'],
    rejected: ['no', 'Reddedildi'],
  };
  const tag = (status) => { const [cls, label] = STATUS[status] || ['', status]; return `<span class="tag ${cls}">${esc(label)}</span>`; };
  const empty = (text) => `<div class="empty">${esc(text)}</div>`;
  const dateBlock = (s) => { const d = parseYmd(s); return `<div class="date-block"><b>${d.getDate()}</b><span>${MONTHS_SHORT[d.getMonth()]}</span></div>`; };

  let dlgSubmit = null;
  const openForm = ({ title, lead = '', fields = '', submit = 'Kaydet', danger = false, onSubmit }) => {
    dlgForm.innerHTML = `
      <h2>${esc(title)}</h2>
      ${lead ? `<p class="lead">${esc(lead)}</p>` : ''}
      ${fields}
      <p class="form-error" id="dlgError" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Vazgeç</button>
        <button type="submit" class="btn ${danger ? 'danger' : ''}">${esc(submit)}</button>
      </div>`;
    dlgSubmit = onSubmit;

    const posterInput = dlgForm.querySelector('input[name="poster"]');
    const posterClear = dlgForm.querySelector('[data-clear-poster]');
    const posterPreview = dlgForm.querySelector('[data-poster-preview]');
    if (posterInput && posterClear && posterPreview) {
      posterInput.addEventListener('change', () => {
        const file = posterInput.files && posterInput.files[0];
        if (!file) {
          posterClear.hidden = true;
          posterPreview.hidden = true;
          posterPreview.innerHTML = '';
          return;
        }
        posterClear.hidden = false;
        const url = URL.createObjectURL(file);
        posterPreview.innerHTML = `<img src="${url}" alt="Afiş önizlemesi">`;
        posterPreview.hidden = false;
        const img = posterPreview.querySelector('img');
        img?.addEventListener('load', () => URL.revokeObjectURL(url), { once: true });
      });
      posterClear.addEventListener('click', () => {
        posterInput.value = '';
        posterPreview.innerHTML = '';
        posterPreview.hidden = true;
        posterClear.hidden = true;
      });
    }

    dlg.showModal();
    dlgForm.querySelector('input:not([type=checkbox]), textarea, select')?.focus();
  };
  dlgForm.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) dlg.close(); });
  dlg.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-support-save],[data-support-close],[data-support-reopen],[data-support-delete],[data-act="support-attachment-open"]');
    if (!btn || !dlg.contains(btn)) return;
    e.preventDefault();
    e.stopPropagation();
    const id = btn.dataset.id || btn.dataset.supportSave || btn.dataset.supportClose || btn.dataset.supportReopen || btn.dataset.supportDelete;
    if (!id) return toast('Ticket kimliği bulunamadı.');
    try {
      if (btn.matches('[data-act="support-attachment-open"]')) {
        const t = clubSupportTickets().find(x => String(x.id) === String(id));
        if (!t?.attachmentPath) return toast('Ek dosya bulunamadı.');
        // Opened before the request so the browser does not treat it as a pop-up.
        const tab = window.open('', '_blank');
        try {
          const url = await remote.supportAttachmentUrl(t.attachmentPath);
          if (tab) { tab.opener = null; tab.location.href = url; } else location.href = url;
        } catch (error) { if (tab) tab.close(); throw error; }
        return;
      }
      if (!isAdmin()) return toast('Bu işlem için UniPakt yetkisi gerekir.');
      if (btn.matches('[data-support-save]')) {
        const status = dlgForm.querySelector('[name="status"]')?.value || 'open';
        const category = dlgForm.querySelector('[name="category"]')?.value || 'technical';
        await api.supportUpdate(id, {status, category, category_label: SUPPORT_CATEGORIES[category]?.label || category});
        toast('Ticket güncellendi.');
      } else if (btn.matches('[data-support-close]')) {
        await api.supportUpdate(id, {status:'closed'});
        toast('Ticket kapatıldı.');
      } else if (btn.matches('[data-support-reopen]')) {
        await api.supportUpdate(id, {status:'open'});
        toast('Ticket yeniden açıldı.');
      } else if (btn.matches('[data-support-delete]')) {
        if (!confirm('Bu ticketı, tüm konuşma geçmişini ve ek dosyasını kalıcı olarak silmek istediğine emin misin? Bu işlem geri alınamaz.')) return;
        const warning = await api.supportDelete(id);
        if (warning) notice('Ek dosya silinemedi', warning); else toast('Ticket kalıcı olarak silindi.');
      }
      dlg.close();
      render();
    } catch (error) {
      toast(error.message || 'Destek işlemi yapılamadı.');
    }
  });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
  dlgForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = dlgForm.querySelector('#dlgError');
    const button = dlgForm.querySelector('button[type="submit"]');
    if (button.disabled) return;
    const invalid = [...dlgForm.elements].find((el) => el.willValidate && !el.checkValidity());
    if (invalid) {
      err.textContent = 'Lütfen zorunlu alanları doldur.'; err.hidden = false; invalid.focus(); return;
    }
    err.hidden = true; button.disabled = true;
    let problem = null;
    try { problem = dlgSubmit ? await dlgSubmit(new FormData(dlgForm)) : null; }
    catch (error) { problem = error.message || 'İşlem yapılamadı.'; }
    button.disabled = false;
    if (typeof problem === 'string' && state.user) { err.textContent = problem; err.hidden = false; return; }
    dlg.close();
    if (typeof problem === 'string') toast(problem);   // signed out while the dialog was open
    render();
  });

  let pendingNotice = null;
  const notice = (title, message) => { pendingNotice = { title, message }; };
  dlg.addEventListener('close', () => {
    if (!pendingNotice) return;
    const { title, message } = pendingNotice; pendingNotice = null;
    dlgForm.innerHTML = `<h2>${esc(title)}</h2><p class="lead">${esc(message)}</p>
      <div class="dialog-actions"><button type="button" class="btn" data-close>Tamam</button></div>`;
    dlgSubmit = null;
    dlg.showModal();
  });

  const field = (label, control) => `<label class="field"><span>${esc(label)}</span>${control}</label>`;
  const val = (fd, name) => String(fd.get(name) || '').trim();
  // Registration links end up as a button on unipakt.com: only plain web links are allowed.
  const badLink = (v) => !!v && !/^https?:\/\/[^\s"'<>]+$/i.test(v);
  const LINK_ERROR = 'Kayıt bağlantısı http:// ya da https:// ile başlayan bir web adresi olmalı.';

  const notificationApplication = (n) => n.applicationId ? db.events.flatMap(e => e.applications.map(p => ({ e, p }))).find(x => x.p.id === n.applicationId) : null;
  const notificationAction = (n) => {
    if (n.type === 'partnership_application') {
      const found = notificationApplication(n);
      if (found?.p.status === 'approved') return `<span class="notif-result success">Bu başvuruyu onayladınız.</span><button class="btn small" disabled>Onayla</button><button class="btn ghost small" disabled>Reddet</button>`;
      if (found?.p.status === 'rejected') return `<span class="notif-result danger">Bu başvuruyu reddettiniz.</span><button class="btn small" disabled>Onayla</button><button class="btn ghost small" disabled>Reddet</button>`;
      if (found?.p.status === 'removed') return `<span class="notif-result danger">Bu ortaklık kaldırıldı.</span><button class="btn small" disabled>Onayla</button><button class="btn ghost small" disabled>Reddet</button>`;
      return `<button class="btn small" data-act="notif-app-approve" data-id="${esc(n.applicationId)}">Onayla</button><button class="btn ghost small" data-act="notif-app-reject" data-id="${esc(n.applicationId)}">Reddet</button>`;
    }
    return `<button class="btn small" data-act="notif-open" data-id="${esc(n.eventId || n.taskId)}">Aç</button>`;
  };

  /* ------------------------------------------------------------------
     VIEWS
     ------------------------------------------------------------------ */
  const head = (title, sub, action = '') => `
    <div class="page-head">
      <div><h1>${esc(title).replace(/^UniPakt\.Vanguard$/, 'UniPakt<span>.</span>Vanguard')}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div>
      ${action}
    </div>`;

  const announcementCard = (a, { mine = false } = {}) => `
    <article class="card item">
      ${mine ? `<div class="meta top">${tag(a.status)}<span>${fmtStamp(a.createdAt)} tarihinde gönderildi</span></div>` : ''}
      <h3>${esc(a.title)}</h3>
      <p class="body">${esc(a.body)}</p>
      ${mine && a.status === 'rejected' && a.note ? `<div class="quote"><small>UniPakt notu</small>${esc(a.note)}</div>` : ''}
      ${mine ? '' : `<div class="meta"><span>${esc(who(a.authorId))}</span><span>${fmtStamp(a.decidedAt || a.createdAt)}</span></div>`}
      ${mine && a.status === 'rejected' ? `<div class="actions"><button class="btn danger small" data-act="rejected-ann-delete" data-id="${esc(a.id)}">Reddedilen başvuruyu sil</button></div>` : ''}
      ${isAdmin() && !mine ? `<div class="actions"><button class="btn ghost small" data-act="ann-remove" data-id="${esc(a.id)}">Kaldır</button></div>` : ''}
    </article>`;

  const organizerNames = (e) => {
    const host = e.ownerId === ADMIN ? (e.university || 'UniPakt') : (club(e.ownerId)?.uni || e.university || who(e.ownerId));
    const partners = e.applications.filter(p => p.status === 'approved').map(p => club(p.clubId)?.uni || who(p.clubId));
    return [host, ...partners].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);
  };

  // page: 'etkinlik' (the calendar list), 'ortak' (partner search) or 'mine' (the club's own requests)
  const eventCard = (e, page = 'etkinlik') => {
    const mine = page === 'mine';
    const partner = e.kind === 'partner';
    const partners = e.applications.filter((p) => p.status === 'approved');
    const waiting = e.applications.filter((p) => p.status === 'pending');
    const myApp = !isAdmin() ? e.applications.find((p) => p.clubId === state.user) : null;
    const owner = e.ownerId === state.user;
    const tags = [];
    const acts = [];
    if (mine) tags.push(tag(e.status), `<span class="tag">${kindLabel(e)}</span><span class="tag">${feeLabel(e)}</span>`, e.status === 'published' ? (e.visible === false ? '<span class="tag no">Gizli</span>' : '<span class="tag ok">Görünür</span>') : '');
    if (page === 'etkinlik' && partner) tags.push('<span class="tag">Ortak aranıyor</span>');
    if (partner && e.status === 'published' && page !== 'etkinlik') {
      tags.push(e.calendar === 'on' ? '<span class="tag ok">Takvimde</span>'
        : e.calendar === 'requested' ? '<span class="tag wait">Takvim talebi bekliyor</span>' : '<span class="tag">Takvimde değil</span>');
    }
    if (page === 'ortak') {
      if (isAdmin()) {
        if (e.calendar === 'none') acts.push(`<button class="btn small" data-act="pub-approve" data-id="${esc(e.id)}">Yayına al</button>`);
        if (e.calendar === 'requested') acts.push(`<button class="btn small" data-act="pub-approve" data-id="${esc(e.id)}">Talebi onayla</button>`,
          `<button class="btn ghost small" data-act="pub-reject" data-id="${esc(e.id)}">Reddet</button>`);
        if (e.calendar === 'on') acts.push(`<button class="btn ghost small" data-act="pub-remove" data-id="${esc(e.id)}">Takvimden kaldır</button>`);
      } else if (owner) {
        tags.push('<span class="tag">Senin etkinliğin</span>');
        if (e.calendar === 'none') acts.push(`<button class="btn small" data-act="pub-request" data-id="${esc(e.id)}">Yayına alma talebi gönder</button>`);
      } else if (myApp) {
        tags.push(myApp.status === 'approved' ? '<span class="tag ok">Ortaksın</span>'
          : myApp.status === 'pending' ? '<span class="tag wait">Başvurun onay bekliyor</span>' : '<span class="tag no">Başvurun reddedildi</span>');
      } else if (e.date >= today()) acts.push(`<button class="btn small" data-act="event-apply" data-id="${esc(e.id)}">Ortak ol</button>`);
    }
    if (mine && owner && partner && e.status === 'published' && e.calendar === 'none') {
      acts.push(`<button class="btn small" data-act="pub-request" data-id="${esc(e.id)}">Yayına alma talebi gönder</button>`);
    }
    if ((isAdmin() || owner) && e.status === 'published' && page !== 'ortak') {
      const pendingEdit = pendingEventEdits().find((r) => r.eventId === e.id && r.clubId === state.user);
      if (pendingEdit && !isAdmin()) acts.push('<span class="tag wait">Düzenleme talebi bekliyor</span>');
      else acts.push(`<button class="btn ghost small" data-act="event-edit" data-id="${esc(e.id)}">Düzenle</button>`);
    }
    if (isAdmin() && e.status === 'published') {
      acts.push(`<button class="btn ${e.visible === false ? '' : 'ghost '}small" data-act="event-visibility" data-id="${esc(e.id)}">${e.visible === false ? 'Sitede göster' : 'Siteden gizle'}</button>`);
    } else if (!isAdmin() && mine && owner && e.status === 'published') {
      const pendingVis = pendingVisibility().find((r) => r.eventId === e.id && r.clubId === state.user);
      if (pendingVis) acts.push(`<span class="tag wait">Görünürlük talebi bekliyor</span>`);
      else acts.push(`<button class="btn ghost small" data-act="event-visibility-request" data-id="${esc(e.id)}">${e.visible === false ? 'Görünürlük talebi gönder' : 'Gizleme talebi gönder'}</button>`);
    }
    if (!isAdmin() && mine && e.status === 'rejected') acts.push(`<button class="btn danger small" data-act="rejected-event-delete" data-id="${esc(e.id)}">Reddedilen başvuruyu sil</button>`);
    if (isAdmin() && !mine) acts.push(`<button class="btn danger small" data-act="event-remove" data-id="${esc(e.id)}">Sil</button>`);
    return `
    <article class="card item event">
      ${dateBlock(e.date)}
      <div>
        ${tags.length ? `<div class="meta top">${tags.join('')}${mine ? `<span>${fmtStamp(e.createdAt)} tarihinde gönderildi</span>` : ''}</div>` : ''}
        <h3>${esc(e.title)}</h3>
        ${e.poster ? `<img src="${esc(e.poster)}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:12px;border:1px solid var(--border)">` : ''}
        <p class="body">${esc(e.desc)}</p>
        ${e.address ? `<div class="quote"><small>Açık adres</small><a href="https://www.google.com/maps/search/?api=1&query=${esc(encodeURIComponent(e.address))}" target="_blank" rel="noopener noreferrer" style="color:inherit">${esc(e.address)} → Haritada aç</a></div>` : ''}
        ${e.tags?.length ? `<div class="meta">${e.tags.map(t => `<span class="tag">#${esc(String(t).replace(/^#/,'') )}</span>`).join('')}</div>` : ''}
        ${partner && e.seeking && page !== 'etkinlik' ? `<div class="quote"><small>Aranan ortak</small>${esc(e.seeking)}</div>` : ''}
        ${mine && e.status === 'rejected' && e.note ? `<div class="quote"><small>UniPakt notu</small>${esc(e.note)}</div>` : ''}
        <div class="meta">
          <span>${fmtDay(e.date)}${e.time ? ` · ${esc(e.time)}` : ''}</span>
          ${e.place ? `<span>${esc(e.place)}</span>` : ''}
          <span>Organizatör: ${esc(organizerNames(e).join(', '))}</span>
        </div>
        ${partners.length ? `<div class="meta"><span>Ortaklar:</span>${partners.map((p) => `<span class="tag ok">${esc(who(p.clubId))}</span>`).join('')}</div>` : ''}
        ${isAdmin() && page === 'ortak' && waiting.length ? `<div class="apps"><small>Onay bekleyen ortaklık başvuruları</small>${waiting.map((p) => applicationRow(e, p)).join('')}</div>` : ''}
        ${acts.length ? `<div class="actions">${acts.join('')}</div>` : ''}
      </div>
    </article>`;
  };

  const applicationRow = (e, p) => `
    <div class="app-row">
      <p><strong>${esc(who(p.clubId))}</strong>${p.note ? ` — ${esc(p.note)}` : ''}</p>
      <div class="actions">
        <button class="btn small" data-act="app-approve" data-id="${esc(e.id)}" data-sub="${esc(p.id)}">Onayla</button>
        <button class="btn ghost small" data-act="app-reject" data-id="${esc(e.id)}" data-sub="${esc(p.id)}">Reddet</button>
      </div>
    </div>`;

  // Approvals: before/after for every field a club's edit request carries. Everything is escaped.
  const EDIT_LABELS = { title: 'Başlık', desc: 'Açıklama', date: 'İlk tarih', time: 'Saat', occurrences: 'Tarihler', university: 'Üniversite', place: 'Mekan', address: 'Açık adres', rules: 'Bilgiler / kurallar', posterUrl: 'Afiş', tags: 'Etiketler', registration: 'Kayıt bağlantısı', feeType: 'Ücret durumu', feeAmount: 'Ücret tutarı', seeking: 'Aranan ortak', kind: 'Tür',
    endDate: 'Bitiş tarihi', endTime: 'Bitiş saati', bannerUrl: 'Banner', city: 'İl', category: 'Kategori', biletimgo: 'biletimGO sayfası',
    instagram: 'Instagram', facebook: 'Facebook', x: 'X / Twitter', youtube: 'YouTube', capacity: 'Kontenjan', speakers: 'Konuşmacılar', design: 'Sayfa tasarımı' };
  const editValue = (k, v) => {
    if (v === null || v === undefined || v === '') return '';
    if (k === 'occurrences' && Array.isArray(v)) return v.map((o) => `${o.date || ''}${o.time ? ` ${o.time}` : ''}`).join('\n');
    if (k === 'feeType') return v === 'paid' ? 'Ücretli' : 'Ücretsiz';
    if (k === 'time') return String(v).slice(0, 5);
    if (k === 'design' && v && typeof v === 'object') return designSummary(v);
    if (k === 'speakers' && Array.isArray(v)) return v.map((s) => `${s.name}${s.linkedin ? ` (${s.linkedin})` : ''}`).join('\n');
    if (Array.isArray(v)) return v.map((x) => (typeof x === 'object' ? JSON.stringify(x) : String(x))).join(', ');
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  };
  const eventEditDiff = (e, changes) => {
    const before = e ? { ...e, posterUrl: e.poster, bannerUrl: e.banner, feeType: e.feeType || 'free',
      occurrences: e.occurrences && e.occurrences.length ? e.occurrences : [{ date: e.date, time: e.time || '' }] } : {};
    const rows = Object.keys(changes || {}).map((k) => ({ k, label: EDIT_LABELS[k] || k, old: editValue(k, before[k]), next: editValue(k, changes[k]) }));
    const changed = rows.filter((r) => r.old !== r.next);
    const same = rows.filter((r) => r.old === r.next);
    const poster = (url, alt) => (url ? `<div class="approval-poster"><img src="${esc(url)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer"></div>` : '<em>afiş yok</em>');
    const row = (r) => (r.k === 'posterUrl' || r.k === 'bannerUrl')
      ? `<div class="quote"><small>${esc(r.label)}</small><b>Önce:</b> ${poster(r.old, 'Mevcut görsel')}<b>Sonra:</b> ${poster(r.next, 'Yeni görsel')}</div>`
      : `<div class="quote"><small>${esc(r.label)}</small><b>Önce:</b> ${esc(r.old || '—')}\n<b>Sonra:</b> ${esc(r.next || '—')}</div>`;
    return `${changed.length ? changed.map(row).join('') : '<div class="quote"><small>Değişiklik</small>Mevcut etkinlikten farklı bir alan yok.</div>'}${same.length ? `<div class="meta"><span>Değişmeyen: ${esc(same.map((r) => r.label).join(', '))}</span></div>` : ''}`;
  };
  const FILE_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'application/pdf'];
  // Support attachments: same file types as task proofs, at most 5 MB. Returns the error text or ''.
  const supportAttachmentProblem = (file) => (!FILE_TYPES.includes(file.type) || file.size > 5 * 1024 * 1024)
    ? 'Ek dosya PNG, JPG, WEBP ya da PDF olmalı ve 5 MB’ı geçmemeli.' : '';
  const proofFile = (f, taskId) => {
    if (f && f.path) return `<button type="button" class="proof" data-act="proof-open" data-id="${esc(taskId)}"><span>Ek: ${esc(f.name)}</span></button>`;

  const taskCard = (t) => {
    const late = t.status === 'open' && t.due && t.due < today();
