    vanguard() {
      // Vanguard yenileniyor: şimdilik "ıslak zemin" levhası. Eski sayfa aşağıda duruyor; VANGUARD_OPEN = true ile geri açılır.
      if (!VANGUARD_OPEN) return `${head('UniPakt.Vanguard', '')}
        <section class="card wet-floor" role="status">
          <img class="wet-sign" src="/assets/img/kaygan-zemin.png?v=2" alt="" width="264" height="214">
          <p class="wet-text">Şu an yerler biraz ıslak, kuruyunca uğra.</p>
          <p class="wet-sub">(Önerilerinizi dinliyoruz)</p>
          <p class="wet-sub">Önerilerinizi uyguluyoruz.</p>
        </section>`;
      const list = ranking();
      const max = Math.max(1, ...list.map((c) => c.points));
      const newest = (a, b) => String(b.at).localeCompare(String(a.at));
      const logRows = (log, withClub) => log.map((l) => {
        const rawNote = l.note || '';
        const marker = ' · Açıklama: ';
        let generatedDetail = rawNote;
        let userNote = '';
        const markerIndex = rawNote.indexOf(marker);
        if (markerIndex >= 0) {
          generatedDetail = rawNote.slice(0, markerIndex);
          userNote = rawNote.slice(markerIndex + marker.length);
        } else {
          // Eski kayıtlar için: hesaplama metninin sonundaki serbest açıklamayı ayır.
          const legacyMatch = rawNote.match(/^(.* · Yuvarlanan: [^ ·]+)(?: · (.+))$/);
          if (legacyMatch) {
            generatedDetail = legacyMatch[1];
            userNote = legacyMatch[2];
          }
        }
        const eventId = l.eventId || '';
        const pointId = l.id || '';
        const meta = [withClub ? (l.label || OTHER) : '', fmtStamp(l.at)].filter(Boolean).join(' · ');
        const hasDetails = !!(generatedDetail || userNote || eventId || (withClub && pointId));
        return `
        <div class="mini-row" data-point-row data-point-id="${esc(pointId)}">
          <div style="min-width:0">
            <strong>${esc(withClub ? who(l.clubId) : l.label || OTHER)}</strong>
            <small>${esc(meta)}</small>
            <div data-point-detail hidden style="margin-top:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2,#111);line-height:1.55">
              ${withClub && pointId ? `<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)"><small style="display:block;opacity:.65">Puan ID</small><span style="word-break:break-all">${esc(pointId)}</span></div>` : ''}
              ${eventId ? `<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)"><small style="display:block;opacity:.65">Etkinlik ID</small><span style="word-break:break-all">${esc(eventId)}</span></div>` : ''}
              ${generatedDetail ? `<div style="${userNote ? 'margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);' : ''}"><small style="display:block;opacity:.65;margin-bottom:4px">Puan değerlendirmesi</small><span style="white-space:normal">${esc(generatedDetail)}</span></div>` : ''}
              ${userNote ? `<div><small style="display:block;opacity:.65;margin-bottom:4px">Açıklama</small><span style="white-space:normal">${esc(userNote)}</span></div>` : ''}
            </div>
          </div>
          <div class="actions" style="align-items:center;gap:8px">
            ${hasDetails ? `<button class="btn ghost small" type="button" data-act="point-details" data-id="${esc(pointId)}">Detaylar</button>` : ''}
            <span class="delta ${l.delta >= 0 ? 'up' : 'down'}">${signed(l.delta)}</span>
          </div>
        </div>`;
      }).join('');
      const board = `
        <div class="card" style="padding:0;overflow:hidden">
          ${list.map((c, i) => `
            <div class="rank-row ${c.id === state.user ? 'mine' : ''}">
              <span class="pos">${i + 1}</span>
              <div><strong>${esc(c.name)}</strong><small>${esc(c.uni)}</small><div class="bar"><i style="width:${Math.max(0, Math.round(c.points / max * 100))}%"></i></div></div>
              <div class="pts"><b>${c.points}</b>
                ${isAdmin() ? `<button class="btn ghost small" data-act="pts-new" data-id="${esc(c.id)}">Puan ver</button>` : ''}</div>
            </div>`).join('')}
        </div>`;

      if (isAdmin()) {
        const log = [...db.pointLog].sort(newest).slice(0, 12);
        return `
          ${head('UniPakt.Vanguard', 'Kulüp seç, etkinliği seç, artı ya da eksi puanı gönder. Kulüp, puanın hangi etkinlikten geldiğini kendi panelinde görür.',
            '<button class="btn" data-act="pts-new">Puan gönder</button>')}
          ${board}
          <div class="section-head"><h2>Son puan hareketleri</h2></div>
          ${log.length ? `<div class="card">${logRows(log, true)}</div>` : empty('Henüz puan hareketi yok.')}`;
      }

      const mine = db.pointLog.filter((l) => l.clubId === state.user);
      const sources = [];
      [...mine].sort((a, b) => String(a.at).localeCompare(String(b.at))).forEach((l) => {
        const label = l.label || OTHER;
        let row = sources.find((x) => x.label === label);
        if (!row) sources.push(row = { label, total: 0 });
        row.total += l.delta;
      });
      const top = Math.max(1, ...sources.map((x) => Math.abs(x.total)));
      const rank = list.findIndex((c) => c.id === state.user) + 1;
      return `
        ${head('UniPakt.Vanguard', 'Kazandığın puanlar ve hangi etkinliklerden geldikleri.')}
        <div class="stats two">
          <div class="stat hot"><b>${pts(state.user)}</b><span>Toplam puan</span></div>
          <div class="stat"><b>${rank}.</b><span>${list.length} kulüp arasında sıran</span></div>
        </div>
        <div class="section-head"><h2>Puanların nereden geldi</h2></div>
        ${sources.length ? `<div class="card chart" role="img" aria-label="Etkinliklere göre puan dağılımı">${sources.map((x) => `
          <div class="chart-row">
            <span class="chart-label">${esc(x.label)}</span>
            <span class="chart-track"><i class="${x.total < 0 ? 'down' : ''}" style="width:${Math.max(2, Math.round(Math.abs(x.total) / top * 100))}%"></i></span>
            <span class="delta ${x.total >= 0 ? 'up' : 'down'}">${signed(x.total)}</span>
          </div>`).join('')}</div>` : empty('Henüz puan kazanmadın.')}
        <div class="section-head"><h2>Puan hareketlerin</h2></div>
        ${mine.length ? `<div class="card">${logRows([...mine].sort(newest), false)}</div>` : empty('Henüz puan hareketi yok.')}
        <div class="section-head"><h2>Ağ sıralaması</h2></div>
        ${board}`;
    },

    kulupler() {
      if (state.accounts === null) {
        state.accounts = 'loading';
        api.accounts().then((map) => { state.accounts = map; }, () => { state.accounts = 'unavailable'; })
          .then(() => { if (state.view === 'kulupler' && state.user && !busy()) render(); });
      }
      const accountLine = (c) => {
        if (state.accounts === 'loading') return 'Giriş hesabı: yükleniyor…';
        if (state.accounts === 'unavailable') return 'Giriş hesabı: bilgi alınamadı';
        const email = state.accounts[c.id];
        return email ? `Giriş hesabı: ${esc(email)}` : '<span class="tag no">Giriş hesabı yok</span>';
      };
      const when = (iso) => new Date(iso).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
      const kvkkLine = (c) => c.kvkkConsentAt
        ? `<span class="tag ok">KVKK: Onay alındı (${esc(when(c.kvkkConsentAt))})</span>`
        : c.kvkkNoticeSentAt
          ? `<span class="tag wait">KVKK: Onay maili gitti (${esc(when(c.kvkkNoticeSentAt))})</span>`
          : '<span class="tag no">KVKK: Onay maili gitmedi</span>';
      const list = [...db.clubs].sort((a, b) => a.name.localeCompare(b.name, 'tr'));
      return `
        ${head('Kulüpler', 'Buradaki kulüpler unipakt.com’daki Ortak Kulüpler sayfasında görünür. İletişim bilgilerini değiştirdiğinde sitede de değişir.',
          '<button class="btn" data-act="club-new">Kulüp ekle</button>')}
        <div class="support-info" style="margin-bottom:18px"><strong>KVKK onayı</strong><p>Kulübün iletişim bilgileri sitede ancak KVKK onayı kaydedildikten sonra görünür. Kulüp sitede görünür ve e-postası kayıtlıysa onay maili kendiliğinden bir kez gider; kulüp onay verdiğinde “Onay alındı” ile kaydet. E-posta değişirse onay sıfırlanır ve yeni adrese yeniden mail gider.</p></div>
        <div class="stack">${list.length ? list.map((c) => {
          const filled = CONTACT_KEYS.filter(([k]) => c.contact && c.contact[k]);
          return `
          <article class="card item">
            <div class="meta top">${c.category ? `<span class="tag">${esc(c.category)}</span>` : '<span class="tag wait">Kategori yok</span>'}<span>${esc(c.uni)}</span></div>
            <h3>${esc(c.name)}</h3>
            <div class="meta">${filled.length ? filled.map(([k, label]) => {
              const link = contactLink(k, c.contact[k]);
              return link ? `<span>${label}: <a href="${esc(link.href)}" ${k === 'email' ? '' : 'target="_blank" rel="noopener noreferrer"'}>${esc(link.text)}</a></span>`
                : `<span class="bad">${label}: ${esc(c.contact[k])} (geçersiz, sitede görünmez)</span>`;
            }).join('') : '<span>İletişim bilgisi eklenmemiş</span>'}</div>
            <div class="meta"><span>${accountLine(c)}</span></div>
            <div class="meta">${kvkkLine(c)}</div>
            <div class="actions">
              <button class="club-visibility ${c.visible === false ? 'is-hidden' : ''}" data-act="club-visibility" data-id="${esc(c.id)}" aria-label="${c.visible === false ? 'Kulübü sitede görünür yap' : 'Kulübü sitede gizle'}" title="${c.visible === false ? 'Sitede görünür yap' : 'Sitede gizle'}">
                ${c.visible === false
                  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 4.3A11.8 11.8 0 0 1 12 4c5.5 0 9.5 5.7 9.5 8s-1.4 3.4-3.3 4.9"/><path d="M6.1 6.1C3.9 7.7 2.5 10.3 2.5 12c0 2.3 4 8 9.5 8 1 0 2-.2 2.9-.6"/></svg>'
                  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"/><circle cx="12" cy="12" r="2.5"/></svg>'}
              </button>
              <button class="btn ghost small" data-act="club-edit" data-id="${esc(c.id)}">Düzenle</button>
              ${c.kvkkConsentAt
                ? `<button class="btn ghost small" data-act="club-consent-withdraw" data-id="${esc(c.id)}">KVKK onayını geri çek</button>`
                : `<button class="btn small" data-act="club-consent" data-id="${esc(c.id)}">KVKK onayı alındı</button>`}
              <button class="btn danger small" data-act="club-remove" data-id="${esc(c.id)}">Sil</button>
            </div>
          </article>`; }).join('') : empty('Henüz kulüp yok.')}</div>`;
    },

    basvuru() {
      const anns = db.announcements.filter((a) => a.authorId === state.user).sort(byNewest);
      const evs = db.events.filter((e) => e.ownerId === state.user).sort(byNewest);
      const apps = db.events.flatMap((e) => e.applications.filter((p) => p.clubId === state.user).map((p) => ({ event: e, app: p })))
        .sort((a, b) => byNewest(a.app, b.app));
      return `
        ${head('Duyuru ve Etkinlik Başvurusu', 'Gönderdiklerin UniPakt’ın Onaylamalar sekmesine düşer. Onaylanınca tüm kulüp başkanları görür.')}
        <div class="grid-3">
          <div class="card item"><h3>Duyuru gönder</h3><p class="body">Diğer kulüplerin görmesini istediğin duyuruyu yaz.</p>
            <div class="actions"><button class="btn" data-act="ann-new">Duyuru başvurusu</button></div></div>
          <div class="card item"><h3>Etkinlik ekle</h3><p class="body">Ortak aramadan, etkinliğini doğrudan takvime göndermek için.</p>

        </div>
        <div class="section-head"><h2>Duyuru başvuruların</h2></div>
        <div class="stack">${anns.length ? anns.map((a) => announcementCard(a, { mine: true })).join('') : empty('Henüz duyuru başvurun yok.')}</div>
        <div class="section-head"><h2>Etkinlik başvuruların</h2></div>
        <div class="stack">${evs.length ? evs.map((e) => eventCard(e, 'mine')).join('') : empty('Henüz etkinlik başvurun yok.')}</div>

        ${apps.length ? `<div class="card">${apps.map(({ event, app }) => `

          : empty('Henüz bir etkinliğe ortaklık başvurun yok.')}`;

  /* ------------------------------------------------------------------
     ACTIONS
     ------------------------------------------------------------------ */
  const rejectWithNote = (title, apply) => openForm({
    title, lead: 'İstersen kulübe kısa bir not bırak.',
    fields: field('Not (isteğe bağlı)', '<textarea name="note" maxlength="400"></textarea>'),
    submit: 'Reddet', danger: true,
    onSubmit: async (fd) => { await apply(val(fd, 'note')); toast('Reddedildi.'); },
  });
  const confirmRemove = (title, lead, apply, submit = 'Kaldır') => openForm({
    title, lead, submit, danger: true,
    onSubmit: async () => { await apply(); toast(/sil$/i.test(submit) ? 'Silindi.' : 'Kaldırıldı.'); },
  });
  const chatNoticeStorageKey = () => `unipaktChatNoticeAccepted.v1.${session?.user_id || state.user || 'unknown'}`;
  const hasAcceptedChatNotice = () => {
    if (state.chat.noticeAccepted) return true;
    try { state.chat.noticeAccepted = localStorage.getItem(chatNoticeStorageKey()) === '1'; }
    catch (_) { state.chat.noticeAccepted = false; }
    return state.chat.noticeAccepted;
  };
  const imNoticeHtml = () => `<div class="im-placeholder im-notice"><form class="im-notice-card" id="imNoticeForm">
      <p class="kicker">Beta</p>
      <h3 class="title-xl">${esc(IM_TITLE)} hakkında</h3>
      <p>UniPakt Instant Messages beta sürümüdür. Kişisel ve özel bilgilerinizi paylaşmayın.</p>
      <p>Mesajların Oracle sunucularında uçtan uca şifrelenerek aktarılması planlanmaktadır. Sunucu ve şifreleme altyapısı devreye alınıp doğrulanana kadar bu güvenlik özelliği kullanıma açık değildir.</p>
      <p>UniPakt Instant Messages ürününün tüm bölümleri değişime tabi olabilir. Sistem tamamen kaldırılabilir, gizlenebilir veya kullanımı kısıtlanabilir. Mesajlarınızın bir bölümü veya tamamı silinebilir, kaybolabilir veya anonim hale gelebilir.</p>
      <p>Destek bildirimleriniz için UniPakt Destek sekmesini kullanın. UniPakt olarak kişisel sohbetlerinizde WhatsApp, Telegram ya da SMS sağlayıcısı gibi farklı yazılımlar kullanmanızı tavsiye ediyoruz.</p>
      <label class="chat-beta-consent"><input type="checkbox" name="chatNoticeAccepted" required><span>Bilgilendirmeyi okudum ve sohbeti açmayı kabul ediyorum.</span></label>
      <div><button class="btn" type="submit">Kabul et ve sohbeti aç</button></div>
    </form></div>`;

  /* ------------------------------------------------------------------
     KAYIT TOPLAMA — form builder (new event), registrations board
     (Etkinliklerim → Kayıtlar) and door staff (Görevliler).
     Visitors register on the public event page; staff check entries on
     /kontrol.html with a link + access code e-mailed from here.
     ------------------------------------------------------------------ */
  const REG_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const REG_TYPES = [['text', 'Kısa yanıt'], ['choice', 'Çoktan seçmeli']];
  const newQid = () => `q${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const freshRegDraft = () => ({ enabled: false, deadline: '', questions: [], reminders: ['1d'] });
  // <input type="datetime-local"> works in local wall time; the panel is Istanbul (UTC+03:00).
  const toLocalInput = (iso) => (iso ? new Date(new Date(iso).getTime() + 3 * 3600000).toISOString().slice(0, 16) : '');
  const fromLocalInput = (v) => (v ? new Date(`${v}:00+03:00`).toISOString() : null);
  const fmtRegTime = (iso) => (iso ? new Date(iso).toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '');
  const answerText = (v) => (Array.isArray(v) ? v.join(', ') : (v ?? ''));
  const regDraft = () => (state.view === 'kayitlar' ? state.regBoard.edit : (evForm.reg ||= freshRegDraft()));
  const ownsEventUi = (e) => !!e && (isAdmin() || e.ownerId === state.user);

  const REMINDERS = [['1d', '1 gün önce'], ['2h', '2 saat önce']];
  const reminderChecks = (on, attr) => `<div class="regb-rem">${REMINDERS.map(([k, l]) => `<label><input type="checkbox" ${attr} value="${k}" ${on.includes(k) ? 'checked' : ''}> ${l}</label>`).join('')}</div>`;
  const REMINDER_HINT = 'Kayıtlı herkese giriş kodu, QR ve “gelemeyeceksen iptal et” bağlantısıyla gider. 2 saat önceki hatırlatma yalnızca etkinlik saati girildiyse gider. İkisini de boş bırakırsan hatırlatma gitmez.';
  const regBuilderHtml = (d) => {
    if (!d) return '';
    const qs = d.questions.map((q, i) => `
      <div class="regb-q" data-qi="${i}">
        <button type="button" class="regb-handle" data-regb-drag aria-label="${i + 1}. soruyu sürükleyerek taşı" title="Sürükleyerek taşı"><svg viewBox="0 0 10 16" aria-hidden="true"><circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg></button>
        <div class="regb-row">
          <select data-regb="type" data-i="${i}" aria-label="Soru türü">${REG_TYPES.map(([v, l]) => `<option value="${v}" ${q.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <input data-regb="label" data-i="${i}" maxlength="200" placeholder="Soru (örn. Bölümün)" value="${esc(q.label)}" aria-label="Soru metni">
        </div>
        ${q.type === 'choice' ? `<div class="regb-mode" role="radiogroup" aria-label="Cevap sayısı">
          <label><input type="radio" name="regb-mode-${i}" data-regb="multi" data-i="${i}" value="0" ${q.multiple ? '' : 'checked'}><span>Tek cevap</span></label>
          <label><input type="radio" name="regb-mode-${i}" data-regb="multi" data-i="${i}" value="1" ${q.multiple ? 'checked' : ''}><span>Çok cevap</span></label>
        </div>` : ''}
        ${q.type === 'choice' ? `<div class="regb-opts">${q.options.map((o, j) => `
          <div class="regb-opt"><span class="regb-dot ${q.multiple ? 'sq' : ''}" aria-hidden="true"></span><input data-regb="opt" data-i="${i}" data-j="${j}" maxlength="100" placeholder="Seçenek ${j + 1}" value="${esc(o)}" aria-label="Seçenek ${j + 1}">
            <button type="button" class="icon-btn" data-act="regb-opt-del" data-id="${i}" data-sub="${j}" aria-label="Seçeneği sil" ${q.options.length <= 2 ? 'disabled' : ''}>×</button></div>`).join('')}
          ${q.options.length < 20 ? `<button type="button" class="link-btn" data-act="regb-opt-add" data-id="${i}">+ Seçenek ekle</button>` : ''}</div>` : ''}
        <div class="regb-tools">
          <label class="regb-req"><input type="checkbox" data-regb="req" data-i="${i}" ${q.required ? 'checked' : ''}> Zorunlu</label>
          <span class="spacer"></span>
          <button type="button" class="icon-btn" data-act="regb-move" data-id="${i}" data-sub="-1" ${i === 0 ? 'disabled' : ''} aria-label="Yukarı taşı">↑</button>
          <button type="button" class="icon-btn" data-act="regb-move" data-id="${i}" data-sub="1" ${i === d.questions.length - 1 ? 'disabled' : ''} aria-label="Aşağı taşı">↓</button>
          <button type="button" class="btn danger small" data-act="regb-del" data-id="${i}">Sil</button>
        </div>
      </div>`).join('');
    return `
      <label class="evp-check"><input type="checkbox" data-regb="enabled" ${d.enabled ? 'checked' : ''}><span>UniPakt üzerinden kayıt topla<small>Etkinlik sayfasında “Kayıt ol” düğmesi çıkar. Kayıt olan kişiye QR ve 6 karakterli giriş kodu gösterilir.</small></span></label>
      ${d.enabled ? `
        ${evField('Son kayıt zamanı', `<input type="datetime-local" data-regb="deadline" value="${esc(d.deadline)}">`, { opt: true, hint: 'Boş bırakırsan kayıtlar etkinlik bitene kadar açık kalır. Kontenjan girdiysen kontenjan dolunca da kapanır.' })}
        ${d.reminders ? `<div class="field"><span>Hatırlatma e-postası</span>${reminderChecks(d.reminders, 'data-regb="rem"')}<small class="hint">${esc(REMINDER_HINT)}</small></div>` : ''}
        <div class="regb-fixed" aria-label="Her formda bulunan sabit sorular">
          <div class="regb-fixed-head"><strong>Sabit sorular</strong><small>Her kayıt formunda bulunur, kaldırılamaz.</small></div>
          <div class="regb-fixed-row"><span class="regb-lock" aria-hidden="true">${REG_LOCK}</span><span>Ad soyad</span><em>Kısa yanıt · zorunlu</em></div>
          <div class="regb-fixed-row"><span class="regb-lock" aria-hidden="true">${REG_LOCK}</span><span>E-posta</span><em>E-posta · zorunlu</em></div>
          <div class="regb-fixed-row"><span class="regb-lock" aria-hidden="true">${REG_LOCK}</span><span>KVKK Aydınlatma Metni’ni okudum</span><em>Onay kutusu · zorunlu</em></div>
          <p class="regb-fixed-note">KVKK kutusu sitedeki diğer formlardaki gibi çalışır: işaretlemek isteyen kişiye aydınlatma metni açılır, metin sonuna kadar kaydırılınca “Okudum” ile onaylanır.</p>
        </div>
        <div class="regb-list">${qs || '<p class="hint">Henüz ek soru yok. “+ Soru ekle” ile kulübünün soracağı soruları ekle.</p>'}</div>
        ${d.questions.length < 30 ? '<div><button type="button" class="btn ghost small" data-act="regb-add">+ Soru ekle</button></div>' : ''}` : ''}`;
  };
  const rerenderRegb = (focus) => {
    const host = document.querySelector('[data-regb-host]');
    if (host) host.innerHTML = regBuilderHtml(regDraft());
    if (focus) host?.querySelector(focus)?.focus();
  };
  // Soruları sol kenardaki tutamaçtan sürükleyerek sıralama (fare + dokunmatik).
  // Sürüklerken kartlar DOM'da yer değiştirir (diğerleri kayarak açılır); bırakınca sıra taslağa yazılır.
  document.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest?.('[data-regb-drag]');
    if (!handle || e.button > 0) return;
    const card = handle.closest('.regb-q'), list = card?.parentElement;
    const d = regDraft();
    if (!card || !list || !d || d.questions.length < 2) return;
    e.preventDefault();
    handle.setPointerCapture?.(e.pointerId);
    const startY = e.clientY;
    let lastY = e.clientY, scrollTimer = null;
    const baseTop = card.getBoundingClientRect().top;
    card.classList.add('dragging'); list.classList.add('regb-sorting');
    const cards = () => [...list.querySelectorAll(':scope > .regb-q')];
    const flip = (move) => {
      const others = cards().filter((c) => c !== card);
      const before = new Map(others.map((c) => [c, c.getBoundingClientRect().top]));
      move();
      others.forEach((c) => {
        const dy = before.get(c) - c.getBoundingClientRect().top;
        if (!dy) return;
        c.style.transition = 'none'; c.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(() => { c.style.transition = 'transform .18s ease'; c.style.transform = ''; });
      });
    };
    const follow = () => {
      // Kart parmağı/imleci takip eder; komşusunun ortasını geçince yer değiştirir.
      const naturalTop = card.getBoundingClientRect().top - (parseFloat(card.style.getPropertyValue('--dy')) || 0);
      card.style.setProperty('--dy', `${lastY - startY - (naturalTop - baseTop)}px`);
      const mid = card.getBoundingClientRect().top + card.offsetHeight / 2;
      const prev = card.previousElementSibling?.matches('.regb-q') ? card.previousElementSibling : null;
      const next = card.nextElementSibling?.matches('.regb-q') ? card.nextElementSibling : null;
      if (prev && mid < prev.getBoundingClientRect().top + prev.offsetHeight / 2) { flip(() => list.insertBefore(card, prev)); follow(); }
      else if (next && mid > next.getBoundingClientRect().top + next.offsetHeight / 2) { flip(() => list.insertBefore(next, card)); follow(); }
    };
    const autoScroll = () => {
      const edge = 70, h = window.innerHeight;
      const v = lastY < edge ? -(edge - lastY) / 4 : lastY > h - edge ? (lastY - (h - edge)) / 4 : 0;
      if (v) { window.scrollBy(0, v); follow(); }
      scrollTimer = requestAnimationFrame(autoScroll);
    };
    scrollTimer = requestAnimationFrame(autoScroll);
    const onMove = (ev) => { lastY = ev.clientY; follow(); };
    const onEnd = () => {
      cancelAnimationFrame(scrollTimer);
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onEnd);
      handle.removeEventListener('pointercancel', onEnd);
      const order = cards().map((c) => Number(c.dataset.qi));
      const moved = order.some((n, i) => n !== i);
      if (moved) {
        d.questions = order.map((n) => d.questions[n]);
        if (state.view === 'etkinlik-olustur') evForm.dirty = true;
      }
      card.classList.remove('dragging'); list.classList.remove('regb-sorting'); card.style.removeProperty('--dy');
      rerenderRegb();
      if (moved) document.querySelector(`.regb-q[data-qi="${order.indexOf(Number(card.dataset.qi))}"] [data-regb-drag]`)?.focus({ preventScroll: true });
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onEnd);
    handle.addEventListener('pointercancel', onEnd);
  });

  const validateRegDraft = (d) => {
    if (!d || !d.enabled) return '';
    if (d.deadline && new Date(fromLocalInput(d.deadline)).getTime() < Date.now()) return 'Son kayıt zamanı geçmişte olamaz.';
    for (const [i, q] of d.questions.entries()) {
      if (!q.label.trim()) return `${i + 1}. sorunun metnini yaz.`;
      if (q.type === 'choice') {
        const opts = q.options.map((o) => o.trim());
        if (opts.some((o) => !o)) return `“${q.label.trim()}” sorusunda boş seçenek var.`;
        if (new Set(opts.map((o) => o.toLocaleLowerCase('tr-TR'))).size !== opts.length) return `“${q.label.trim()}” sorusunda aynı seçenek iki kez yazılmış.`;
      }
    }
    return '';
  };
  const cleanRegQuestions = (d) => d.questions.map((q) => ({
    id: q.id, type: q.type, label: q.label.trim(), required: !!q.required,
    ...(q.type === 'choice' ? { options: q.options.map((o) => o.trim()), multiple: !!q.multiple } : {}),
  }));
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.matches?.('[data-regb]')) return;
    const d = regDraft(); if (!d) return;
    const k = el.dataset.regb, i = Number(el.dataset.i), j = Number(el.dataset.j);
    if (k === 'deadline') d.deadline = el.value;
    else if (k === 'label') d.questions[i].label = el.value;
    else if (k === 'opt') d.questions[i].options[j] = el.value;
    if (state.view === 'etkinlik-olustur') evForm.dirty = true;
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (!el.matches?.('[data-regb]')) return;
    const d = regDraft(); if (!d) return;
    const k = el.dataset.regb, i = Number(el.dataset.i);
    if (k === 'enabled') { d.enabled = el.checked; rerenderRegb(); }
    else if (k === 'rem') d.reminders = [...document.querySelectorAll('[data-regb="rem"]:checked')].map((x) => x.value);
    else if (k === 'req') d.questions[i].required = el.checked;
    else if (k === 'multi') { d.questions[i].multiple = el.value === '1'; rerenderRegb(); }
    else if (k === 'type') {
      const q = d.questions[i]; q.type = el.value;
      if (q.type === 'choice' && (!q.options || q.options.length < 2)) q.options = ['', ''];
      rerenderRegb(`[data-regb="label"][data-i="${i}"]`);
    }
    if (state.view === 'etkinlik-olustur') evForm.dirty = true;
  });

  // ---- Board: Etkinliklerim → Kayıtlar ----
  const freshRegBoard = (eventId = '') => ({ eventId, settings: null, rows: null, loading: false, error: '', search: '', edit: null });
  const loadRegBoard = async () => {
    const b = state.regBoard;
    b.loading = true; b.error = '';
    try {
      const [settings, rows] = await Promise.all([api.regSettings(b.eventId), api.registrations(b.eventId)]);
      if (state.regBoard !== b) return;
      b.settings = settings; b.rows = rows;
    } catch (error) { b.error = error.message || 'Kayıtlar yüklenemedi.'; }
    b.loading = false;
    if (state.view === 'kayitlar' && !busy()) render();
  };
  const openRegBoard = (eventId) => { state.regBoard = freshRegBoard(eventId); go('kayitlar'); loadRegBoard(); };
  const boardColumns = (s) => {
    const qs = s?.questions || [];
    const all = [['status', 'Durum'], ['code', 'Kod'], ['email', 'E-posta'], ['created', 'Kayıt zamanı'], ['checkin', 'Giriş'], ...qs.map((q) => [q.id, q.label])];
    const chosen = Array.isArray(s?.board_columns) && s.board_columns.length ? s.board_columns : ['status', 'code', 'email', 'checkin', ...qs.map((q) => q.id)];
    return { all, chosen: chosen.filter((k) => all.some(([id]) => id === k)) };
  };
  const eventEnd = (e) => (e.endDate && e.endDate > e.date ? e.endDate : e.date);
  const regReason = (e, s, n) => {
    if (eventEnd(e) < today()) return 'Etkinlik bitti';
    if (!s?.is_open) return 'Kapalı';
    if (s.deadline && new Date(s.deadline).getTime() <= Date.now()) return 'Süresi doldu';
    if (e.capacity && n >= Number(e.capacity)) return 'Dolu · bekleme listesi';
    return 'Açık';
  };
  const regStatus = (r) => r.status || 'confirmed';
  const waitPos = (r) => (state.regBoard.rows || []).filter((x) => regStatus(x) === 'waitlist' && x.created_at <= r.created_at).length;
  const regTableHtml = () => {
    const b = state.regBoard, s = b.settings, rows = b.rows || [];
    const { all, chosen } = boardColumns(s);
    const label = Object.fromEntries(all);
    const q = searchKey(b.search);
    const list = q ? rows.filter((r) => searchKey(`${r.full_name} ${r.email} ${r.code}`).includes(q)) : rows;
    if (!rows.length) return empty('Henüz kayıt yok. Etkinlik sayfasındaki “Kayıt ol” düğmesiyle gelen kayıtlar burada görünür.');
    if (!list.length) return empty('Aramaya uyan kayıt yok.');
    const cell = (r, k) => {
      if (k === 'code') return `<code class="rb-code">${esc(r.code)}</code>`;
      if (k === 'email') return esc(r.email);
      if (k === 'created') return esc(fmtRegTime(r.created_at));
      if (k === 'checkin') return regStatus(r) !== 'confirmed' ? '—' : r.checked_in_at ? `<span class="tag ok">✓ ${esc(fmtRegTime(r.checked_in_at))}</span>` : '<span class="tag">Gelmedi</span>';
      if (k === 'status') return regStatus(r) === 'waitlist' ? `<span class="tag wait">Bekleme listesi · ${waitPos(r)}.</span>`
        : regStatus(r) === 'offered' ? `<span class="tag wait">Yer teklif edildi · ${esc(fmtRegTime(r.offer_expires_at))}’e kadar</span>` : '<span class="tag ok">Kesin</span>';
      return esc(answerText(r.answers?.[k]));
    };
    return `<div class="rb-wrap"><table class="rb-table"><thead><tr><th>#</th><th>Ad soyad</th>${chosen.map((k) => `<th>${esc(label[k])}</th>`).join('')}<th><span class="sr-only">İşlem</span></th></tr></thead>
      <tbody>${list.map((r) => `<tr><td class="rb-n">${rows.indexOf(r) + 1}</td><td><strong>${esc(r.full_name)}</strong></td>${chosen.map((k) => `<td>${cell(r, k)}</td>`).join('')}
        <td class="rb-act">${regStatus(r) === 'confirmed' ? `<button class="btn small ${r.checked_in_at ? 'ghost' : ''}" data-act="reg-checkin" data-id="${esc(r.id)}" data-sub="${r.checked_in_at ? '0' : '1'}">${r.checked_in_at ? 'Girişi geri al' : 'Giriş yaptı'}</button>` : ''}
          <button class="btn danger small" data-act="reg-del" data-id="${esc(r.id)}" aria-label="Kaydı sil">Sil</button></td></tr>`).join('')}</tbody></table></div>`;
  };
  const regBoardView = () => {
    const b = state.regBoard;
    const e = db.events.find((x) => x.id === b.eventId);
    if ((!e || !ownsEventUi(e)) && !can('events')) {
      // Etkinliklerim'i göremeyen kayıt sorumlusu etkinliği buradan seçer.
      const list = db.events.filter((x) => ownsEventUi(x) && x.status === 'published').sort((x, y) => y.date.localeCompare(x.date));
      return `${head('Kayıtlar', 'Kayıt listesini görmek istediğin etkinliği seç.')}
        ${list.length ? `<div class="card">${list.map((x) => `<div class="mini-row"><div><strong>${esc(x.title)}</strong><small>${fmtDay(x.date)}${x.time ? ` · ${esc(x.time)}` : ''}</small></div><button class="btn small" data-act="reg-open" data-id="${esc(x.id)}">Kayıtlar</button></div>`).join('')}</div>` : empty('Kulübünün yayında bir etkinliği yok.')}`;
    }
    if (!e || !ownsEventUi(e)) { setTimeout(() => go('etkinliklerim')); return ''; }
    const top = head('Kayıtlar', `${e.title} · ${fmtDay(e.date)}`, `<div class="head-actions">${can('events') ? '' : '<button class="btn ghost" data-act="reg-pick">Etkinlik değiştir</button>'}<button class="btn ghost" data-go="gorevliler">Görevliler</button>${b.rows?.length ? '<button class="btn" data-act="reg-csv">CSV indir</button>' : ''}</div>`);
    if (b.error) return `${top}<section class="card"><p class="body">${esc(b.error)}</p><button class="btn small" data-act="reg-reload">Tekrar dene</button></section>`;
    if (!b.rows) return `${top}<section class="card"><p class="body">Kayıtlar yükleniyor…</p></section>`;
    const s = b.settings, rows = b.rows;
    if (b.edit) {
      return `${top}<section class="card evp-sec"><h2>${s?.enabled ? 'Kayıt formunu düzenle' : 'Kayıt toplamayı aç'}</h2>
        <div data-regb-host>${regBuilderHtml(b.edit)}</div>
        <p class="form-error" data-reg-edit-error hidden></p>
        <div class="row"><button class="btn" data-act="reg-edit-save">Kaydet</button><button class="btn ghost" data-act="reg-edit-cancel">Vazgeç</button></div></section>`;
    }
    if (!s || !s.enabled) {
      return `${top}<section class="card"><p class="body">Bu etkinlik UniPakt üzerinden kayıt toplamıyor.</p><button class="btn small" data-act="reg-edit">Kayıt toplamayı aç</button></section>`;
    }
    const seated = rows.filter((r) => regStatus(r) === 'confirmed');
    const waiting = rows.filter((r) => regStatus(r) !== 'confirmed').length;
    const checked = seated.filter((r) => r.checked_in_at).length;
    const status = regReason(e, s, rows.filter((r) => regStatus(r) !== 'waitlist').length);
    const { all, chosen } = boardColumns(s);
    return `${top}
      <div class="stats">
        <div class="stat"><b>${seated.length}</b><span>Kesin kayıt${e.capacity ? ` · kontenjan ${esc(e.capacity)}` : ''}</span></div>
        <div class="stat"><b>${checked}</b><span>Giriş yaptı · ${seated.length - checked} gelmedi</span></div>
        <div class="stat"><b>${waiting}</b><span>Bekleme listesi</span></div>
        <div class="stat rb-status ${status === 'Açık' ? 'hot' : ''}"><b>${esc(status)}</b><span>Kayıt durumu</span></div>
      </div>
      <section class="card rb-settings">
        <div class="rb-set-row">
          <div><strong>Kayıtlar ${s.is_open ? 'açık' : 'kapalı'}</strong><small>${s.is_open ? 'Etkinlik sayfasında “Kayıt ol” düğmesi görünüyor.' : 'Etkinlik sayfasında “Kayıtlar kapalı” yazıyor.'}</small></div>
          <button class="btn small ${s.is_open ? 'ghost' : ''}" data-act="reg-toggle">${s.is_open ? 'Kayıtları kapat' : 'Kayıtları aç'}</button>
        </div>
        <div class="rb-set-row">
          <label class="field" style="flex:1;max-width:320px"><span>Son kayıt zamanı</span><input type="datetime-local" data-reg-deadline value="${esc(toLocalInput(s.deadline))}"></label>
          <button class="btn small ghost" data-act="reg-deadline-save">Kaydet</button>
        </div>
        <div class="rb-set-row rb-rem">
          <div><strong>Hatırlatma e-postası</strong><small>${esc(REMINDER_HINT)}</small></div>
          ${reminderChecks(Array.isArray(s.reminders) ? s.reminders : ['1d'], 'data-reg-rem')}
        </div>
        <div class="rb-set-row rb-links">
          <a class="link-btn" href="https://unipakt.com/etkinlik/?id=${esc(e.id)}" target="_blank" rel="noopener">Etkinlik sayfasını aç ↗</a>
          ${rows.length ? '<span class="hint">Kayıt geldiği için form soruları artık değiştirilemez.</span>' : '<button class="link-btn" data-act="reg-edit">Formu düzenle</button>'}
        </div>
      </section>
      <div class="rb-tabs" role="tablist" aria-label="Kayıt görünümü">
        <button type="button" role="tab" class="rb-tab" aria-selected="${b.tab !== 'ozet'}" data-act="reg-tab" data-id="pano">Pano</button>
        <button type="button" role="tab" class="rb-tab" aria-selected="${b.tab === 'ozet'}" data-act="reg-tab" data-id="ozet">Özet</button>
      </div>
      ${b.tab === 'ozet' ? regSummaryHtml(e, s, rows) : `
      <div class="rb-cols" role="group" aria-label="Panoda görünecek bilgiler">${all.map(([k, l]) => `<button type="button" class="rb-chip" data-act="reg-col" data-id="${esc(k)}" aria-pressed="${chosen.includes(k)}">${esc(l)}</button>`).join('')}</div>
      <label class="im-search rb-search">${IM_ICON.search}<input type="search" placeholder="Ad, e-posta ya da kod ara" value="${esc(b.search)}" data-reg-search aria-label="Kayıt ara"></label>
      <div id="rbTable">${regTableHtml()}</div>`}`;
  };
  // ---- Özet (etkinlik sonrası rapor): sayılar, kayıt günleri, saatlik giriş, cevap dağılımı ----
  const IST_HOUR = (iso) => Number(new Date(iso).toLocaleString('en-GB', { timeZone: 'Europe/Istanbul', hour: '2-digit', hour12: false }));
  const IST_DAY = (iso) => new Date(iso).toLocaleDateString('sv-SE', { timeZone: 'Europe/Istanbul' });
  const barsHtml = (items, { total = 0, unit = '' } = {}) => {
    const max = Math.max(1, ...items.map(([, n]) => n));
    return `<div class="rs-bars">${items.map(([label, n]) => `<div class="rs-bar"><span class="rs-bar-label">${esc(label)}</span>
      <span class="rs-bar-track"><i style="width:${Math.round((n / max) * 100)}%"></i></span>
      <b>${n}${unit}${total ? ` <small>%${Math.round((n / total) * 100)}</small>` : ''}</b></div>`).join('')}</div>`;
  };
  const regSummaryHtml = (e, s, rows) => {
    const seated = rows.filter((r) => regStatus(r) === 'confirmed');
    const came = seated.filter((r) => r.checked_in_at);
    const waiting = rows.filter((r) => regStatus(r) !== 'confirmed').length;
    const cap = Number(e.capacity) || 0;
    const rate = seated.length ? Math.round((came.length / seated.length) * 100) : 0;
    // Kayıtların günlere dağılımı
    const byDay = new Map();
    rows.forEach((r) => { const d = IST_DAY(r.created_at); byDay.set(d, (byDay.get(d) || 0) + 1); });
    const days = [...byDay.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([d, n]) => [fmtDay(d), n]);
    // Saat saat giriş
    const byHour = new Map();
    came.forEach((r) => { const h = IST_HOUR(r.checked_in_at); byHour.set(h, (byHour.get(h) || 0) + 1); });
    const hours = [...byHour.keys()].sort((a, b) => a - b);
    const hourItems = hours.length ? Array.from({ length: hours[hours.length - 1] - hours[0] + 1 }, (_, i) => hours[0] + i)
      .map((h) => [`${String(h).padStart(2, '0')}:00`, byHour.get(h) || 0]) : [];
    // Soru cevapları (kesin kayıtlar)
    const qs = (s?.questions || []);
    const questionHtml = qs.map((q) => {
      const answered = seated.filter((r) => { const v = r.answers?.[q.id]; return Array.isArray(v) ? v.length : String(v ?? '').trim(); });
      if (q.type !== 'choice') return `<div class="rs-q"><h4>${esc(q.label)}</h4><p class="hint">Kısa yanıt · ${answered.length} / ${seated.length} kişi cevapladı. Cevaplar Pano ve CSV'de.</p></div>`;
      const counts = (q.options || []).map((o) => [o, answered.filter((r) => { const v = r.answers?.[q.id]; return Array.isArray(v) ? v.includes(o) : v === o; }).length]);
      return `<div class="rs-q"><h4>${esc(q.label)}${q.multiple ? ' <small>(çok cevap)</small>' : ''}</h4>${barsHtml(counts, { total: answered.length })}<p class="hint">${answered.length} / ${seated.length} kişi cevapladı.</p></div>`;
    }).join('');
    return `<section class="rb-report" id="rbReport">
      <div class="rs-head"><div><p class="rs-kicker">UniPakt · Etkinlik özeti</p><h2>${esc(e.title)}</h2><p class="hint">${esc(fmtDay(e.date))}${e.place ? ` · ${esc(e.place)}` : ''} · ${esc(who(e.ownerId))}</p></div>
        <button type="button" class="btn small" data-act="reg-print">Yazdır / PDF</button></div>
      <div class="rs-stats">
        <div><b>${seated.length}</b><span>Kesin kayıt${cap ? ` · kontenjanın %${Math.round((seated.length / cap) * 100)}'i` : ''}</span></div>
        <div><b>${came.length}</b><span>Etkinliğe gelen</span></div>
        <div><b>%${rate}</b><span>Gelme oranı</span></div>
        <div><b>${waiting}</b><span>Bekleme listesi</span></div>
      </div>
      <div class="rs-grid">
        <div class="rs-card"><h3>Kayıtların günlere dağılımı</h3>${days.length ? barsHtml(days) : '<p class="hint">Henüz kayıt yok.</p>'}</div>
        <div class="rs-card"><h3>Saat saat giriş</h3>${hourItems.length ? barsHtml(hourItems) : '<p class="hint">Henüz giriş yapılmadı.</p>'}</div>
      </div>
      ${qs.length ? `<div class="rs-card"><h3>Form cevapları <small>(kesin kayıtlar)</small></h3>${questionHtml}</div>` : ''}
      <p class="hint rs-foot">Bu özet ${esc(new Date().toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }))} itibarıyla UniPakt Paneli'nden alınmıştır. Kişisel bilgi içermez.</p>
    </section>`;
  };
  document.addEventListener('change', async (e) => {
    if (!e.target.matches?.('[data-reg-rem]')) return;
    const reminders = [...document.querySelectorAll('[data-reg-rem]:checked')].map((x) => x.value);
    document.querySelectorAll('[data-reg-rem]').forEach((x) => { x.disabled = true; });
    try { await saveRegSettings({ reminders }); toast(reminders.length ? `Hatırlatma: ${REMINDERS.filter(([k]) => reminders.includes(k)).map(([, l]) => l).join(' ve ')}.` : 'Hatırlatma e-postaları kapatıldı.'); }
    catch (error) { toast(error.message || 'Kaydedilemedi.'); }
    if (state.view === 'kayitlar' && !busy()) render();
  });
  const saveRegSettings = async (patch) => {
    const b = state.regBoard, s = b.settings || {};
    await api.setRegistration(b.eventId, { enabled: s.enabled ?? true, open: s.is_open ?? true, deadline: s.deadline || null, ...patch });
    b.settings = await api.regSettings(b.eventId);
  };
  document.addEventListener('input', (e) => {
    if (!e.target.matches?.('[data-reg-search]')) return;
    state.regBoard.search = e.target.value;
    const box = document.getElementById('rbTable');
    if (box) box.innerHTML = regTableHtml();
  });
  const downloadRegCsv = () => {
    const b = state.regBoard, e = db.events.find((x) => x.id === b.eventId);
    const qs = b.settings?.questions || [];
    const head = ['Ad soyad', 'E-posta', 'Durum', 'Kod', 'Kayıt zamanı', 'Giriş zamanı', ...qs.map((q) => q.label)];
    const stLabel = (r) => ({ waitlist: 'Bekleme listesi', offered: 'Yer teklif edildi' }[regStatus(r)] || 'Kesin');
    const cellOf = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) || /^[=+\-@]/.test(s) ? `"${(/^[=+\-@]/.test(s) ? `'${s}` : s).replace(/"/g, '""')}"` : s; };
    const lines = [head, ...(b.rows || []).map((r) => [r.full_name, r.email, stLabel(r), r.code, fmtRegTime(r.created_at), fmtRegTime(r.checked_in_at), ...qs.map((q) => answerText(r.answers?.[q.id]))])]
      .map((row) => row.map(cellOf).join(';'));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${String(e?.title || 'kayitlar').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '')}-kayitlar.csv`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  // ---- Görevliler ----
  const freshStaffView = () => ({ staff: null, grants: null, settings: null, loading: false, error: '' });
  const loadStaffView = async () => {
    const v = state.staffView;
    if (v.loading) return;
    v.loading = true; v.error = '';
    try {
      const [staff, grants, settings] = await Promise.all([api.staffList(), api.grants(), api.regSettingsAll()]);
      Object.assign(v, { staff, grants, settings });
    } catch (error) { v.error = error.message || 'Görevliler yüklenemedi.'; }
    v.loading = false;
    if (state.view === 'gorevliler' && !busy()) render();
  };
  const grantableEvents = () => {
    const on = new Set((state.staffView.settings || []).filter((s) => s.enabled).map((s) => s.event_id));
    return db.events.filter((e) => on.has(e.id) && e.status === 'published' && ownsEventUi(e) && eventEnd(e) >= today())
      .sort((a, b) => a.date.localeCompare(b.date));
  };
  const staffView = () => {
    const v = state.staffView;
    const top = head('Görevliler', 'Etkinlik girişinde QR ve kod kontrolü yapacak kişiler. Panel hesabı gerekmez: etkinlik yetkisi verdiğinde e-postalarına kontrol sayfasının bağlantısı ve 6 haneli erişim kodu gider. Yetki, etkinliğin son günü bitince kendiliğinden kapanır.',
      '<button class="btn" data-act="staff-add">Görevli ekle</button>');
    if (v.error) return `${top}<section class="card"><p class="body">${esc(v.error)}</p><button class="btn small" data-act="staff-reload">Tekrar dene</button></section>`;
    if (!v.staff) return `${top}<section class="card"><p class="body">Yükleniyor…</p></section>`;
    if (!v.staff.length) return `${top}${empty('Henüz görevli eklemedin. “Görevli ekle” ile bir kez ekle; sonra her etkinlik için tek tıkla yetki verirsin.')}`;
    const now = Date.now();
    return `${top}<div class="stack">${v.staff.map((s) => {
      const gs = (v.grants || []).filter((g) => g.staff_id === s.id && new Date(g.expires_at).getTime() > now);
      return `<article class="card staff-card">
        <div class="staff-head"><div><h3>${esc(s.full_name)}</h3><small>${esc(s.email)}</small></div>
          <div class="row"><button class="btn small" data-act="staff-grant" data-id="${esc(s.id)}">Etkinlik yetkisi ver</button><button class="btn danger small" data-act="staff-del" data-id="${esc(s.id)}">Sil</button></div></div>
        ${gs.length ? `<div class="staff-grants">${gs.map((g) => {
          const ev = db.events.find((x) => x.id === g.event_id);
          const locked = Number(g.failed_attempts) >= 10;
          return `<div class="mini-row"><div><strong>${esc(ev?.title || 'Etkinlik')}${locked ? ' <span class="tag no">Kilitli</span>' : ''}</strong><small>${locked ? 'Erişim kodu 10 kez yanlış girildi · ' : ''}${esc(fmtRegTime(g.expires_at))}’e kadar${g.last_used_at ? ` · son kullanım ${esc(fmtRegTime(g.last_used_at))}` : ' · henüz açılmadı'}</small></div>
            <div class="row"><button class="btn small ${locked ? '' : 'ghost'}" data-act="grant-resend" data-id="${esc(g.id)}">Kodu yeniden gönder</button><button class="btn ghost small" data-act="grant-revoke" data-id="${esc(g.id)}">Yetkiyi geri al</button></div></div>`;
        }).join('')}</div>` : '<p class="hint" style="margin:10px 0 0">Aktif etkinlik yetkisi yok.</p>'}
      </article>`;
    }).join('')}</div>`;
  };

  /* ------------------------------------------------------------------
     KULÜP EKİBİ (yalnızca başkan)
     Başkan ekip üyesini davet eder; kişi e-postadaki bağlantıyla şifresini
     belirler ve yalnızca seçilen yetkilerle panele girer.
     ------------------------------------------------------------------ */
  const TEAM_PERMS = [
    ['events', 'Etkinlikler', 'Etkinlik oluşturma, düzenleme, Ortak Arama ve başvurular'],
    ['registrations', 'Kayıtlar ve giriş', 'Kayıt listeleri, özet, görevliler ve giriş kontrolü'],
    ['announcements', 'Duyurular', 'Duyuru gönderme'],
    ['tasks', 'Görevler', 'UniPakt görevlerini tamamlama'],
    ['support', 'Destek', 'UniPakt Destek talepleri'],
    ['chat', 'Mesajlar', 'Kulüpler arası sohbetler (kulübün adıyla)'],
  ];
  const TEAM_ROLES = [
    ['Başkan Yardımcısı', TEAM_PERMS.map(([k]) => k)],
    ['Etkinlik Sorumlusu', ['events', 'registrations']],
    ['Kayıt & Giriş Sorumlusu', ['registrations']],
    ['İletişim Sorumlusu', ['chat', 'announcements', 'support']],
  ];
  const freshTeam = () => ({ rows: null, loading: false, error: '' });
  const loadTeam = async () => {
    const t = state.team;
    if (t.loading) return;
    t.loading = true; t.error = '';
    try { t.rows = (await api.team('list')).members || []; }
    catch (error) { t.error = error.message || 'Ekip yüklenemedi.'; }
    t.loading = false;
    if (state.view === 'ekip' && !busy()) render();
  };
  const permLabel = (k) => (TEAM_PERMS.find(([p]) => p === k) || [k, k])[1];
  const teamView = () => {
    const t = state.team;
    const top = head('Ekip', 'Kulübünün panelini seninle birlikte kullananlar. Her kişi kendi e-postası ve şifresiyle girer, yalnızca senin seçtiğin bölümleri görür. Ekip yönetimi ve kulüp profili yalnızca sende kalır.',
      '<button class="btn" data-act="team-invite">Ekip üyesi davet et</button>');
    if (t.error) return `${top}<section class="card"><p class="body">${esc(t.error)}</p><button class="btn small" data-act="team-reload">Tekrar dene</button></section>`;
    if (!t.rows) return `${top}<section class="card"><p class="body">Yükleniyor…</p></section>`;
    if (!t.rows.length) return `${top}${empty('Henüz ekip üyesi yok. “Ekip üyesi davet et” ile rolünü ve yetkilerini seçip davet gönder.')}`;
    return `${top}<div class="stack">${t.rows.map((m) => `<article class="card staff-card">
        <div class="staff-head"><div><h3>${esc(m.full_name || m.email)} <span class="tag ${m.joined ? 'ok' : 'wait'}">${m.joined ? 'Aktif' : 'Davet bekliyor'}</span></h3><small>${esc(m.title)} · ${esc(m.email)}</small></div>
          <div class="row"><button class="btn ghost small" data-act="team-edit" data-id="${esc(m.id)}">Yetkileri düzenle</button>${m.joined ? '' : `<button class="btn ghost small" data-act="team-resend" data-id="${esc(m.id)}">Daveti yeniden gönder</button>`}<button class="btn danger small" data-act="team-remove" data-id="${esc(m.id)}">Kaldır</button></div></div>
        <div class="team-perms">${(m.permissions || []).map((p) => `<span class="tag">${esc(permLabel(p))}</span>`).join('')}</div>
      </article>`).join('')}</div>`;
  };
  // Rol + yetki alanları; hazır rol seçilince yetkiler ona göre işaretlenir, sonra tek tek değiştirilebilir.
  const teamRoleFields = (title = '', perms = null) => {
    const preset = TEAM_ROLES.find(([r]) => r === title);
    const other = !!title && !preset;
    const on = new Set(perms || (preset ? preset[1] : TEAM_ROLES[1][1]));
    return field('Rol', `<select name="role" data-team-role>${TEAM_ROLES.map(([r]) => `<option ${r === (title || TEAM_ROLES[1][0]) ? 'selected' : ''}>${esc(r)}</option>`).join('')}<option value="__other" ${other ? 'selected' : ''}>Başka bir rol (kendin yaz)</option></select>`)
      + `<label class="field" data-team-custom ${other ? '' : 'hidden'}><span>Rol adı</span><input name="customTitle" maxlength="60" value="${other ? esc(title) : ''}" placeholder="Örn. Sosyal Medya Sorumlusu"></label>`
      + `<div class="field"><span>Yetkiler</span><div class="checks team-checks">${TEAM_PERMS.map(([k, label, hint]) => `<label><input type="checkbox" name="perm" value="${k}" ${on.has(k) ? 'checked' : ''}> <span><strong>${esc(label)}</strong><small>${esc(hint)}</small></span></label>`).join('')}</div>
        <small class="hint">Ekip yönetimi ve kulüp profili her zaman yalnızca başkanda kalır.</small></div>`;
  };
  const mountTeamRoleFields = () => {
    const sel = dlgForm.querySelector('[data-team-role]');
    sel?.addEventListener('change', () => {
      const custom = dlgForm.querySelector('[data-team-custom]');
      custom.hidden = sel.value !== '__other';
      if (!custom.hidden) { custom.querySelector('input').focus(); return; }
      const preset = TEAM_ROLES.find(([r]) => r === sel.value);
      if (preset) dlgForm.querySelectorAll('input[name="perm"]').forEach((box) => { box.checked = preset[1].includes(box.value); });
    });
  };
  const teamRoleFrom = (fd) => {
    const role = val(fd, 'role');
    const title = role === '__other' ? val(fd, 'customTitle').replace(/\s+/g, ' ') : role;
    const permissions = fd.getAll('perm').map(String);
    if (!title) return { problem: 'Rol adını yaz.' };
    if (!permissions.length) return { problem: 'En az bir yetki seç.' };
    return { title, permissions };
  };
  const teamActions = {
    'team-reload'() { state.team = freshTeam(); loadTeam(); render(); },
    'activity-reload'() { state.activity = { ...freshActivity(), club: state.activity.club, q: state.activity.q }; loadActivity(); render(); },
    'team-invite'() {
      openForm({
        title: 'Ekip üyesi davet et',
        lead: 'Kişiye panelde şifresini belirleyeceği bir davet e-postası gider. Rolünü ve yetkilerini şimdi seç; sonra istediğin zaman değiştirebilirsin.',
        fields: field('Ad soyad', '<input name="name" required maxlength="120" autocomplete="off">')
          + field('E-posta', '<input type="email" name="email" required maxlength="254" autocomplete="off">')
          + teamRoleFields(),
        submit: 'Daveti gönder',
        onSubmit: async (fd) => {
          const name = val(fd, 'name').replace(/\s+/g, ' '), email = val(fd, 'email').toLowerCase();
          if (name.length < 2) return 'Ad soyadı yaz.';
          if (!EMAIL_RE.test(email)) return 'Geçerli bir e-posta yaz.';
          const r = teamRoleFrom(fd);
          if (r.problem) return r.problem;
          await api.team('invite', { email, full_name: name, title: r.title, permissions: r.permissions });
          toast(`Davet ${email} adresine gönderildi.`); state.team = freshTeam(); loadTeam();
        },
      });
      mountTeamRoleFields();
    },
    'team-edit'(id) {
      const m = state.team.rows?.find((x) => x.id === id);
      if (!m) return;
      openForm({
        title: 'Yetkileri düzenle', lead: `${m.full_name || m.email} · değişiklik bir sonraki sayfa yenilemesinde geçerli olur.`,
        fields: teamRoleFields(m.title, m.permissions),
        onSubmit: async (fd) => {
          const r = teamRoleFrom(fd);
          if (r.problem) return r.problem;
          await api.team('update', { id, title: r.title, permissions: r.permissions });
          toast('Yetkiler kaydedildi.'); state.team = freshTeam(); loadTeam();
        },
      });
      mountTeamRoleFields();
    },
    async 'team-resend'(id) { await api.team('resend', { id }); toast('Davet yeniden gönderildi.'); },
    'team-remove'(id) {
      const m = state.team.rows?.find((x) => x.id === id);
      confirmRemove('Ekip üyesini kaldır', `${m?.full_name || 'Bu kişi'} ekipten çıkarılsın mı? Hesabı silinir ve panele bir daha giremez.`, async () => {
        await api.team('remove', { id }); state.team = freshTeam(); loadTeam();
      }, 'Kaldır');
    },
  };
  /* İŞLEM KAYDI — kim, ne zaman, ne yaptı (son 6 ay). */
  const freshActivity = () => ({ rows: null, loading: false, error: '', club: 'all', q: '' });
  const loadActivity = async () => {
    const a = state.activity;
    if (a.loading) return;
    a.loading = true; a.error = '';
    try { a.rows = await api.activity(); }
    catch (error) { a.error = error.message || 'İşlem kaydı yüklenemedi.'; }
    a.loading = false;
    if (state.view === 'islem-kaydi' && !busy()) render();
  };
  const activityListHtml = () => {
    const a = state.activity, q = searchKey(a.q);
    const rows = (a.rows || []).filter((r) => (a.club === 'all' || (a.club === 'unipakt' ? !r.club_id : r.club_id === a.club))
      && (!q || searchKey(`${r.actor_name} ${r.actor_title} ${r.action} ${r.target} ${club(r.club_id)?.name || ''}`).includes(q)));
    if (!rows.length) return empty(a.rows?.length ? 'Aramana uyan işlem yok.' : 'Henüz kayıtlı işlem yok. Ekibin panelde bir şey yaptığında burada görünür.');
    const day = (iso) => new Date(iso).toLocaleDateString('tr-TR', { timeZone: 'Europe/Istanbul', day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' });
    const time = (iso) => new Date(iso).toLocaleTimeString('tr-TR', { timeZone: 'Europe/Istanbul', hour: '2-digit', minute: '2-digit' });
    const groups = [];
    rows.forEach((r) => { const d = day(r.created_at); if (!groups.length || groups[groups.length - 1][0] !== d) groups.push([d, []]); groups[groups.length - 1][1].push(r); });
    return groups.map(([d, list]) => `<div class="act-day"><h3>${esc(d)}</h3><div class="card">${list.map((r) => `
      <div class="act-row"><time>${esc(time(r.created_at))}</time>
        <div><p><strong>${esc(r.actor_name)}</strong> <span class="act-title">${r.actor_title !== r.actor_name ? esc(r.actor_title) : ''}${isAdmin() && r.club_id ? ` · ${esc(club(r.club_id)?.name || 'Kulüp')}` : ''}</span></p>
        <p class="act-what">${esc(r.action)}${r.target ? `: <span>${esc(r.target)}</span>` : ''}</p></div></div>`).join('')}</div></div>`).join('');
  };
  /* ------------------------------------------------------------------
     KULÜP SAYFASI (yalnızca kulüp başkanı) — sitedeki /kulup/?id=… sayfasının
     üst alan görseli (banner), vurgu rengi, arka planı ve başlık stili.
     ------------------------------------------------------------------ */
  const CLUB_BGS = [['default', 'Varsayılan', 'Banner varsa koyu katmanla, yoksa noktalı zemin'], ['clear', 'Banner net', 'Görsel olduğu gibi görünür'], ['blur', 'Bannerdan bulanık', 'Görselin renkleri yumuşak bir zemin olur'], ['color', 'Düz renk', 'Seçtiğin renk'], ['gradient', 'Renk geçişi', 'Arka plan renginden vurgu rengine']];
  const clubPageDraft = () => {
    if (!state.clubPage) {
      const d = state.profile.pageDesign || {};
      state.clubPage = { v: { dAccent: d.accent || '', dBg: d.bg || 'default', dBgColor: d.bgColor || '', dTitle: d.title || 'default' }, banner: state.profile.pageBanner || '', file: null, removeBanner: false, saving: false, error: '' };
    }
    return state.clubPage;
  };
  const clubPreviewHtml = () => {
    const cp = clubPageDraft(), v = cp.v, c = club(state.user) || {};
    const d = designFrom(v);
    const bg = (d.bg === 'clear' || d.bg === 'blur') && !cp.banner ? 'default' : (d.bg || 'default');
    const second = d.bg === 'gradient' ? (d.accent || '#2A2A2D') : (d.bgColor || '#0C0C0D');
    const ink = (bg === 'color' || bg === 'gradient') && (bLum(d.bgColor || '#0C0C0D') + bLum(second)) / 2 > 0.42 ? '#0C0C0D' : '#FFFFFF';
    const vivid = (h) => { const x = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); return Math.max(...x) - Math.min(...x); };
    let acc = d.accent || '';
    if ((!acc || vivid(acc) < 0.15) && (bg === 'color' || bg === 'gradient') && d.bgColor && vivid(d.bgColor) >= 0.15) acc = d.bgColor;
    const style = [`--cp-ink:${ink}`, `--cp-bgc:${d.bgColor || '#0C0C0D'}`, `--cp-grad2:${second}`, acc ? `--cp-acc:${acc}` : '', cp.banner ? `--cp-banner:url('${esc(cp.banner).replace(/'/g, '%27')}')` : ''].filter(Boolean).join(';');
    const initial = String(c.name || '?').trim().charAt(0).toLocaleUpperCase('tr-TR');
    return `<div class="cpv ${acc ? 'has-acc' : ''}" style="${style}">
      <div class="cpv-hero cpv-bg-${bg}${cp.banner && bg === 'default' ? ' cpv-has-banner' : ''} cpv-title-${d.title || 'default'}">
        <div class="cpv-logo">${state.profile.avatarUrl ? `<img src="${esc(state.profile.avatarUrl)}" alt="">` : esc(initial)}</div>
        <h3>${esc(c.name || 'Kulübün')}</h3><p>${esc(c.uni || '')}${c.category ? ` · ${esc(c.category)}` : ''}</p>
      </div>
      <div class="cpv-body"><div class="cpv-ev"><b>19</b><span><strong>Örnek etkinlik</strong><small>19 Kasım · 13:00</small></span><i>→</i></div><span class="cpv-btn">Kayıt ol</span></div>
    </div>`;
  };
  const clubPageView = () => {
    const cp = clubPageDraft();
    const url = `https://unipakt.com/kulup/?id=${encodeURIComponent(state.user)}`;
    return `${head('Kulüp sayfası', 'Sitedeki kulüp sayfanın görünümü: üst alan görseli, renkler ve başlık stili. Logo ve tanıtım yazısı Profil’den değişir.', `<a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener">Sayfayı aç ↗</a>`)}
      <form id="clubPageForm" class="cp-grid" novalidate>
        <div class="stack">
          <section class="card stack">
            <span class="field-label">Üst alan görseli (banner)</span>
            <small class="hint">Yatay bir görsel seç (ör. 1920×640). 1 MB’tan büyükse otomatik küçültülür.</small>
            <div class="row-actions">
              <label class="btn ghost small" style="cursor:pointer">Görsel seç<input type="file" accept="image/jpeg,image/png,image/webp" data-cp-file hidden></label>
              ${cp.banner ? '<button type="button" class="btn ghost small" data-act="cp-banner-remove">Görseli kaldır</button>' : ''}
            </div>
          </section>
          <section class="card stack">${designHtml(cp.v, { accentHint: 'Düğmeler, vurgulu yazılar, etkinlik tarihleri ve iletişim simgeleri bu renge döner. Boş bırakır ve renkli bir arka plan seçersen o renk kullanılır.', bgs: CLUB_BGS })}</section>
          ${cp.error ? `<p class="form-error">${esc(cp.error)}</p>` : ''}
          <div class="row-actions">
            <button type="button" class="btn" data-act="cp-save" ${cp.saving ? 'disabled' : ''}>${cp.saving ? 'Kaydediliyor…' : 'Kaydet ve yayınla'}</button>
            <button type="button" class="btn ghost" data-act="cp-reset">Varsayılana dön</button>
          </div>
        </div>
        <aside class="evp-preview"><small>Sitedeki görünüm · canlı önizleme</small><div data-cp-preview>${clubPreviewHtml()}</div></aside>
      </form>`;
  };
  const clubPageRefresh = () => {
    const form = document.getElementById('clubPageForm'); if (!form) return;
    const fd = new FormData(form), cp = clubPageDraft();
    cp.v = { dAccent: String(fd.get('dAccent') || '').trim().toUpperCase(), dBg: String(fd.get('dBg') || 'default'), dBgColor: String(fd.get('dBgColor') || '').trim().toUpperCase(), dTitle: String(fd.get('dTitle') || 'default') };
    const box = form.querySelector('[data-cp-preview]'); if (box) box.innerHTML = clubPreviewHtml();
  };
  document.addEventListener('input', (e) => { if (e.target.form?.id === 'clubPageForm') clubPageRefresh(); });
  document.addEventListener('change', async (e) => {
    if (e.target.form?.id === 'clubPageForm' && !e.target.matches('[data-cp-file]')) { clubPageRefresh(); return; }
    if (!e.target.matches?.('[data-cp-file]')) return;
    const file = e.target.files?.[0]; if (!file) return;
    const cp = clubPageDraft();
    try {
      const { file: small } = await shrinkImage(file);
      cp.file = small; cp.removeBanner = false; cp.banner = await readAsDataUrl(small); cp.error = '';
      if (cp.v.dBg === 'default' || cp.v.dBg === 'color' || cp.v.dBg === 'gradient') cp.v.dBg = 'clear';   // yeni görsel görünsün
    } catch (error) { cp.error = error.message || 'Görsel okunamadı.'; }
    render();
  });
  const clubPageActions = {
    'cp-banner-remove'() { Object.assign(clubPageDraft(), { banner: '', file: null, removeBanner: true }); render(); },
    'cp-reset'() { Object.assign(clubPageDraft(), { v: { dAccent: '', dBg: 'default', dBgColor: '', dTitle: 'default' }, error: '' }); render(); },
    async 'cp-save'() {
      const cp = clubPageDraft();
      clubPageRefresh();
      const v = cp.v;
      if (v.dAccent && !HEX6.test(v.dAccent)) { cp.error = 'Vurgu rengi #RRGGBB biçiminde olmalı.'; render(); return; }
      if ((v.dBg === 'color' || v.dBg === 'gradient') && !HEX6.test(v.dBgColor)) { cp.error = 'Arka plan rengini seç.'; render(); return; }
      cp.saving = true; cp.error = ''; render();
      try {
        await api.saveClubPage({ design: designFrom(v), file: cp.file, removeBanner: cp.removeBanner });
        Object.assign(cp, { file: null, removeBanner: false, banner: state.profile.pageBanner || '' });
        toast('Kulüp sayfası güncellendi. Sitede hemen görünür.');
      } catch (error) { cp.error = error.message || 'Kaydedilemedi.'; }
      cp.saving = false; render();
    },
  };

  /* ------------------------------------------------------------------
     MARKA RENGİ (yalnızca UniPakt yöneticisi)
     1–4 renk + açı. Kaydedince site, panel, giriş kontrol sayfası, logolar ve
     e-postalar bu renge geçer (site_theme satırı; bkz. theme.js, tools/brand.py).
     ------------------------------------------------------------------ */
  const BRAND_HEX = /^#[0-9A-F]{6}$/;
  const BRAND_PRESETS = [
    ['Mor gradyan', ['#8F244D', '#A94B86'], 135],
    ['Turkuaz', ['#19C7B5'], 135],
    ['Turuncu', ['#FF5A1F'], 135],
    ['Gün batımı', ['#FF5A1F', '#FFC23D'], 135],
    ['Okyanus', ['#2F6FE0', '#19C7B5'], 135],
    ['Gökkuşağı', ['#FF5A1F', '#FFC23D', '#2F6FE0', '#7C3CFF'], 90],
  ];
  // bLum: göreli parlaklık (yukarıda, etkinlik tasarımıyla ortak).
  const bContrast = (a, b) => { const x = bLum(a), y = bLum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const mixHex = (hex, to, t) => '#' + [1, 3, 5].map((i) => { const v = parseInt(hex.slice(i, i + 2), 16), w = parseInt(to.slice(i, i + 2), 16); return Math.round(v + (w - v) * t).toString(16).padStart(2, '0'); }).join('').toUpperCase();
  // Okunurluk: koyu zeminde (#0C0C0D) en az 3:1, beyaz zeminde en az 4.5:1; gerekirse renk açılır/koyulaşır.
  const readable = (hex, bg, target) => { for (let k = 0; k <= 20; k++) { const c = mixHex(hex, bg === '#FFFFFF' ? '#000000' : '#FFFFFF', k / 20); if (bContrast(c, bg) >= target) return c; } return bg === '#FFFFFF' ? '#000000' : '#FFFFFF'; };
  const brandTheme = (colors, angle) => {
    const byLight = [...colors].sort((a, b) => bLum(b) - bLum(a));
    const worst = (ink) => Math.min(...colors.map((c) => bContrast(ink, c)));
    return {
      colors, angle: ((Math.round(angle) % 360) + 360) % 360,
      on_dark: readable(byLight[0], '#0C0C0D', 3),
      on_light: readable(byLight[byLight.length - 1], '#FFFFFF', 4.5),
      on_accent: worst('#FFFFFF') >= worst('#000000') ? '#FFFFFF' : '#000000',
    };
  };
  const brandDraft = () => {
    if (!state.brand) {
      const t = window.unipaktTheme?.current() || { colors: ['#8F244D', '#A94B86'], angle: 135 };
      state.brand = { colors: [...t.colors], angle: t.angle, saved: brandTheme([...t.colors], t.angle), saving: false, error: '', dirty: false };
    }
    return state.brand;
  };
  const brandPreview = () => {
    const b = brandDraft();
    const t = brandTheme(b.colors, b.angle);
    window.unipaktTheme?.apply(t, { preview: true });
    const out = document.querySelector('[data-brand-out]');
    if (out) out.innerHTML = brandOutHtml(t);
  };
  const brandOutHtml = (t) => `
      <div class="brand-swatch" style="background:${window.unipaktTheme ? window.unipaktTheme.gradient(t) : t.colors[0]}"></div>
      <div class="brand-samples">
        <span class="btn" style="pointer-events:none">Örnek düğme</span>
        <span style="color:${t.on_dark};font-weight:700">Koyu zeminde vurgu yazısı</span>
        <span class="brand-light" style="color:${t.on_light}">Açık zeminde vurgu yazısı</span>
      </div>
      <img data-tint="logo-full" src="/hackfest-media/logo-full.webp?v=3" alt="Örnek logo" class="brand-logo">
      <p class="hint">Yazılar okunmuyorsa renk otomatik açılıp koyulaştırılır: koyu zeminde <b style="color:${t.on_dark}">${t.on_dark}</b>, açık zeminde <b>${t.on_light}</b>, düğme yazısı ${t.on_accent === '#FFFFFF' ? 'beyaz' : 'siyah'}.</p>`;
  const brandView = () => {
    const b = brandDraft();
    const t = brandTheme(b.colors, b.angle);
    const rows = b.colors.map((c, i) => `
        <div class="brand-row">
          <input type="color" value="${c}" data-brand-color="${i}" aria-label="${i + 1}. renk">
          <input type="text" value="${c}" maxlength="7" data-brand-hex="${i}" aria-label="${i + 1}. renk (#RRGGBB)" spellcheck="false">
          ${b.colors.length > 1 ? `<button type="button" class="btn ghost small" data-act="brand-remove" data-id="${i}" aria-label="${i + 1}. rengi kaldır">Kaldır</button>` : ''}
        </div>`).join('');
    return `${head('Marka rengi', 'Sitenin, panelin, giriş kontrol sayfasının, logoların ve e-postaların rengi. Kaydedince herkes için değişir.')}
      <section class="card stack brand-card">
        <div class="brand-presets">${BRAND_PRESETS.map(([name, cols, ang], i) => `<button type="button" class="chip" data-act="brand-preset" data-id="${i}" title="${esc(cols.join(' → '))}"><i style="background:linear-gradient(${ang}deg, ${(cols.length > 1 ? cols : [cols[0], cols[0]]).join(', ')})"></i>${esc(name)}</button>`).join('')}</div>
        <div class="brand-grid">
          <div class="stack">
            <p class="field-label">Renkler <small>(1–4, sırasıyla)</small></p>
            ${rows}
            ${b.colors.length < 4 ? '<button type="button" class="btn ghost small" data-act="brand-add">+ Renk ekle</button>' : ''}
            <label class="field"><span>Gradyan açısı: <b data-brand-angle-out>${t.angle}°</b></span><input type="range" min="0" max="359" step="1" value="${t.angle}" data-brand-angle ${b.colors.length < 2 ? 'disabled' : ''}></label>
          </div>
          <div class="brand-out" data-brand-out>${brandOutHtml(t)}</div>
        </div>
        ${b.error ? `<p class="form-error">${esc(b.error)}</p>` : ''}
        <div class="row-actions">
          <button type="button" class="btn" data-act="brand-save" ${b.saving ? 'disabled' : ''}>${b.saving ? 'Kaydediliyor…' : 'Kaydet ve yayınla'}</button>
          <button type="button" class="btn ghost" data-act="brand-reset" ${b.dirty ? '' : 'disabled'}>Kaydedilene dön</button>
        </div>
        <p class="hint">Değiştirdiğinde önce yalnızca bu ekranda önizlenir. Kaydedince site ziyaretçileri yeni rengi hemen görür; logolu paylaşım görselleri (bağlantı önizlemeleri) en geç bir saat içinde güncellenir. E-postalar bir dakika içinde yeni renkle gider.</p>
      </section>`;
  };
  const brandActions = {
    'brand-preset'(id) { const [, cols, ang] = BRAND_PRESETS[Number(id)]; Object.assign(brandDraft(), { colors: [...cols], angle: ang, dirty: true, error: '' }); render(); brandPreview(); },
    'brand-add'() { const b = brandDraft(); if (b.colors.length < 4) { b.colors.push(b.colors[b.colors.length - 1]); b.dirty = true; render(); brandPreview(); } },
    'brand-remove'(id) { const b = brandDraft(); if (b.colors.length > 1) { b.colors.splice(Number(id), 1); b.dirty = true; render(); brandPreview(); } },
    'brand-reset'() { const b = brandDraft(); Object.assign(b, { colors: [...b.saved.colors], angle: b.saved.angle, dirty: false, error: '' }); window.unipaktTheme?.apply(b.saved); render(); },
    async 'brand-save'() {
      const b = brandDraft();
      if (!b.colors.every((c) => BRAND_HEX.test(c))) { b.error = 'Her renk #RRGGBB biçiminde olmalı.'; render(); return; }
      const t = brandTheme(b.colors, b.angle);
      b.saving = true; b.error = ''; render();
      try {
        await api.saveTheme(t);
        Object.assign(b, { saved: t, dirty: false });
        toast('Marka rengi kaydedildi. Site, panel ve e-postalar yeni renkte.');
      } catch (error) { b.error = error.message || 'Kaydedilemedi.'; }
      b.saving = false; render();
    },
  };
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.matches?.('[data-brand-color],[data-brand-hex],[data-brand-angle]')) return;
    const b = brandDraft();
    if (el.matches('[data-brand-angle]')) { b.angle = Number(el.value) || 0; const o = document.querySelector('[data-brand-angle-out]'); if (o) o.textContent = `${b.angle}°`; }
    else {
      const i = Number(el.dataset.brandColor ?? el.dataset.brandHex);
      let v = el.value.trim().toUpperCase(); if (v && v[0] !== '#') v = `#${v}`;
      if (!BRAND_HEX.test(v)) return;
      b.colors[i] = v;
      const twin = document.querySelector(el.matches('[data-brand-color]') ? `[data-brand-hex="${i}"]` : `[data-brand-color="${i}"]`);
      if (twin) twin.value = v;
    }
    b.dirty = true;
    const reset = document.querySelector('[data-act="brand-reset"]'); if (reset) reset.disabled = false;
    brandPreview();
  });
  // Sayfadan kaydetmeden çıkılırsa önizleme geri alınır.
  const brandLeave = () => { const b = state.brand; if (b?.dirty) { Object.assign(b, { colors: [...b.saved.colors], angle: b.saved.angle, dirty: false }); window.unipaktTheme?.apply(b.saved); } };

  const activityView = () => {
    const a = state.activity;
    const top = head('İşlem Kaydı', isAdmin() ? 'Panelde kimin, ne zaman, ne yaptığı. Tüm kulüpler; son 6 ay saklanır.' : 'Sen ve ekibinin panelde ne zaman ne yaptığı. Yalnızca sen görürsün; son 6 ay saklanır.',
      '<button class="btn ghost" data-act="activity-reload">Yenile</button>');
    if (a.error) return `${top}<section class="card"><p class="body">${esc(a.error)}</p><button class="btn small" data-act="activity-reload">Tekrar dene</button></section>`;
    if (!a.rows) return `${top}<section class="card"><p class="body">Yükleniyor…</p></section>`;
    const clubsWithRows = [...new Set(a.rows.map((r) => r.club_id).filter(Boolean))].map(club).filter(Boolean).sort(byLabel);
    return `${top}
      <div class="act-filters">
        <input type="search" data-activity-q value="${esc(a.q)}" placeholder="Kişi, işlem ya da etkinlik ara" aria-label="İşlem kaydında ara">
        ${isAdmin() ? `<select data-activity-club aria-label="Kulüp"><option value="all">Tüm kulüpler</option><option value="unipakt" ${a.club === 'unipakt' ? 'selected' : ''}>UniPakt</option>${clubsWithRows.map((c) => `<option value="${esc(c.id)}" ${a.club === c.id ? 'selected' : ''}>${esc(clubLabel(c))}</option>`).join('')}</select>` : ''}
      </div>
      <div id="activityList">${activityListHtml()}</div>`;
  };
  document.addEventListener('input', (e) => {
    if (!e.target.matches?.('[data-activity-q]')) return;
    state.activity.q = e.target.value;
    const list = document.getElementById('activityList'); if (list) list.innerHTML = activityListHtml();
  });
  document.addEventListener('change', (e) => {
    if (!e.target.matches?.('[data-activity-club]')) return;
    state.activity.club = e.target.value;
    const list = document.getElementById('activityList'); if (list) list.innerHTML = activityListHtml();
  });

  // Ekip üyesinin göremeyeceği düğme ve bağlantılar sayfadan çıkarılır.
  const pruneForMember = (scope) => {
    scope?.querySelectorAll('[data-act]').forEach((el) => { if (!actAllowed(el.dataset.act) && !el.closest('.profile-menu')) el.remove(); });
    scope?.querySelectorAll('[data-go]').forEach((el) => {
      if (viewAllowed(el.dataset.go)) return;
      if (el.classList.contains('stat')) { el.removeAttribute('data-go'); el.disabled = true; } else el.remove();
    });
  };

  const regActions = {
    'reg-open'(id) { openRegBoard(id); },
    'reg-pick'() { state.regBoard = freshRegBoard(); render(); },
    'reg-reload'() { loadRegBoard(); render(); },
    'reg-edit'() {
      const s = state.regBoard.settings;
      state.regBoard.edit = { enabled: true, deadline: toLocalInput(s?.deadline), questions: JSON.parse(JSON.stringify(s?.questions || [])).map((q) => ({ options: [], ...q })) };
      render();
    },
    'reg-edit-cancel'() { state.regBoard.edit = null; render(); },
    async 'reg-edit-save'() {
      const d = state.regBoard.edit;
      const problem = validateRegDraft({ ...d, enabled: true });
      const err = document.querySelector('[data-reg-edit-error]');
      if (problem) { if (err) { err.textContent = problem; err.hidden = false; } return; }
      await saveRegSettings({ enabled: d.enabled, deadline: fromLocalInput(d.deadline), questions: cleanRegQuestions(d) });
      state.regBoard.edit = null; toast(d.enabled ? 'Kayıt formu kaydedildi.' : 'Kayıt toplama kapatıldı.'); render();
    },
    async 'reg-toggle'() {
      const s = state.regBoard.settings;
      await saveRegSettings({ open: !s.is_open });
      toast(state.regBoard.settings.is_open ? 'Kayıtlar açıldı.' : 'Kayıtlar kapatıldı.'); render();
    },
    async 'reg-deadline-save'() {
      const v = document.querySelector('[data-reg-deadline]')?.value || '';
      if (v && new Date(fromLocalInput(v)).getTime() < Date.now() && !confirm('Bu zaman geçmişte; kayıtlar hemen kapanır. Devam edilsin mi?')) return;
      await saveRegSettings({ deadline: fromLocalInput(v) });
      toast(v ? 'Son kayıt zamanı kaydedildi.' : 'Son kayıt zamanı kaldırıldı.'); render();
    },
    async 'reg-col'(key) {
      const b = state.regBoard;
      const { chosen } = boardColumns(b.settings);
      const next = chosen.includes(key) ? chosen.filter((k) => k !== key) : [...chosen, key];
      b.settings.board_columns = next.length ? next : ['code'];
      render();
      try { await saveRegSettings({ columns: b.settings.board_columns }); } catch (_) {}
    },
    async 'reg-checkin'(id, on) {
      await api.setCheckin(id, on === '1');
      const r = state.regBoard.rows.find((x) => x.id === id);
      if (r) r.checked_in_at = on === '1' ? (r.checked_in_at || new Date().toISOString()) : null;
      render();
    },
    'reg-del'(id) {
      const r = state.regBoard.rows.find((x) => x.id === id);
      confirmRemove('Kaydı sil', `${r?.full_name || 'Bu kişi'} kaydı silinsin mi? Giriş kodu da geçersiz olur.${regStatus(r || {}) === 'waitlist' ? '' : ' Bekleme listesinde biri varsa yer ona teklif edilir.'}`, async () => {
        await api.deleteRegistration(id, state.regBoard.eventId);
        state.regBoard.rows = state.regBoard.rows.filter((x) => x.id !== id);
      }, 'Sil');
    },
    'reg-csv'() { downloadRegCsv(); },
    'reg-tab'(tab) { state.regBoard.tab = tab === 'ozet' ? 'ozet' : 'pano'; render(); },
    'reg-print'() { document.documentElement.classList.add('print-report'); window.print(); setTimeout(() => document.documentElement.classList.remove('print-report'), 500); },
    'staff-reload'() { state.staffView = freshStaffView(); loadStaffView(); render(); },
    'staff-add'() {
      openForm({
        title: 'Görevli ekle', lead: 'Bir kez eklersin; sonra her etkinlik için tek tıkla yetki verirsin. Panel hesabı açılmaz.',
        fields: field('Ad soyad', '<input name="name" required maxlength="120" autocomplete="off">') + field('E-posta', '<input type="email" name="email" required maxlength="254" autocomplete="off">'),
        submit: 'Ekle',
        onSubmit: async (fd) => {
          const name = val(fd, 'name').trim(), email = val(fd, 'email').trim().toLowerCase();
          if (name.length < 2) return 'Ad soyadı yaz.';
          if (!EMAIL_RE.test(email)) return 'Geçerli bir e-posta yaz.';
          try { await api.addStaff({ name, email }); }
          catch (error) { return /duplicate|unique/i.test(error.message) ? 'Bu e-posta zaten görevli listende.' : error.message; }
          toast('Görevli eklendi.'); state.staffView = freshStaffView(); loadStaffView();
        },
      });
    },
    'staff-del'(id) {
      const s = state.staffView.staff?.find((x) => x.id === id);
      confirmRemove('Görevliyi sil', `${s?.full_name || 'Görevli'} listeden silinsin mi? Verilmiş tüm etkinlik yetkileri de kapanır.`, async () => {
        await api.removeStaff(id); state.staffView = freshStaffView(); loadStaffView();
      }, 'Sil');
    },
    'staff-grant'(id) {
      const s = state.staffView.staff?.find((x) => x.id === id);
      const events = grantableEvents();
      if (!events.length) { toast('Önce bir etkinlikte UniPakt üzerinden kayıt toplamayı aç (yalnızca yayındaki, bitmemiş etkinlikler).'); return; }
      openForm({
        title: 'Etkinlik yetkisi ver',
