        lead: `${s?.full_name || 'Görevli'} (${s?.email || ''}) adresine kontrol sayfasının bağlantısı ve 6 haneli erişim kodu gönderilir. Aynı etkinliğe tekrar verirsen eski bağlantı geçersiz olur.`,
        fields: field('Etkinlik', `<select name="event" required>${events.map((e) => `<option value="${esc(e.id)}">${esc(e.title)} · ${esc(fmtDay(e.date))}</option>`).join('')}</select>`),
        submit: 'Yetki e-postasını gönder',
        onSubmit: async (fd) => {
          await api.grantStaff(id, val(fd, 'event'));
          toast(`${s?.full_name || 'Görevli'} kişisine yetki e-postası gönderildi.`);
          state.staffView = freshStaffView(); loadStaffView();
        },
      });
    },
    'grant-resend'(id) {
      const g = state.staffView.grants?.find((x) => x.id === id);
      const s = state.staffView.staff?.find((x) => x.id === g?.staff_id);
      if (!g || !s) return;
      confirmRemove('Kodu yeniden gönder', `${s.full_name} kişisine yeni bir kontrol bağlantısı ve erişim kodu gönderilir; eski bağlantı geçersiz olur, kilit açılır.`, async () => {
        await api.grantStaff(g.staff_id, g.event_id);
        toast(`${s.full_name} kişisine yeni bağlantı ve kod gönderildi.`);
        state.staffView = freshStaffView(); loadStaffView();
      }, 'Gönder');
    },
    'grant-revoke'(id) {
      confirmRemove('Yetkiyi geri al', 'Bu görevlinin bu etkinlikteki kontrol bağlantısı hemen geçersiz olur.', async () => {
        await api.revokeGrant(id); state.staffView = freshStaffView(); loadStaffView();
      }, 'Geri al');
    },
    // builder
    'regb-add'() {
      const d = regDraft(); d.questions.push({ id: newQid(), type: 'text', label: '', required: false, options: [] });
      rerenderRegb(`[data-regb="label"][data-i="${d.questions.length - 1}"]`);
    },
    'regb-del'(i) { regDraft().questions.splice(Number(i), 1); rerenderRegb(); },
    'regb-move'(i, dir) {
      const qs = regDraft().questions, a = Number(i), b = a + Number(dir);
      if (b < 0 || b >= qs.length) return;
      [qs[a], qs[b]] = [qs[b], qs[a]]; rerenderRegb();
    },
    'regb-opt-add'(i) { const q = regDraft().questions[Number(i)]; if (q.options.length < 20) q.options.push(''); rerenderRegb(`[data-regb="opt"][data-i="${i}"][data-j="${q.options.length - 1}"]`); },
    'regb-opt-del'(i, j) { const q = regDraft().questions[Number(i)]; if (q.options.length > 2) q.options.splice(Number(j), 1); rerenderRegb(); },
  };

  /* ------------------------------------------------------------------
     BİRİMLER — Merkez Yönetim tüm birimleri yönetir (birim açar, başkan atar/değiştirir,
     rol ekler). Birim hesabı kendi birimini yetkisine göre yönetir, diğer birimleri
     salt okunur görür. Her birimde tek başkan; çıkarılan kişi pasife alınır.
     Sunucu: unit_directory() (okuma) + unit-team fonksiyonu (yazma, yetkiyi o da denetler).
     ------------------------------------------------------------------ */
  // Yetki kataloğu: ortak (team, roles, chat) + birim türüne özel (veritabanındaki unit_kind_perms() ile aynı).
  const UNIT_PERMS = [
    ['team', 'Ekip yönetimi', 'Kişi ekler, rol verir, pasife alır'],
    ['roles', 'Rol yönetimi', 'Yeni rol açar, rollerin yetkilerini düzenler'],
    ['chat', 'Mesajlar', 'UniPakt Instant Messages'],
    ['posts', 'Paylaşım talepleri', 'Talepleri değerlendirir, yayın akışını yürütür'],
    ['brand', 'Marka rengi', 'Sitenin ve panelin marka rengini değiştirir'],
    ['campaigns', 'Kampanyalar', 'Kampanya açar, onaya gönderir'],
    ['sponsors', 'Sponsor ağı', 'Sponsor kayıtları ve görüşmeler'],
    ['clubs', 'Kulüp ağı', 'Kulüp kayıtları ve iletişim takibi'],
    ['audit', 'Denetim kayıtları', 'Tespit, uyarı ve rapor'],
    ['audit_assign', 'Etkinliğe sorumlu atama', 'Etkinliklere denetim sorumlusu atar'],
    ['approve', 'YK onayı', 'Birimlerden gelen talepleri onaylar'],
  ];
  const UNIT_KINDS = [['', 'Genel (yalnızca ekip yönetimi)'], ['social', 'Sosyal Medya'], ['pr', 'Halkla İlişkiler'], ['sponsor', 'Sponsorluk'], ['clubs', 'Kulüp İlişkileri'], ['audit', 'Denetim'], ['board', 'Yönetim Kurulu (YK)']];
  const unitKindPerms = (u) => (Array.isArray(u?.kind_perms) && u.kind_perms.length ? u.kind_perms : ['team', 'roles', 'chat']);
  const unitPermLabel = (k) => (UNIT_PERMS.find(([p]) => p === k) || [k, k])[1];
  const freshUnits = () => ({ data: null, loading: false, error: '', open: '', emails: {}, showPassive: false });
  const loadUnits = async () => {
    const u = state.units;
    if (u.loading) return;
    u.loading = true; u.error = '';
    try {
      u.data = await api.units();
      if (!u.open && u.data?.me?.unit_id) u.open = u.data.me.unit_id;
      if (u.open) loadUnitEmails(u.open);
    } catch (error) { u.error = error.message || 'Birimler yüklenemedi.'; }
    u.loading = false;
    if (state.view === 'birimler' && !busy()) render();
  };
  const reloadUnits = () => { state.units = { ...freshUnits(), open: state.units.open, showPassive: state.units.showPassive }; loadUnits(); };
  const unitById = (id) => state.units.data?.units.find((x) => x.id === id);
  const unitMe = () => state.units.data?.me || { admin: false, perms: [], unit_id: null, is_head: false };
  const unitCan = (unitId, perm) => { const me = unitMe(); return me.admin || (me.unit_id === unitId && (me.is_head || me.perms.includes(perm))); };
  const unitIsHead = (unitId) => { const me = unitMe(); return me.admin || (me.unit_id === unitId && me.is_head); };
  const loadUnitEmails = async (unitId) => {
    if (!unitCan(unitId, 'team')) return;
    try { const r = await api.unit('emails', { unit_id: unitId }); state.units.emails = { ...state.units.emails, ...(r.emails || {}) }; if (state.view === 'birimler' && !busy()) render(); }
    catch (_) { /* e-postalar olmadan da sayfa çalışır */ }
  };
  const unitHead = (u) => u.members.find((m) => m.is_head && m.status === 'active');
  const roleName = (u, id) => u.roles.find((r) => r.id === id)?.name || '—';
  const memberPerms = (u, m) => m.is_head ? unitKindPerms(u) : [...new Set([...(u.roles.find((r) => r.id === m.role_id)?.permissions || []), ...(m.permissions || [])])];
  const personName = (m) => m.full_name || m.username || 'İsimsiz';

  const unitsView = () => {
    const u = state.units, me = unitMe();
    const intro = me.admin
      ? 'UniPakt birimleri. Başkanı atarsın, başkan kendi ekibini kurar. Her birimin tek başkanı olur; birimden çıkarılan kişi silinmez, pasife alınır.'
      : 'Kendi birimini yetkin ölçüsünde yönetirsin; diğer birimleri yalnızca görürsün.';
    const top = head('Birimler', intro, me.admin && !u.open ? '<button class="btn" data-act="unit-new">Birim ekle</button>' : '');
    if (u.error) return `${top}<section class="card"><p class="body">${esc(u.error)}</p><button class="btn small" data-act="unit-reload">Tekrar dene</button></section>`;
    if (!u.data) return `${top}<section class="card"><p class="body">Yükleniyor…</p></section>`;
    const open = u.open && unitById(u.open);
    if (open) return `${top}${unitDetailHtml(open)}`;
    if (!u.data.units.length) return `${top}${empty('Henüz birim yok.')}`;
    return `${top}<div class="unit-grid">${u.data.units.map((x) => {
      const h = unitHead(x), active = x.members.filter((m) => m.status === 'active');
      return `<button class="card unit-card ${x.id === me.unit_id ? 'is-mine' : ''}" data-act="unit-open" data-id="${esc(x.id)}">
        <span class="unit-name">${esc(x.name)}${x.id === me.unit_id ? ' <span class="tag ok">Birimin</span>' : ''}</span>
        <span class="unit-head">${h ? `${avatarMarkup(h.avatar_url, personName(h), 'small')}<span><strong>${esc(personName(h))}</strong><small>Birim Başkanı</small></span>` : '<span class="unit-nohead">Başkan atanmadı</span>'}</span>
        <span class="unit-count">${active.length} kişi</span>
      </button>`;
    }).join('')}</div>`;
  };

  const unitDetailHtml = (u) => {
    const me = unitMe(), team = unitCan(u.id, 'team'), roles = unitCan(u.id, 'roles'), headOk = unitIsHead(u.id);
    const readOnly = !team && !roles;
    const h = unitHead(u);
    const people = u.members.filter((m) => state.units.showPassive || m.status === 'active')
      .sort((a, b) => (b.is_head - a.is_head) || ((a.status === 'passive') - (b.status === 'passive')));
    const passiveCount = u.members.filter((m) => m.status === 'passive').length;
    const emails = state.units.emails;
    const back = '<button class="btn ghost small" data-act="unit-back">← Tüm birimler</button>';
    const memberRow = (m) => {
      const isMe = !!state.meId && m.id === state.meId;
      const btns = [];
      if (m.status === 'active') {
        if (team && (!m.is_head || headOk)) btns.push(`<button class="btn ghost small" data-act="unit-member-edit" data-id="${esc(m.id)}">Rol ve yetkiler</button>`);
        if (headOk && !m.is_head) btns.push(`<button class="btn ghost small" data-act="unit-head-set" data-id="${esc(m.id)}">Başkan yap</button>`);
        if (team && (!m.is_head || me.admin) && !isMe) btns.push(`<button class="btn danger small" data-act="unit-member-off" data-id="${esc(m.id)}">Pasife al</button>`);
        if (team && (!m.is_head || headOk) && emails[m.id] !== undefined) btns.push(`<button class="btn ghost small" data-act="unit-member-resend" data-id="${esc(m.id)}">Daveti yeniden gönder</button>`);
        if (me.admin) btns.push(`<button class="btn ghost small" data-act="unit-member-email" data-id="${esc(m.id)}">E-postayı değiştir</button>`);
      } else if (team) btns.push(`<button class="btn ghost small" data-act="unit-member-on" data-id="${esc(m.id)}">Yeniden aktif et</button>`);
      return `<article class="unit-member ${m.status === 'passive' ? 'is-passive' : ''}">
        ${avatarMarkup(m.avatar_url, personName(m), 'small')}
        <div class="unit-member-main">
          <p><strong>${esc(personName(m))}</strong> ${m.is_head ? '<span class="tag ok">Birim Başkanı</span>' : `<span class="tag">${esc(roleName(u, m.role_id))}</span>`}${m.status === 'passive' ? ' <span class="tag wait">Pasif</span>' : ''}</p>
          <small>${m.username ? `@${esc(m.username)}` : ''}${emails[m.id] ? `${m.username ? ' · ' : ''}${esc(emails[m.id])}` : ''}</small>
          ${!readOnly ? `<div class="team-perms">${memberPerms(u, m).map((p) => `<span class="tag">${esc(unitPermLabel(p))}</span>`).join('')}</div>` : ''}
        </div>
        ${btns.length ? `<div class="row unit-member-actions">${btns.join('')}</div>` : ''}
      </article>`;
    };
    return `<section class="unit-detail">
      <div class="unit-detail-head">${back}
        <h2>${esc(u.name)}</h2>
        ${u.kind ? `<span class="tag">${esc(UNIT_KINDS.find(([k]) => k === u.kind)?.[1] || '')}</span>` : ''}
        ${readOnly ? '<span class="tag">Salt okunur</span>' : ''}
        ${me.admin ? `<div class="row"><button class="btn ghost small" data-act="unit-rename" data-id="${esc(u.id)}">Birim ayarları</button><button class="btn danger small" data-act="unit-delete" data-id="${esc(u.id)}">Birimi sil</button></div>` : ''}
      </div>
      <div class="card unit-headline">
        ${h ? `${avatarMarkup(h.avatar_url, personName(h), 'large')}<div><small>Birim Başkanı</small><h3>${esc(personName(h))}</h3></div>` : '<div><small>Birim Başkanı</small><h3 class="unit-nohead">Başkan atanmadı</h3></div>'}
        ${headOk ? `<button class="btn ${h ? 'ghost ' : ''}small" data-act="unit-head-change" data-id="${esc(u.id)}">${h ? 'Başkanı değiştir' : 'Başkan ata'}</button>` : ''}
      </div>
      <div class="unit-section-head"><h3>Ekip <small>${u.members.filter((m) => m.status === 'active').length} aktif</small></h3>
        <div class="row">${passiveCount && !readOnly ? `<button class="btn ghost small" data-act="unit-passive-toggle">${state.units.showPassive ? 'Pasifleri gizle' : `Pasifleri göster (${passiveCount})`}</button>` : ''}${team ? `<button class="btn small" data-act="unit-invite" data-id="${esc(u.id)}">Kişi ekle</button>` : ''}</div></div>
      <div class="card unit-members">${people.length ? people.map(memberRow).join('') : '<p class="body">Henüz kimse yok.</p>'}</div>
      <div class="unit-section-head"><h3>Roller</h3>${roles ? `<button class="btn ghost small" data-act="unit-role-new" data-id="${esc(u.id)}">Rol ekle</button>` : ''}</div>
      <div class="card unit-roles">${u.roles.map((r) => `<div class="unit-role">
          <div><strong>${esc(r.name)}</strong>${r.preset ? ' <span class="tag">Hazır</span>' : ''}<div class="team-perms">${(r.is_head ? unitKindPerms(u) : r.permissions).map((p) => `<span class="tag">${esc(unitPermLabel(p))}</span>`).join('') || '<small>Yetki yok</small>'}</div></div>
          ${roles && !r.is_head ? `<div class="row"><button class="btn ghost small" data-act="unit-role-edit" data-id="${esc(r.id)}">Düzenle</button>${r.preset ? '' : `<button class="btn danger small" data-act="unit-role-delete" data-id="${esc(r.id)}">Sil</button>`}</div>` : ''}
        </div>`).join('')}</div>
    </section>`;
  };

  // Yetki kutuları. locked: rolden gelenler (işaretli, değiştirilemez). allowed: verebileceklerin.
  const unitPermChecks = (u, on = [], locked = [], allowed = null) => `<div class="field"><span>Yetkiler</span><div class="checks team-checks">${UNIT_PERMS.filter(([k]) => unitKindPerms(u).includes(k)).map(([k, label, hint]) => {
      const lock = locked.includes(k), dis = lock || (allowed && !allowed.includes(k));
      return `<label><input type="checkbox" name="perm" value="${k}" ${on.includes(k) || lock ? 'checked' : ''} ${dis ? 'disabled' : ''}> <span><strong>${esc(label)}</strong><small>${esc(lock ? 'Rolünden geliyor' : hint)}</small></span></label>`;
    }).join('')}</div></div>`;
  const myGrantable = (unitId) => { const me = unitMe(); return me.admin || unitIsHead(unitId) ? null : me.perms; };
  const roleSelect = (u, selected, { withHead = false } = {}) => `<select name="role" data-unit-role>${u.roles.filter((r) => withHead || !r.is_head).map((r) => {
      const h = r.is_head && unitHead(u);
      return `<option value="${esc(r.id)}" ${r.id === selected ? 'selected' : ''}>${esc(r.name)}${h ? ` (şu an: ${esc(personName(h))})` : ''}</option>`;
    }).join('')}</select>`;
  // Rol seçilince o rolün yetkileri kilitli işaretlenir; başkan rolü seçilip başkan varsa uyarı + eski başkanın rolü sorulur.
  const mountUnitRoleFields = (u) => {
    const sel = dlgForm.querySelector('[data-unit-role]');
    if (!sel) return;
    const sync = () => {
      const r = u.roles.find((x) => x.id === sel.value);
      const lockedPerms = r?.is_head ? unitKindPerms(u) : (r?.permissions || []);
      dlgForm.querySelectorAll('input[name="perm"]').forEach((box) => {
        const lock = lockedPerms.includes(box.value);
        box.checked = lock || (box.dataset.extra === '1');
        box.disabled = lock || box.dataset.denied === '1';
        box.closest('label').querySelector('small').textContent = lock ? 'Rolünden geliyor' : UNIT_PERMS.find(([k]) => k === box.value)[2];
      });
      const warn = dlgForm.querySelector('[data-head-warn]');
      if (warn) warn.hidden = !(r?.is_head && unitHead(u));
    };
    dlgForm.querySelectorAll('input[name="perm"]').forEach((box) => {
      box.dataset.denied = box.disabled && !box.checked ? '1' : '';
      box.addEventListener('change', () => { box.dataset.extra = box.checked ? '1' : ''; });
    });
    sel.addEventListener('change', sync);
    sync();
  };
  const extraPerms = (fd, u, roleId) => {
    const r = u.roles.find((x) => x.id === roleId);
    return fd.getAll('perm').map(String).filter((p) => !(r?.permissions || []).includes(p));
  };
  const headWarnHtml = (u) => {
    const h = unitHead(u);
    if (!h) return '';
    return `<div class="unit-warn" data-head-warn hidden><p><strong>Bu birimin zaten bir başkanı var: ${esc(personName(h))}.</strong> Bir birimde tek başkan olur. Devam edersen başkan değişir; ${esc(personName(h))} için yeni rolü seç:</p>
      ${field('Eski başkanın yeni rolü', roleSelect(u, u.roles.find((r) => !r.is_head && r.name === 'Başkan Yardımcısı')?.id).replace('name="role" data-unit-role', 'name="oldRole"'))}</div>`;
  };

  const unitActions = {
    'unit-reload'() { reloadUnits(); render(); },
    'unit-open'(id) { state.units.open = id; loadUnitEmails(id); render(); window.scrollTo(0, 0); },
    'unit-back'() { state.units.open = ''; render(); },
    'unit-passive-toggle'() { state.units.showPassive = !state.units.showPassive; render(); },
    'unit-new'() {
      openForm({ title: 'Birim ekle', lead: 'Yeni birim hazır rollerle (Birim Başkanı, Başkan Yardımcısı, Üye) açılır.',
        fields: field('Birim adı', '<input name="name" required maxlength="60" placeholder="Örn. Yönetim Kurulu">') + field('Birim türü', `<select name="kind">${UNIT_KINDS.map(([k, l]) => `<option value="${k}" ${k === ('') ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select><small class="hint">Tür, birimin özel sayfalarını ve yetkilerini belirler. Her türden tek birim olur.</small>`),
        submit: 'Birimi aç',
        onSubmit: async (fd) => {
          const name = val(fd, 'name').replace(/\s+/g, ' ');
          if (name.length < 2) return 'Birim adını yaz.';
          const r = await api.unit('unit_save', { name, kind: val(fd, 'kind') || null });
          toast(`${name} açıldı.`); state.units.open = r.id || ''; reloadUnits();
        } });
    },
    'unit-rename'(id) {
      const u = unitById(id); if (!u) return;
      openForm({ title: 'Birim ayarları', fields: field('Birim adı', `<input name="name" required maxlength="60" value="${esc(u.name)}">`) + field('Birim türü', `<select name="kind">${UNIT_KINDS.map(([k, l]) => `<option value="${k}" ${k === ((u.kind || '')) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select><small class="hint">Tür, birimin özel sayfalarını ve yetkilerini belirler. Her türden tek birim olur.</small>`),
        onSubmit: async (fd) => { const name = val(fd, 'name').replace(/\s+/g, ' '); if (name.length < 2) return 'Birim adını yaz.'; await api.unit('unit_save', { id, name, kind: val(fd, 'kind') || null }); toast('Kaydedildi.'); reloadUnits(); } });
    },
    'unit-delete'(id) {
      const u = unitById(id); if (!u) return;
      if (u.members.length) { toast('Bu birimde kayıtlı kişiler var (pasifler dahil); birim silinemez.'); return; }
      confirmRemove('Birimi sil', `${u.name} silinsin mi? Rolleri de silinir.`, async () => { await api.unit('unit_delete', { id }); state.units.open = ''; reloadUnits(); }, 'Sil');
    },
    'unit-invite'(unitId) {
      const u = unitById(unitId); if (!u) return;
      const headOk = unitIsHead(u.id), grant = myGrantable(u.id);
      const def = u.roles.find((r) => r.name === 'Üye' && r.preset)?.id || u.roles.find((r) => !r.is_head)?.id;
      openForm({
        title: `${u.name} · kişi ekle`,

    'support-ticket-new'() {
      if (isAdmin()) return;

      const categoryCards = Object.entries(SUPPORT_CATEGORIES).map(([key, cfg]) => `
        <button type="button" class="support-category-card" data-support-category="${key}">
          <strong>${esc(cfg.label)}</strong>
          <span>${esc(cfg.description)}</span>
        </button>`).join('');

      const renderCategory = (kind) => {
        const cfg = SUPPORT_CATEGORIES[kind];
        const options = cfg.options.map((option) => `<option value="${esc(option)}">${esc(option)}</option>`).join('');
        const events = kind === 'event' ? supportEventOptions() : [];
        const eventField = kind === 'event'
          ? field('Etkinlik', `<select name="eventId" required><option value="">Etkinlik seçiniz</option><option value="__none__">Etkinlik dışı — belirli bir etkinlikle ilgili değil</option>${events.map((e) => `<option value="${esc(e.id)}">${esc(e.title)} · ${esc(e.date ? fmtDay(e.date) : '')}</option>`).join('')}</select>`)
          : '';
        const otherField = `<div data-support-other style="display:none">${field('Konu başlığı', `<input name="subject" maxlength="160" placeholder="${esc(cfg.otherPlaceholder)}">`)}</div>`;
        let info = '';
        if (kind === 'technical') {
          info = `<div class="support-info"><strong>Bilgilendirme</strong><p><strong>UniPakt.</strong> tarafından geliştirilen UniPakt.Panel, kullanıcı deneyimlerinden elde edilen geri bildirimler doğrultusunda sürekli olarak geliştirilmektedir. Bununla birlikte, tüm dijital sistemlerde olduğu gibi teknik sorunlar veya beklenmeyen durumlarla karşılaşılması mümkündür.</p><p>Sorunun hangi işlem sırasında meydana geldiğini, beklediğiniz sonucu ve karşılaştığınız durumu mümkün olduğunca ayrıntılı şekilde belirtmeniz, destek sürecinin daha hızlı ilerlemesine yardımcı olacaktır.</p></div>`;
        }
        if (kind === 'community') {
          info = `<div class="support-info"><strong>Önemli Bilgilendirme</strong><p><strong>UniPakt.</strong>, toplum ve kulüp gönüllülerinin bir arada bulunduğu; adalet, aidiyet ve güven ilkelerini temel alan bir oluşumdur. Topluluk içerisindeki bu temel değerlere ve belirlenen ilkelere aykırı durumların uygun şekilde bildirilmesi ve değerlendirilmesi için bu kanal kullanılabilir.</p><p>Gönderilen bildirimler, bildirimin niteliği ve sunulan bilgiler doğrultusunda değerlendirilir. Bildirimin mümkün olduğunca açık, doğru ve somut bilgiler içermesi değerlendirme sürecine katkı sağlar.</p><p><strong>Uyarı:</strong> Bu kategoriden oluşturulan destek talepleri <strong>en geç 1 gün içerisinde değerlendirmeye alınır.</strong> Konunun niteliğine bağlı olarak inceleme süreci daha uzun sürebilir. Lütfen göndermeden önce bildiriminizin bu kategori kapsamında olduğundan emin olunuz.</p><div class="support-privacy"><strong>Gizlilik Bildirimi</strong><p>Bu kategori üzerinden iletilen bildirimler, yalnızca destek ve değerlendirme sürecinde yetkilendirilmiş kişiler tarafından erişilebilir.</p></div></div>`;
        }
        if (kind === 'event') {
          info = `<div class="support-info"><strong>Bilgilendirme</strong><p><strong>UniPakt.</strong>, kulüplerin etkinliklerini daha düzenli, verimli ve erişilebilir şekilde gerçekleştirebilmelerini desteklemek amacıyla UniPakt.Panel sistemini sürekli olarak geliştirmektedir.</p><p>Etkinliğinizle ilgili destek talebinizde etkinliğin adını, karşılaştığınız problemi ve mümkünse sorunun meydana geldiği işlemi belirtmeniz, değerlendirme ve çözüm sürecinin daha hızlı ilerlemesine yardımcı olacaktır.</p></div>`;
        }
        return `<div class="support-form-intro"><h3>${esc(cfg.label)}</h3><p>${esc(cfg.description)}</p></div>`
          + field('Konu', `<select name="topic" required data-support-topic><option value="">Seçiniz</option>${options}</select>`)
          + otherField
          + eventField
          + field('Ayrıntılar', `<label class="field-label">Mesajınız</label><textarea name="body" required maxlength="4000" placeholder="${esc(cfg.messagePlaceholder)}"></textarea>`)
          + field('İsteğe bağlı ekran görüntüsü / belge', `<input type="file" name="attachment" accept="image/png,image/jpeg,image/webp,application/pdf"><small class="muted">PNG, JPG, WebP veya PDF · en fazla 5 MB</small>`)
          + info;
      };

      openForm({
        title: 'Yeni destek talebi',
        lead: 'Hangi konuda destek almak istiyorsunuz?',
        fields: `<div class="support-category-picker"><p><strong>Destek kategorisi</strong></p><div class="support-category-grid">${categoryCards}</div></div><div data-support-detail style="display:none"></div>`,
        submit: 'Talep oluştur',
        onSubmit: async (fd) => {
          const kind = fd.get('supportKind');
          const topic = val(fd, 'topic').trim();
          const subject = topic === 'Başka bir konu...' ? val(fd, 'subject').trim() : topic;
          if (!kind || !topic || !subject) throw new Error('Destek kategorisi ve konu zorunludur.');
          const file = fd.get('attachment');
          if (file && file.size && supportAttachmentProblem(file)) return supportAttachmentProblem(file);
          await api.supportCreate({
            subject,
            category: kind,
            categoryLabel: SUPPORT_CATEGORIES[kind].label,
            body: val(fd, 'body').trim(),
            eventId: val(fd, 'eventId') === '__none__' ? '' : val(fd, 'eventId'),
            attachment: file && file.size ? file : null,
          });
          toast('Destek talebi oluşturuldu.');
        },
      });

      const modal = dlg;
      if (!modal) return;
      const form = dlgForm;
      const detail = modal.querySelector('[data-support-detail]');
      const hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.name = 'supportKind';
      form.appendChild(hidden);

      const bindCategory = (kind) => {
        hidden.value = kind;
        modal.querySelectorAll('[data-support-category]').forEach((button) => {
          button.classList.toggle('active', button.dataset.supportCategory === kind);
        });
        detail.innerHTML = renderCategory(kind);
        detail.style.display = 'block';
        const topic = detail.querySelector('[data-support-topic]');
        const other = detail.querySelector('[data-support-other]');
        if (topic && other) {
          topic.addEventListener('change', () => {
            const isOther = topic.value === 'Başka bir konu...';
            other.style.display = isOther ? 'block' : 'none';
            if (!isOther) {
              const subject = detail.querySelector('[name="subject"]');
              if (subject) subject.value = '';
            }
          });
        }
      };
      modal.querySelectorAll('[data-support-category]').forEach((button) => {
        button.addEventListener('click', () => bindCategory(button.dataset.supportCategory));
      });
    },

    'task-new'() {
      openForm({
        title: 'Görev ata',
        fields: `<div class="field"><span>Kulüpler <em class="pick-count" id="pickCount">0 seçili</em></span>
            <input type="search" id="clubFilter" placeholder="Kulüp ya da üniversite ara" autocomplete="off" aria-label="Kulüp ara">
            <div class="checks">
              <label><input type="checkbox" id="allClubs"> <strong id="allClubsLabel">Tüm kulüpler</strong></label>
              ${[...db.clubs].sort(byLabel).map((c) => `<label data-search="${esc(searchKey(clubLabel(c)))}"><input type="checkbox" name="club" value="${esc(c.id)}"> ${esc(clubLabel(c))}</label>`).join('')}
              <p class="checks-empty" id="clubFilterEmpty" hidden>Aramana uyan kulüp yok.</p>
            </div></div>`
          + field('Görev', '<input name="title" required maxlength="120">')
          + field('Açıklama (isteğe bağlı)', '<textarea name="desc" maxlength="1000"></textarea>')
          + field('Son tarih (isteğe bağlı)', '<input type="date" name="due">'),
        submit: 'Ata',
        onSubmit: async (fd) => {
          const ids = fd.getAll('club');
          if (!ids.length) return 'En az bir kulüp seç.';
          await api.addTasks(ids, { title: val(fd, 'title'), desc: val(fd, 'desc'), due: val(fd, 'due') });
          state.taskTab = 'open';
          toast(ids.length > 1 ? `Görev ${ids.length} kulübe atandı.` : 'Görev atandı.');
        },
      });
      const all = dlgForm.querySelector('#allClubs');
      const boxes = [...dlgForm.querySelectorAll('input[name="club"]')];
      const filter = dlgForm.querySelector('#clubFilter');
      // "Tüm kulüpler" works on what the search shows; ticks on hidden clubs are kept.
      const visible = () => boxes.filter((b) => !b.closest('label').hidden);
      const sync = () => {
        const shown = visible();
        all.checked = shown.length > 0 && shown.every((x) => x.checked);
        dlgForm.querySelector('#allClubsLabel').textContent = filter.value.trim() ? `Aramadaki kulüpler (${shown.length})` : 'Tüm kulüpler';
        dlgForm.querySelector('#pickCount').textContent = `${boxes.filter((b) => b.checked).length} seçili`;
        dlgForm.querySelector('#clubFilterEmpty').hidden = shown.length > 0;
      };
      filter.addEventListener('input', () => {
        const q = searchKey(filter.value);
        boxes.forEach((b) => { const label = b.closest('label'); label.hidden = !!q && !label.dataset.search.includes(q); });
        sync();
      });
      // Enter in the search box must not submit the form.
      filter.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });
      all.addEventListener('change', () => { visible().forEach((b) => { b.checked = all.checked; }); sync(); });
      boxes.forEach((b) => b.addEventListener('change', sync));
      sync();
      setTimeout(() => filter.focus(), 0);
    },

    'pts-new'(id) {
      if (!isAdmin()) return;
      const events = [...publishedEvents()].reverse();
      const hostCategories = [
        ['org', 'Organizasyon Planlama', 10],
        ['ops', 'Operasyon Yönetimi', 10],
        ['participant', 'Katılımcı Memnuniyeti', 10],
        ['resource', 'Kaynak & Tesis Yönetimi', 5],
        ['fairness', 'Adalet & Sorumluluk', 9],
        ['innovation', 'Yenilik & Fikir Geliştirme', 6],
      ];
      const supportCategories = [
        ['supportDuty', 'Görev ve Sorumluluk Yönetimi', 12],
        ['supportOps', 'Operasyonel Katkı', 10],
        ['supportStaff', 'Personel Desteği', 4],
        ['supportTeam', 'Ekip Koordinasyonu', 4],
      ];
      const makeScoreFields = (categories) => categories.map(([name, label, max]) =>
        field(label, `<div class="field-row"><input type="number" name="${name}" min="0" max="100" step="1" value="0" placeholder="0–100"><span class="muted" data-score="${name}">0 / ${max}</span></div>`)
      ).join('');
      const clubOptions = db.clubs.map((c) => `<option value="${esc(c.id)}" ${c.id === id ? 'selected' : ''}>${esc(c.name)} — ${esc(c.uni || c.university || 'Üniversite belirtilmemiş')} (${pts(c.id)})</option>`).join('');
      const eventOptions = events.map((e) => `<option value="${esc(e.id)}">${esc(e.title)} · ${fmtDay(e.date)}</option>`).join('');

      openForm({
        title: 'Puan gönder',
        lead: 'Kulüp ve etkinliği seç. Sistem etkinlikteki rolünü otomatik belirleyip doğru puanlama aracını açar.',
        fields: field('Kulüp', `<select name="club" required><option value="">Kulüp seç</option>${clubOptions}</select>`)
          + field('Etkinlik', `<select name="event"><option value="">${OTHER}</option>${eventOptions}</select>`)
          + `<div data-role-status class="quote"><small>Rol</small>Etkinlik seçildiğinde kulübün Host veya Support rolü burada gösterilir.</div>`
          + `<div data-host-panel hidden><p class="form-section">Host değerlendirmesi · Standart toplam 50 puandır</p>${makeScoreFields(hostCategories)}<label class="checkline"><input type="checkbox" name="crisisBonus" value="5"><span><strong>Kriz Çözüm Bonusu</strong><small>Gerçek operasyonel kriz başarıyla çözüldüyse +5 puan</small></span><b data-crisis-value>+0</b></label><div class="card" style="margin-top:14px;padding:16px"><div class="mini-row"><div><strong>Standart toplam</strong><small>50 puan üzerinden</small></div><b data-standard-total>0 / 50</b></div><div class="mini-row"><div><strong>Kriz Çözüm Bonusu</strong><small>Bonus ayrı değerlendirilir</small></div><b data-bonus-total>+0</b></div><div class="mini-row"><div><strong>Genel toplam</strong><small>55 puan üzerinden</small></div><b data-grand-total>0 / 55</b></div></div></div>`
          + `<div data-support-panel hidden><p class="form-section">Support değerlendirmesi · Standart toplam 30 puandır</p>${makeScoreFields(supportCategories)}<label class="checkline"><input type="checkbox" name="supportBonus" value="5"><span><strong>Ek Sorumluluk Bonusu</strong><small>Ek sorumluluk başarıyla üstlenildiyse +5 puan</small></span><b data-support-bonus-value>+0</b></label><div class="card" style="margin-top:14px;padding:16px"><div class="mini-row"><div><strong>Standart toplam</strong><small>30 puan üzerinden</small></div><b data-support-standard-total>0 / 30</b></div><div class="mini-row"><div><strong>Ek Sorumluluk Bonusu</strong><small>Bonus ayrı değerlendirilir</small></div><b data-support-bonus-total>+0</b></div><div class="mini-row"><div><strong>Genel toplam</strong><small>35 puan üzerinden</small></div><b data-support-grand-total>0 / 35</b></div></div></div>`
          + `<div data-other-panel hidden>${field('Etkinlik dışı puan','<input type="number" name="otherDelta" step="1" placeholder="Örn. 20 veya -10">')}<p class="muted">Etkinlik seçilmezse puan doğrudan bu değer olarak kaydedilir.</p></div>`
          + field('Açıklama (isteğe bağlı)', '<input name="note" maxlength="120" placeholder="Değerlendirme notu">'),
        submit: 'Gönder',
        onSubmit: async (fd) => {
          const c = club(val(fd, 'club')); if (!c) return 'Bir kulüp seç.';
          const eventId = val(fd, 'event');
          const ev = db.events.find((e) => e.id === eventId);
          const userNote = val(fd, 'note');

          if (!ev) {
            const delta = Math.round(Number(fd.get('otherDelta')));
            if (!Number.isFinite(delta) || delta === 0) return 'Etkinlik dışı puan sıfırdan farklı olmalı.';
            await api.addPoints({ clubId: c.id, eventId: '', label: OTHER, delta, note: userNote });
            toast(`${c.name}: ${signed(delta)} puan`);
            return;
          }

          const isHost = ev.ownerId === c.id;
          const isSupport = ev.applications.some((p) => p.clubId === c.id && p.status === 'approved');
          if (!isHost && !isSupport) return 'Bu kulüp seçilen etkinlikte Host veya onaylı Support değil.';

          if (isHost) {
            const values = Object.fromEntries(hostCategories.map(([name]) => [name, Math.max(0, Math.min(100, Number(fd.get(name)) || 0))]));
            const standard = hostCategories.reduce((sum, [name, , max]) => sum + (values[name] * max / 100), 0);
            const crisis = fd.get('crisisBonus') ? 5 : 0;
            const rawTotal = standard + crisis;
            if (rawTotal <= 0) return 'En az bir değerlendirme puanı gir.';
            const total = Math.round(rawTotal);
            const breakdown = hostCategories.map(([name, label, max]) => `${label}: ${(values[name] * max / 100).toFixed(1)}/${max}`).join(' · ');
            const generatedNote = `${breakdown} · Kriz: +${crisis} · Hesaplanan: ${rawTotal.toFixed(1)}/55 · Yuvarlanan: ${total}/55`;
            const note = `${generatedNote}${userNote ? ` · Açıklama: ${userNote}` : ''}`;
            await api.addPoints({ clubId: c.id, eventId: ev.id, label: ev.title, delta: total, note });
            toast(`${c.name}: +${total} Host puanı`);
          } else {
            const values = Object.fromEntries(supportCategories.map(([name]) => [name, Math.max(0, Math.min(100, Number(fd.get(name)) || 0))]));
            const standard = supportCategories.reduce((sum, [name, , max]) => sum + (values[name] * max / 100), 0);
            const bonus = fd.get('supportBonus') ? 5 : 0;
            const rawTotal = standard + bonus;
            if (rawTotal <= 0) return 'En az bir değerlendirme puanı gir.';
            const total = Math.round(rawTotal);
            const breakdown = supportCategories.map(([name, label, max]) => `${label}: ${(values[name] * max / 100).toFixed(1)}/${max}`).join(' · ');
            const generatedNote = `${breakdown} · Ek Sorumluluk: +${bonus} · Hesaplanan: ${rawTotal.toFixed(1)}/35 · Yuvarlanan: ${total}/35`;
            const note = `${generatedNote}${userNote ? ` · Açıklama: ${userNote}` : ''}`;
            await api.addPoints({ clubId: c.id, eventId: ev.id, label: ev.title, delta: total, note });
            toast(`${c.name}: +${total} Support puanı`);
          }
        },
      });

      const hostPanel = dlgForm.querySelector('[data-host-panel]');
      const supportPanel = dlgForm.querySelector('[data-support-panel]');
      const otherPanel = dlgForm.querySelector('[data-other-panel]');
      const roleStatus = dlgForm.querySelector('[data-role-status]');
      const eventSelect = dlgForm.querySelector('[name="event"]');
      const clubSelect = dlgForm.querySelector('[name="club"]');

      const updateRolePreview = () => {
        const c = club(clubSelect?.value || '');
        const ev = db.events.find((e) => e.id === (eventSelect?.value || ''));
        if (!ev) {
          hostPanel.hidden = true; supportPanel.hidden = true; otherPanel.hidden = false;
          if (roleStatus) roleStatus.innerHTML = '<small>Rol</small>Etkinlik dışı puanlama';
          return;
        }
        otherPanel.hidden = true;
        const isHost = !!c && ev.ownerId === c.id;
        const isSupport = !!c && ev.applications.some((p) => p.clubId === c.id && p.status === 'approved');
        hostPanel.hidden = !isHost;
        supportPanel.hidden = !(!isHost && isSupport);
        if (roleStatus) {
          roleStatus.innerHTML = isHost
            ? '<small>Rol</small><strong>Host</strong> · Host puanlama sistemi açıldı.'
            : isSupport
              ? '<small>Rol</small><strong>Support</strong> · Support puanlama sistemi açıldı.'
              : '<small>Rol</small>Bu kulüp bu etkinlikte Host veya onaylı Support değil.';
        }
        updateScorePreview();
      };

      const updateScorePreview = () => {
        let hostStandard = 0;
        hostCategories.forEach(([name, , max]) => {
          const input = dlgForm.querySelector(`[name="${name}"]`);
          const raw = Math.max(0, Math.min(100, Number(input?.value) || 0));
          const score = raw * max / 100;
          hostStandard += score;
          const out = dlgForm.querySelector(`[data-score="${name}"]`);
          if (out) out.textContent = `${score.toFixed(1)} / ${max}`;
        });
        const crisis = dlgForm.querySelector('[name="crisisBonus"]')?.checked ? 5 : 0;
        const hostTotal = Math.round(hostStandard + crisis);
        const hostStdOut = dlgForm.querySelector('[data-standard-total]');
        const hostBonusOut = dlgForm.querySelector('[data-bonus-total]');
        const hostGrandOut = dlgForm.querySelector('[data-grand-total]');
        const crisisOut = dlgForm.querySelector('[data-crisis-value]');
        if (hostStdOut) hostStdOut.textContent = `${hostStandard.toFixed(1)} / 50`;
        if (hostBonusOut) hostBonusOut.textContent = `+${crisis}`;
        if (hostGrandOut) hostGrandOut.textContent = `${hostTotal} / 55`;
        if (crisisOut) crisisOut.textContent = `+${crisis}`;

        let supportStandard = 0;
        supportCategories.forEach(([name, , max]) => {
          const input = dlgForm.querySelector(`[name="${name}"]`);
          const raw = Math.max(0, Math.min(100, Number(input?.value) || 0));
          const score = raw * max / 100;
          supportStandard += score;
          const out = dlgForm.querySelector(`[data-score="${name}"]`);
          if (out) out.textContent = `${score.toFixed(1)} / ${max}`;
        });
        const supportBonus = dlgForm.querySelector('[name="supportBonus"]')?.checked ? 5 : 0;
        const supportTotal = Math.round(supportStandard + supportBonus);
        const supportStdOut = dlgForm.querySelector('[data-support-standard-total]');
        const supportBonusOut = dlgForm.querySelector('[data-support-bonus-total]');
        const supportGrandOut = dlgForm.querySelector('[data-support-grand-total]');
        const supportBonusValue = dlgForm.querySelector('[data-support-bonus-value]');
        if (supportStdOut) supportStdOut.textContent = `${supportStandard.toFixed(1)} / 30`;
        if (supportBonusOut) supportBonusOut.textContent = `+${supportBonus}`;
        if (supportGrandOut) supportGrandOut.textContent = `${supportTotal} / 35`;
        if (supportBonusValue) supportBonusValue.textContent = `+${supportBonus}`;
      };

      eventSelect?.addEventListener('change', updateRolePreview);
      clubSelect?.addEventListener('change', updateRolePreview);
      dlgForm.querySelectorAll('input[type="number"], input[name="crisisBonus"], input[name="supportBonus"]').forEach((input) => input.addEventListener('input', updateScorePreview));
      dlgForm.querySelectorAll('input[name="crisisBonus"], input[name="supportBonus"]').forEach((input) => input.addEventListener('change', updateScorePreview));
      updateRolePreview();
    },
